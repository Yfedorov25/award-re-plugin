<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>combo: architecture--section-accordion / Дім у розрізі</title>
<!--
  INTERACTIVE architecture section (NO scroll pin): a horizontal accordion of four BIG
  renders, one open at a time. At rest one slab is open (a near-full render) and the rest
  are narrow vertical strips with a spine label; HOVER/FOCUS a strip and it expands to a
  near-full render of THAT component while the others compress to spines, its label +
  material spec fading in. The render NEVER swaps, so the slab you touch IS the slab that
  opens - correspondence is structural. Built ban-clean (transform: translateX + clip-path
  inset + opacity/filter; no width/left/flex tween). The four slabs:
    Вінець  = renders/macro-roof.webp     (rooftop deck)
    Пергола = renders/macro-pergola.webp  (timber soffit)
    Фасад   = renders/day-34.webp         (frontal facade)
    Основа  = renders/aerial.webp         (aerial site)
  pinOwner:none, expectPins:0. The .lar-rack carries [data-render-surface].
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/layer-accordion-reveal/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  /* variant SKIN only (scaffold owns the rails). The section is a full-bleed editorial
     panel: a meta spine top-left, the accordion as the hero, a hint bottom-right. */
  .sa-stage { display: grid; grid-template-rows: auto 1fr; padding: clamp(28px,5vh,64px) clamp(20px,5vw,80px) clamp(24px,4vh,56px); }

  .sa-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: clamp(20px,3vh,40px); }
  .sa-titlewrap { max-width: 60ch; }
  .sa-eyebrow { font: 600 .72rem/1 var(--combo-sans); letter-spacing: .24em; text-transform: uppercase; color: rgba(244,239,230,.6); }
  .sa-title { font-family: var(--combo-serif); font-weight: 300; font-size: clamp(2.6rem,7vw,6rem);
    line-height: .92; letter-spacing: -.035em; margin: 14px 0 0; color: var(--combo-ink); }
  .sa-title em { font-style: italic; font-weight: 400; }
  .sa-lede { margin: 0 0 6px; max-width: 32ch; text-align: right;
    font: 400 clamp(.92rem,1.1vw,1.05rem)/1.5 var(--combo-sans); color: rgba(244,239,230,.66); }

  /* the rack box - the hero. The atom paints into [data-render-surface]. */
  .sa-rackbox { position: relative; width: 100%; height: 100%; min-height: 420px; overflow: hidden; }
  .sa-rackbox .lar-rack { border-radius: 2px; }

  /* a quiet count + hint riding the bottom edge, outside the rack */
  .sa-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: clamp(16px,2.4vh,28px); }
  .sa-count { font: 600 .72rem/1 var(--combo-sans); letter-spacing: .2em; text-transform: uppercase; color: rgba(244,239,230,.5); }
  .sa-hint { display: inline-flex; align-items: center; gap: 10px;
    font: 600 .72rem/1 var(--combo-sans); letter-spacing: .14em; text-transform: uppercase; color: rgba(244,239,230,.5); }
  .sa-hint span { width: 26px; height: 1px; background: rgba(244,239,230,.4); transform-origin: left;
    animation: sa-slide 2.6s var(--sa-ease, ease) infinite; }
  @keyframes sa-slide { 0%,100% { transform: scaleX(.4); opacity:.4 } 50% { transform: scaleX(1); opacity:.9 } }

  @media (prefers-reduced-motion: reduce) { .sa-hint span { animation: none; transform: scaleX(1); } }
  @media (max-width: 820px) { .sa-head { flex-direction: column; align-items: flex-start; } .sa-lede { text-align: left; } }
</style>
</head>
<body>
  <div class="combo-pre">архітектура</div>

  <section id="combo" class="combo-stage sa-stage" data-combo="architecture--section-accordion">
    <header class="sa-head">
      <div class="sa-titlewrap">
        <div class="sa-eyebrow">вул. Замкова · конструкція</div>
        <h2 class="sa-title">Дім у <em>розрізі</em></h2>
      </div>
      <p class="sa-lede">Чотири шари одного дому. Наведіть, щоб роздивитись кожен зблизька.</p>
    </header>

    <!-- the accordion is the render surface; the atom builds the slabs inside -->
    <div class="sa-rackbox">
      <div class="lar-rack" id="rack" data-render-surface></div>
    </div>

    <footer class="sa-foot">
      <div class="sa-count">04 шари</div>
      <div class="sa-hint">наведіть<span></span></div>
    </footer>
  </section>

  <div class="combo-post">наступна секція</div>

  <!-- scaffold + adapters, then the cited atom -->
  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/layer-accordion-reveal/component.js"></script>

  <script>
    (function () {
      SectionHarness.boot();
      // sync the section hint underline to the house air curve
      document.documentElement.style.setProperty('--sa-ease', 'cubic-bezier(.22,1,.36,1)');

      // THE interactive accordion. Each slab IS its component; the render never swaps,
      // so the slab you touch is the slab that opens (correspondence is structural).
      SectionHarness.ranOK('layer-accordion-reveal', function () {
        window.__lar = window.LayerAccordionReveal.create('#rack', {
          openFlex: 0.62,
          defaultIndex: 2,                 // open on FASADE at rest (the establishing whole)
          seam: 3,
          ease: 'cubic-bezier(.22,1,.36,1)',
          dur: 0.62, uiDur: 0.34,
          panels: [
            { img: 'renders/macro-roof.webp',    label: 'Вінець',  kicker: '01 · покрівля', alt: 'Експлуатована покрівля',
              spec: 'Експлуатована покрівля з настилом. Площина, з якої видно місто.' },
            { img: 'renders/macro-pergola.webp', label: 'Пергола', kicker: '02 · тінь',     alt: 'Деревʼяна пергола',
              spec: 'Термодеревина над терасою. Тепла лінія на тлі білого тиньку.' },
            { img: 'renders/day-34.webp',        label: 'Фасад',   kicker: '03 · оболонка', alt: 'Фасад комплексу',
              spec: 'Архітектурний тиньк і панорамне скло. Шість будинків, один почерк.' },
            { img: 'renders/aerial.webp',        label: 'Основа',  kicker: '04 · ділянка',  alt: 'Ділянка з висоти',
              spec: 'Півтори сотки під кожним домом. Двір, що належить лише вам.' }
          ]
        });
      });

      // INTERACTIVE section: NO scroll pin. The atom is hover-driven; the harness owns no pin.
      SectionHarness.declare({
        pinOwner: 'none', expectPins: 0,
        atomsCited: ['layer-accordion-reveal']
      });
    })();
  </script>
</body>
</html>
