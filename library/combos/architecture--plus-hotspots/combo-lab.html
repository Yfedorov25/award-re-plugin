<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>combo: architecture--plus-hotspots — Розглянь зблизька</title>
<!--
  ARCHITECTURE section variant · "Розглянь зблизька" · atom: veil-flat-detail-reveal
  ------------------------------------------------------------------------------------
  A clean frontal facade (renders/day-34.webp) carries FOUR "+" hotspots, each ANCHORED
  to a real element. Click a "+" -> the veil-flat-detail-reveal modal plays its dark
  COVER -> HOLD -> UNCOVER and lands on a BIG full-bleed MACRO of THAT exact element,
  with a one-line material spec in the rail and a close back to the facade.

  CORRESPONDENCE (the whole point — each "+" reveals its OWN element):
    + on the white ROOF parapet (top band)        -> macro-roof.webp     (rooftop deck)
    + on the upper dark GLAZING band              -> terrace-02.webp      (glazed volume, 3/4)
    + on the timber SOFFIT / overhang (left)      -> macro-pergola.webp   (timber soffit + posts)
    + on the lower BALCONY behind the glass       -> macro-table.webp     (terrace dining detail)

  The atom owns the veil + the content reveal. Each macro lives in a hidden template;
  the hotspot passes the matching template id as planSVG, so the engine copies that macro
  into .vfd-plan (= [data-render-surface]) during the HOLD, unseen, then uncovers onto it.
  This is INTERACTIVE: NO scroll pin. declare({pinOwner:'none', expectPins:0}).
  Motion: transform / opacity / clip-path only. No WebGL, no mix-blend, no backdrop-filter.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/veil-flat-detail-reveal/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  :root{
    --ph-ink: #11161a;
    --ph-cream: #f2efe9;
    --ph-line: rgba(242,239,233,.72);
    --ph-dot: #f2efe9;
    --ph-dot-ink: #11161a;
  }

  /* ---- the section stage: a frontal facade, generous air around it ---- */
  .ph-stage{ position: relative; min-height: 100vh; background: #0c1014;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    font-family: var(--combo-sans, 'Inter', system-ui, sans-serif); color: var(--ph-cream); }

  .ph-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 2rem;
    padding: clamp(28px,5vh,64px) clamp(20px,5vw,80px) 0; }
  .ph-eyebrow{ font: 500 .72rem/1 var(--combo-sans, 'Inter', sans-serif); letter-spacing: .22em;
    text-transform: uppercase; opacity: .58; }
  .ph-title{ font-family: var(--combo-serif, 'Fraunces', Georgia, serif); font-weight: 300;
    font-size: clamp(40px, 7vw, 116px); line-height: .92; letter-spacing: -.035em; margin: .5rem 0 0; }
  .ph-hint{ align-self: flex-end; max-width: 26ch; text-align: right; font-size: .82rem; line-height: 1.45;
    opacity: .62; }

  /* ---- facade frame: BIG render, hotspots ride over it ---- */
  .ph-frame{ position: relative; margin: clamp(20px,3.5vh,48px) clamp(20px,5vw,80px) clamp(24px,5vh,72px);
    border-radius: 2px; overflow: hidden; }
  .ph-facade{ display: block; width: 100%; height: 100%; object-fit: cover; aspect-ratio: 16 / 9;
    filter: saturate(1.02) contrast(1.02); }
  /* a barely-there vignette so the cream dots read on sky + glass alike */
  .ph-frame::after{ content:''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 58%, rgba(8,11,14,.34) 100%); }

  /* ---- the "+" hotspots ---- */
  .ph-spot{ position: absolute; z-index: 5; transform: translate(-50%,-50%);
    width: 0; height: 0; }
  .ph-spot__hit{ position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 64px; height: 64px; border: 0; background: none; padding: 0; cursor: pointer;
    display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  /* the calm pulsing ring */
  .ph-spot__ring{ position: absolute; left: 50%; top: 50%; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid var(--ph-line); transform: translate(-50%,-50%) scale(.6);
    opacity: 0; will-change: transform, opacity; }
  /* the solid dot with a + */
  .ph-spot__dot{ position: relative; width: 30px; height: 30px; border-radius: 50%;
    background: var(--ph-dot); box-shadow: 0 6px 20px rgba(8,11,14,.45);
    display: grid; place-items: center; transition: transform .34s cubic-bezier(.22,1,.36,1); }
  .ph-spot__dot::before, .ph-spot__dot::after{ content:''; position: absolute; background: var(--ph-dot-ink);
    border-radius: 1px; transition: transform .34s cubic-bezier(.22,1,.36,1); }
  .ph-spot__dot::before{ width: 12px; height: 1.6px; }
  .ph-spot__dot::after{ width: 1.6px; height: 12px; }
  .ph-spot__hit:hover .ph-spot__dot,
  .ph-spot__hit:focus-visible .ph-spot__dot{ transform: scale(1.18); }
  .ph-spot__hit:focus-visible{ outline: none; }
  .ph-spot__hit:focus-visible .ph-spot__ring{ opacity: .9; }
  /* the element label that slides out on hover */
  .ph-spot__tag{ position: absolute; left: 26px; top: 50%; transform: translate(-6px,-50%);
    white-space: nowrap; font-size: .64rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ph-cream); background: rgba(12,16,20,.66); padding: .4rem .7rem; border-radius: 2px;
    opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1); }
  .ph-spot--left .ph-spot__tag{ left: auto; right: 26px; transform: translate(6px,-50%); }
  .ph-spot__hit:hover .ph-spot__tag,
  .ph-spot__hit:focus-visible .ph-spot__tag{ opacity: 1; transform: translate(0,-50%); }

  @keyframes ph-pulse{ 0%{ transform: translate(-50%,-50%) scale(.62); opacity: .9; }
    70%{ opacity: 0; } 100%{ transform: translate(-50%,-50%) scale(1.5); opacity: 0; } }
  .ph-spot__ring--auto{ animation: ph-pulse 2.8s cubic-bezier(.22,1,.36,1) infinite; }

  .ph-foot{ position: absolute; left: clamp(20px,5vw,80px); bottom: clamp(16px,3vh,34px); z-index: 6;
    font-size: .7rem; letter-spacing: .04em; opacity: .42; }

  /* ====================================================================
     MACRO SKIN: turn the atom's .vfd-plan into a BIG full-bleed image
     and the canvas dark, so the reveal lands on the material itself.
     (overrides the plan-svg canvas — here the "plan" IS the macro photo)
     ==================================================================== */
  .vfd-page{ --vfd-rail-w: 372px; --vfd-rail-bg: #e7e3db; --vfd-ink: #14191d;
    --vfd-dark: #14191d; --vfd-canvas-bg: #0c1014;
    --vfd-serif: 'Fraunces', Georgia, serif; --vfd-sans: 'Inter', system-ui, sans-serif; }
  .vfd-veil{ --vfd-veil: #14191d; }
  /* macro sources: off-screen but DECODABLE (never display:none/hidden, which skips decode) */
  .ph-macro-src{ position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); left: -9999px; top: 0; pointer-events: none; }
  .vfd-canvas{ overflow: hidden; }
  .vfd-plan{ width: 100% !important; height: 100% !important; max-height: none !important;
    position: absolute; inset: 0; }
  .vfd-plan img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  /* a one-line material spec laid over the macro, bottom-left */
  .vfd-spec{ position: absolute; left: clamp(20px,3vw,48px); bottom: clamp(20px,4vh,48px); z-index: 5;
    color: #f2efe9; text-shadow: 0 2px 22px rgba(0,0,0,.55); pointer-events: none; max-width: 30ch; }
  .vfd-spec__k{ font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
  .vfd-spec__v{ font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-size: clamp(1.4rem,2.4vw,2.1rem);
    line-height: 1.04; letter-spacing: -.01em; margin-top: .35rem; }
  /* rail: replace the apartment data with material narrative */
  .vfd-rail{ gap: 1rem; padding: 14vh 2.6vw; }
  .vfd-eyebrow2{ font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; opacity: .55; }
  .vfd-note{ font-size: .9rem; line-height: 1.55; opacity: .78; max-width: 30ch; }

  @media (max-width: 820px){
    .ph-head{ flex-direction: column; gap: .6rem; }
    .ph-hint{ text-align: left; align-self: flex-start; }
    .vfd-spec__v{ font-size: 1.3rem; }
  }
</style>
</head>
<body>

  <section id="combo" class="ph-stage" data-combo="architecture--plus-hotspots">
    <div class="ph-head">
      <div>
        <div class="ph-eyebrow">QUADRO HOUSE · фасад</div>
        <h1 class="ph-title">Розглянь зблизька</h1>
      </div>
      <p class="ph-hint">Натисніть «плюс» на фасаді. Кожна точка відкриває матеріал, з якого зроблена саме ця деталь.</p>
    </div>

    <div class="ph-frame">
      <img class="ph-facade" src="renders/day-34.webp" alt="Фронтальний фасад QUADRO HOUSE" decoding="async">

      <!-- FOUR "+" hotspots. left/top in % of the frame, each on its real element. -->
      <!-- 1 · ROOF parapet (white band, top) -> rooftop deck -->
      <span class="ph-spot" style="left:71%; top:13%;">
        <button class="ph-spot__hit" data-spot="roof" aria-label="Покрівля — відкрити деталь">
          <span class="ph-spot__ring ph-spot__ring--auto"></span>
          <span class="ph-spot__dot"></span>
          <span class="ph-spot__tag">Покрівля</span>
        </button>
      </span>
      <!-- 2 · upper GLAZING band (dark glass) -> glazed volume -->
      <span class="ph-spot ph-spot--left" style="left:30%; top:23%;">
        <button class="ph-spot__hit" data-spot="glazing" aria-label="Скління — відкрити деталь">
          <span class="ph-spot__ring ph-spot__ring--auto"></span>
          <span class="ph-spot__dot"></span>
          <span class="ph-spot__tag">Скління</span>
        </button>
      </span>
      <!-- 3 · timber SOFFIT / overhang edge (left, between storeys) -> timber soffit -->
      <span class="ph-spot ph-spot--left" style="left:18.5%; top:40.5%;">
        <button class="ph-spot__hit" data-spot="soffit" aria-label="Підшивка терасою — відкрити деталь">
          <span class="ph-spot__ring ph-spot__ring--auto"></span>
          <span class="ph-spot__dot"></span>
          <span class="ph-spot__tag">Підшивка</span>
        </button>
      </span>
      <!-- 4 · lower BALCONY behind the glass (left terrace) -> terrace dining detail -->
      <span class="ph-spot" style="left:24%; top:55%;">
        <button class="ph-spot__hit" data-spot="balcony" aria-label="Тераса — відкрити деталь">
          <span class="ph-spot__ring ph-spot__ring--auto"></span>
          <span class="ph-spot__dot"></span>
          <span class="ph-spot__tag">Тераса</span>
        </button>
      </span>

      <div class="ph-foot">візуалізація · 4 деталі</div>
    </div>
  </section>

  <!-- ============ the veil-flat-detail-reveal MODAL (one node, content swapped) ============ -->
  <div class="vfd-overlay" id="detail">
    <div class="vfd-veil"></div>
    <div class="vfd-page">
      <div class="vfd-head">
        <button class="vfd-back"><span class="vfd-back__o">&#8592;</span> До фасаду</button>
        <span class="vfd-word">QUADRO</span>
      </div>
      <div class="vfd-crumbs"></div>

      <!-- LEFT rail: material narrative (we drive .vfd-type / .vfd-sub / .vfd-area / .vfd-note) -->
      <div class="vfd-rail">
        <div class="vfd-eyebrow2">матеріал</div>
        <div class="vfd-type"></div>
        <div class="vfd-sub"></div>
        <div class="vfd-area"></div>
        <p class="vfd-note"></p>
      </div>

      <!-- CENTER: the BIG full-bleed macro lands here. [data-render-surface] on .vfd-plan -->
      <div class="vfd-canvas">
        <div class="vfd-plan" data-render-surface></div>
        <div class="vfd-spec">
          <div class="vfd-spec__k">специфікація</div>
          <div class="vfd-spec__v"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- macro templates: each hotspot copies the matching one into .vfd-plan.
       NOT `hidden` (a hidden <img> never decodes -> the veil would uncover onto a black
       blank until decode = the flicker). They sit off-screen but decodable, and the init
       script force-decodes all four so the uncover always lands on a ready bitmap. -->
  <div id="macro-roof" class="ph-macro-src"><img src="renders/macro-roof.webp" alt="Покрівля QUADRO HOUSE, експлуатована тераса" decoding="async"></div>
  <div id="macro-glazing" class="ph-macro-src"><img src="renders/terrace-02.webp" alt="Скління QUADRO HOUSE, суцільний світлопрозорий об'єм" decoding="async"></div>
  <div id="macro-soffit" class="ph-macro-src"><img src="renders/macro-pergola.webp" alt="Підшивка тераси QUADRO HOUSE, дерев'яний софіт" decoding="async"></div>
  <div id="macro-balcony" class="ph-macro-src"><img src="renders/macro-table.webp" alt="Тераса QUADRO HOUSE, палубна дошка" decoding="async"></div>

  <!-- scaffold + adapters, then the cited atom, then ONE inline script -->
  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/veil-flat-detail-reveal/component.js"></script>

  <script>
    (function () {
      SectionHarness.boot();
      var gsap = window.gsap;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // each "+" -> its OWN element. type/sub feed the rail; spec is the one-line material line.
      // planSVG = the macro template id -> the engine copies THAT macro into .vfd-plan (the render surface).
      var DETAILS = {
        roof: {
          type: 'Покрівля',
          sub: 'Експлуатований дах',
          area: 'Тераса на даху',
          note: 'Плоский дах став відкритою терасою. Вихід просто з квартири, ніхто над вами.',
          spec: 'Терасна дошка, прихований водовідвід, парапет без звисів',
          planSVG: 'macro-roof'
        },
        glazing: {
          type: 'Скління',
          sub: 'Світлопрозорий об’єм',
          area: 'Від підлоги до стелі',
          note: 'Скло на всю висоту поверху. Світло заходить углиб, фасад читається одним об’ємом.',
          spec: 'Алюмінієвий профіль, склопакет із теплим контуром, прихована рама',
          planSVG: 'macro-glazing'
        },
        soffit: {
          type: 'Підшивка',
          sub: 'Дерев’яний софіт',
          area: 'Виліт над терасою',
          note: 'Виліт верхнього поверху підшитий деревом. Тінь удень, м’яке світло ввечері.',
          spec: 'Термодерево, точкові світильники в лінію, чорний металевий стояк',
          planSVG: 'macro-soffit'
        },
        balcony: {
          type: 'Тераса',
          sub: 'Палуба за склом',
          area: 'Вихід із вітальні',
          note: 'Тераса продовжує вітальню назовні. Обідній стіл стоїть на палубі, а не на бетоні.',
          spec: 'Палубна дошка, лага на регульованих опорах, чорне огородження',
          planSVG: 'macro-balcony'
        }
      };

      var detail;
      SectionHarness.ranOK('veil-flat-detail-reveal', function () {
        detail = window.VeilFlatDetailReveal.create('#detail', {
          veilColor: '#14191d', coverDur: 0.42, holdDur: 0.32, uncoverDur: 0.48, ease: 'expo.out',
          drawPlan: false,
          onClose: function () {
            // return focus to the stage; clear the one-shot will-change
            if (gsap) gsap.set('.vfd-rail, .vfd-plan', { clearProps: 'willChange' });
          }
        });
        window.__detail = detail;
        // paint the render surface at init (modal is hidden) so the gate sees a decoded
        // macro without needing a click; the first real open() swaps it under the veil.
        var plan = document.querySelector('#detail .vfd-plan');
        var seed = document.getElementById('macro-roof');
        if (plan && seed) plan.innerHTML = seed.innerHTML;
        // FORCE-DECODE all four macros up front so the veil never uncovers onto an
        // undecoded (black) image (the flicker). Off-screen .ph-macro-src imgs decode here.
        Array.prototype.forEach.call(document.querySelectorAll('.ph-macro-src img'), function (im) {
          if (im.decode) { try { im.decode().catch(function () {}); } catch (e) {} }
        });
      });

      // open the matching element on click; set the rail note + the one-line spec ourselves
      function openSpot(key) {
        var d = DETAILS[key];
        if (!d || !detail || !detail.open) return;
        // the engine fills .vfd-type/.vfd-sub/.vfd-area + copies the macro template into .vfd-plan
        detail.open({ type: d.type, sub: d.sub, areaM2: null, planSVG: d.planSVG, status: '' });
        // ensure the overlay is clickable now (the atom only sets pointer-events in its
        // animated path; under reduced-motion the close button would otherwise be dead).
        document.getElementById('detail').style.pointerEvents = 'auto';
        // our extra slots, set during the HOLD so they are unseen until uncover
        setTimeout(function () {
          var ov = document.getElementById('detail');
          var note = ov.querySelector('.vfd-note'); if (note) note.textContent = d.note;
          var area = ov.querySelector('.vfd-area'); if (area) area.textContent = d.area;
          var spec = ov.querySelector('.vfd-spec__v'); if (spec) spec.textContent = d.spec;
        }, reduced ? 0 : 460);
      }

      var spots = document.querySelectorAll('.ph-spot__hit');
      Array.prototype.forEach.call(spots, function (btn) {
        btn.addEventListener('click', function () { openSpot(btn.getAttribute('data-spot')); });
      });

      // gentle entrance of the dots (one-shot; clears will-change)
      if (gsap && !reduced) {
        gsap.from('.ph-spot', { autoAlpha: 0, scale: 0.4, duration: 0.7, ease: 'air',
          stagger: 0.09, delay: 0.25, transformOrigin: '50% 50%',
          onComplete: function () { gsap.set('.ph-spot', { clearProps: 'transform' }); } });
        gsap.from('.ph-title', { autoAlpha: 0, y: 24, duration: 0.9, ease: 'air', delay: 0.1 });
      }

      // INTERACTIVE section: no pin.
      SectionHarness.declare({
        pinOwner: 'none', expectPins: 0,
        atomsCited: ['veil-flat-detail-reveal']
      });
    })();
  </script>
</body>
</html>
