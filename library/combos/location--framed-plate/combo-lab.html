<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>combo: location--framed-plate · Карта-експонат (sepia)</title>
<!--
  SECTION VARIANT, location--framed-plate (role: location). MAP-STYLE = HERITAGE-SEPIA.
  COMPOSITION = FRAMED EXHIBIT: the real dense sepia map of с. Агрономічне is presented as a framed
  PLATE (a thin inset border + soft shadow + a surveyed corner frame: coords, scale bar, north arrow,
  sheet labels) sitting on a darker warm MAT with air around it, like an expensive map in a frame on
  a wall. NO big text over the map. The map is the hero; the frame makes it read costly. A thin caption
  strip of the 6 real POIs sits BELOW the plate. CONTROLLED-CLICK: reveals on scroll-in, then the USER
  clicks/hovers a POI (in the strip or the map) and the real Dijkstra route draws + honest minute badge.
  Everything is a layout frame around the map (no transform on the map), so nothing floats.

  asset-truth: streets/footprints/green + 6 real POIs verbatim from osm.js. Coords 49.18N 28.33E.
  __LAB_OK__: 0 pins, the cited atoms ran, [data-render-surface] painted, 0 errors.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/locmap-engine/component.css">
<link rel="stylesheet" href="../../components/coords-corner-frame/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  /* variant SKIN only. transform / opacity / clip-path / filter / stroke-dashoffset only.
     NO mix-blend, NO backdrop-filter, NO animating width/height/top/left/margin. */
  :root { --ease-air: cubic-bezier(.22,1,.36,1); }

  /* the MAT: a darker warm wall the framed plate sits on, with air around it */
  #combo.combo-stage { background:
      radial-gradient(120% 100% at 50% 38%, #2a2218, #1c160f 92%);
    min-height: 100vh; height: 100vh; position: relative; overflow: clip;
    display: grid; grid-template-rows: 1fr auto; align-items: stretch;
    padding: clamp(20px, 4.5vh, 56px) clamp(20px, 4.5vw, 72px) clamp(16px, 3vh, 40px); }

  /* the PLATE = the framed map. A thin border + soft shadow makes it an exhibit. */
  .fp__plate {
    position: relative; border-radius: 4px; overflow: clip;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,240,210,.06) inset,
                0 0 0 1px rgba(120,92,58,.5), 0 0 0 10px rgba(20,15,9,.0);
    border: 1px solid rgba(150,118,78,.55); }

  /* HERITAGE-SEPIA palette + treatment (lifted 1:1 from location--heritage-sepia) */
  #combo.combo-stage, .fp__field {
    --lm-ink: #4a3a26; --lm-bg-1: #e8dcc0; --lm-bg-2: #efe6d1;
    --lm-accent: #8c3a26; --lm-accent-soft: #a85a3e; --lm-lit: 224,150,96;
  }
  .fp__field {
    position: absolute; inset: 0; overflow: clip; background-color: #e8dcc0;
    background-image:
      radial-gradient(135% 110% at 50% 42%, rgba(74,58,38,0) 56%, rgba(74,58,38,.16) 84%, rgba(58,42,24,.28)),
      radial-gradient(60% 52% at 74% 78%, rgba(140,58,38,.07), rgba(140,58,38,0) 62%),
      radial-gradient(rgba(74,58,38,.05) 0.5px, transparent 0.6px),
      radial-gradient(rgba(74,58,38,.035) 0.5px, transparent 0.6px),
      radial-gradient(120% 100% at 42% 30%, #ece2c8, #ddd0af);
    background-size: auto, auto, 5px 5px, 8px 8px, auto;
  }
  .fp__field .lm__map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fp__field.lm__stage, .fp__field.lm { background-color: #e8dcc0; }
  .fp__field .lm-gw--green { fill: rgba(120,130,70,.10); }
  .fp__field .lm-gw--water { fill: rgba(110,130,150,.12); }
  .fp__field .lm-bld      { fill: rgba(120,82,44,.13); stroke: rgba(96,64,36,.22); stroke-width: 0.5; }
  .fp__field .lm-bld--lit { fill: rgba(120,82,44,.13); stroke: rgba(96,64,36,.22); animation: none; }
  .fp__field .lm-rdc { stroke: #efe6d1; }
  .fp__field .lm-rd--hwy   { stroke: rgba(74,52,30,.8); }
  .fp__field .lm-rd--main  { stroke: rgba(120,68,40,.72); }
  .fp__field .lm-rd--mid   { stroke: rgba(74,52,30,.46); }
  .fp__field .lm-rd--minor { stroke: rgba(74,52,30,.28); }
  .fp__field .lm-rd--faint { stroke: rgba(74,52,30,.13); }
  .fp__field .lm-rdname { fill: rgba(74,52,30,.6); text-anchor: middle; font-weight: 600; }
  .fp__field #lmHatch rect { fill: rgba(140,58,38,.10); }
  .fp__field #lmHatch line { stroke: rgba(140,58,38,.55); }
  .fp__field .lm-parcel { stroke: var(--lm-accent); stroke-width: 1.6; }
  .fp__field .lm-pulse  { stroke: var(--lm-accent-soft); }
  .fp__field .lm-sitetag { fill: #3c2e1c; }
  .fp__field .lm-ring  { stroke: rgba(120,68,40,.34); }
  .fp__field .lm-ringt { fill: rgba(74,52,30,.5); }
  .fp__field .lm-pt circle { fill: #efe6d1; stroke: rgba(120,68,40,.7); stroke-width: 1.4; }
  .fp__field .lm-pt text   { fill: #3c2e1c; }
  .fp__field .lm-pt:hover circle, .fp__field .lm-pt.is-on circle { fill: var(--lm-accent); stroke: #efe6d1; }
  .fp__field .lm-route  { stroke: var(--lm-accent); stroke-width: 3.2; }
  .fp__field .lm-walker { fill: #efe6d1; stroke: var(--lm-accent); }
  .fp__field .lm-livet  { fill: #fbf3e2; font-weight: 700; }
  .fp__field .lm-livebg { fill: var(--lm-accent); stroke: var(--lm-accent); }

  /* the surveyed corner frame (coords-corner-frame) tinted to ink-on-paper */
  .fp__plate .ccf-overlay { --ccf-ink: rgba(74,52,30,.7); --ccf-accent: #8c3a26; color: rgba(74,52,30,.7); }

  /* ---- the caption strip BELOW the plate: eyebrow + the 6 real POIs as a thin clickable row ---- */
  .fp__caption { display: flex; align-items: baseline; justify-content: space-between; gap: 1.4rem;
    padding-top: clamp(.7rem, 1.6vh, 1.1rem); color: #e8dcc0; }
  .fp__cap-l { display: flex; flex-direction: column; gap: .15rem; }
  .fp__eyebrow { font: 600 .62rem/1 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(232,220,192,.62); }
  .fp__title { font-family: var(--combo-serif); font-weight: 300; font-size: clamp(1rem, 1.5vw, 1.3rem);
    line-height: 1; letter-spacing: -.01em; color: #f3ead7; }
  /* the engine fills this list; render it as a horizontal strip of compact clickable items */
  .fp__list { display: flex; flex-wrap: wrap; gap: 0 1.3rem; justify-content: flex-end; max-width: 64%; }
  .fp__list .lm-row { display: inline-flex; align-items: baseline; gap: .4rem; padding: .2rem 0;
    border-bottom: 1px solid transparent; color: #e0d3b6; cursor: pointer;
    transition: color .25s, border-color .25s; }
  .fp__list .lm-row .n { color: rgba(168,90,62,.9); font-variant-numeric: tabular-nums; font-size: .72rem; }
  .fp__list .lm-row .nm { font-weight: 500; font-size: .82rem; }
  .fp__list .lm-row .tm { font-size: .72rem; opacity: .7; font-variant-numeric: tabular-nums; }
  .fp__list .lm-row:hover, .fp__list .lm-row.is-on { color: #fbf3e2; border-color: rgba(168,90,62,.7); }
  @media (max-width: 820px) { .fp__caption { flex-direction: column; gap: .6rem; } .fp__list { max-width: 100%; justify-content: flex-start; } }

  .combo-pre, .combo-post { background: #1c160f; color: rgba(232,220,192,.4); }
  @media (prefers-reduced-motion: reduce) { .fp__list .lm-row { transition: none; } }
</style>
</head>
<body>
  <div class="combo-pre">scroll ↓</div>

  <section id="combo" class="combo-stage" data-combo="location--framed-plate">

    <!-- THE FRAMED PLATE: the sepia map as an exhibit (corner frame injected by the atom) -->
    <div class="fp__plate" data-fp-plate>
      <div class="fp__field lm" data-lm-stage data-render-surface></div>
    </div>

    <!-- the caption strip below: eyebrow + title + the 6 real POIs as a thin clickable row -->
    <div class="fp__caption">
      <div class="fp__cap-l">
        <p class="fp__eyebrow">с. Агрономічне · за даними OpenStreetMap</p>
        <p class="fp__title">Що поруч, за хвилинами пішки</p>
      </div>
      <div class="fp__list" data-lm-list></div>
    </div>
  </section>

  <div class="combo-post">наступна секція</div>

  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/locmap-engine/component.js"></script>
  <script src="../../components/coords-corner-frame/component.js"></script>

  <script type="module">
    import { OSM } from './osm.js';
    SectionHarness.boot();

    // ---- ENGINE: the sepia map. owns_pin FALSE; reveal on scroll-in; CLICK/HOVER drives route ----
    SectionHarness.ranOK('locmap-engine', function () {
      var map = window.LocMap.create('#combo', {
        data: Object.assign({}, OSM, { site: Object.assign({}, OSM.site, { tag: 'Тут будується' }) }),
        mScale: 2.6, walkMin: 10, modes: ['loc'], route: true, flicker: { rate: 1e9 },
        reveal: { start: 'top 72%', once: true },
        parallax: { green: 1.0, buildings: 1.6, pins: 2.4 },
        ease: 'award'
      });
      window.__fpMap = map;
    });

    // ---- the surveyed corner frame on the plate (coords, scale bar, north, sheet labels) ----
    SectionHarness.ranOK('coords-corner-frame', function () {
      window.CoordsCornerFrame.create('[data-fp-plate]', {
        coords: '49.18N 28.33E', scale: '0 . . . 500 м', north: true,
        labels: { tl: 'План локації', bl: 'Агрономічне', br: 'Аркуш 01', rc: 'OSM 2026' },
        ease: 'air', inset: '2.6vmin', size: 30
      });
    });

    // pin-less controlled-interactive section. 0 pins.
    SectionHarness.declare({ pinOwner: 'none', expectPins: 0, atomsCited: ['locmap-engine', 'coords-corner-frame'] });
  </script>
</body>
</html>
