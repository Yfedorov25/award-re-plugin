<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>combo: hero--wordmark-docks-to-nav · Бренд, що сідає в навігацію (harness)</title>
<!--
  SECTION VARIANT (hero, candidate): hero--wordmark-docks-to-nav · "Бренд, що сідає в навігацію"
  Shape = ENGINE-ATOM. The cited atom hero-title-to-nav-pill OWNS the one pinned scrub
  ScrollTrigger (its create() builds a pin:true trigger). So this lab does NOT call
  SectionHarness.pin. The other three atoms are COUPLED to that one pin's progress:
    - hero-title-to-nav-pill : the giant QUADRO wordmark scroll-scrubs scale+translateY DOWN
      and DOCKS into a frosted pill that lives inside a REAL persistent top-centre nav. The pin
      OWNER. (B-entrance, whole pin.)
    - render-scroll-scale    : the SAME full-bleed render (.htp-render IS the .rss-frame) gently
      pushes in 1.0 -> 1.07 on the same progress. (A-ambient, whole pin.)
    - blur-reveal-stagger-title : the REAL headline sits BEHIND the wordmark; it blur-staggers
      into focus ONCE the wordmark clears centre (~p>0.5), a one-shot play(). (B-entrance, late.)
    - corner-frame-meta      : the authored-plate corner labels fade in as a one-shot near the
      same moment the headline lands. (C-microdetail, late.)
  Distinct timing layers (R_timing_layers): two coupled scrubs (pill + render) + two one-shots
  (headline + corners), never two fighting scrubbed systems.
  [data-render-surface] sits on #renderFrame (the full-bleed render the hero paints into).
  Asset: renders/day-34.webp — the clean cars-free LANDSCAPE frontal crop (1920x1080). NO
  scrubbed video bg. The building/atmosphere is the hero; sparse Fedoriv UA copy; zero em/en-dashes.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- GSAP first (the engine atom + the scaffold both register against this one source) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<!-- cited atoms' component.css (never inline atom code) -->
<link rel="stylesheet" href="../../components/hero-title-to-nav-pill/component.css" />
<link rel="stylesheet" href="../../components/render-scroll-scale/component.css" />
<link rel="stylesheet" href="../../components/blur-reveal-stagger-title/component.css" />
<link rel="stylesheet" href="../../components/corner-frame-meta/component.css" />
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css" />

<style>
  /* ============================================================
     variant SKIN only — the scaffold + atom CSS own the rails, the pin, the pill chrome,
     the corner positions, the per-word reveal. This skin handles: the dark grade over the
     render, the REAL top-centre nav the pill docks into, the headline that hides behind the
     wordmark, type scale, and the lab field. transform / opacity / clip-path / filter only.
     ============================================================ */
  :root{
    --ink:#f4f1ea; --ink-dim:rgba(244,241,234,.62);
    --field:#16130f; --line:rgba(244,241,234,.14);
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  .combo-pre,.combo-post{ background:var(--field); }

  /* the stage IS the .htp-stage (the atom CSS sets position/height/overflow for that class) */
  #hero{ background:var(--field); }

  /* the full-bleed render doubles as the rss scaling frame. The atom .htp-render gives it
     inset:0/z-index:0; .rss-frame would normally set its own size, but here the render lives
     absolutely inside the stage, so we keep .htp-render's box and only let .rss-render scale. */
  #renderFrame{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  #renderFrame .rss-render{ position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block; transform-origin:50% 56%; will-change:transform; }

  /* readability grade over the render (linear + soft top band for the nav). opacity-composited,
     NO backdrop, NO mix-blend. Sits above the render, below the nav/wordmark/copy. */
  .grade{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(12,10,8,.46) 0%, rgba(12,10,8,0) 22%),
      linear-gradient(0deg, rgba(12,10,8,.42) 0%, rgba(12,10,8,0) 40%); }

  /* ---- the REAL persistent top-centre nav the wordmark docks INTO ----
     A thin bar pinned to the top of the stage. Left + right nav clusters flank a centred
     SLOT; the atom's .htp-pill (the frosted plate) lands inside that slot, and the shrunk
     wordmark docks over it. This is the mechanic: a brand that sits down into the nav. */
  .nav{ position:absolute; top:0; left:0; right:0; z-index:5; height:64px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 clamp(20px,4vw,56px); pointer-events:none;
    border-bottom:1px solid rgba(244,241,234,.10); }
  .nav__left,.nav__right{ display:flex; gap:clamp(14px,2vw,30px); font:600 11px/1 var(--sans);
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); }
  .nav__right{ justify-content:flex-end; }
  .nav a{ color:inherit; text-decoration:none; pointer-events:auto;
    transition:color .3s cubic-bezier(.22,1,.36,1); }
  .nav a:hover{ color:var(--ink); }
  /* the centred slot that holds the frosted pill — same width/height as the pill plate so the
     docked mark lands dead-centre in the bar. The atom's .htp-pill is fixed at top:14px,
     left:50%, translateX(-50%); this slot is purely a visual rail mark so the dock reads
     intentional even before the plate fades in. */
  .nav__slot{ width:var(--htp-pill-w,196px); height:40px; border-radius:0 0 16px 16px;
    border:1px solid rgba(244,241,234,.0); }

  /* the moving wordmark — the atom moves .htp-mark; we only skin the glyph */
  .htp-mark .word{ font-family:var(--serif); font-style:italic; font-weight:300; color:#fff;
    font-size:clamp(3.4rem,12vw,10.5rem); line-height:.92; letter-spacing:-.03em; white-space:nowrap;
    text-shadow:0 4px 40px rgba(0,0,0,.32); }

  /* tune the frosted pill plate to the docked mark size (the atom reads these vars) */
  #hero{ --htp-pill-w:196px; --htp-pill-h:46px; }
  .htp-pill{ top:12px; height:46px; border-radius:0 0 16px 16px; }

  /* ---- the REAL headline, hidden BEHIND the wordmark, blur-staggers in once the mark clears
     centre. It sits lower than centre (the wordmark dock vacates the centre band) and reveals
     per word via blur-reveal-stagger-title. z below the wordmark while the mark is big, but the
     mark has shrunk + risen to the nav by the time the headline lands, so they never collide. */
  .head{ position:absolute; z-index:2; left:50%; top:54%; transform:translate(-50%,-50%);
    width:min(94vw,1000px); text-align:center; pointer-events:none; }
  .head__eyebrow{ font:600 12px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:clamp(14px,2vh,22px); opacity:0; }
  .head__title{ font-family:var(--serif); font-weight:300; color:var(--ink);
    font-size:clamp(2rem,5vw,4.2rem); line-height:1.04; letter-spacing:-.02em;
    text-shadow:0 2px 30px rgba(0,0,0,.45); white-space:nowrap; }

  /* corner meta plate (the atom positions [data-corner]; we only set colour/contrast) */
  .corner{ color:var(--ink); opacity:.9; font-family:var(--sans);
    text-shadow:0 1px 18px rgba(0,0,0,.55); z-index:4; }
  [data-corner]{ z-index:4; }
  .corner b{ font-weight:600; }
  .corner .dim{ color:var(--ink-dim); }

  /* progress rail — a thin scaleY bead so the one heroic gesture has a read-out */
  .rail{ position:absolute; right:clamp(20px,4vw,40px); top:50%; transform:translateY(-50%);
    z-index:4; width:1px; height:120px; background:rgba(244,241,234,.16); transform-origin:50% 0; }
  .rail__fill{ position:absolute; inset:0; background:var(--ink); transform:scaleY(0);
    transform-origin:50% 0; will-change:transform; }

  /* reduced-motion / narrow: the atoms fall to their static branches (docked pill shown,
     render at scaleFrom, words sharp, corners shown). Make the headline + eyebrow visible too. */
  @media (prefers-reduced-motion: reduce){
    .head__eyebrow{ opacity:1 !important; }
  }
  @media (max-width:820px){
    .head__eyebrow{ opacity:1; }
    .head__title{ font-size:clamp(1.7rem,7vw,2.6rem); }
  }
</style>
</head>
<body>

<div class="combo-pre">бренд сідає в навігацію ↓</div>

<!-- PINNED HERO STAGE = the atom's .htp-stage. The pill (engine) owns the one pin. -->
<section class="htp-stage" id="hero">

  <!-- full-bleed render = BOTH the pill's background AND the rss scaling layer. [data-render-surface]. -->
  <div class="htp-render" id="renderFrame" data-render-surface>
    <img class="rss-render" src="renders/day-34.webp" alt="QUADRO, фасад удень" />
  </div>

  <!-- readability scrim owned by the atom (fades as the mark shrinks) + our grade -->
  <div class="htp-scrim"></div>
  <div class="grade" aria-hidden="true"></div>

  <!-- REAL persistent top-centre nav with the dock slot the pill lands in -->
  <nav class="nav" aria-label="QUADRO">
    <div class="nav__left">
      <a href="#">Проєкт</a>
      <a href="#">Локація</a>
    </div>
    <div class="nav__slot" aria-hidden="true"></div>
    <div class="nav__right">
      <a href="#">Квартири</a>
      <a href="#">Контакти</a>
    </div>
  </nav>

  <!-- the frosted pill plate the mark docks into (lives at top-centre, in the nav row) -->
  <div class="htp-pill"></div>

  <!-- the giant moving wordmark (same DOM node the whole way) -->
  <div class="htp-mark"><div class="word">QUADRO</div></div>

  <!-- the REAL headline behind the wordmark; blur-staggers in once the mark docks -->
  <div class="head">
    <div class="head__eyebrow" id="eyebrow">Власний берег, Україна</div>
    <!-- plain text only: blur-reveal-stagger-title splits on whitespace, so NO inner tags here
         (an <em> would be torn across word spans). The italic display voice lives in the wordmark. -->
    <h1 class="head__title" id="headline">Дім на воді, не в потоці</h1>
  </div>

  <!-- authored-plate corner meta -->
  <div class="corner">
    <div data-corner="tl"><b>QUADRO</b><br><span class="dim">503.21 · 34.21</span></div>
    <div data-corner="bl"><span class="dim">Перший рядок до берега</span></div>
    <div data-corner="br" style="text-align:right"><span class="dim">Візуалізація</span><br><b>День</b></div>
    <div data-corner="rc" style="text-align:right"><span class="dim">01</span></div>
  </div>

  <!-- progress rail -->
  <div class="rail" aria-hidden="true"><div class="rail__fill" id="railFill"></div></div>

</section>

<div class="combo-post">наступна секція</div>

<!-- scaffold + adapters FIRST (rails + honest gate), then the cited atoms -->
<script src="../_scaffold/combo-scaffold.js"></script>
<script src="../_scaffold/adapters.js"></script>
<script src="../../components/hero-title-to-nav-pill/component.js"></script>
<script src="../../components/render-scroll-scale/component.js"></script>
<script src="../../components/blur-reveal-stagger-title/component.js"></script>
<script src="../../components/corner-frame-meta/component.js"></script>

<script>
  (function () {
    SectionHarness.boot();
    var gsap = window.gsap;
    if (gsap && window.CustomEase && !gsap.parseEase('expoOut')) {
      try { window.CustomEase.create('expoOut', '0.16,1,0.3,1'); } catch (e) {}
    }

    var railFill = document.getElementById('railFill');

    // --- ATOM 2: render-scroll-scale — the full-bleed render, host-driven (we call set(p)).
    //     A gentle push-in on the SAME pin. selfTrigger:false (no second trigger).
    var rss = null;
    SectionHarness.ranOK('render-scroll-scale', function () {
      rss = RenderScrollScale.create('#renderFrame', {
        scaleFrom: 1.0, scaleTo: 1.07, originY: '56%', drift: 0,
        ease: 'none', selfTrigger: false, manageLenis: false
      });
      window.__rss = rss;
    });

    // --- ATOM 3: blur-reveal-stagger-title — the REAL headline, split per word, scrubbed off
    //     by set(0) at init; played as a ONE-SHOT once the wordmark clears centre.
    var brst = null;
    SectionHarness.ranOK('blur-reveal-stagger-title', function () {
      brst = BlurRevealStaggerTitle.create('#headline', {
        blur: 22, stagger: 0.12, duration: 0.62, ease: 'power2.out'
      });
      brst.set(0); // hidden behind the giant wordmark until it docks
      window.__brst = brst;
    });

    // --- ATOM 4: corner-frame-meta — authored-plate corners, one-shot near the headline land.
    var cfm = null;
    SectionHarness.ranOK('corner-frame-meta', function () {
      cfm = CornerFrameMeta.create('.corner', { sel: '[data-corner]', dur: 0.5, ease: 'power2.out', stagger: 0.09 });
      window.__cfm = cfm;
    });

    // --- ATOM 1 (PIN OWNER): hero-title-to-nav-pill — the wordmark docks into the nav pill.
    //     create() builds the ONE pinned scrub trigger with its own onUpdate. We let it run,
    //     then COUPLE the other atoms onto the SAME progress by wrapping that trigger's onUpdate
    //     (we call the pill's own set(p) first to preserve its dock, then drive the rest).
    var pill = null, headFired = false, cornersFired = false;
    SectionHarness.ranOK('hero-title-to-nav-pill', function () {
      pill = HeroTitleToNavPill.create('#hero', {
        pillScale: 0.085, pillY: -46, pinFactor: 1.0, ease: 'power2.inOut',
        scrim: true, manageLenis: false
      });
      window.__pill = pill;

      function couple(p) {
        // pill.set(p) is driven by the atom's OWN onUpdate (its trigger captured that callback
        // at create-time, so we do NOT overwrite it). We only drive the COUPLED atoms here off
        // the same progress, read each frame from the same pin's trigger.progress.
        if (rss && rss.set) rss.set(p);               // the render push-in, same progress
        if (railFill && gsap) gsap.set(railFill, { scaleY: p });
        // headline blur-staggers in ONLY AFTER the giant mark has visibly CLEARED the centre
        // band (by p~0.62 the mark is scaled small and rising into the nav), so the two never
        // overlap on screen. One-shot, reversible on scroll-up.
        if (!headFired && p > 0.62) {
          headFired = true;
          if (brst && brst.play) brst.play();
          if (gsap) gsap.to('#eyebrow', { opacity: 1, duration: 0.7, ease: 'power2.out' });
          else document.getElementById('eyebrow').style.opacity = '1';
        }
        if (headFired && p < 0.54) {
          headFired = false;
          if (brst && brst.set) brst.set(0);
          if (gsap) gsap.set('#eyebrow', { opacity: 0 });
        }
        // corners fade in just after the headline lands (one-shot)
        if (!cornersFired && p > 0.74) {
          cornersFired = true;
          if (cfm && cfm.reveal) cfm.reveal();
        }
        if (cornersFired && p < 0.64) {
          cornersFired = false;
          if (cfm && cfm.set) cfm.set(0);
        }
      }

      // COUPLING: the pill atom captured its OWN onUpdate at create-time, so we cannot inject
      // ours there. Instead poll the same pin's trigger.progress on gsap.ticker (no second
      // ScrollTrigger, no second pin) and drive the coupled atoms off that one scroll position.
      // This is the ONE scroll owner; everything rides its progress.
      if (pill.trigger && gsap) {
        var tr = pill.trigger, last = -1;
        gsap.ticker.add(function () {
          var p = tr.progress;
          if (p === last) return;        // only on change (cheap)
          last = p;
          couple(p);
        });
        couple(0); // init state (giant centred mark, headline hidden)
      } else {
        // STATIC branch (reduced-motion / <=820px / no GSAP): the pill is shown docked.
        // Resolve every coupled atom to its resting/visible state so nothing stays hidden.
        if (rss && rss.set) rss.set(0);
        if (brst && brst.set) brst.set(1);
        var eb = document.getElementById('eyebrow'); if (eb) eb.style.opacity = '1';
        if (cfm && cfm.set) cfm.set(1);
        if (railFill) railFill.style.transform = 'scaleY(1)';
      }
    });

    // PIN OWNER = the engine atom. Do NOT call SectionHarness.pin(). Declare the contract.
    SectionHarness.declare({
      pinOwner: 'hero-title-to-nav-pill', expectPins: 1,
      atomsCited: ['hero-title-to-nav-pill', 'render-scroll-scale', 'blur-reveal-stagger-title', 'corner-frame-meta']
    });
  })();
</script>
</body>
</html>
