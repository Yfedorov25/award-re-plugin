<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>combo: location--concierge-radiate · Все поруч, від ваших дверей</title>
<!--
  SECTION VARIANT, location--concierge-radiate (role: location).
  MAP-STYLE = LIGHT EDITORIAL + RADIATING THREADS over a real dense map. The SAME dense real OSM
  district of с. Агрономічне as the surveyed-route-map ideal (real road hierarchy by class, 823
  building footprints, the site parcel inside a true-scale 10-minute walking ring, real Dijkstra
  routes drawn along the actual streets with a walking dot and a live minute counter), re-rendered
  in a DIFFERENT cartographic TREATMENT: a light cream-day editorial plan (cream paper, dark-ink
  roads, warm-grey footprints, one terracotta accent), NO warm-lit windows. The realism is identical
  to the ideal (same baked OSM, same routes); only the palette and line/fill treatment differ.

  SIGNATURE on top of the real map: thin terracotta LEADER-THREADS splay from the REAL site
  (OSM.site 746,325) to each of the 6 REAL POIs, each carrying its real walk-minute, drawn in the
  engine's OWN SVG coordinate space (viewBox 120 -20 1060 660) so they land exactly on the real POI
  coords. The threads are the mark; the dense real map is the base.

  Shape = ENGINE-ATOM-DRIVEN-BY-HARNESS-PIN: locmap-engine (owns_pin=FALSE) bakes the SVG + draws
  routes; the harness owns the ONE section pin. On scroll-in the threads radiate (stroke-dashoffset).
  As you scroll the pinned range the section STEPS through the 6 REAL POIs one at a time: each step
  calls map.select(id) -> the real Dijkstra route DRAWS along the actual streets, a walking dot rides
  it, the live minute counter grows to the REAL walk-time, and the matching thread lights. ONE clean
  story block per step (number + POI name + real minutes), cross-faded so two are never legible at once.

  asset-truth: streets/footprints from osm-agronomichne.js; site = OSM.site; the 6 threads + POI
  names + minutes are the 6 REAL POIs (Школа·садок 9хв, Нова Пошта 10хв, Траш! 9хв, Подорожник 10хв,
  Грош Експрес 15хв, Аврора 18хв). A module island asserts the thread targets equal the OSM coords.
  __LAB_OK__ passes only if: 1 pin, the cited real atom ran, [data-render-surface] painted (the cream
  paper), 0 real console errors. NO WebGL/canvas/tiles/mix-blend/backdrop-filter.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/locmap-engine/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  /* variant SKIN only (scaffold owns the rails). transform / opacity / clip-path / filter /
     stroke-dashoffset only. NO mix-blend, NO backdrop-filter, NO animating width/height/top/left. */

  /* LIGHT EDITORIAL / CREAM-DAY PALETTE: re-point every engine token to a cream-paper register
     with dark-ink roads, warm-grey footprints, ONE terracotta accent. Same engine, different paint
     (the whole "different map style"); the threads are the signature mark drawn on top. */
  #combo.combo-stage,
  .cr__field {
    --lm-ink: #2a2118;            /* dark warm ink foreground (roads, type) */
    --lm-bg-1: #f3ede1;          /* cream paper */
    --lm-bg-2: #f3ede1;          /* road casing = cream halo so dark strokes separate on paper */
    --lm-accent: #b15a36;        /* terracotta, the single editorial accent (parcel + active route) */
    --lm-accent-soft: #c47a55;
  }
  #combo.combo-stage { background: #f3ede1; color: #2a2118; }

  /* the render surface = cream PAPER. A real CSS background (a hairline warm grain over the cream)
     so the honest paint-probe sees a painted surface AND the sheet reads like printed editorial stock. */
  .cr__field {
    background-color: #f3ede1;
    background-image:
      radial-gradient(125% 95% at 76% 26%, rgba(255,251,243,.9) 0%, rgba(243,237,225,0) 56%),
      radial-gradient(rgba(42,33,24,.020) 0.5px, transparent 0.6px),
      radial-gradient(rgba(42,33,24,.014) 0.5px, transparent 0.6px);
    background-size: 100% 100%, 4px 4px, 7px 7px;
    background-position: 0 0, 0 0, 2px 3px;
  }
  .cr__field .lm__map { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the engine's stage gradient would re-tint the field; force the flat cream paper under the SVG */
  .cr__field.lm__stage, .cr__field.lm { background-color: #f3ede1; }

  /* ---- LIGHT EDITORIAL MAP TREATMENT: redraw the engine's SVG classes ink-on-cream ---- */
  /* green demoted to a faint sage wash so the cream sheet stays editorial */
  .cr__field .lm-gw--green { fill: rgba(96,116,84,.10); }
  .cr__field .lm-gw--water { fill: rgba(96,128,150,.12); }

  /* buildings: warm-grey footprints, hairline ink stroke, a printed cadastral plan.
     NO lit windows in cream-day: the --lit class renders like every other footprint. */
  .cr__field .lm-bld      { fill: rgba(42,33,24,.075); stroke: rgba(42,33,24,.14); stroke-width: 0.5; }
  .cr__field .lm-bld--lit { fill: rgba(42,33,24,.075); stroke: rgba(42,33,24,.14); animation: none; }

  /* road hierarchy: DARK INK strokes over a CREAM halo casing, so the grid reads crisp on the
     warm-grey footprint field. Widths kept from the engine ranking; casing is the cream halo. */
  .cr__field .lm-rdc { stroke: #f3ede1; }
  .cr__field .lm-rd--hwy   { stroke: rgba(42,33,24,.86); }
  .cr__field .lm-rd--main  { stroke: rgba(177,90,54,.72); }   /* the main artery picks up the accent */
  .cr__field .lm-rd--mid   { stroke: rgba(42,33,24,.46); }
  .cr__field .lm-rd--minor { stroke: rgba(42,33,24,.28); }
  .cr__field .lm-rd--faint { stroke: rgba(42,33,24,.13); }
  .cr__field .lm-rdname { fill: rgba(42,33,24,.5); }

  /* parcel: terracotta hatch + stroke; tag in ink. (engine hatch uses brick rgba, override to warm) */
  .cr__field #lmHatch rect { fill: rgba(177,90,54,.10); }
  .cr__field #lmHatch line { stroke: rgba(177,90,54,.7); }
  .cr__field .lm-parcel { stroke: var(--lm-accent); stroke-width: 1.7; }
  .cr__field .lm-pulse  { stroke: var(--lm-accent); }
  .cr__field .lm-sitetag { fill: #2a2118; }

  /* walking ring: thin warm dashed */
  .cr__field .lm-ring  { stroke: rgba(42,33,24,.26); }
  .cr__field .lm-ringt { fill: rgba(42,33,24,.5); }

  /* numbered POIs: cream disc, ink ring, ink numeral; active flips to the terracotta accent */
  .cr__field .lm-pt circle { fill: #fbf6ec; stroke: rgba(42,33,24,.7); stroke-width: 1.4; }
  .cr__field .lm-pt text   { fill: #2a2118; }
  .cr__field .lm-pt:hover circle, .cr__field .lm-pt.is-on circle { fill: var(--lm-accent); stroke: #fbf6ec; }

  /* the active Dijkstra route + walker + live badge (the engine accent) */
  .cr__field .lm-route  { stroke: var(--lm-accent); stroke-width: 3.2; }
  .cr__field .lm-walker { fill: var(--lm-accent); stroke: #fbf6ec; }
  .cr__field .lm-livet  { fill: #fbf6ec; }
  .cr__field .lm-livebg { fill: var(--lm-accent); stroke: var(--lm-accent); }

  /* ---- THE SIGNATURE: radiating leader-threads (authored layer, viewBox units) ----
     A thin terracotta hairline bows from the real site to each real POI, with an open ring on the
     POI end and the real walk-minute in ink. Drawn in via stroke-dashoffset. Only stroke/opacity. */
  .cr-threads .cr-thread {
    fill: none; stroke: var(--lm-accent-soft); stroke-width: 1.4;
    stroke-linecap: round; opacity: .9;
  }
  .cr-threads .cr-thread.is-on { stroke: var(--lm-accent); stroke-width: 2; }
  .cr-threads .cr-thread.is-dim { opacity: .32; }
  .cr-threads .cr-end { fill: #fbf6ec; stroke: var(--lm-accent); stroke-width: 1.5; }
  .cr-threads .cr-end.is-on { fill: var(--lm-accent); stroke: #fbf6ec; }
  .cr-threads .cr-mlabel {
    fill: #2a2118; font: 600 12.5px/1 'Inter', system-ui, sans-serif;
    letter-spacing: .02em; font-variant-numeric: tabular-nums;
    paint-order: stroke; stroke: rgba(251,246,236,.92); stroke-width: 3.4px; stroke-linejoin: round;
  }
  .cr-threads .cr-mlabel.is-on { fill: var(--lm-accent); }

  /* ---- the reading rail (ink on cream): eyebrow + ONE stepping story block ---- */
  .cr__rail {
    position: absolute; z-index: 8;
    left: clamp(20px, 4vw, 64px); bottom: clamp(26px, 7vh, 72px);
    width: min(34ch, 46vw); pointer-events: none;
  }
  @media (min-width: 900px) {
    .cr__rail { left: auto; right: clamp(24px, 4vw, 72px); width: min(30ch, 34vw); }
  }
  .cr__eyebrow {
    font: 600 .68rem/1 var(--combo-sans);
    letter-spacing: .26em; text-transform: uppercase;
    color: rgba(42,33,24,.6); margin: 0 0 clamp(.9rem, 2.4vh, 1.6rem);
  }
  .cr__coords {
    display: block; margin-top: .5rem;
    font: 500 .64rem/1.4 var(--combo-sans);
    letter-spacing: .12em; color: rgba(42,33,24,.42); text-transform: none;
  }
  .cr__story { position: relative; min-height: clamp(124px, 20vh, 184px); }
  .cr__block {
    position: absolute; inset: 0; opacity: 0; will-change: opacity, transform;
    transform: translateY(14px);
  }
  .cr__no {
    font: 600 .7rem/1 var(--combo-sans); letter-spacing: .2em;
    color: var(--lm-accent); font-variant-numeric: tabular-nums;
  }
  .cr__place {
    font-family: var(--combo-serif); font-weight: 300;
    font-size: clamp(2rem, 4vw, 3.4rem); line-height: .98; letter-spacing: -.03em;
    color: #2a2118; margin: clamp(.5rem,1.4vh,.9rem) 0 0;
  }
  .cr__time {
    margin-top: clamp(.7rem, 1.8vh, 1.2rem);
    font: 500 .92rem/1.5 var(--combo-sans); letter-spacing: .02em;
    color: rgba(42,33,24,.78);
  }
  .cr__time b { font-weight: 600; color: #2a2118; font-variant-numeric: tabular-nums; }

  /* a slim step progress, one tick per real POI, the active one filled terracotta */
  .cr__steps {
    position: absolute; z-index: 8; left: clamp(20px, 4vw, 64px); bottom: clamp(20px, 5vh, 44px);
    display: flex; gap: 8px; pointer-events: none;
  }
  @media (max-width: 899px) { .cr__steps { bottom: auto; top: clamp(18px, 4vh, 40px); } }
  .cr__tick { width: 26px; height: 2px; background: rgba(42,33,24,.2); transform-origin: left center; }
  .cr__tick.on { background: var(--lm-accent); }

  /* the standing section label top-left */
  .cr__label {
    position: absolute; z-index: 8; top: clamp(20px, 5vh, 52px); left: clamp(20px, 4vw, 64px);
    font: 600 .66rem/1 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(42,33,24,.56);
  }
  .combo-pre, .combo-post { background: #ece4d6; color: rgba(42,33,24,.45); }

  @media (prefers-reduced-motion: reduce) { .cr__block { transition: none; } }
</style>
</head>
<body>
  <div class="combo-pre">scroll ↓</div>

  <section id="combo" class="combo-stage" data-combo="location--concierge-radiate">

    <!-- the cream paper field + the side list host. locmap-engine injects the SVG here. -->
    <div class="cr__field lm" data-lm-stage data-render-surface></div>

    <p class="cr__label">с. Агрономічне · за даними OpenStreetMap</p>

    <div class="cr__rail">
      <p class="cr__eyebrow">Все поруч
        <span class="cr__coords">49.18° Пн · 28.33° Сх · 5 хвилин від Вінниці</span>
      </p>
      <div class="cr__story" data-cr-story></div>
    </div>

    <!-- side list the engine fills (hidden off-screen; powers click-to-select + a11y) -->
    <div data-lm-list hidden></div>

    <div class="cr__steps" data-cr-steps></div>
  </section>

  <div class="combo-post">наступна секція</div>

  <!-- scaffold + adapters, then the cited atom (canon engine) -->
  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/locmap-engine/component.js"></script>

  <script type="module">
    import { OSM } from './osm.js';

    SectionHarness.boot();
    var gsap = window.gsap;
    var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var NS = 'http://www.w3.org/2000/svg';

    // the 6 REAL POIs, in a walking order that reads as a tour (verbatim names + minutes)
    var ORDER = ['school', 'np', 'trash', 'apteka', 'grosh', 'avrora'];
    var byId = {}; OSM.pois.forEach(function (p) { byId[p.id] = p; });
    var POIS = ORDER.map(function (id) { return byId[id]; }).filter(Boolean);
    var SITE = { x: OSM.site.x, y: OSM.site.y };

    // ---- ENGINE job: the dense real map, re-themed light-editorial via CSS (owns_pin=FALSE) ----
    var map;
    SectionHarness.ranOK('locmap-engine', function () {
      map = window.LocMap.create('#combo', {
        data: Object.assign({}, OSM, { site: Object.assign({}, OSM.site, { tag: 'Тут будується' }) }),
        mScale: 2.6,
        walkMin: 10,
        modes: ['loc'],
        flicker: { rate: 1e9 },    // cream-day: NO lit windows (rate huge -> none light)
        route: true,
        reveal: { start: 'top 75%', once: true },
        parallax: { green: 1.2, buildings: 2, pins: 3 },
        ease: 'award'
      });
      window.__crMap = map;
    });

    // ---- SIGNATURE: append the radiating leader-threads INTO the engine's baked SVG ----
    // One bowed quadratic path per REAL POI from SITE -> poi (control offset perpendicular to the
    // radius, the smarts thread math), an open ring on the POI end, the real walk-minute as text.
    // All in viewBox units, so the threads land EXACTLY on the real POI coords at any viewport.
    var threadEls = {};   // id -> { path, end, label, len }
    (function buildThreads() {
      var svg = map && map.svg ? map.svg : document.querySelector('#combo .lm__map');
      if (!svg) return;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'cr-threads');
      g.setAttribute('data-cr-threads', '');
      g.setAttribute('aria-hidden', 'true');
      POIS.forEach(function (p) {
        var dx = p.x - SITE.x, dy = p.y - SITE.y;
        var dist = Math.hypot(dx, dy) || 1;
        var mx = (SITE.x + p.x) / 2, my = (SITE.y + p.y) / 2;
        // perpendicular to the radius, a gentle consistent bow so threads splay (not straight spokes)
        var nx = -dy / dist, ny = dx / dist;
        var bow = Math.min(46, dist * 0.13);
        var qx = mx + nx * bow, qy = my + ny * bow;
        // stop the thread a touch short of the pin disc so the open ring reads as the terminus
        var ex = p.x - (dx / dist) * 13, ey = p.y - (dy / dist) * 13;
        var path = document.createElementNS(NS, 'path');
        path.setAttribute('class', 'cr-thread');
        path.setAttribute('data-id', p.id);
        // stamp the REAL POI target coord this thread was built FROM (for the asset-truth island)
        path.setAttribute('data-tx', Math.round(p.x)); path.setAttribute('data-ty', Math.round(p.y));
        path.setAttribute('d', 'M' + SITE.x.toFixed(1) + ' ' + SITE.y.toFixed(1) +
          ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1));
        g.appendChild(path);
        var end = document.createElementNS(NS, 'circle');
        end.setAttribute('class', 'cr-end');
        end.setAttribute('data-id', p.id);
        end.setAttribute('cx', ex.toFixed(1)); end.setAttribute('cy', ey.toFixed(1));
        end.setAttribute('r', 3.4);
        g.appendChild(end);
        // minute label, nudged outward along the radius so it sits beyond the ring, never on the pin
        var lx = p.x + (dx / dist) * 18, ly = p.y + (dy / dist) * 18 + 4;
        var label = document.createElementNS(NS, 'text');
        label.setAttribute('class', 'cr-mlabel');
        label.setAttribute('data-id', p.id);
        label.setAttribute('x', lx.toFixed(1)); label.setAttribute('y', ly.toFixed(1));
        label.setAttribute('text-anchor', dx >= 0 ? 'start' : 'end');
        label.textContent = p.walk + ' хв';
        g.appendChild(label);
        threadEls[p.id] = { path: path, end: end, label: label, len: 0 };
      });
      svg.appendChild(g);
      // measure once for the dashoffset radiate-in
      Object.keys(threadEls).forEach(function (id) {
        var t = threadEls[id];
        try { t.len = t.path.getTotalLength(); } catch (e) { t.len = 220; }
      });
    })();

    // radiate the threads in (stroke-dashoffset), staggered, on scroll-in. NON-pin trigger so it
    // never contends for the single section pin. Reduced-motion -> threads shown final/static.
    function radiateThreads() {
      var ids = POIS.map(function (p) { return p.id; });
      if (!gsap || REDUCED) {
        ids.forEach(function (id) {
          var t = threadEls[id]; if (!t) return;
          if (gsap) gsap.set([t.path, t.end, t.label], { opacity: 1 });
          else { t.path.style.opacity = 1; t.end.style.opacity = 1; t.label.style.opacity = 1; }
        });
        return;
      }
      ids.forEach(function (id) {
        var t = threadEls[id]; if (!t) return;
        gsap.set(t.path, { strokeDasharray: t.len, strokeDashoffset: t.len, opacity: 0.9 });
        gsap.set([t.end, t.label], { opacity: 0 });
      });
      if (window.ScrollTrigger) {
        window.ScrollTrigger.create({
          trigger: '#combo', start: 'top 70%', once: true,
          onEnter: function () {
            ids.forEach(function (id, k) {
              var t = threadEls[id]; if (!t) return;
              gsap.to(t.path, { strokeDashoffset: 0, duration: 0.95, delay: 0.25 + k * 0.13,
                ease: 'air', onComplete: function () { t.path.style.willChange = ''; } });
              gsap.to([t.end, t.label], { opacity: 1, duration: 0.4, delay: 0.6 + k * 0.13, ease: 'air' });
            });
          }
        });
      } else {
        ids.forEach(function (id) {
          var t = threadEls[id]; if (!t) return;
          gsap.set(t.path, { strokeDashoffset: 0 }); gsap.set([t.end, t.label], { opacity: 1 });
        });
      }
    }
    radiateThreads();

    // light the active thread (and calm the rest) in step with the POI being walked
    function lightThread(id) {
      Object.keys(threadEls).forEach(function (k) {
        var t = threadEls[k]; if (!t) return;
        var on = k === id;
        t.path.classList.toggle('is-on', on);
        t.path.classList.toggle('is-dim', !on);
        t.end.classList.toggle('is-on', on);
        t.label.classList.toggle('is-on', on);
      });
    }

    // ---- build the stepping story blocks + the step ticks from the REAL POIs ----
    var storyEl = document.querySelector('[data-cr-story]');
    var stepsEl = document.querySelector('[data-cr-steps]');
    var blocks = POIS.map(function (p, i) {
      var b = document.createElement('div');
      b.className = 'cr__block'; b.dataset.idx = i;
      b.innerHTML =
        '<div class="cr__no">' + String(i + 1).padStart(2, '0') + ' / ' + String(POIS.length).padStart(2, '0') + '</div>' +
        '<h3 class="cr__place">' + p.label + '</h3>' +
        '<p class="cr__time"><b>' + p.walk + ' хв</b> пішки · <b>' + p.drive + ' хв</b> авто · ' + p.m + ' м</p>';
      storyEl.appendChild(b);
      var t = document.createElement('span'); t.className = 'cr__tick'; stepsEl.appendChild(t);
      return b;
    });
    if (gsap) gsap.set(blocks[0], { opacity: 1, y: 0 });
    lightThread(POIS[0].id);

    // ---- the stepping mechanic: ONE block legible at a time, never overlapping ----
    var shown = -1;
    function showStep(i) {
      if (i === shown) return;
      var prev = shown; shown = i;
      stepsEl.querySelectorAll('.cr__tick').forEach(function (t, k) { t.classList.toggle('on', k <= i); });
      if (map && map.select) map.select(POIS[i].id);
      lightThread(POIS[i].id);
      if (!gsap || REDUCED) {
        blocks.forEach(function (b, k) {
          b.style.opacity = k === i ? '1' : '0';
          b.style.visibility = k === i ? 'visible' : 'hidden';
        });
        return;
      }
      // SEQUENTIAL handoff: the outgoing block fully fades + hides FIRST, then a short hold, then
      // the incoming rises. Their legible windows can never overlap -> never two readable at once.
      var nb = blocks[i];
      if (prev >= 0 && blocks[prev]) {
        gsap.killTweensOf(blocks[prev]);
        gsap.to(blocks[prev], { opacity: 0, y: -14, duration: 0.26, ease: 'power2.in',
          onComplete: function () { blocks[prev].style.willChange = ''; blocks[prev].style.visibility = 'hidden'; } });
      }
      gsap.killTweensOf(nb);
      gsap.set(nb, { opacity: 0, y: 16, visibility: 'visible' });
      gsap.to(nb, { opacity: 1, y: 0, duration: 0.42, ease: 'air',
        delay: prev >= 0 ? 0.34 : 0, onComplete: function () { nb.style.willChange = ''; } });
    }

    // ---- the ONE section pin (harness owns it). Scroll -> step index -> select + story + thread ----
    var st = SectionHarness.pin('#combo', { start: 'top top', end: '+=' + (POIS.length * 90) + '%', scrub: 0.6 });
    if (st) {
      st.onUpdate = function (p) {
        var idx = Math.min(POIS.length - 1, Math.max(0, Math.floor(p * (POIS.length - 0.001))));
        showStep(idx);
      };
    } else {
      showStep(0);
    }

    // ---- asset-truth island: every thread was built FROM the REAL OSM POI coord ----
    // Each thread stamps data-tx/data-ty = Math.round(real poi coord) at build time; assert those
    // equal the bake (rounded). This catches any hand-typed drift away from osm.js, without a lossy
    // geometric reconstruction (the thread terminus is intentionally inset from the pin).
    (function assertTruth() {
      var ok = true, why = [];
      OSM.pois.forEach(function (poi) {
        var t = threadEls[poi.id];
        if (!t) { ok = false; why.push(poi.id + ':missing'); return; }
        if (+t.path.getAttribute('data-tx') !== Math.round(poi.x)) { ok = false; why.push(poi.id + '.x'); }
        if (+t.path.getAttribute('data-ty') !== Math.round(poi.y)) { ok = false; why.push(poi.id + '.y'); }
      });
      window.__ASSET_TRUTH__ = { ok: ok, why: why };
