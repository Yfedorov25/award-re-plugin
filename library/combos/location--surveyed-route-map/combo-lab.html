<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>combo: location--surveyed-route-map · Маршрут по справжніх вулицях</title>
<!--
  SECTION VARIANT, location--surveyed-route-map (role: location). MAP-STYLE = DARK DUSK (the ideal).
  CONTROLLED-INTERACTIVE model (the smarts Агрономічне model): a dense, real baked OSM district of
  с. Агрономічне (real road hierarchy by class, 823 building footprints with deterministic warm-lit
  windows, the site parcel inside a true-scale 10-minute walking ring) REVEALS on scroll-in once.
  After that there is NO pin and NO forced stepping: the USER clicks (or hovers) any of the 6 real
  POIs, on the map or in the side list, and THAT draws the real Dijkstra route along the actual
  streets while a walking dot travels it and the live minute counter shows the honest walk-time.
  Two-way hover (pin <-> list row). theme-tween warms the chrome to dusk on scroll. This is
  locmap-engine's native interaction; no scroll-lock, the visitor drives.

  asset-truth: streets/footprints from osm-agronomichne.js; POI names + minutes are the 6 real ones
  (Траш! 9хв, Аврора 18хв, Грош Експрес 15хв, Нова Пошта 10хв, Подорожник 10хв, Школа·садок 9хв).
  __LAB_OK__ passes only if: 0 pins (pin-less click section), the cited real atoms ran, the
  [data-render-surface] painted (the baked dusk field), 0 real console errors. NO WebGL/canvas/tiles.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/locmap-engine/component.css">
<link rel="stylesheet" href="../../components/theme-tween/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  /* variant SKIN only. transform / opacity / clip-path / filter / stroke-dashoffset only.
     NO mix-blend, NO backdrop-filter, NO animating width/height/top/left/margin. */
  :root { --srm-eyebrow: rgba(243,241,236,.62); --ease-air: cubic-bezier(.22,1,.36,1); }

  /* the stage is a full-viewport map + a reading rail; the section is a normal-flow block (no pin) */
  #combo.combo-stage { background: #0b0a08; min-height: 100vh; height: 100vh; position: relative; overflow: clip; }

  /* the render surface = the baked surveyed FIELD (dusk paper) the streets sit on */
  .srm__field {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(125% 95% at 38% 26%, rgba(34,28,20,.0), rgba(11,10,8,.92) 78%),
      radial-gradient(70% 60% at 72% 78%, rgba(176,106,79,.10), rgba(176,106,79,0) 60%),
      radial-gradient(120% 100% at 40% 30%, #1a160f, #0b0a08);
  }
  .srm__field { --lm-accent: var(--accent, #b06a4f); --lm-accent-soft: #c98a72; }
  .srm__field .lm__map { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* the standing section label top-left */
  .srm__label {
    position: absolute; z-index: 8; top: clamp(20px, 5vh, 52px); left: clamp(20px, 4vw, 64px);
    font: 600 .66rem/1 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(243,241,236,.58); text-shadow: 0 1px 14px rgba(0,0,0,.5); pointer-events: none;
  }

  /* ---- the reading rail: eyebrow + a CLICKABLE list of the 6 real POIs ---- */
  .srm__rail {
    position: absolute; z-index: 8;
    left: clamp(20px, 4vw, 64px); bottom: clamp(22px, 6vh, 56px);
    width: min(40ch, 88vw);
  }
  @media (min-width: 900px) {
    .srm__rail { left: auto; right: clamp(24px, 4vw, 60px); top: 50%; bottom: auto;
      transform: translateY(-50%); width: min(32ch, 34vw); }
  }
  .srm__eyebrow {
    font: 600 .68rem/1 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: var(--srm-eyebrow); margin: 0 0 .5rem; text-shadow: 0 1px 16px rgba(0,0,0,.55);
  }
  .srm__title {
    font-family: var(--combo-serif); font-weight: 300;
    font-size: clamp(1.7rem, 3vw, 2.7rem); line-height: 1.0; letter-spacing: -.03em;
    color: var(--combo-cream); margin: 0 0 .4rem; text-shadow: 0 2px 26px rgba(0,0,0,.55);
  }
  .srm__hint {
    font: 500 .76rem/1.45 var(--combo-sans); letter-spacing: .01em;
    color: rgba(243,241,236,.55); margin: 0 0 clamp(.9rem, 2vh, 1.4rem);
    text-shadow: 0 1px 14px rgba(0,0,0,.5);
  }
  .srm__coords {
    display: block; margin-top: .4rem;
    font: 500 .62rem/1.4 var(--combo-sans);
    letter-spacing: .12em; color: rgba(243,241,236,.34); text-transform: none;
  }
  /* the list the engine fills with .lm-row rows (click + hover drives the route) */
  .srm__list { display: block; }

  /* the engine's .lm-row styling is themed for dark already (component.css); a touch of polish so
     the rows read as the interactive control on the dusk field */
  .srm__field { --lm-ink: #f3f1ec; }
  .srm__rail .lm-row { padding: .62rem 0; border-bottom: 1px solid rgba(243,241,236,.1);
    text-shadow: 0 1px 12px rgba(0,0,0,.5); transition: background .25s, padding-left .25s; }
  .srm__rail .lm-row:hover, .srm__rail .lm-row.is-on { background: rgba(243,241,236,.05); padding-left: .5rem; }

  .combo-pre, .combo-post { background: #100e0b; color: rgba(243,241,236,.4); }

  @media (prefers-reduced-motion: reduce) { .srm__rail .lm-row { transition: none; } }
</style>
</head>
<body data-theme data-theme-bg="#0b0a08" data-theme-ink="#f3f1ec" data-theme-accent="#c98a72">
  <div class="combo-pre">scroll ↓</div>

  <section id="combo" class="combo-stage" data-combo="location--surveyed-route-map"
           data-theme data-theme-bg="#13110c" data-theme-ink="#f3f1ec" data-theme-accent="#c98a72">

    <!-- the baked surveyed field. locmap-engine injects the SVG here. -->
    <div class="srm__field lm" data-lm-stage data-render-surface></div>

    <p class="srm__label">с. Агрономічне · за даними OpenStreetMap</p>

    <div class="srm__rail">
      <p class="srm__eyebrow">Маршрут по справжніх вулицях</p>
      <h2 class="srm__title">Що поруч</h2>
      <p class="srm__hint">Натисніть місце, щоб побачити шлях і час пішки.
        <span class="srm__coords">49.18° Пн · 28.33° Сх · 5 хвилин від Вінниці</span>
      </p>
      <!-- the engine fills this with clickable rows (two-way synced with the map pins) -->
      <div class="srm__list" data-lm-list></div>
    </div>
  </section>

  <div class="combo-post">наступна секція</div>

  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/locmap-engine/component.js"></script>
  <script src="../../components/theme-tween/component.js"></script>

  <script type="module">
    import { OSM } from './osm.js';
    SectionHarness.boot();

    // ---- ENGINE: the baked dusk map. owns_pin FALSE; reveal on scroll-in; CLICK/HOVER drives route ----
    SectionHarness.ranOK('locmap-engine', function () {
      var map = window.LocMap.create('#combo', {
        data: Object.assign({}, OSM, { site: Object.assign({}, OSM.site, { tag: 'Тут будується' }) }),
        mScale: 2.6, walkMin: 10, modes: ['loc'], route: true,
        reveal: { start: 'top 70%', once: true },
        parallax: { green: 1.2, buildings: 2, pins: 3 },
        ease: 'award'
      });
      window.__srmMap = map;
    });

    // ---- THEME: dusk recolour on scroll (color vars only) ----
    SectionHarness.ranOK('theme-tween', function () {
      window.ThemeTween.init({ root: document.documentElement, sectionSelector: '[data-theme]',
        vars: ['--bg', '--ink', '--accent'], ease: 0.12 });
    });

    // pin-less, controlled-interactive section: the visitor clicks to draw routes. 0 pins.
    SectionHarness.declare({ pinOwner: 'none', expectPins: 0, atomsCited: ['locmap-engine', 'theme-tween'] });
  </script>
</body>
</html>
