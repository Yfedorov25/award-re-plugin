<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>combo: benefit-wipe-band — assembled section lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<style>
  :root{--dark:#0a0a0a;--cream:#ece5d8;}
  *{margin:0;box-sizing:border-box;}
  html,body{background:var(--dark);color:var(--cream);font-family:Georgia,serif;}
  .spacer{height:60vh;display:grid;place-items:center;opacity:.5;font-size:13px;letter-spacing:.2em;text-transform:uppercase;}
  #combo{position:relative;min-height:100vh;display:grid;place-items:center;padding:8vh 6vw;text-align:center;}
  h1{font-size:clamp(28px,4vw,52px);line-height:1.1;max-width:24ch;}
  .stack{margin-top:20px;font-family:system-ui,sans-serif;font-size:13px;opacity:.7;letter-spacing:.04em;}
  .gate{margin-top:14px;font-family:system-ui,sans-serif;font-size:12px;opacity:.55;}
</style>
</head><body>
<div class="spacer">scroll ↓</div>
<section id="combo" data-combo="benefit-wipe-band">
  <div>
    <h1 data-spine>benefit-wipe-band</h1>
    <p class="stack">stack: media-step-switch* + parallax-depth + reveal</p>
    <p class="gate">pin owner: <b>media-step-switch</b> · expected pins: <b>1</b></p>
  </div>
</section>
<div class="spacer">next section</div>

<!-- COMBO ASSEMBLY PROOF
     A full assembled section imports the cited atoms by relative path and wires
     them to ONE shared pin progress (see RECIPE uses[]). This lab is the PROOF
     SCAFFOLD: it stands up the pin contract (1 pin) and the
     __LAB_OK__ gate. The richly-skinned 4-5-atom assembly is recorded via
     /award-re:learn --promote against this combo's RECIPE. -->
<script>
  gsap.registerPlugin(ScrollTrigger, CustomEase);
  if (window.CustomEase && !gsap.parseEase('air')) CustomEase.create('air','0.25,0.74,0.22,0.99');
  var EXPECT_PINS = 1;
  var spine = document.querySelector('[data-spine]');
  if (EXPECT_PINS > 0) {
    // the pin-owner contract: exactly one pinned ScrollTrigger for the section
    ScrollTrigger.create({
      trigger:'#combo', start:'top top', end:'+=120%', pin:true, scrub:1, anticipatePin:1,
      invalidateOnRefresh:true,
      onUpdate:function(self){ gsap.set(spine,{y:(self.progress-0.5)*-40, opacity:0.5+self.progress*0.5}); }
    });
  } else {
    // conversion gate: ZERO pins — one entrance fade, then dead still (by design)
    gsap.fromTo('#combo > div',{opacity:0,y:24},{opacity:1,y:0,duration:0.8,ease:'air',
      scrollTrigger:{trigger:'#combo',start:'top 80%',once:true}});
  }
</script>

<!-- ── __LAB_OK__ acceptance probe (combo): assert the pin contract ── -->
<script>(function(){
  var errs=0; var _e=console.error; console.error=function(){var s=Array.prototype.join.call(arguments," "); if(!/Failed to load resource|ERR_FILE_NOT_FOUND|net::ERR/.test(s)) errs++; return _e.apply(console,arguments);};
  var tries=0;
  function ready(){
    try{
      var pins = ScrollTrigger.getAll().filter(function(t){return t.pin;}).length;
      var ok = errs===0 && !!window.gsap && pins===1;
      window.__LAB_OK__ = !!ok;
      if(!ok && tries<40){ tries++; return setTimeout(ready,150); }
    }catch(e){ window.__LAB_OK__=false; }
  }
  window.addEventListener('load',function(){ setTimeout(ready,400); });
})();</script>
</body></html>
