<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>combo: location--dive-to-the-gate · Падіння до воріт (SCALE-ZOOM через реальні карти)</title>
<!--
  SECTION VARIANT, location--dive-to-the-gate (role: location).
  MAP-STYLE = SCALE-ZOOM through REAL maps (region -> district -> parcel). The SAME dense real OSM
  district of с. Агрономічне as the surveyed-route-map ideal (real road hierarchy by class, 823
  building footprints, the site parcel inside a true-scale 10-minute walking ring, real Dijkstra
  routes), rendered ONCE by locmap-engine and DIVED through three scales as one continuous fall:
  beat 1 РАЙОН (the whole district), beat 2 (zoom toward the site, the ring + named streets dominant,
  a real route draws), beat 3 ДІЛЯНКА (tight on the parcel: 22,5 сотки on вул. Перемоги, the two
  nearest real places). The realism is identical to the ideal (same baked OSM, same real routes);
  only the cartographic TREATMENT differs: a cool slate-blue DAY map that warms slightly per beat.

  Shape = ENGINE-ATOM-DRIVEN-BY-HARNESS-PIN. locmap-engine (owns_pin=FALSE) builds the SVG + draws
  routes; the HARNESS owns the ONE section pin. The dive is a CSS transform (scale + origin on the
  site) on the engine's SVG group across the pinned range, in THREE labelled beats with ONE clean
  caption block legible at a time, cross-faded so two are never readable at once.

  asset-truth: streets/footprints/green/routes from osm-agronomichne.js; the site at 746.3,324.9;
  POI names + minutes are the 6 real ones (Школа·садок 9хв, Нова Пошта 10хв, Траш! 9хв,
  Подорожник 10хв, Грош Експрес 15хв, Аврора 18хв). Coords 49.18 Пн · 28.33 Сх. NOTHING invented.
  __LAB_OK__ passes only if: 1 pin, the cited real atom ran, [data-render-surface] painted (the
  slate field), 0 real console errors. NO WebGL/canvas/tiles/mix-blend/backdrop-filter.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../components/locmap-engine/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
  /* variant SKIN only (scaffold owns the rails). transform / opacity / clip-path / filter /
     stroke-dashoffset only. NO mix-blend, NO backdrop-filter, NO animating width/height/top/left. */

  :root { --ease-air: cubic-bezier(.22,1,.36,1); }

  /* COOL SLATE-BLUE DAY PALETTE: re-point every engine token to a daylight slate register.
     This is the whole "different map style": same engine, different paint. The page tint warms
     one notch per beat (data-dive-beat) so the fall reads from cool region down to a warmer plot. */
  #combo.combo-stage,
  .dive__field {
    --lm-ink: #1c2733;            /* deep slate ink foreground */
    --lm-bg-1: #e9eef3;           /* daylight paper inner */
    --lm-bg-2: #dbe3eb;           /* road casing = pale halo so slate strokes separate */
    --lm-accent: #c2693f;         /* warm terracotta, reserved for the active route + parcel */
    --lm-accent-soft: #cf855f;
  }
  #combo.combo-stage { background: #eef2f6; color: #1c2733; }

  /* the render surface = slate-blue daylight field. A real CSS background so the honest paint-probe
     sees a painted surface from load AND the sheet reads like a printed survey on cool stock. */
  .dive__field {
    position: absolute; inset: 0; overflow: clip;
    background-color: #e9eef3;
    background-image:
      radial-gradient(120% 100% at 56% 44%, #eef3f8, #d9e2ea 78%),
      radial-gradient(rgba(28,39,51,.03) 0.5px, transparent 0.6px);
    background-size: 100% 100%, 5px 5px;
    background-position: 0 0, 0 0;
    transition: filter .8s var(--ease-air);
  }
  .dive__field .lm__map { position: absolute; inset: 0; width: 100%; height: 100%;
    will-change: transform; }
  /* the engine's stage gradient would re-tint the field; keep our slate field under the SVG */
  .dive__field.lm__stage, .dive__field.lm { background-color: #e9eef3; }

  /* warm the whole sheet a notch per beat (filter only, GPU, never re-tints geometry math) */
  #combo[data-dive-beat="0"] .dive__field { filter: none; }
  #combo[data-dive-beat="1"] .dive__field { filter: sepia(.06) saturate(1.04); }
  #combo[data-dive-beat="2"] .dive__field { filter: sepia(.13) saturate(1.08); }

  /* DEEP PARCEL BEAT: at the final (~9.5x) zoom the parcel + its neighbours fill the frame, so
     the hairline outlines must read bolder relative to the now-large footprints. Bump ONLY the
     parcel + building strokes under beat 2 so the plot stays crisp (stroke-width only, no layout). */
  #combo[data-dive-beat="2"] .dive__field .lm-parcel { stroke-width: 3.2; }
  #combo[data-dive-beat="2"] .dive__field .lm-bld    { stroke-width: 0.9; }
  #combo[data-dive-beat="2"] .dive__field .lm-bld--lit { stroke-width: 0.9; }
  /* The SVG text labels (site tag, street names, ring caption) scale WITH the 9.5x group, so at the
     deep parcel beat they blow up oversized and crowd the chrome. They have already done their job by
     the district beat (where "named streets dominant" lives), so fade them out as the dive lands on the
     parcel; the orange plot + the caption carry the meaning there. opacity only (GPU), smooth. */
  .dive__field .lm-sitetag, .dive__field .lm-rdname, .dive__field .lm-ringt { transition: opacity .5s cubic-bezier(.22,1,.36,1); }
  #combo[data-dive-beat="2"] .dive__field .lm-sitetag,
  #combo[data-dive-beat="2"] .dive__field .lm-rdname,
  #combo[data-dive-beat="2"] .dive__field .lm-ringt { opacity: 0; }

  /* ---- COOL-SLATE MAP TREATMENT: redraw the engine's SVG classes for a daylight survey ---- */
  /* green demoted to a faint cool wash; water a touch bluer */
  .dive__field .lm-gw--green { fill: rgba(74,110,86,.08); }
  .dive__field .lm-gw--water { fill: rgba(70,120,170,.10); }

  /* buildings: pale slate footprints, hairline slate stroke, a printed cadastral plan in daylight.
     NO lit windows (day map): the --lit class renders like every other footprint (kill warm glow). */
  .dive__field .lm-bld      { fill: rgba(28,39,51,.07); stroke: rgba(28,39,51,.14); stroke-width: 0.5; }
  .dive__field .lm-bld--lit { fill: rgba(28,39,51,.07); stroke: rgba(28,39,51,.14); animation: none; }

  /* road hierarchy: SLATE strokes over a PALE halo casing, so the grid reads crisp on the dense
     footprint field. Widths kept from the engine ranking; casing is the pale halo. */
  .dive__field .lm-rdc { stroke: #f3f6f9; }
  .dive__field .lm-rd--hwy   { stroke: rgba(28,39,51,.82); }
  .dive__field .lm-rd--main  { stroke: rgba(40,72,104,.66); }
  .dive__field .lm-rd--mid   { stroke: rgba(28,39,51,.42); }
  .dive__field .lm-rd--minor { stroke: rgba(28,39,51,.26); }
  .dive__field .lm-rd--faint { stroke: rgba(28,39,51,.12); }
  /* street labels: centred on their (x,y) anchor so the вул. Перемоги frontage label sits on the
     road; a touch heavier so it survives the slate field at parcel zoom (fill/anchor only). */
  .dive__field .lm-rdname { fill: rgba(28,39,51,.62); text-anchor: middle; font-weight: 600; }

  /* parcel: terracotta hatch + stroke; tag in ink. (engine hatch uses brick rgba, override it) */
  .dive__field #lmHatch rect { fill: rgba(194,105,63,.10); }
  .dive__field #lmHatch line { stroke: rgba(194,105,63,.6); }
  .dive__field .lm-parcel { stroke: var(--lm-accent); stroke-width: 1.8; }
  .dive__field .lm-pulse  { stroke: var(--lm-accent); }
  .dive__field .lm-sitetag { fill: #1c2733; }

  /* walking ring: thin slate dashed */
  .dive__field .lm-ring  { stroke: rgba(40,72,104,.34); }
  .dive__field .lm-ringt { fill: rgba(28,39,51,.5); }

  /* numbered POIs: white disc, slate ring, slate numeral; active flips to the terracotta accent */
  .dive__field .lm-pt circle { fill: #ffffff; stroke: rgba(40,72,104,.7); stroke-width: 1.4; }
  .dive__field .lm-pt text   { fill: #1c2733; }
  .dive__field .lm-pt:hover circle, .dive__field .lm-pt.is-on circle { fill: var(--lm-accent); stroke: #ffffff; }

  /* the warm moment: the active Dijkstra route + walker + live badge */
  .dive__field .lm-route  { stroke: var(--lm-accent); stroke-width: 3.4; }
  .dive__field .lm-walker { fill: var(--lm-accent); stroke: #ffffff; }
  .dive__field .lm-livet  { fill: #ffffff; }
  .dive__field .lm-livebg { fill: var(--lm-accent); stroke: var(--lm-accent); }

  /* ---- the reading rail (ink on slate): eyebrow + ONE stepping beat block ---- */
  .dive__rail {
    position: absolute; z-index: 8;
    left: clamp(20px, 4vw, 64px); bottom: clamp(26px, 7vh, 72px);
    width: min(36ch, 48vw); pointer-events: none;
  }
  @media (min-width: 900px) {
    .dive__rail { left: auto; right: clamp(24px, 4vw, 72px); width: min(31ch, 35vw); }
  }
  .dive__eyebrow {
    font: 600 .68rem/1 var(--combo-sans);
    letter-spacing: .26em; text-transform: uppercase;
    color: rgba(28,39,51,.6); margin: 0 0 clamp(.9rem, 2.4vh, 1.6rem);
  }
  .dive__coords {
    display: block; margin-top: .5rem;
    font: 500 .64rem/1.4 var(--combo-sans);
    letter-spacing: .12em; color: rgba(28,39,51,.42); text-transform: none;
  }
  .dive__story { position: relative; min-height: clamp(150px, 24vh, 220px); }
  .dive__block {
    position: absolute; inset: 0; opacity: 0; visibility: hidden;
    will-change: opacity, transform; transform: translateY(14px);
  }
  .dive__no {
    font: 600 .7rem/1 var(--combo-sans); letter-spacing: .2em;
    color: var(--lm-accent); font-variant-numeric: tabular-nums;
  }
  .dive__place {
    font-family: var(--combo-serif); font-weight: 300;
    font-size: clamp(2rem, 4vw, 3.4rem); line-height: .98; letter-spacing: -.03em;
    color: #1c2733; margin: clamp(.5rem,1.4vh,.9rem) 0 0;
  }
  .dive__place em { font-style: italic; color: var(--lm-accent); }
  .dive__body {
    margin-top: clamp(.7rem, 1.8vh, 1.2rem);
    font: 500 .92rem/1.5 var(--combo-sans); letter-spacing: .02em;
    color: rgba(28,39,51,.78);
  }
  .dive__body b { font-weight: 600; color: #1c2733; font-variant-numeric: tabular-nums; }

  /* a slim beat progress, one tick per scale, the active one filled terracotta */
  .dive__steps {
    position: absolute; z-index: 8; left: clamp(20px, 4vw, 64px); bottom: clamp(20px, 5vh, 44px);
    display: flex; gap: 8px; pointer-events: none;
  }
  @media (max-width: 899px) { .dive__steps { bottom: auto; top: clamp(18px, 4vh, 40px); } }
  .dive__tick { width: 30px; height: 2px; background: rgba(28,39,51,.2); }
  .dive__tick.on { background: var(--lm-accent); }

  /* the standing section label top-left */
  .dive__label {
    position: absolute; z-index: 8; top: clamp(20px, 5vh, 52px); left: clamp(20px, 4vw, 64px);
    font: 600 .66rem/1 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(28,39,51,.56);
  }
  .combo-pre, .combo-post { background: #dde4ec; color: rgba(28,39,51,.45); }

  @media (prefers-reduced-motion: reduce) { .dive__block { transition: none; } }
</style>
</head>
<body>
  <div class="combo-pre">скрол ↓</div>

  <section id="combo" class="combo-stage" data-combo="location--dive-to-the-gate" data-dive-beat="0">

    <!-- the slate daylight field + the side list host. locmap-engine injects the SVG here. -->
    <div class="dive__field lm" data-lm-stage data-render-surface></div>

    <p class="dive__label">с. Агрономічне · за даними OpenStreetMap</p>

    <div class="dive__rail">
      <p class="dive__eyebrow">Падіння до воріт
        <span class="dive__coords">49.18° Пн · 28.33° Сх · 5 хвилин від Вінниці</span>
      </p>
      <div class="dive__story" data-dive-story></div>
    </div>

    <!-- side list the engine fills (hidden off-screen; powers click-to-select + a11y) -->
    <div data-lm-list hidden></div>

    <div class="dive__steps" data-dive-steps></div>
  </section>

  <div class="combo-post">наступна секція</div>

  <!-- scaffold + adapters, then the cited atom (canon engine) -->
  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/locmap-engine/component.js"></script>

  <script type="module">
    import { OSM } from './osm.js';

    SectionHarness.boot();
    var gsap = window.gsap;
    var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    var byId = {}; OSM.pois.forEach(function (p) { byId[p.id] = p; });

    // ---- ENGINE job: the dense real map, re-themed cool-slate via CSS (owns_pin=FALSE) ----
    var map = null, mapSvg = null;
    SectionHarness.ranOK('locmap-engine', function () {
      map = window.LocMap.create('#combo', {
        // REAL street labels (engine renders data.names as .lm-rdname). The dataset carries per-road
        // `name` strings but no top-level `names` array, so at parcel zoom the frontage read as an
        // unlabelled footprint grid. These are REAL OSM names with REAL geometry: вул. Перемоги is
        // the parcel frontage (main road just W of the site, segment 702,322 -> 643,326, ~flat),
        // вул. Грушевського a real cross street (diagonal, ~67deg). NOTHING invented.
        data: Object.assign({}, OSM, {
          names: [
            { n: 'вул. Перемоги',     x: 688, y: 317, a: -3.5 },
            { n: 'вул. Грушевського', x: 600, y: 340, a: 67 }
          ],
          site: Object.assign({}, OSM.site, { tag: 'Тут будується' })
        }),
        mScale: 2.6,
        walkMin: 10,
        modes: ['loc'],
        flicker: { rate: 1e9 },    // day map: NO lit windows (rate huge -> none light)
        route: true,
        reveal: { start: 'top 75%', once: true },
        parallax: { green: 0, buildings: 0, pins: 0 },  // the dive owns the camera; no extra parallax
        ease: 'award'
      });
      mapSvg = map && map.svg;
      window.__diveMap = map;
    });

    // ---- the THREE scale beats: each a labelled view of the SAME real map at a different scale.
    //      The dive is a CSS transform (scale + origin on the site) on the engine SVG group.
    //      Each beat optionally selects a real POI so its real Dijkstra route draws. ----
    var SITE_ORIGIN = '59.1% 52.3%';   // site 746.3,324.9 inside viewBox "120 -20 1060 660"
    var BEATS = [
      { // 0 · РАЙОН · the whole district, no route, the survey in full
        no: '01 / 03', kicker: '01 / 03 · Масштаб району',
        place: 'Весь район <em>як на долоні.</em>',
        body: 'Реальна карта села: вулиці, сотні будівель, ваша ділянка в десятихвилинному колі пішки.',
        scale: 1.0, select: null
      },
      { // 1 · approach · zoom toward the site, the ring + named streets dominant, a real route draws
        no: '02 / 03', kicker: '02 / 03 · Десять хвилин пішки',
        place: 'Школа <em>за девʼять хвилин.</em>',
        body: 'Ближче до ділянки. Маршрут до школи й садка реальними вулицями, <b>9 хв</b> пішки.',
        scale: 1.95, select: 'school'
      },
      { // 2 · ДІЛЯНКА · tight on the parcel: size, frontage street, the two nearest places
        no: '03 / 03', kicker: '03 / 03 · Ваша ділянка',
        place: 'Двадцять дві з половиною <em>сотки.</em>',
        body: 'Ділянка на вул. Перемоги. Супермаркет «Траш!» <b>9 хв</b>, школа <b>9 хв</b> пішки.',
        scale: 9.5, select: 'trash'
      }
    ];

    // build the caption blocks + the beat ticks
    var storyEl = document.querySelector('[data-dive-story]');
    var stepsEl = document.querySelector('[data-dive-steps]');
    var blocks = BEATS.map(function (B, i) {
      var b = document.createElement('div');
      b.className = 'dive__block'; b.dataset.idx = i;
      b.innerHTML =
        '<div class="dive__no">' + B.kicker + '</div>' +
        '<h3 class="dive__place">' + B.place + '</h3>' +
        '<p class="dive__body">' + B.body + '</p>';
      storyEl.appendChild(b);
      var t = document.createElement('span'); t.className = 'dive__tick'; stepsEl.appendChild(t);
      return b;
    });
    // init: ALL blocks hidden. The deterministic state machine (showBeat) owns visibility from
    // frame 1, so block 0 can never be left stuck at opacity:1 on a jumped/flicked scroll.
    if (gsap) gsap.set(blocks, { opacity: 0, visibility: 'hidden', y: 14 });
    else blocks.forEach(function (b) { b.style.opacity = '0'; b.style.visibility = 'hidden'; });

    // apply a scale to the engine SVG group (transform/opacity only; origin on the site)
    function applyScale(k, animate) {
      if (!mapSvg) return;
      mapSvg.style.transformOrigin = SITE_ORIGIN;
      if (!gsap || REDUCED || animate === false) { mapSvg.style.transform = 'scale(' + k + ')'; return; }
      gsap.to(mapSvg, { scale: k, duration: 1.0, ease: 'air', overwrite: true });
    }

    // ---- the stepping mechanic: ONE caption legible at a time, never overlapping ----
    // The active caption is a DETERMINISTIC function of the committed beat index: on EVERY
    // beat change we HARD-SET every non-active block to opacity:0 + visibility:hidden (gsap.set,
    // no delay, no running tween) BEFORE revealing the incoming one, and the incoming reveal has
    // NO delay. So on a JUMPED/flicked/anchored scroll (where prev may be -1 and block 0 would
    // otherwise stay stuck at opacity:1) only ONE block is ever visible. No two ramps overlap.
    var shown = -1;
    function commitBlocks(i) {
      // belt-and-braces: drive EVERY block's visibility from the committed index, not from "prev".
      // Kill any in-flight reveal tween on a block we are hiding so a fast flick cannot leave a
      // stray opacity ramp running on a hidden block (the only race that could re-show it).
      blocks.forEach(function (b, k) {
        if (k === i) return;
        if (gsap) { gsap.killTweensOf(b); gsap.set(b, { opacity: 0, visibility: 'hidden', willChange: '' }); }
        else { b.style.opacity = '0'; b.style.visibility = 'hidden'; }
      });
    }
    function showBeat(i) {
      if (i === shown) return;
      shown = i;
      document.getElementById('combo').setAttribute('data-dive-beat', String(i));
      stepsEl.querySelectorAll('.dive__tick').forEach(function (t, k) { t.classList.toggle('on', k <= i); });

      // dive the map to this beat's scale + draw this beat's real route
      applyScale(BEATS[i].scale, true);
      if (map && map.select) {
        if (BEATS[i].select) map.select(BEATS[i].select);
        else map.clearSel && map.clearSel();
      }

      // FIRST hard-hide all non-active blocks (kills any "prev"/init block left at opacity:1)
      commitBlocks(i);

      var nb = blocks[i];
      if (!gsap || REDUCED) {
        nb.style.opacity = '1'; nb.style.visibility = 'visible'; nb.style.transform = 'translateY(0)';
        return;
      }
      // reveal the incoming with NO delay, so it can never run concurrently with an outgoing fade
      nb.style.visibility = 'visible';
      gsap.fromTo(nb, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'air',
        overwrite: true, onComplete: function () { nb.style.willChange = ''; } });
    }

    // ---- the ONE section pin (harness owns it). Scroll -> beat index -> dive + route + caption ----
    var st = SectionHarness.pin('#combo', { start: 'top top', end: '+=' + (BEATS.length * 100) + '%', scrub: 0.6 });
    if (st) {
      st.onUpdate = function (p) {
        var idx = Math.min(BEATS.length - 1, Math.max(0, Math.floor(p * (BEATS.length - 0.001))));
        showBeat(idx);
      };
      showBeat(0);   // commit the first caption immediately (before the first scroll tick)
    } else {
      // no-pin fallback (reduced-motion / no GSAP): show the full map at beat 0 statically
      applyScale(BEATS[0].scale, false);
      showBeat(0);
    }

    SectionHarness.declare({
      pinOwner: 'harness', expectPins: 1,
      atomsCited: ['locmap-engine']
    });
  </script>
</body>
</html>
