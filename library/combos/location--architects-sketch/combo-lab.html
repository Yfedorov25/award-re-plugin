<title>combo: location--architects-sketch · Схема від руки</title>
<!--
  SECTION VARIANT · location--architects-sketch (role: location).
  MEDIUM = PEN-SKETCH. A MONOCHROME architect's hand-sketch of с. Агрономічне: thin (~1px) cream
  strokes on a brown drafting field. NO fills, NO colour photography, NO Google / NO Mapbox / NO tiles.
  The REAL OSM roads (80 streets, baked from osm-agronomichne.js) DRAW in via stroke-dashoffset; a
  ringed crosshair marks the real site point; the 6 REAL POIs ladder up on hairline leader-lines with
  their real minutes; and as the section pins, each POI's REAL Dijkstra walking route draws along the
  actual streets. coords-corner-frame frames it as a drafting plate (49.18N 28.33E, scale bar, north).

  Shape = ENGINE-ATOM-DRIVEN-BY-HARNESS-PIN. line-art-location-map is owns_pin=FALSE (its own
  scroll-into-view trigger is KILLED at wire-time so it does not auto-play); the HARNESS owns the ONE
  section pin and scrubs lam.set(p) + frame.set(p) 1:1, reversible. Over the pinned range the section
  STEPS through the 6 POIs: the active route draws, prior fades, and ONE pin-story block is legible at a
  time (eyebrow + POI name + real minutes), cross-faded so two are never legible at once.

  asset-truth: streets + routes + POI names + minutes are the REAL baked OSM (Траш! 9хв, Аврора 18хв,
  Грош Експрес 15хв, Нова Пошта 10хв, Подорожник 10хв, Школа·садок 9хв). __LAB_OK__ (combo-scaffold.js)
  passes only if: 1 pin, the cited real atoms ran, [data-render-surface] painted (the drafting field),
  0 real console errors. Motion: stroke-dashoffset / transform / opacity / filter only. NO WebGL.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../../components/coords-corner-frame/component.css">
<link rel="stylesheet" href="../_scaffold/combo-scaffold.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
  /* variant SKIN only (scaffold owns the rails). stroke-dashoffset / transform / opacity / filter only.
     NO mix-blend, NO backdrop-filter, NO animating width/height/top/left/margin. */
  :root { --ease-air: cubic-bezier(.22,1,.36,1); }

  /* a warm drafting register: dark brown field, cream ink, terracotta accent on the live route */
  #combo.combo-stage { background: #211a13; }

  /* THE RENDER SURFACE = the brown DRAFTING FIELD (a real CSS background-image so the honest
     paint-probe sees a painted surface, and the medium reads as paper on a drafting table). The
     line-art SVG mounts on top of it; line-art-location-map reads its --lam-* tokens. */
  .as__field {
    --lam-bg: transparent; --lam-stroke: #e9e1d2; --lam-ink: #f4efe4; --lam-w: 1;
    background-color: #221a12;
    background-image:
      radial-gradient(130% 100% at 30% 22%, rgba(60,48,34,.55), rgba(20,15,10,0) 60%),
      radial-gradient(90% 80% at 82% 56%, rgba(181,106,74,.10), rgba(181,106,74,0) 55%),
      linear-gradient(rgba(233,225,210,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,225,210,.045) 1px, transparent 1px),
      linear-gradient(160deg, #2a2017 0%, #1b140d 100%);
    background-size: auto, auto, 38px 38px, 38px 38px, auto;
  }
  /* the SVG sits inside the field. the atom's .lam-stage rules also apply; we re-point colour tokens. */
  .as__field .lam-map { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* keep the drawn ink hairline-thin and warm; faint roads dimmer (the medium's hand-sketch grade) */
  .as__field .lam-map .lam-road { stroke: #e9e1d2; }
  .as__field .lam-map .lam-road--faint { opacity: .34; }
  .as__field .lam-map .lam-road--minor { opacity: .56; }
  .as__field .lam-map .lam-road--mid   { opacity: .82; }
  .as__field .lam-map .lam-road--main,
  .as__field .lam-map .lam-road--hwy   { opacity: 1; }
  .as__field .lam-map [data-target] .ring,
  .as__field .lam-map [data-target] line { stroke: #f6f0e4; }
  .as__field .lam-map [data-target] .core { fill: #f6f0e4; }
  .as__field .lam-map [data-target] line { stroke-width: 1.2; vector-effect: non-scaling-stroke; }

  /* the LIVE route layer: the active POI's REAL Dijkstra path, drawn in terracotta over the streets */
  .as-route { fill: none; stroke: var(--as-accent, #cf8a5e); stroke-width: 2.1;
    stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
    opacity: 0; will-change: stroke-dashoffset, opacity; }

  /* POI markers (atom-styled .lam-poi): warm hairline leaders + small serif labels */
  .as__field .lam-poi .lam-leader { background: #e9e1d2; opacity: .55; --lam-leader: 40px; }
  .as__field .lam-poi .lam-dot { border-color: #f4efe4; background: #221a12; }
  .as__field .lam-poi .lam-label b { font-family: var(--combo-serif); font-weight: 400; font-size: .92rem;
    letter-spacing: -.01em; color: #f4efe4; }
  .as__field .lam-poi .lam-label .dist { font-size: .58rem; letter-spacing: .16em; opacity: .55; }
  /* the active POI gets a brighter dot + accent label (set via .is-active) */
  .as__field .lam-poi.is-active .lam-dot { border-color: var(--as-accent, #cf8a5e); background: var(--as-accent, #cf8a5e); }
  .as__field .lam-poi.is-active .lam-label b { color: #f7efe2; }
  .as__field .lam-poi.is-active .lam-leader { opacity: .9; }
  .as__field .lam-poi { transition: opacity .35s var(--ease-air); }

  /* the section's own standing label (top-left) */
  .as__label { position: absolute; z-index: 8; top: clamp(20px,5vh,52px); left: clamp(22px,5vw,72px);
    font: 600 .64rem/1.5 var(--combo-sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(244,239,228,.6); max-width: 24ch; }
  .as__label b { display: block; font-weight: 600; color: rgba(244,239,228,.4); letter-spacing: .2em;
    margin-top: .35rem; font-size: .58rem; }

  /* ---- the reading rail: a fixed eyebrow + ONE stepping story block (no two legible at once) ---- */
  .as__rail { position: absolute; z-index: 8; left: clamp(22px,5vw,72px); bottom: clamp(28px,8vh,80px);
    width: min(32ch, 42vw); pointer-events: none; }
  @media (min-width: 980px) { .as__rail { left: auto; right: clamp(28px,5vw,84px); width: min(28ch,32vw); } }

  .as__eyebrow { margin: 0 0 clamp(1rem,2.6vh,1.7rem); font: 600 .66rem/1 var(--combo-sans);
    letter-spacing: .28em; text-transform: uppercase; color: rgba(244,239,228,.6); }

  .as__story { position: relative; min-height: clamp(132px, 22vh, 196px); }
  .as__block { position: absolute; inset: 0; opacity: 0; transform: translateY(16px);
    will-change: opacity, transform; }
  .as__no { font: 600 .68rem/1 var(--combo-sans); letter-spacing: .22em;
    color: var(--as-accent, #cf8a5e); font-variant-numeric: tabular-nums; }
  .as__place { font-family: var(--combo-serif); font-weight: 300; font-size: clamp(2.1rem,4.6vw,3.6rem);
    line-height: .98; letter-spacing: -.03em; color: #f6f0e4; margin: clamp(.5rem,1.5vh,.95rem) 0 0; }
  .as__time { margin-top: clamp(.7rem,2vh,1.25rem); font: 400 .9rem/1.55 var(--combo-sans);
    letter-spacing: .01em; color: rgba(244,239,228,.78); }
  .as__time b { font-weight: 600; color: #f6f0e4; font-variant-numeric: tabular-nums; }

  /* slim step ticks: one per real POI, the walked ones filled */
  .as__steps { position: absolute; z-index: 8; left: clamp(22px,5vw,72px); bottom: clamp(20px,5vh,46px);
    display: flex; gap: 8px; pointer-events: none; }
  @media (max-width: 979px) { .as__steps { bottom: auto; top: clamp(64px,9vh,96px); } }
  .as__tick { width: 24px; height: 2px; background: rgba(244,239,228,.18); transform-origin: left center;
    transition: background .3s var(--ease-air), transform .3s var(--ease-air); }
  .as__tick.on { background: var(--as-accent, #cf8a5e); transform: scaleX(1.04); }

  /* harmonise the coords-corner-frame chrome with the cream/terracotta register */
  .as__field .ccf-overlay { --ccf-ink: #efe8da; --ccf-ink-dim: rgba(239,232,218,.6);
    --ccf-accent: #cf8a5e; --ccf-tick-stroke: #efe8da; }

  @media (prefers-reduced-motion: reduce) {
    .as__block { transition: none; }
    .as-route { opacity: .85; }
  }
  @media (max-width: 979px) {
    .as__rail { right: auto; left: clamp(18px,5vw,40px); bottom: clamp(20px,6vh,52px); width: min(30ch,82vw); }
  }
</style>

  <!-- scaffold + adapters, then the cited atoms (canon map engine FIRST) -->
  <script src="../_scaffold/combo-scaffold.js"></script>
  <script src="../_scaffold/adapters.js"></script>
  <script src="../../components/line-art-location-map/component.js"></script>
  <script src="../../components/coords-corner-frame/component.js"></script>

  <!-- ONE module script: imports the REAL baked OSM, wires the two cited atoms by hand -->
  <script type="module">
    import { OSM } from './osm.js';   // asset-truth: the real с. Агрономічне dataset

    SectionHarness.boot();
    var gsap = window.gsap;
    var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- ATOM 1 · line-art-location-map (owns_pin FALSE) ----------------------------------------
    // It reads our static [data-draw] roads + [data-target] crosshair + .lam-poi markers and returns
    // a PURE set(p) scrub of the whole pen-sketch reveal. We KILL its own onEnter trigger so ONLY the
    // harness pin drives set(p) (no auto-play, no second trigger fighting the scrub).
    var lam;
    SectionHarness.ranOK('line-art-location-map', function () {
      lam = window.LineArtLocationMap.create('#plate', {
        draw: true, stagger: 0.09, duration: 0.7, ease: 'power2.out',
        start: 'top 78%', once: true, manageLenis: false
      });
      if (lam && lam.trigger && lam.trigger.kill) lam.trigger.kill();   // harness owns the scroll; no auto-play
      if (lam && lam.set) lam.set(REDUCED ? 1 : 0);   // reduced-motion: the whole sketch shown, no scrub needed
      window.__asLam = lam;
    });

    // ---- ATOM 2 · coords-corner-frame (owns_pin FALSE) ------------------------------------------
    // Injects the drafting plate over the field: survey crosshair corners that DRAW, a coordinate
    // readout, a scale bar, a north arrow, corner labels. set(p) is a PURE scrub we ride on the pin.
    var frame;
    SectionHarness.ranOK('coords-corner-frame', function () {
      frame = window.CoordsCornerFrame.create('#plate', {
        coords: '49.18N 28.33E',
        scale: '0 ... 500 м',
        north: true,
        labels: { tl: 'План локації', bl: 'Масштаб', br: 'Аркуш 01', rc: 'OSM · 2026' },
        ease: 'air', stagger: 0.08, dur: 0.7
      });
      if (frame && frame.set) frame.set(REDUCED ? 1 : 0);   // reduced-motion: plate fully drawn
      window.__asFrame = frame;
    });

    // ---- the REAL POI tour order (verbatim names + real minutes) --------------------------------
    var ORDER = ['school', 'np', 'trash', 'apteka', 'grosh', 'avrora'];
    var byId = {}; OSM.pois.forEach(function (p) { byId[p.id] = p; });
    var STORY = [{"i":0,"id":"school","label":"Школа · садок","walk":9,"drive":2,"m":800},{"i":1,"id":"np","label":"Нова Пошта","walk":10,"drive":2,"m":800},{"i":2,"id":"trash","label":"Супермаркет «Траш!»","walk":9,"drive":1,"m":700},{"i":3,"id":"apteka","label":"Аптека «Подорожник»","walk":10,"drive":2,"m":900},{"i":4,"id":"grosh","label":"«Грош Експрес»","walk":15,"drive":2,"m":1200},{"i":5,"id":"avrora","label":"Маркет «Аврора»","walk":18,"drive":3,"m":1500}];

    // ---- build the stepping story blocks + step ticks from the REAL POIs ------------------------
    var storyEl = document.querySelector('[data-story]');
    var stepsEl = document.querySelector('[data-steps]');
    var blocks = STORY.map(function (p, i) {
      var b = document.createElement('div');
      b.className = 'as__block'; b.dataset.idx = i;
      b.innerHTML =
        '<div class="as__no">' + String(i + 1).padStart(2, '0') + ' / ' + String(STORY.length).padStart(2, '0') + '</div>' +
        '<h3 class="as__place">' + p.label + '</h3>' +
        '<p class="as__time"><b>' + p.walk + ' хв</b> пішки · <b>' + p.drive + ' хв</b> авто · ' + p.m + ' м</p>';
      storyEl.appendChild(b);
      var t = document.createElement('span'); t.className = 'as__tick'; stepsEl.appendChild(t);
      return b;
    });
    // first block composed before scroll; every OTHER block is hard 0 + hidden (no orphan can persist)
    if (gsap) { gsap.set(blocks[0], { opacity: 1, y: 0, visibility: 'visible' }); blocks.slice(1).forEach(function (b) { gsap.set(b, { opacity: 0, y: 14, visibility: 'hidden' }); }); }

    // ---- route + POI marker handles (the live "live my life from here" proof) -------------------
    var routeEls = {}; STORY.forEach(function (p) { routeEls[p.id] = document.querySelector('.as-route[data-route="' + p.id + '"]'); });
    var poiEls = {}; STORY.forEach(function (p) { poiEls[p.id] = document.querySelector('.lam-poi[data-id="' + p.id + '"]'); });
    // prime each route's dashoffset so it can DRAW in (stroke-dashoffset, not width/length)
    Object.keys(routeEls).forEach(function (id) {
      var el = routeEls[id]; if (!el) return;
      var L = 0; try { L = el.getTotalLength(); } catch (e) {}
      el.__len = L; if (L) { el.style.strokeDasharray = L; el.style.strokeDashoffset = L; }
    });

    function drawRoute(id, show) {
      var el = routeEls[id]; if (!el) return;
      var L = el.__len || 0;
      if (!gsap || REDUCED) { el.style.opacity = show ? '.85' : '0'; el.style.strokeDashoffset = show ? '0' : L; return; }
      gsap.killTweensOf(el);
      if (show) {
        el.style.opacity = '1';
        gsap.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out',
          onComplete: function () { el.style.willChange = ''; } });
      } else {
        gsap.to(el, { opacity: 0, duration: 0.3, ease: 'power2.in' });
      }
    }

    // ---- the stepping mechanic: ONE block legible at a time (cross-fade), active route + POI ----
    var shown = -1;
    function showStep(i) {
      if (i === shown) return;
      var prev = shown; shown = i;
      stepsEl.querySelectorAll('.as__tick').forEach(function (t, k) { t.classList.toggle('on', k <= i); });

      // route layer: draw the new real path, fade the old
      if (prev >= 0) drawRoute(STORY[prev].id, false);
      drawRoute(STORY[i].id, true);

      // POI marker emphasis: only the active one is "is-active", others dim a touch
      Object.keys(poiEls).forEach(function (id) { var el = poiEls[id]; if (el) { el.classList.remove('is-active'); el.style.opacity = '.5'; } });
      var ap = poiEls[STORY[i].id]; if (ap) { ap.classList.add('is-active'); ap.style.opacity = '1'; }

      // text: legibility is a PURE FUNCTION of the active step. NOT a prev->next cross-fade
      // (that fed only blocks[prev], so a fast scrub that skipped indices left every skipped
      // block stuck at opacity 1 -> several story blocks ghosting at once). Instead, ONE
      // deterministic pass over EVERY block: each non-active block is KILLED (killTweensOf, so
      // no in-flight rise can climb back to 1 after a set) then hard-zeroed + hidden; only the
      // active block tweens 0 -> 1. Exactly one block is ever above 0, settled or mid-scrub.
      if (!gsap || REDUCED) {
        blocks.forEach(function (b, k) { b.style.opacity = k === i ? '1' : '0'; b.style.visibility = k === i ? 'visible' : 'hidden'; });
        return;
      }
      blocks.forEach(function (b, k) {
        if (k !== i) { gsap.killTweensOf(b); gsap.set(b, { opacity: 0, y: 14, visibility: 'hidden', willChange: 'auto' }); }
      });
      var nb = blocks[i];
      nb.style.visibility = 'visible'; nb.style.willChange = 'opacity, transform';
      gsap.fromTo(nb, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'air', overwrite: true,
        onComplete: function () { nb.style.willChange = ''; } });
    }

    // ---- the ONE section pin (harness owns it). Scroll scrubs the sketch + frame, then steps POIs --
    var st = SectionHarness.pin('#combo', { start: 'top top', end: '+=' + (STORY.length * 100 + 60) + '%', scrub: 0.6 });
    if (st) {
      st.onUpdate = function (p) {
        // first ~38% of the pin: the pen-sketch + plate frame DRAW in (pure scrub of both atoms).
        // reduced-motion: keep them fully drawn (no scrub-back), only the POI tour still steps.
        var drawP = REDUCED ? 1 : Math.min(1, p / 0.38);
        if (lam && lam.set) lam.set(drawP);
        if (frame && frame.set) frame.set(drawP);
        // remaining range: STEP through the 6 real POIs (route + text), one at a time
        var tourP = Math.max(0, (p - 0.38) / 0.62);
        var idx = Math.min(STORY.length - 1, Math.max(0, Math.floor(tourP * (STORY.length - 0.001))));
        showStep(idx);
      };
    } else {
      // no GSAP / reduced: show the finished sketch + the first real route statically
      if (lam && lam.set) lam.set(1);
      if (frame && frame.set) frame.set(1);
      showStep(0);
    }

    // declare the contract for the honest probe (ONLY the two cited atoms; harness owns the single pin)
    SectionHarness.declare({
      pinOwner: 'harness', expectPins: 1,
      atomsCited: ['line-art-location-map', 'coords-corner-frame']
    });
  </script>
