<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Інвестиційна пропозиція · комерція · здавати чи перепродати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ІНВЕСТИЦІЙНА ПРОПОЗИЦІЯ · група КОМЕРЦІЯ · внутрішній код c3-branch · BRANCH CONSOLE (C-hybrid)
  Re-skin консолі: гілки «Хочу здавати» (оренда, +X/міс) і «Хочу перепродати дорожче»
  (перепродаж, було->стало, +Z разово · знак + дозволений бо продаж приносить гроші).
  ОДИН спільний слайдер площі блоку 100-712 обслуговує обидві гілки. price-model спільний.
  Перепродаж = компактний «було->стало» у консолі; ПОВНА крива зростання $/м² в L3-cinema
  (той самий t2-синхрон: одометр=висота кінчика). Нуль жаргону/дешів.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#12100d;color:#f0eae0;font-family:"Jost","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9d968a;font-weight:500}
.section-tag{position:fixed;left:72px;top:26px;z-index:30;color:#c89f6a;letter-spacing:.22em;pointer-events:none}
.console{position:relative;min-height:100vh;overflow:clip;display:grid;grid-template-columns:36% 64%}
.media{position:absolute;inset:0;z-index:0}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;filter:saturate(.72) brightness(.66)}
.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#12100d 0%,rgba(18,16,13,.85) 42%,rgba(18,16,13,.5) 100%)}
.veil-b{position:absolute;left:0;right:0;bottom:0;height:30vh;z-index:1;background:linear-gradient(180deg,rgba(18,16,13,0),#12100d)}
.index{position:relative;z-index:5;padding:9vh 40px 8vh 72px;display:flex;flex-direction:column;gap:15px;border-right:1px solid rgba(240,234,224,.1)}
.index>*{flex:none}
h1{font-size:40px;line-height:1.06;font-weight:600;margin:6px 0 4px}
.lede{font-size:15px;color:#9d968a;margin:0 0 6px;line-height:1.55;max-width:22em}
.tabs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tab{display:flex;align-items:baseline;gap:12px;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:13px 0 13px 16px;cursor:pointer;color:#9d968a;transition:color .4s,border-color .4s;min-height:44px}
.tab .n{font-family:"Cormorant Garamond",serif;font-size:15px;opacity:.55}
.tab .t{font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:600;line-height:1.05}
.tab.on{color:#f0eae0;border-color:#c89f6a}
.tab.on .t{color:#f0eae0}.tab.on .n{color:#c89f6a;opacity:1}
.bridge{margin-top:auto;font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:500;color:#f0eae0;line-height:1.22;max-width:17em}
.demo-cap{margin-top:12px;color:#c89f6a;opacity:.85}
.window{position:relative;z-index:5;padding:9vh 72px 8vh 56px;display:flex;flex-direction:column;justify-content:center;overflow:clip}
.flow{display:flex;flex-direction:column;gap:3px}
.flow-eyebrow{color:#9d968a;margin-bottom:8px}
.hero-state{color:#9d968a}
.hero-row{display:flex;align-items:baseline;gap:.05em;line-height:.95}
.plus{font-family:"Cormorant Garamond",serif;font-size:56px;font-weight:500;color:#c89f6a;line-height:.9;opacity:0;width:0;transition:opacity .3s}
.plus.on{opacity:1;width:auto;margin-right:.04em}
.odo{display:inline-flex;align-items:baseline;font-variant-numeric:tabular-nums;line-height:1;font-family:"Cormorant Garamond",serif}
.hero-odo{font-size:88px;font-weight:600;letter-spacing:-.01em}
.unit{font-family:"Cormorant Garamond",serif;font-size:35px;font-weight:500;color:#c89f6a;margin-left:.1em}
.hero-role{color:#f0eae0;font-size:15px;margin-top:5px}
/* resale «було->стало» рядок */
.grow{margin-top:14px;display:none;align-items:baseline;gap:14px;font-variant-numeric:tabular-nums}
.grow.on{display:flex}
.grow .from{color:#9d968a;font-size:16px}
.grow .arr{color:#9d968a;font-size:16px}
.grow .to{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:#f0eae0}
.grow .to small{font-family:"Jost";font-size:12px;color:#9d968a;font-weight:400;margin-left:.3em}
.hero-sub{color:#9d968a;font-size:14px;margin-top:6px}
.hero-sub b{color:#f0eae0;font-weight:500;font-variant-numeric:tabular-nums}
.odo-col{display:inline-block;width:1ch;height:1em;overflow:hidden}
.odo-strip{display:block;transform:translateY(0)}
.odo-cell{display:block;height:1em;line-height:1}
.odo-sep{display:inline-block;width:.30ch;height:1em}
.odo.roll .odo-strip{transition:transform .14s cubic-bezier(.33,0,.3,1)}
.odo.settle .odo-strip{transition:transform .52s cubic-bezier(.16,.84,.26,1)}
.ctrl{margin-top:22px;width:min(100%,450px);display:flex;flex-direction:column;gap:8px}
.ctrl label{font-size:13px;color:#9d968a;display:flex;gap:12px;align-items:baseline}
.ctrl label b{color:#f0eae0;font-weight:500;font-family:"Cormorant Garamond",serif;font-size:18px}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;--f:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#c89f6a 0,#c89f6a calc(var(--f)*100%),rgba(240,234,224,.22) calc(var(--f)*100%),rgba(240,234,224,.22) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#f0eae0;margin-top:-13px;box-shadow:0 0 0 8px rgba(200,159,106,.14)}
input[type=range]::-moz-range-track{height:2px;background:rgba(240,234,224,.22)}
input[type=range]::-moz-range-progress{height:2px;background:#c89f6a}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#f0eae0;border:0;box-shadow:0 0 0 8px rgba(200,159,106,.14)}
.tickrow{display:flex;justify-content:space-between;font-size:11px;color:#9d968a}
.payoff{margin-top:22px;display:flex;flex-direction:column;gap:5px;max-width:26em;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.payoff.on{opacity:1;transform:none}
.payoff .prow{display:flex;align-items:baseline;gap:.4em}
.payoff .when{color:#f0eae0;font-size:15px}
.payoff .big{font-family:"Cormorant Garamond",serif;font-size:31px;font-weight:600;color:#c89f6a;line-height:1;font-variant-numeric:tabular-nums}
.payoff .note{color:#9d968a;font-size:13px;line-height:1.5}
.acts{margin-top:20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.how{background:none;border:0;padding:0;color:#c89f6a;font-size:14px;cursor:pointer;text-align:left;width:max-content;border-bottom:1px solid rgba(200,159,106,.5);min-height:26px}
.panel{margin-top:14px;background:rgba(24,21,17,.98);border:1px solid rgba(240,234,224,.16);padding:20px 22px;max-width:560px}
.panel[hidden]{display:none}
.panel h3{font-family:"Jost";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9d968a;font-weight:600;margin:0 0 12px}
.panel p{margin:0 0 9px;font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
.panel p b{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600}
.panel p.dim{color:#9d968a;font-size:12.5px;margin-top:12px}
.offer{position:absolute;left:72px;bottom:16px;z-index:6;color:#9d968a}
.data-fail{background:#7c2320;color:#fff;padding:14px 72px;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid #c89f6a;outline-offset:3px}
#cinema{position:relative;z-index:10;max-height:0;overflow:hidden;transition:max-height .5s ease}
#cinema.open{max-height:none}
.cine-close{position:absolute;right:72px;top:24px;z-index:14;background:rgba(24,21,17,.9);border:1px solid rgba(240,234,224,.2);color:#f0eae0;font-family:"Jost";font-size:13px;padding:9px 16px;cursor:pointer}
@media (max-width:900px){
  .section-tag{left:24px}
  .console{grid-template-columns:1fr;min-height:auto}
  .index{padding:5vh 24px 20px;border-right:0;border-bottom:1px solid rgba(240,234,224,.1)}
  h1{font-size:28px}
  .tabs{flex-direction:row;gap:8px}
  .tab{border-left:0;border-bottom:2px solid transparent;padding:10px 4px}
  .tab .t{font-size:16px}.tab .n{display:none}
  .bridge{display:none}
  .window{padding:24px 24px 40px}
  .hero-odo{font-size:54px}.plus{font-size:36px}.unit{font-size:24px}
  .offer{position:static;padding:0 24px 20px}
  .cine-close{right:24px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} .odo-strip{transition:none!important} }
</style>
</head>
<body>
<p class="cap section-tag" data-slot="section"></p>
<div class="console" id="console" data-screen-label="Інвестиційна пропозиція · комерція · здавати чи перепродати">
  <div class="media" aria-hidden="true"><img src="assets/plans-smarts/facade-commerce-clean.webp" alt="Візуалізація фасаду з комерцією, приклад"></div>
  <div class="veil"></div><div class="veil-b"></div>
  <aside class="index">
    <p class="cap" data-slot="eyebrow"></p>
    <h1 class="serif" data-slot="title"></h1>
    <p class="lede" data-slot="lede"></p>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="bridge serif" data-slot="bridge"></p>
    <p class="cap demo-cap" data-slot="demoNote"></p>
  </aside>
  <main class="window">
    <div class="flow" id="flow">
      <p class="cap flow-eyebrow" id="flowEyebrow"></p>
      <p class="cap hero-state" id="heroState"></p>
      <div class="hero-row" id="hero" data-value="">
        <span class="plus" id="heroPlus">+</span>
        <span class="odo hero-odo" id="heroOdo" aria-hidden="true"></span>
        <span class="unit" id="heroUnit"></span>
        <span id="heroSr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)" role="status"></span>
      </div>
      <p class="hero-role" id="heroRole"></p>
      <div class="grow" id="grow"><span class="from" id="growFrom"></span><span class="arr">→</span><span class="to" id="growTo"></span></div>
      <p class="hero-sub" id="heroSub"></p>
      <div class="ctrl">
        <label for="rng"><span id="sliderLabel"></span> <b id="rngOut"></b></label>
        <input type="range" id="rng">
        <div class="tickrow"><span id="minLab"></span><span id="maxLab"></span></div>
      </div>
      <div class="payoff" id="payoff"><div class="prow"><span class="when" id="payoffWhen"></span> <span class="big serif" id="payoffBig"></span></div><p class="note" id="payoffNote"></p></div>
      <div class="acts">
        <button class="how" id="howBtn" aria-expanded="false"></button>
        <button class="how" id="cineBtn" aria-expanded="false"></button>
      </div>
      <div class="panel" id="howPanel" hidden></div>
    </div>
  </main>
  <p class="cap offer" data-slot="offerNote"></p>
</div>
<div id="cinema" aria-hidden="true"></div>

<script>
/* ============ ДЕДУП PRICE-MODEL ============ */
const PriceModel = {
  rentMonthly(area, ratePerM2){ return Math.round(area*ratePerM2); },
  payback(investedUsd, monthlyUsd){ const yr=monthlyUsd*12; return { years: investedUsd/yr, yr }; },
  entryTotal(area, presalePerM2){ return Math.round(area*presalePerM2); },
  resaleGain(area, presalePerM2, handoverPerM2){ return Math.round(area*(handoverPerM2-presalePerM2)); }
};
window.PriceModel = PriceModel;

/* TEMPLATE CONTRACT · c3-branch · BRANCH CONSOLE · комерція
   ОБОВʼЯЗКОВІ: section, eyebrow, title, lede, bridge, demoNote, dataAsOf, assumptionNote,
     offerNote, com{presalePerM2, marketLoPerM2, marketHiPerM2, area{lo,hi,step,default},
     rentPerM2{lo,hi,default}, media}, branches{rent, resale}. */
const DATA = {
  section: 'Інвестиційна пропозиція',
  eyebrow: 'Комерція на першому поверсі',
  title: 'Комерція: здавати чи перепродати',
  lede: 'Оберіть площу блоку і що плануєте: здавати щомісяця чи перепродати після здачі.',
  bridge: 'Ви обираєте свою дорогу, числа рахуємо ми.',
  demoNote: 'приклад розрахунку · 03.07.2026',
  dataAsOf: '03.07.2026',
  assumptionNote: 'Приклад розрахунку · ціни станом на 03.07.2026 · рахуємо по мінімуму, щоб не завищувати.',
  offerNote: 'Не є публічною офертою.',
  com: {
    presalePerM2: 1100, marketLoPerM2: 1400, marketHiPerM2: 1700,
    area: { lo: 100, hi: 712, step: 12, default: 100 },
    rentPerM2: { lo: 18, hi: 25, default: 20 },
    media: 'assets/plans-smarts/facade-commerce-clean.webp'
  },
  branches: {
    rent: { label: 'Хочу здавати', state: 'оренда', unit: '$', plus: true,
      role: 'приходить вам щомісяця', slider: 'Скільки просити за метр',
      payoffWhen: 'окупиться за', payoffNote: 'За цей час оренда поверне вкладене в блок.' },
    resale: { label: 'Хочу перепродати дорожче', state: 'ваш прибуток з продажу', unit: '$', plus: true,
      role: 'разово, коли будинок здадуть', slider: 'Площа блоку',
      payoffWhen: 'ціна метра', payoffNote: 'Різницю між входом і ціною на здачі забираєте ви.' }
  },
  cineLabel: 'Подивитись криву зростання',
  cineClose: 'Згорнути',
  howLabel: 'Як ми це рахували',
  hideLabel: 'Сховати розрахунок'
};
window.DATA = DATA;
const C = DATA.com;
const handover = Math.round((C.marketLoPerM2 + C.marketHiPerM2)/2);   // 1550 медіана

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt1 = x => (Math.round(x*10)/10).toString().replace('.', ',');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

(function guard(){
  const req = ['section','eyebrow','title','lede','bridge','demoNote','dataAsOf','assumptionNote','offerNote','com','branches'];
  const miss = req.filter(k => DATA[k] == null);
  if (miss.length) document.body.insertAdjacentHTML('afterbegin','<div class="data-fail">TEMPLATE CONTRACT FAIL · ' + miss.join(', ') + '</div>');
})();
$$('[data-slot]').forEach(el => { const v = DATA[el.dataset.slot]; if (v != null) el.textContent = v; });

function makeOdo(el, maxVal){
  const maxStr = fmt(maxVal); el.textContent=''; const cols=[];
  for (const ch of maxStr){
    if (ch>='0'&&ch<='9'){ const c=document.createElement('span');c.className='odo-col';
      const s=document.createElement('span');s.className='odo-strip';
      s.innerHTML='<span class="odo-cell"> </span>'+Array.from({length:10},(_,d)=>'<span class="odo-cell">'+d+'</span>').join('');
      c.appendChild(s);el.appendChild(c);cols.push({s,last:null});
    } else { const sp=document.createElement('span');sp.className='odo-sep';sp.textContent=' ';el.appendChild(sp);cols.push(null); } }
  return { set(v){ const str=fmt(v); let si=str.length-1;
    for (let i=cols.length-1;i>=0;i--){ if(!cols[i]){ if(si>=0&&!/[0-9]/.test(str[si]))si--; continue; }
      const ch=si>=0?str[si--]:''; if(cols[i].last===ch)continue; cols[i].last=ch;
      cols[i].s.style.transform='translateY('+(-(ch===''?0:1+(+ch)))+'em)'; } } };
}
function roll(el, settle){ el.classList.remove('roll','settle'); el.classList.add(settle?'settle':'roll'); }
const heroOdo = makeOdo($('#heroOdo'), PriceModel.resaleGain(C.area.hi, C.presalePerM2, C.marketHiPerM2));

const state = { branch: 'rent', area: C.area.default, ratePerM2: C.rentPerM2.default };

function buildTabs(){
  $('#tabs').innerHTML = ['rent','resale'].map((b,i)=>'<button class="tab" role="tab" data-b="'+b+'"><span class="n">0'+(i+1)+'</span><span class="t">'+DATA.branches[b].label+'</span></button>').join('');
  $$('#tabs .tab').forEach(t=> t.addEventListener('click', ()=> switchTo(t.dataset.b)));
}
function paintTabs(){ $$('#tabs .tab').forEach(t=> t.classList.toggle('on', t.dataset.b===state.branch)); }

function render(settle){
  const b = state.branch, br = DATA.branches[b], isRent = b==='rent';
  const val = isRent ? PriceModel.rentMonthly(state.area, state.ratePerM2)
                     : PriceModel.resaleGain(state.area, C.presalePerM2, handover);
  $('#flowEyebrow').textContent = br.label;
  $('#heroState').textContent = br.state;
  $('#heroPlus').classList.toggle('on', br.plus);
  $('#heroUnit').textContent = br.unit;
  $('#heroRole').textContent = br.role;
  roll($('#heroOdo'), settle); heroOdo.set(val); $('#hero').dataset.value = val;
  const rng = $('#rng');
  $('#sliderLabel').textContent = br.slider;
  if (isRent){
    $('#grow').classList.remove('on');
    rng.min=C.rentPerM2.lo; rng.max=C.rentPerM2.hi; rng.step=1; rng.value=state.ratePerM2;
    rng.style.setProperty('--f',(state.ratePerM2-C.rentPerM2.lo)/(C.rentPerM2.hi-C.rentPerM2.lo));
    $('#rngOut').textContent = state.ratePerM2+' $/м² · '+fmt(val)+' $/міс';
    rng.setAttribute('aria-valuetext', fmt(val)+' $ на місяць');
    $('#minLab').textContent=C.rentPerM2.lo+' $/м²'; $('#maxLab').textContent=C.rentPerM2.hi+' $/м²';
    const invested = PriceModel.entryTotal(state.area, C.presalePerM2);
    const pb = PriceModel.payback(invested, val);
    $('#heroSub').innerHTML = 'блок <b>'+state.area+' м²</b> · вхід '+fmt(invested)+' $';
    $('#payoffWhen').textContent=br.payoffWhen; $('#payoffBig').textContent=fmt1(pb.years)+' років'; $('#payoffNote').textContent=br.payoffNote;
    $('#heroSr').textContent='оренда +'+fmt(val)+' $ на місяць';
  } else {
    $('#grow').classList.add('on');
    rng.min=C.area.lo; rng.max=C.area.hi; rng.step=C.area.step; rng.value=state.area;
    rng.style.setProperty('--f',(state.area-C.area.lo)/(C.area.hi-C.area.lo));
    $('#rngOut').textContent = state.area+' м²';
    rng.setAttribute('aria-valuetext', state.area+' м² · прибуток +'+fmt(val)+' $ разово');
    $('#minLab').textContent=C.area.lo+' м²'; $('#maxLab').textContent=C.area.hi+' м²';
    $('#growFrom').textContent = 'зараз '+fmt(C.presalePerM2)+' $/м²';
    $('#growTo').innerHTML = 'на здачі ~'+fmt(handover)+' <small>$/м²</small>';
    $('#heroSub').innerHTML = 'блок <b>'+state.area+' м²</b> · вхід '+fmt(PriceModel.entryTotal(state.area,C.presalePerM2))+' $';
    $('#payoffWhen').textContent=br.payoffWhen; $('#payoffBig').textContent=fmt(C.presalePerM2)+' → '+fmt(handover); $('#payoffNote').textContent=br.payoffNote;
    $('#heroSr').textContent='прибуток з продажу +'+fmt(val)+' $ разово';
  }
  paintHow();
}
function paintHow(){
  const invested = PriceModel.entryTotal(state.area, C.presalePerM2);
  const val = PriceModel.rentMonthly(state.area, state.ratePerM2);
  const pb = PriceModel.payback(invested, val);
  const gain = PriceModel.resaleGain(state.area, C.presalePerM2, handover);
  $('#howPanel').innerHTML = (state.branch==='rent'
    ? '<h3>Приклад розрахунку · блок '+state.area+' м²</h3>'
      + '<p>оренда: '+state.area+' × '+state.ratePerM2+' = <b>'+fmt(val)+' $ на місяць</b> · за рік '+fmt(pb.yr)+' $</p>'
      + '<p>вхід поки будують: '+state.area+' × '+fmt(C.presalePerM2)+' = <b>'+fmt(invested)+' $</b> · окупність '+fmt(invested)+' / '+fmt(pb.yr)+' = <b>'+fmt1(pb.years)+' років</b></p>'
    : '<h3>Приклад розрахунку · блок '+state.area+' м²</h3>'
      + '<p>вхід поки будують: '+state.area+' × '+fmt(C.presalePerM2)+' = <b>'+fmt(invested)+' $</b></p>'
      + '<p>на здачі метр коштує ~'+fmt(handover)+' $ (ринок '+fmt(C.marketLoPerM2)+' до '+fmt(C.marketHiPerM2)+') · блок = <b>'+fmt(state.area*handover)+' $</b></p>'
      + '<p>ваш прибуток з продажу: '+fmt(state.area*handover)+' − '+fmt(invested)+' = <b>+'+fmt(gain)+' $ разово</b></p>')
    + '<p class="dim">'+DATA.demoNote+' · '+DATA.assumptionNote+'</p>'
    + '<p><button class="how" id="hideBtn">'+DATA.hideLabel+'</button></p>';
  $('#hideBtn').onclick = ()=>{ $('#howPanel').hidden=true; $('#howBtn').setAttribute('aria-expanded','false'); };
}
$('#rng').addEventListener('input', ()=>{ if(state.branch==='rent') state.ratePerM2=+$('#rng').value; else state.area=+$('#rng').value; render(false); });
$('#rng').addEventListener('change', ()=> render(true));
$('#howBtn').onclick = ()=>{ const p=$('#howPanel'); p.hidden=!p.hidden; $('#howBtn').setAttribute('aria-expanded', String(!p.hidden)); };

function switchTo(b){
  if (b===state.branch) return;
  const dir = b==='resale' ? 34 : -34;
  state.branch = b; paintTabs(); render(true);
  if (reduced) return;
  $('#flow').animate([{opacity:0, transform:'translateX('+dir+'px)'},{opacity:1, transform:'none'}], {duration:460, easing:'cubic-bezier(.16,1,.3,1)'});
  revealSeq();
}
function revealSeq(){ $('#payoff').classList.remove('on'); setTimeout(()=>{ $('#payoff').classList.add('on'); }, 420); }

/* L3 · cinema = ПОВНА крива зростання $/м² (той самий t2-синхрон: одометр=висота кінчика) */
let cineBuilt=false;
function buildCinema(){
  if (cineBuilt) return; cineBuilt=true;
  const host=$('#cinema');
  const stages=[{c:'котлован',p:1100},{c:'коробка',p:1300},{c:'фасад',p:1450},{c:'здача',p:handover}];
  const X0=90,X1=980,YB=440,YT=70,PMIN=1000,PMAX=1800;
  const YOF=p=>YB-(p-PMIN)/(PMAX-PMIN)*(YB-YT);
  const XS=stages.map((_,i)=>X0+(X1-X0)*i/3);
  let d='M'+XS[0]+' '+YOF(stages[0].p);
  for(let i=1;i<4;i++) d+=' L'+XS[i]+' '+YOF(stages[i].p);
  const marks=stages.map((s,i)=>'<text x="'+XS[i]+'" y="'+(YB+28)+'" text-anchor="'+(i===0?'start':i===3?'end':'middle')+'" font-family="Jost" font-size="12" fill="#9d968a" letter-spacing=".1em">'+s.c.toUpperCase()+'</text><text x="'+XS[i]+'" y="'+(YOF(s.p)-12)+'" text-anchor="middle" font-family="Cormorant Garamond" font-size="18" font-weight="600" fill="#f0eae0">'+fmt(s.p)+'</text>').join('');
  host.innerHTML =
    '<button class="cine-close" id="cineClose">'+DATA.cineClose+'</button>'
    + '<div style="position:relative;min-height:92vh;overflow:clip;display:flex;flex-direction:column;justify-content:center;padding:0 72px;background:#12100d">'
    + '<div style="position:relative;z-index:2;max-width:44em">'
    + '<p class="cap" style="color:#c89f6a">повна сцена · зростання ціни метра</p>'
    + '<h2 class="serif" style="font-size:40px;font-weight:600;margin:10px 0 8px">Метр комерції дорожчає, поки будують</h2>'
    + '<p class="hero-role" style="font-size:16px;color:#9d968a;max-width:26em">Зараз '+fmt(C.presalePerM2)+' $ за метр, на здачі ~'+fmt(handover)+' $. Різницю на вашому блоці забираєте ви.</p>'
    + '</div>'
    + '<svg viewBox="0 0 1040 500" style="width:100%;max-width:1040px;height:auto;margin-top:20px;z-index:2" aria-hidden="true">'
    + '<path d="'+d+'" fill="none" stroke="#c89f6a" stroke-width="3" stroke-linecap="round"></path>'
    + '<path d="'+d+' L'+XS[3]+' '+YB+' L'+XS[0]+' '+YB+' Z" fill="#c89f6a" fill-opacity=".12"></path>'
    + '<circle cx="'+XS[3]+'" cy="'+YOF(handover)+'" r="6" fill="#f6ecdc"></circle>'
    + marks + '</svg>'
    + '<p class="cap" style="margin-top:16px;color:#9d968a;z-index:2">'+DATA.demoNote+' · '+DATA.assumptionNote+'</p>'
    + '</div>';
  $('#cineClose').onclick = ()=> toggleCinema(false);
}
function toggleCinema(open){
  buildCinema();
  const c=$('#cinema'); c.classList.toggle('open', open); c.setAttribute('aria-hidden', String(!open));
  $('#cineBtn').setAttribute('aria-expanded', String(open));
  if (open) c.scrollIntoView({ behavior: reduced?'auto':'smooth', block:'start' });
}
$('#cineBtn').textContent = DATA.cineLabel;
$('#cineBtn').onclick = ()=> toggleCinema($('#cinema').getAttribute('aria-hidden')!=='false' ? true : false);

window.__zeroBlankProbe = () => ({ ok: getComputedStyle($('.console')).opacity==='1' });

function arm(){
  buildTabs(); paintTabs();
  $('#howBtn').textContent = DATA.howLabel;
  render(true);
  if (!reduced){ const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ revealSeq(); io.disconnect(); } }); },{threshold:.3}); io.observe($('#flow')); }
  else { $('#payoff').classList.add('on'); }
}
const imgs = $$('.media img');
function decodeGuard(){ return Promise.all(imgs.map(i => i.decode ? Promise.race([i.decode().catch(()=>0), new Promise(r=>setTimeout(r,1200))]) : 0)); }
decodeGuard().then(arm);
</script>
</body>
</html>
