<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Інвестиція в комерцію · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ПРОТОТИП «Інвестиція в комерцію» · ГЛИБИНА 1 (без наміру «жити/інвестувати»: комерція = бізнес-актив)
  RE-SKIN town/smart-еталона. Дані з units.json commercial + content.js investCalc:
    пресейл 1100 $/м² -> готова фасадна 1400-1700 $/м² · капіталізація 30% · блоки від 100 м²
  Оренди в $ у фактажі НЕМАЄ -> одна композиція: КРИВА ПЕРЕПРОДАЖУ + слайдер блоку.
  Ті самі закони: один PriceModel + makeOdo, пін НЕМА, крива self-play,
  синхрон-інваріант одометр = висота кінчика = priceAt(p).
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#12100d;color:#f0eae0;font-family:"Jost","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9d968a;font-weight:500}
.section-tag{position:fixed;left:72px;top:26px;z-index:30;color:#c89f6a;letter-spacing:.22em;pointer-events:none}
.console{position:relative;min-height:100vh;overflow:clip;display:grid;grid-template-columns:33% 67%}
.media{position:absolute;inset:0;z-index:0}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:saturate(.72) brightness(.6);transition:opacity .55s ease}
.media img.on{opacity:.16}
.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#12100d 0%,rgba(18,16,13,.86) 40%,rgba(18,16,13,.5) 100%)}
.veil-b{position:absolute;left:0;right:0;bottom:0;height:28vh;z-index:1;background:linear-gradient(180deg,rgba(18,16,13,0),#12100d)}
.index{position:relative;z-index:5;padding:9vh 40px 8vh 72px;display:flex;flex-direction:column;gap:14px;border-right:1px solid rgba(240,234,224,.1)}
.index>*{flex:none}
h1{font-size:38px;line-height:1.06;font-weight:600;margin:6px 0 2px}
.lede{font-size:15px;color:#9d968a;margin:0 0 4px;line-height:1.55;max-width:22em}
.facts{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.fact{display:flex;align-items:baseline;gap:11px}
.fact b{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;color:#f0eae0;font-variant-numeric:tabular-nums;min-width:2.6em}
.fact span{font-size:13px;color:#9d968a;line-height:1.3}
.path{margin-top:14px;font-size:12.5px;color:#9d968a;min-height:1.2em}
.path b{color:#c89f6a;font-weight:500}
.bridge{margin-top:auto;font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:500;color:#f0eae0;line-height:1.22;max-width:17em}
.demo-cap{margin-top:12px;color:#c89f6a;opacity:.85}
.window{position:relative;z-index:5;padding:6vh 60px 6vh 52px;display:flex;flex-direction:column;overflow:clip;min-height:100vh}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.comp{display:flex;flex-direction:column;gap:2px;position:relative}
.comp-eyebrow{color:#9d968a;margin-bottom:6px}
.hero-state{color:#9d968a}
.hero-row{display:flex;align-items:baseline;gap:.05em;line-height:.95}
.odo{display:inline-flex;align-items:baseline;font-variant-numeric:tabular-nums;line-height:1;font-family:"Cormorant Garamond",serif}
.hero-odo{font-size:84px;font-weight:600;letter-spacing:-.01em}
.unit{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:500;color:#c89f6a;margin-left:.1em}
.hero-sub{color:#9d968a;font-size:14px;margin-top:3px}
.hero-sub b{color:#f0eae0;font-weight:500;font-variant-numeric:tabular-nums}
.odo{--ch:1.24em}
.odo-col{display:inline-block;width:1ch;height:var(--ch);overflow:hidden;vertical-align:baseline}
.odo-strip{display:block;transform:translateY(0);will-change:transform}
.odo-cell{display:block;height:var(--ch);line-height:var(--ch);text-align:center;font-variant-numeric:tabular-nums}
.odo-sep{display:inline-block;width:.30ch;height:var(--ch)}
.odo.roll .odo-strip{transition:transform .2s cubic-bezier(.4,0,.2,1)}
.odo.settle .odo-strip{transition:transform .44s cubic-bezier(.22,1,.36,1)}
.chart{width:min(100%,640px);margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.axv{font-family:"Jost";font-size:12px;fill:#9d968a}
.axc{font-family:"Jost";font-size:11.5px;fill:#9d968a;letter-spacing:.12em}
.band-end{font-family:"Cormorant Garamond",serif;font-weight:600;font-variant-numeric:tabular-nums}
.tip-dot{fill:#f6ecdc}
.trail-dot{fill:#c89f6a}
.gridline{transition:opacity .18s,stroke-width .18s}
.gridtext{transition:opacity .18s}
.grow{margin-top:10px;display:flex;align-items:baseline;gap:14px}
.grow .from{color:#9d968a;font-size:15px}
.grow .arr{color:#9d968a;font-size:15px}
.grow .to{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;color:#f0eae0}
.grow .to small{font-family:"Jost";font-size:12px;color:#9d968a;font-weight:400;margin-left:.3em}
.ctrl{margin-top:18px;width:min(100%,440px);display:flex;flex-direction:column;gap:7px}
.ctrl label{font-size:13px;color:#9d968a;display:flex;gap:12px;align-items:baseline}
.ctrl label b{color:#f0eae0;font-weight:500;font-family:"Cormorant Garamond",serif;font-size:18px}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;--f:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#c89f6a 0,#c89f6a calc(var(--f)*100%),rgba(240,234,224,.22) calc(var(--f)*100%),rgba(240,234,224,.22) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#f0eae0;margin-top:-13px;box-shadow:0 0 0 8px rgba(200,159,106,.14)}
input[type=range]::-moz-range-track{height:2px;background:rgba(240,234,224,.22)}
input[type=range]::-moz-range-progress{height:2px;background:#c89f6a}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#f0eae0;border:0;box-shadow:0 0 0 8px rgba(200,159,106,.14)}
.tickrow{display:flex;justify-content:space-between;font-size:11px;color:#9d968a}
.payoff{margin-top:18px;display:flex;flex-direction:column;gap:5px;max-width:26em;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.payoff.on{opacity:1;transform:none}
.payoff .prow{display:flex;align-items:baseline;gap:.4em}
.payoff .when{color:#f0eae0;font-size:15px}
.payoff .big{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:#c89f6a;line-height:1;font-variant-numeric:tabular-nums}
.payoff .note{color:#9d968a;font-size:13px;line-height:1.5}
.acts{margin-top:18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.how{background:none;border:0;padding:0;color:#c89f6a;font-size:14px;cursor:pointer;text-align:left;width:max-content;border-bottom:1px solid rgba(200,159,106,.5);min-height:26px}
.panel{margin-top:14px;background:rgba(24,21,17,.98);border:1px solid rgba(240,234,224,.16);padding:20px 22px;max-width:560px}
.panel[hidden]{display:none}
.panel h3{font-family:"Jost";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9d968a;font-weight:600;margin:0 0 12px}
.panel p{margin:0 0 9px;font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
.panel p b{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600}
.panel p.dim{color:#9d968a;font-size:12.5px;margin-top:12px}
.offer{position:absolute;left:72px;bottom:16px;z-index:6;color:#9d968a}
.data-fail{background:#7c2320;color:#fff;padding:14px 72px;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid #c89f6a;outline-offset:3px}
@media (max-width:900px){
  .section-tag{left:24px}
  .console{grid-template-columns:1fr;min-height:auto}
  .index{padding:5vh 24px 18px;border-right:0;border-bottom:1px solid rgba(240,234,224,.1)}
  h1{font-size:27px}
  .bridge{display:none}
  .window{padding:22px 24px 40px}
  .hero-odo{font-size:52px}.unit{font-size:22px}
  .offer{position:static;padding:0 24px 20px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} .odo-strip{transition:none!important} }
</style>
</head>
<body>
<p class="cap section-tag" data-slot="section"></p>
<div class="console" id="console" data-screen-label="Інвестиція в комерцію · прототип">
  <div class="media" aria-hidden="true">
    <img id="mediaResale" class="on" src="assets/plans-smarts/facade-commerce-clean.webp" alt="">
  </div>
  <img src="assets/plans-smarts/facade-commerce-clean.webp" alt="Візуалізація фасадної комерції, приклад" style="display:none">
  <div class="veil"></div><div class="veil-b"></div>
  <aside class="index">
    <p class="cap" data-slot="eyebrow"></p>
    <h1 class="serif" data-slot="title"></h1>
    <p class="lede" data-slot="lede"></p>
    <div class="facts" id="facts"></div>
    <p class="path" id="path"></p>
    <p class="bridge serif" data-slot="bridge"></p>
    <p class="cap demo-cap" data-slot="demoNote"></p>
  </aside>
  <main class="window">
    <div class="stage" id="stage"></div>
    <div class="acts">
      <button class="how" id="howBtn" aria-expanded="false"></button>
    </div>
    <div class="panel" id="howPanel" hidden></div>
  </main>
  <p class="cap offer" data-slot="offerNote"></p>
</div>

<script>
/* ============ СПІЛЬНЕ (дедуп) ============ */
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const W = (e,a,b) => clamp((e-a)/(b-a),0,1);
const smoothstep = (e,a,b) => { const t=clamp((e-a)/(b-a),0,1); return t*t*(3-2*t); };
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PriceModel = {
  resaleGain(area, presalePerM2, handoverPerM2){ return Math.round(area*(handoverPerM2-presalePerM2)); },
  entryTotal(area, presalePerM2){ return Math.round(area*presalePerM2); }
};
window.PriceModel = PriceModel;

function makeOdo(el, maxVal){
  const maxStr = fmt(maxVal); el.textContent=''; const cols=[];
  for (const ch of maxStr){
    if (ch>='0'&&ch<='9'){ const c=document.createElement('span');c.className='odo-col';
      const s=document.createElement('span');s.className='odo-strip';
      s.innerHTML='<span class="odo-cell"> </span>'+Array.from({length:10},(_,d)=>'<span class="odo-cell">'+d+'</span>').join('');
      c.appendChild(s);el.appendChild(c);cols.push({s,last:null});
    } else { const sp=document.createElement('span');sp.className='odo-sep';sp.textContent=' ';el.appendChild(sp);cols.push(null); } }
  return { set(v){ const str=fmt(v); let si=str.length-1;
    for (let i=cols.length-1;i>=0;i--){ if(!cols[i]){ if(si>=0&&!/[0-9]/.test(str[si]))si--; continue; }
      const ch=si>=0?str[si--]:''; if(cols[i].last===ch)continue; cols[i].last=ch;
      const n=(ch===''?0:1+(+ch)); cols[i].s.style.transform='translateY(calc(var(--ch) * '+(-n)+'))'; } } };
}
function rollCls(el, settle){ el.classList.remove('roll','settle'); el.classList.add(settle?'settle':'roll'); }

function monotonePath(pts){
  const n = pts.length; if (n < 2) return 'M'+pts[0].x+' '+pts[0].y;
  const P = [{x:2*pts[0].x-pts[1].x, y:2*pts[0].y-pts[1].y}, ...pts, {x:2*pts[n-1].x-pts[n-2].x, y:2*pts[n-1].y-pts[n-2].y}];
  const m = P.length, dx=[], sl=[];
  for (let i=0;i<m-1;i++){ dx[i]=P[i+1].x-P[i].x; sl[i]=(P[i+1].y-P[i].y)/dx[i]; }
  const tan = new Array(m); tan[0]=sl[0]; tan[m-1]=sl[m-2];
  for (let i=1;i<m-1;i++){ if (sl[i-1]*sl[i]<=0) tan[i]=0;
    else { const w1=2*dx[i]+dx[i-1], w2=dx[i]+2*dx[i-1]; tan[i]=(w1+w2)/(w1/sl[i-1]+w2/sl[i]); } }
  let d = 'M'+pts[0].x.toFixed(2)+' '+pts[0].y.toFixed(2);
  for (let k=0;k<n-1;k++){ const i=k+1, h=P[i+1].x-P[i].x;
    d += ' C'+(P[i].x+h/3).toFixed(2)+' '+(P[i].y+tan[i]*h/3).toFixed(2)+' '+(P[i+1].x-h/3).toFixed(2)+' '+(P[i+1].y-tan[i+1]*h/3).toFixed(2)+' '+P[i+1].x.toFixed(2)+' '+P[i+1].y.toFixed(2); }
  return d;
}

/* ============ КОМПОЗИЦІЯ · КРИВА ЗРОСТАННЯ КОМЕРЦІЇ (перенос t2-curve, self-play) ============ */
function mountCurveScene(host, D){
  const C = D.commerce;
  const SP = C.curveStages.map(s=>s.p);
  /* commerce: здача = стадія +30% (з curveStages), НЕ середнє ринку. Ринок 1400-1700 = апсайд-смуга вище. */
  const START=SP[0], HANDOVER=SP[SP.length-1], N=SP.length;
  const roundToUsd=10, q=v=>Math.round(v/roundToUsd)*roundToUsd;
  const BR=[.25,.37,.55,.67,.80,.92];
  function priceAt(e){ let p;
    if(e<BR[0])p=SP[0]; else if(e<BR[1])p=SP[0]+(SP[1]-SP[0])*smoothstep(e,BR[0],BR[1]);
    else if(e<BR[2])p=SP[1]; else if(e<BR[3])p=SP[1]+(SP[2]-SP[1])*smoothstep(e,BR[2],BR[3]);
    else if(e<BR[4])p=SP[2]; else p=SP[2]+(SP[3]-SP[2])*smoothstep(e,BR[4],BR[5]);
    return q(p); }
  const X0=70,X1=580,YB=300,YT=48,PMIN=C.curveYMin,PMAX=C.curveYMax;
  const YOF=p=>YB-(p-PMIN)/(PMAX-PMIN)*(YB-YT);
  const XE=e=>X0+(X1-X0)*clamp(e,0,1);
  const XS=C.curveStages.map((_,i)=>X0+(X1-X0)*i/(N-1));
  const gridVals=C.curveGrid;
  host.innerHTML =
    '<div class="comp"><p class="cap comp-eyebrow">Купую, щоб перепродати після введення</p>'
    + '<p class="cap hero-state" id="cState">ціна метра росте до здачі</p>'
    + '<div class="hero-row"><span class="odo hero-odo" id="cOdo"></span><span class="unit">$/м²</span></div>'
    + '<p class="hero-sub" id="cSub"></p>'
    + '<div class="chart"><svg id="cSvg" viewBox="0 0 660 340" preserveAspectRatio="xMidYMid meet">'
    + '<defs><linearGradient id="cAreaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c89f6a" stop-opacity=".17"></stop><stop offset="1" stop-color="#c89f6a" stop-opacity="0"></stop></linearGradient>'
    + '<clipPath id="cAreaClip"><rect id="cAreaRect" x="'+X0+'" y="0" width="0" height="340"></rect></clipPath></defs>'
    + '<g id="cGrid"></g>'
    + '<g clip-path="url(#cAreaClip)"><path id="cArea" fill="url(#cAreaG)"></path></g>'
    + '<path id="cBandPath" fill="#9d968a" fill-opacity=".1" opacity="0"></path>'
    + '<path id="cCurve" pathLength="1" fill="none" stroke="#c89f6a" stroke-width="2.8" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"></path>'
    + '<g id="cBandLab" opacity="0"></g><g id="cTrail"></g>'
    + '<circle id="cTip" class="tip-dot" r="4" opacity="0"></circle></svg></div>'
    + '<div class="grow"><span class="from">пресейл '+fmt(START)+' $/м²</span><span class="arr">→</span><span class="to">готова фасадна ~'+fmt(HANDOVER)+' <small>$/м²</small></span></div>'
    + '<div class="ctrl" id="cCtrl"><label for="cRng">Ваш прибуток на блоці <b id="cRngOut"></b></label>'
    + '<input type="range" id="cRng"><div class="tickrow"><span>'+C.blockArea.lo+' м²</span><span>'+C.blockArea.hi+' м²</span></div></div>'
    + '<div class="payoff" id="cPay"><div class="prow"><span class="when">ваш прибуток</span> <span class="big serif" id="cGain"></span></div>'
    + '<p class="note">Різницю між входом і ціною готової фасадної комерції забираєте ви.</p></div></div>';
  const odo = makeOdo(host.querySelector('#cOdo'), PMAX);
  let gh=''; gridVals.forEach(v=>{ gh+='<line class="gridline" data-v="'+v+'" x1="'+X0+'" x2="'+X1+'" y1="'+YOF(v)+'" y2="'+YOF(v)+'" stroke="#f0eae0" style="opacity:.08"></line>'
    +'<text class="axv gridtext" data-v="'+v+'" x="'+(X1+10)+'" y="'+(YOF(v)+4)+'" style="opacity:.08">'+fmt(v)+'</text>'; });
  C.curveStages.forEach((s,i)=>{ gh+='<text class="axc" x="'+XS[i]+'" y="'+(YB+24)+'" text-anchor="'+(i===0?'start':i===N-1?'end':'middle')+'">'+s.c.toUpperCase()+'</text>'; });
  host.querySelector('#cGrid').innerHTML = gh;
  const prof=[]; for(let i=0;i<=80;i++){ const e=i/80; prof.push({x:XE(e), y:YOF(priceAt(e))}); }
  const mainD = monotonePath(prof);
  host.querySelector('#cCurve').setAttribute('d', mainD);
  host.querySelector('#cArea').setAttribute('d', mainD+' L'+X1+' '+YB+' L'+X0+' '+YB+' Z');
  const fx=XS[2], fy=YOF(SP[2]), ex=XS[3];
  host.querySelector('#cBandPath').setAttribute('d','M'+fx+' '+fy+' L'+ex+' '+YOF(C.marketHi)+' L'+ex+' '+YOF(C.marketLo)+' Z');
  host.querySelector('#cBandLab').innerHTML =
    '<g transform="translate('+(ex+10)+','+YOF(C.marketHi)+')"><text class="axv" y="-4" fill="#9d968a">верх ринку</text><text class="band-end" y="16" fill="#f0eae0" font-size="17">'+fmt(C.marketHi)+'</text></g>'
    +'<g transform="translate('+(ex+10)+','+YOF(C.marketLo)+')"><text class="axv" y="-4" fill="#9d968a">ринок готового</text><text class="band-end" y="16" fill="#f0eae0" font-size="17">'+fmt(C.marketLo)+'</text></g>';
  const cv=host.querySelector('#cCurve'); const len=cv.getTotalLength(), K=80, lut=[];
  for(let i=0;i<=K;i++){ const pt=cv.getPointAtLength(len*i/K); lut.push({x:pt.x,y:pt.y}); }
  const lutAtP=p=>{ const f=clamp(p,0,1)*K,i=Math.floor(f),t=f-i,a=lut[i],b=lut[Math.min(i+1,K)]; return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}; };
  const pAtX=tx=>{ for(let i=0;i<lut.length-1;i++){ if(tx>=lut[i].x&&tx<=lut[i+1].x){ const t=(tx-lut[i].x)/((lut[i+1].x-lut[i].x)||1); return (i+t)/K; } } return tx<=lut[0].x?0:1; };
  function paintTip(drawP, price){
    const x=XE(drawP), y=YOF(price), pLen=pAtX(x);
    cv.style.strokeDashoffset = 1-pLen;
    host.querySelector('#cAreaRect').setAttribute('width',((X1-X0)*drawP).toFixed(1));
    if(drawP<=0.002||drawP>=0.999){ host.querySelector('#cTip').style.opacity=0; host.querySelector('#cTrail').innerHTML=''; return; }
    const tip=host.querySelector('#cTip'); tip.setAttribute('cx',x); tip.setAttribute('cy',y); tip.style.opacity=1;
    if(reduced){ host.querySelector('#cTrail').innerHTML=''; return; }
    let th=''; [12,24,36].forEach((back,k)=>{ const tl=len*pLen-back; if(tl>0){ const c=lutAtP(tl/len); th+='<circle class="trail-dot" cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+(2.6-k*0.6)+'" opacity="'+(0.45-k*0.13).toFixed(2)+'"></circle>'; } });
    host.querySelector('#cTrail').innerHTML=th;
  }
  function paintGrid(headPrice){ gridVals.forEach(v=>{ const line=host.querySelector('.gridline[data-v="'+v+'"]'),txt=host.querySelector('.gridtext[data-v="'+v+'"]');
    const passed=headPrice>=v-2,current=Math.abs(headPrice-v)<70; const op=current?.34:passed?.22:.08; line.style.opacity=op; txt.style.opacity=Math.max(op,passed?.5:.22); line.setAttribute('stroke-width',current?1.4:1); }); }
  /* герой прибутку = площа блоку × дельта */
  let area = C.blockArea.default;
  function setGain(){ const gain=PriceModel.resaleGain(area, START, HANDOVER);
    host.querySelector('#cGain').innerHTML='+'+fmt(gain)+' $ <small style="font-size:14px;color:#9d968a">разово</small>';
    host.querySelector('#cSub').innerHTML='блок <b>'+area+' м²</b> · вхід '+fmt(PriceModel.entryTotal(area,START))+' $';
    D._how={ title:'блок '+area+' м²', lines:[
      'вхід на пресейлі: '+area+' × '+fmt(START)+' = <b>'+fmt(PriceModel.entryTotal(area,START))+' $</b>',
      'готова фасадна ~'+fmt(HANDOVER)+' $/м² · блок = <b>'+fmt(area*HANDOVER)+' $</b>',
      'ваш прибуток: '+fmt(area*HANDOVER)+' − '+fmt(PriceModel.entryTotal(area,START))+' = <b>+'+fmt(gain)+' $ разово</b> (+'+Math.round((HANDOVER-START)/START*100)+'% до входу)' ] }; }
  const rng=host.querySelector('#cRng');
  rng.min=C.blockArea.lo; rng.max=C.blockArea.hi; rng.step=C.blockArea.step; rng.value=area;
  rng.addEventListener('input',()=>{ area=+rng.value; host.querySelector('#cRngOut').textContent=area+' м²'; rng.style.setProperty('--f',(area-C.blockArea.lo)/(C.blockArea.hi-C.blockArea.lo)); setGain(); });
  host.querySelector('#cRngOut').textContent=area+' м²'; rng.style.setProperty('--f',(area-C.blockArea.lo)/(C.blockArea.hi-C.blockArea.lo)); setGain();
  function play(){
    if(reduced){ const pr=priceAt(1); odo.set(pr); rollCls(host.querySelector('#cOdo'),true);
      cv.style.strokeDashoffset=0; host.querySelector('#cAreaRect').setAttribute('width',X1-X0);
      host.querySelector('#cTip').setAttribute('cx',X1); host.querySelector('#cTip').setAttribute('cy',YOF(pr)); host.querySelector('#cTip').style.opacity=1;
      paintGrid(pr); host.querySelector('#cBandPath').style.opacity=1; host.querySelector('#cBandLab').style.opacity=1;
      host.querySelector('#cPay').classList.add('on'); host.querySelector('#cState').textContent='ціна метра · '+fmt(START)+' → '+fmt(HANDOVER); return; }
    const t0=performance.now(), DUR=1550;
    function step(now){ const drawP=clamp((now-t0)/DUR,0,1); const price=priceAt(drawP);
      rollCls(host.querySelector('#cOdo'), drawP>=1); odo.set(price);
      paintTip(drawP, price); paintGrid(price);
      host.querySelector('#cBandPath').style.opacity=W(drawP,.82,1); host.querySelector('#cBandLab').style.opacity=W(drawP,.9,1);
      if(drawP>=1){ host.querySelector('#cState').textContent='ціна метра · '+fmt(START)+' → '+fmt(HANDOVER);
        setTimeout(()=>host.querySelector('#cPay').classList.add('on'),200); return; }
      requestAnimationFrame(step); }
    odo.set(START); requestAnimationFrame(step);
  }
  requestAnimationFrame(()=>requestAnimationFrame(play));
  return { path:'<b>Купую, щоб перепродати</b>' };
}

  bridge: 'Готова фасадна коштує помітно дорожче за пресейл.',
  demoNote: 'демо-дані шаблону · приклад',
  dataAsOf: '03.07.2026',

    curveYMin: 1050, curveYMax: 1750, curveGrid: [1100,1300,1500,1700],

  },
  howLabel: 'Як ми це рахували', hideLabel: 'Сховати розрахунок'
};
window.DATA = DATA;

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
(function guard(){ const req=['section','eyebrow','title','lede','bridge','demoNote','dataAsOf','assumptionNote','offerNote','commerce'];
  const miss=req.filter(k=>DATA[k]==null); if(miss.length) document.body.insertAdjacentHTML('afterbegin','<div class="data-fail">TEMPLATE CONTRACT FAIL · '+miss.join(', ')+'</div>'); })();
$$('[data-slot]').forEach(el => { const v = DATA[el.dataset.slot]; if (v != null) el.textContent = v; });
$('#facts').innerHTML = DATA.commerce.facts.map(f=>'<div class="fact"><b>'+f.b+'</b><span>'+f.s+'</span></div>').join('');

/* ============ ОБОЛОНКА (глибина 1: одна композиція, без табів наміру) ============ */
function mountActive(){
  const host=$('#stage'); host.innerHTML='';
  const res = mountCurveScene(host, DATA);
  $('#path').innerHTML = res.path;
  if(!reduced && host.firstElementChild) host.firstElementChild.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:440,easing:'cubic-bezier(.16,1,.3,1)'});
  $('#howPanel').hidden=true; $('#howBtn').setAttribute('aria-expanded','false');
}
$('#howBtn').onclick = ()=>{ const p=$('#howPanel');
  if(p.hidden){ const h=DATA._how||{title:'',lines:[]}; p.innerHTML='<h3>Приклад розрахунку · '+h.title+'</h3>'+h.lines.map(l=>'<p>'+l+'</p>').join('')+'<p class="dim">'+DATA.demoNote+' · '+DATA.assumptionNote+'</p>'; p.hidden=false; $('#howBtn').setAttribute('aria-expanded','true'); }
  else { p.hidden=true; $('#howBtn').setAttribute('aria-expanded','false'); } };

window.__zeroBlankProbe = () => ({ ok: getComputedStyle($('.console')).opacity==='1' });

function arm(){ $('#howBtn').textContent=DATA.howLabel; mountActive(); }
const imgs=$$('.media img');
function decodeGuard(){ return Promise.all(imgs.map(i => i.decode ? Promise.race([i.decode().catch(()=>0), new Promise(r=>setTimeout(r,1200))]) : 0)); }
decodeGuard().then(arm);
</script>
