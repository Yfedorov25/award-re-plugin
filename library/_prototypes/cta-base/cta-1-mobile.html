<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTA 1 · Ключі на столі · mobile</title>
<style>
/* phone-first 390x844. backgrounds: #0b0a09 backdrop, #12100d canvas, media + local scrim, curtain #171310. no light surface. */
:root{
  --cream:#efe8da;
  --mut:rgba(239,232,218,.72);
  --line:rgba(239,232,218,.36);
  --warm:#d3a077;
  --deep:#171310;
  --ease:cubic-bezier(.25,.74,.22,.99); /* house ease, one per move */
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0a09;font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;position:relative;overflow-x:clip;background:#12100d}
.caps{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}

/* top media band */
.band{position:relative;height:46dvh;min-height:340px;overflow:clip}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.band .scrim{position:absolute;inset:0;background:linear-gradient(0deg,#12100d 4%,rgba(18,16,13,.6) 34%,rgba(18,16,13,.14) 70%,rgba(18,16,13,.38) 100%);pointer-events:none}
.band .tag{position:absolute;top:18px;left:20px;color:var(--mut)}

/* voice block over the band bottom: push-swap in a clipped window */
.voicewin{position:absolute;left:20px;right:20px;bottom:14px;overflow:clip;height:196px}
.voicestrip{height:100%;display:grid;grid-template-rows:100% 100%;transition:transform .7s var(--ease)}
.m-inv .voicestrip{transform:translateY(-100%)}
.voice{display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.title{font-size:clamp(30px,9vw,44px);line-height:1.06;letter-spacing:-.01em}
.sub{font-size:15px;line-height:1.5;color:var(--mut)}
.proofline{color:var(--mut)}

.rise{overflow:clip}
.rise>*{transform:translateY(112%);transition:transform .8s var(--ease)}
.is-in .rise>*{transform:translateY(0)}
.fade{opacity:0;transition:opacity .6s var(--ease) .4s}
.is-in .fade{opacity:1}

/* body column */
.col{padding:18px 20px 34px;display:flex;flex-direction:column}

/* mode anchors */
.modes{display:flex;align-items:center;gap:16px;min-height:44px}
.mode{background:none;border:0;cursor:pointer;color:var(--mut);font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;min-height:44px;min-width:44px;padding:0 2px;text-align:left}
.mode .u{display:block;height:1px;background:var(--warm);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.mode.is-on{color:var(--cream)}
.mode.is-on .u{transform:scaleX(1)}
.sep{color:var(--line)}

/* chip window: push-swap by mode */
.chipwin{overflow:clip;height:48px;margin-top:6px}
.chipstrip{display:grid;grid-template-rows:48px 48px;transition:transform .7s var(--ease)}
.m-inv .chipstrip{transform:translateY(-48px)}
.chipslot{display:flex;align-items:center;height:48px}
.chip-line{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;width:100%}
.chip-t{font-size:14px;line-height:1.3;flex:1}
.chip-x{width:44px;height:44px;flex:none;background:none;border:0;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.chip-x svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5}
.chip-empty a{color:var(--cream);font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--warm);display:inline-flex;align-items:center;min-height:44px}

/* underline fields */
.fld{position:relative;padding-top:18px}
.fld input{width:100%;background:transparent;border:0;outline:0;color:var(--cream);font-size:17px;font-family:inherit;line-height:1.3;padding:10px 0 12px;border-radius:0}
.fld input::placeholder{color:transparent}
.fld:focus-within input::placeholder{color:rgba(239,232,218,.4)}
.fld label{position:absolute;left:0;bottom:15px;font-size:16px;color:var(--mut);pointer-events:none;transform-origin:left bottom;transition:transform .35s var(--ease)}
.fld:focus-within label,.fld.has-val label{transform:translateY(-28px) scale(.7)}
.uline{position:absolute;left:0;bottom:0;width:100%;height:2px;display:block}
.uline line{fill:none;stroke-width:2}
.l-base{stroke:var(--line);stroke-dasharray:100;stroke-dashoffset:100}
.is-in .l-base{stroke-dashoffset:0;transition:stroke-dashoffset .7s var(--ease);transition-delay:var(--d,0s)}
.l-warm{stroke:var(--warm);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .45s var(--ease)}
.fld:focus-within .l-warm{stroke-dashoffset:0}

.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}

.consent{display:flex;align-items:flex-start;gap:14px;min-height:44px;padding:14px 0 2px;cursor:pointer}
.consent input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:20px;height:20px;flex:none;margin-top:1px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center}
.box svg{width:12px;height:12px;fill:none;stroke:var(--warm);stroke-width:2.2;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--ease)}
.consent input:checked~.box svg{stroke-dashoffset:0}
.consent input:focus-visible~.box{border-color:var(--warm)}
.consent .txt{font-size:12px;line-height:1.5;color:rgba(239,232,218,.78)}

.msgzone{min-height:46px;padding:6px 0 2px}
.msg{font-size:14px;line-height:1.4;color:#e8b483}

/* button with mode label window */
.btn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;
  border:1px solid var(--cream);border-radius:28px;background:transparent;color:var(--cream);cursor:pointer;font-family:inherit}
.btn[disabled]{cursor:default}
.blwin{overflow:clip;height:20px}
.blstrip{display:grid;grid-template-rows:20px 20px 20px;transition:transform .5s var(--ease)}
.blstrip span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;line-height:20px}
.btn-run{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;opacity:0;transition:opacity .3s var(--ease)}
.btn-run rect{fill:none;stroke:var(--warm);stroke-width:2;stroke-dasharray:20 80;stroke-dashoffset:0}
.is-busy .btn-run{opacity:1}
.is-busy .btn-run rect{animation:run 1.2s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}

/* undecided window: swapped by mode */
.underwin{overflow:clip;height:52px;margin-top:10px}
.understrip{display:grid;grid-template-rows:52px 52px;transition:transform .7s var(--ease)}
.m-inv .understrip{transform:translateY(-52px)}
.under{color:rgba(239,232,218,.6);font-size:13px;display:flex;align-items:center;height:52px}

/* success curtain in place over the form column */
.stage{position:relative}
.curtain{position:absolute;inset:-2px;background:var(--deep);border:1px solid rgba(239,232,218,.14);border-radius:14px;
  padding:32px 24px;display:flex;flex-direction:column;justify-content:center;gap:14px;
  clip-path:inset(100% 0 0 0);transition:clip-path .85s cubic-bezier(.33,0,.16,1);pointer-events:none}
.is-done .curtain{clip-path:inset(0 0 0 0);pointer-events:auto}
.ok{width:56px;height:56px}
.ok path,.ok circle{fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.succ-h{font-size:26px;line-height:1.15}
.succ-p{font-size:15px;line-height:1.55;color:var(--mut);
  opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease) .95s,transform .6s var(--ease) .95s}
.is-done .succ-p{opacity:1;transform:none}


@media (prefers-reduced-motion: reduce){
  .rise>*,.is-in .rise>*{transform:none;transition:none}
  .fade,.is-in .fade{opacity:1;transition:none}
  .l-base,.is-in .l-base{stroke-dashoffset:0;transition:none}
  .curtain{transition:none}
  .succ-p,.is-done .succ-p{opacity:1;transform:none;transition:none}
  .voicestrip,.chipstrip,.blstrip,.understrip{transition:none}
  .is-busy .btn-run rect{animation:none}
}
</style>
</head>
<body>

<!--
  PASSPORT · cta-1-mobile "Ключі на столі" · smarts · phone twin of the accepted cta-1.
  Shape: ext-02 top band ~46dvh (title + sub on it, local scrim), below on the deep dark:
  mode anchors, chip window, form. Push-swap windows (voice/chip/button/undecided) identical mechanics.
  No call row: smarts has no phone in the data; the form leads. Nothing fixed or sticky; free page scroll.
  Cascade: title rise .8s + lines .7s (stagger .16s) + fades .6s, done by ~1.1s. Then stillness.
  GA4 contract: cta_view, form_start, form_error, generate_lead.
-->
<div class="phone">
<section id="cta" data-cta-variant="cta-1-mobile" data-cta-mode="residential" data-screen-label="CTA 1 mobile Ключі на столі">
  <div class="band">
    <img src="assets/renders-smarts/ext-02-1920.webp" alt="" loading="eager" decoding="sync">
    <div class="scrim" aria-hidden="true"></div>
    <p class="tag caps">ЖК Агрономічне</p>
    <div class="voicewin">
      <div class="voicestrip">
        <div class="voice" data-voice="residential">
          <div class="rise"><h1 class="serif title">Залиште номер, ми передзвонимо.</h1></div>
          <p class="sub fade">Підкажемо, що вам підходить: <span data-j="n24"></span> чи <span data-j="n27"></span> метрів. Обрану квартиру забронюємо за вами.</p>
        </div>
        <div class="voice" data-voice="invest">
          <h2 class="serif title">Комерція: <span data-j="blocks"></span> блоків, $<span data-j="ppm"></span> за метр.</h2>
          <p class="sub">Залиште номер. Надішлемо площі, ціни і вільні блоки з <span data-j="comm"></span> м².</p>
        </div>
      </div>
    </div>
  </div>

  <div class="col">
    <nav class="modes" aria-label="Голос секції">
      <button type="button" class="mode is-on" data-mode="residential">квартира<i class="u"></i></button>
      <span class="sep" aria-hidden="true">|</span>
      <button type="button" class="mode" data-mode="invest">комерція<i class="u"></i></button>
    </nav>

    <div class="stage">
      <form id="form" novalidate autocomplete="on" style="display:flex;flex-direction:column">
        <div class="chipwin">
          <div class="chipstrip">
            <div class="chipslot" id="chipslot-res"></div>
            <div class="chipslot" id="chipslot-inv"></div>
          </div>
        </div>

        <div class="fld" style="--d:.2s">
          <input id="f-name" name="name" type="text" autocomplete="name" aria-required="true">
          <label for="f-name">Імʼя</label>
          <svg class="uline" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true">
            <line class="l-base" x1="0" y1="1" x2="100" y2="1" pathLength="100"/>
            <line class="l-warm" x1="0" y1="1" x2="100" y2="1" pathLength="100"/>
          </svg>
        </div>
        <div class="fld" style="--d:.36s">
          <input id="f-phone" name="phone" type="tel" inputmode="tel" placeholder="+380 __ ___ __ __" autocomplete="tel" aria-required="true">
          <label for="f-phone">Телефон</label>
          <svg class="uline" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true">
            <line class="l-base" x1="0" y1="1" x2="100" y2="1" pathLength="100"/>
            <line class="l-warm" x1="0" y1="1" x2="100" y2="1" pathLength="100"/>
          </svg>
        </div>

        <p class="hp" aria-hidden="true"><label>Компанія<input type="text" name="company" tabindex="-1" autocomplete="off"></label></p>
        <input type="hidden" name="unit" id="f-unit" value="A2-12">
        <input type="hidden" name="mode" id="f-mode" value="residential">

        <label class="consent">
          <input type="checkbox" id="f-consent">
          <span class="box" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.4 3.4L12 3.6"/></svg></span>
          <span class="txt">Погоджуюсь на обробку даних для звʼязку. Без розсилок.</span>
        </label>

        <div class="msgzone"><p class="msg" id="msg" aria-live="polite" role="status"></p></div>

        <button class="btn" id="btn" type="submit" data-conv="lead">
          <span class="blwin"><span class="blstrip" id="blstrip">
            <span>Передзвоніть мені</span>
            <span>Отримати пропозицію</span>
            <span>Надсилаємо…</span>
          </span></span>
          <svg class="btn-run" viewBox="0 0 390 56" preserveAspectRatio="none" aria-hidden="true">
            <rect x="1" y="1" width="388" height="54" rx="27" pathLength="100"/>
          </svg>
        </button>

        <div class="underwin">
          <div class="understrip">
            <p class="under">Не обрали планування? Так теж можна.</p>
            <p class="under" aria-hidden="true"></p>
          </div>
        </div>
      </form>

      <div class="curtain" id="curtain" role="status" aria-live="polite">
        <svg class="ok" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="ok-path" cx="32" cy="32" r="29"/>
          <path class="ok-path" d="M20 33.5l8.4 8.4L44.5 25"/>
        </svg>
        <h2 class="serif succ-h">Заявка у нас.</h2>
        <p class="succ-p" id="succ-p"></p>
      </div>
    </div>
  </div>

</section>
</div>

<script>
/* Dataset: single source of smarts numbers, runtime join, nothing typed in copy */
const SMARTS = {
  priceUsdPerM2Commercial: 1100,
  commercial: { totalM2: 712, minBlockM2: 100, capitalizationPct: 30,
    blocks: ["C-01","C-02","C-03","C-04","C-05"] },
  types: {
    "smart-24": { label: "Смарт 24 м²", totalM2: 23.76, plan: "assets/plans-smarts/type-24-clean.webp" },
    "smart-27": { label: "Смарт 27 м²", totalM2: 27.06, plan: "assets/plans-smarts/type-27-clean.webp" }
  },
  units: [
    ["A2-01","smart-27"],["A2-02","smart-27"],["A2-03","smart-27"],["A2-04","smart-27"],["A2-05","smart-24"],["A2-06","smart-24"],
    ["A2-07","smart-27"],["A2-08","smart-27"],["A2-09","smart-24"],["A2-10","smart-24"],["A2-11","smart-27"],["A2-12","smart-27"],
    ["A2-13","smart-24"],["A2-14","smart-24"],["A2-15","smart-27"],["A2-16","smart-27"],["A2-17","smart-27"],["A2-18","smart-27"],
    ["A3-01","smart-27"],["A3-02","smart-27"],["A3-03","smart-27"],["A3-04","smart-27"],["A3-05","smart-24"],["A3-06","smart-24"],
    ["A3-07","smart-27"],["A3-08","smart-27"],["A3-09","smart-24"],["A3-10","smart-24"],["A3-11","smart-27"],["A3-12","smart-27"],
    ["A3-13","smart-24"],["A3-14","smart-24"],["A3-15","smart-27"],["A3-16","smart-27"],["A3-17","smart-27"],["A3-18","smart-27"],
    ["Am-01","smart-27"],["Am-02","smart-27"],["Am-03","smart-27"],["Am-04","smart-27"],["Am-05","smart-24"],["Am-06","smart-24"],
    ["Am-07","smart-27"],["Am-08","smart-27"],["Am-09","smart-24"],["Am-10","smart-24"],["Am-11","smart-27"],["Am-12","smart-27"],
    ["Am-13","smart-24"],["Am-14","smart-24"],["Am-15","smart-27"],["Am-16","smart-27"],["Am-17","smart-27"],["Am-18","smart-27"]
  ],
  demoUnit: "A2-12"
};
const fmtM2 = v => String(v).replace(".", ",");
const fmtInt = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const J = {
  n24: Math.round(SMARTS.types["smart-24"].totalM2),
  n27: Math.round(SMARTS.types["smart-27"].totalM2),
  m24: Math.round(SMARTS.types["smart-24"].totalM2),
  m27: Math.round(SMARTS.types["smart-27"].totalM2),
  total: SMARTS.units.length,
  blocks: SMARTS.commercial.blocks.length,
  ppm: fmtInt(SMARTS.priceUsdPerM2Commercial),
  comm: SMARTS.commercial.totalM2,
  cap: SMARTS.commercial.capitalizationPct,
  minb: SMARTS.commercial.minBlockM2
};
document.querySelectorAll("[data-j]").forEach(el => { el.textContent = J[el.dataset.j]; });

const sec = document.getElementById("cta");
const form = document.getElementById("form");
const nameI = document.getElementById("f-name");
const phoneI = document.getElementById("f-phone");
const consentI = document.getElementById("f-consent");
const unitI = document.getElementById("f-unit");
const modeI = document.getElementById("f-mode");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
const blstrip = document.getElementById("blstrip");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- chip contract ---------- */
function chipSmarts(code){
  const t = SMARTS.types[Object.fromEntries(SMARTS.units)[code]];
  const p = document.createElement("p");
  p.className = "chip-line";
  p.innerHTML =
    '<span class="chip-t">Квартира ' + code + ' · ' + fmtM2(t.totalM2) + ' м² · з пікера</span>' +
    '<button type="button" class="chip-x" aria-label="Прибрати вибір"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button>';
  p.querySelector(".chip-x").addEventListener("click", ()=>{ unitI.value=""; renderChipRes(null); });
  return p;
}
function chipEmptyRes(){
  const p = document.createElement("p");
  p.className = "chip-empty";
  p.innerHTML = '<a href="#floorplan-picker" data-conv="pick">Обрати квартиру в пікері</a>';
  return p;
}
function renderChipRes(code){
  document.getElementById("chipslot-res").replaceChildren(code ? chipSmarts(code) : chipEmptyRes());
}
renderChipRes(SMARTS.demoUnit); /* demo: arrival from the picker */
(function(){
  const p = document.createElement("p");
  p.className = "chip-line";
  p.innerHTML = '<span class="chip-t">Комерція · ' + J.comm + ' м² · ' + J.blocks + ' блоків</span>';
  document.getElementById("chipslot-inv").replaceChildren(p);
})();

/* ---------- mode switch: applyMode contract, whole copy block push-swap ---------- */
let mode = "residential";
function applyMode(m){
  mode = m;
  sec.dataset.ctaMode = m;
  modeI.value = m;
  sec.classList.toggle("m-inv", m === "invest");
  if (!btn.classList.contains("is-busy"))
    blstrip.style.transform = m === "invest" ? "translateY(-20px)" : "translateY(0)";
  document.querySelectorAll(".mode").forEach(b => b.classList.toggle("is-on", b.dataset.mode === m));
  msg.textContent = "";
}
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", ()=>applyMode(b.dataset.mode)));

/* ---------- phone mask: synchronous, paste safe ---------- */
function maskPhone(v){
  let d = v.replace(/\D/g, "");
  if (d.startsWith("380")) d = d.slice(3);
  else if (d.startsWith("80")) d = d.slice(2);
  else if (d.startsWith("0")) d = d.slice(1);
  d = d.slice(0, 9);
  let out = "+380";
  for (const n of [2,3,2,2]) { if (!d.length) break; out += " " + d.slice(0, n); d = d.slice(n); }
  return out;
}
phoneI.addEventListener("input", ()=>{ phoneI.value = maskPhone(phoneI.value); syncVal(phoneI); });
phoneI.addEventListener("focus", ()=>{ if (!phoneI.value) { phoneI.value = "+380 "; syncVal(phoneI); } });
phoneI.addEventListener("blur", ()=>{ if (phoneI.value.replace(/\D/g,"") === "380") { phoneI.value = ""; syncVal(phoneI); } });
function syncVal(i){ i.closest(".fld").classList.toggle("has-val", !!i.value); }
[nameI, phoneI].forEach(i => { i.addEventListener("input", ()=>syncVal(i)); i.addEventListener("blur", ()=>syncVal(i)); });

/* GA4: form_start on first field focus {variant:"cta-1-mobile", mode} */
let started = false;
[nameI, phoneI].forEach(i => i.addEventListener("focus", ()=>{ if (!started) { started = true; } }));

/* ---------- honest submit through a Promise ---------- */
function sendDemo(){
  /* demo: append ?fail=1 to the file URL to test the honest error path */
  const fail = new URLSearchParams(location.search).get("fail") === "1";
  return new Promise((res, rej)=>setTimeout(()=>fail ? rej(new Error("network")) : res({ok:true}), 1500));
}
function setBusy(on){
  btn.classList.toggle("is-busy", on);
  btn.disabled = on;
  blstrip.style.transform = on ? "translateY(-40px)" : (mode === "invest" ? "translateY(-20px)" : "translateY(0)");
}
const ERR = {
  fill: "Вкажіть імʼя і телефон.",
  phone: "Перевірте номер: +380 і ще 9 цифр.",
  consent: "Потрібна згода на обробку даних.",
  network: "Не надіслалось. Спробуйте ще раз." /* smarts: no phone published yet, honest retry only */
};
function showErr(kind){ msg.textContent = ERR[kind]; /* GA4: form_error {variant:"cta-1-mobile", kind, mode} */ }
form.addEventListener("submit", e => {
  e.preventDefault();
  if (form.company.value) return; /* honeypot: drop silently */
  const digits = phoneI.value.replace(/\D/g, "");
  if (!nameI.value.trim() || digits.length <= 3) return showErr("fill");
  if (digits.length !== 12) return showErr("phone");
  if (!consentI.checked) return showErr("consent");
  msg.textContent = "";
  setBusy(true);
  sendDemo().then(()=>{ /* GA4: generate_lead {variant:"cta-1-mobile", mode, unit:unitI.value} */ ritual(); })
    .catch(()=>{ setBusy(false); showErr("network"); });
});

/* ---------- success ritual: curtain in place, self-drawing check ---------- */
function ritual(){
  document.getElementById("succ-p").textContent = mode === "invest"
    ? "Надішлемо пропозицію по комерції і передзвонимо у робочий час."
    : "Передзвонимо у робочий час і забронюємо квартиру, якщо обрали.";
  sec.classList.add("is-done");
  const finish = ()=>{
    document.querySelectorAll(".ok-path").forEach((p, i) => {
      const L = p.getTotalLength();
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
      p.getBoundingClientRect();
      if (RM) { p.style.strokeDashoffset = "0"; return; }
      p.style.transition = "stroke-dashoffset .7s cubic-bezier(.33,0,.16,1) " + (i * .3) + "s";
      p.style.strokeDashoffset = "0";
    });
    form.setAttribute("inert", "");
  };
  RM ? finish() : setTimeout(finish, 700);
}

/* entrance: one cascade on arrival, then stillness */
/* GA4: cta_view {variant:"cta-1-mobile", mode} */
function arrive(){ setTimeout(()=>sec.classList.add("is-in"), 60); }
document.readyState === "complete" ? arrive() : addEventListener("load", arrive);
</script>
</body>
</html>
