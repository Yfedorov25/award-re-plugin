<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
PASSPORT · t-2-material-in-hand «Матеріал у руці» · клас A
Граматика: Springs P17 persistent-index + P7 rigid push-swap. Click-driven, без піна.
SIGNATURE MORPH (F-45): FLIP тієї самої ноди. Панель деталі (та сама DOM-нода)
розгортається у великий кадр: first rect -> fixed rect, інверсія transform
(translate + uniform scale, аспект збережено), програш до identity. X згортає назад.

STAGE MAP (click-driven, не скрол):
  tap індексу i  ->  push-swap ПАРИ: сфера їде першою, деталь з лагом 100ms
                     (вгору якщо i > активного, вниз якщо i < активного)
  tap деталі/+   ->  FLIP-розгортання тієї ж ноди у великий кадр + скрім
  X / Esc / скрім -> зворотний FLIP

Анімовані властивості: transform, opacity. Нуль hover-механіки.
Reduced-motion / <=820px: усі три пари розкладаються статичним списком.
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t-2 · Матеріал у руці</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1713; --bg-2:#211D18; --ink:#EDE6D8; --muted:#A2988A; --accent:#AC7E65;
    --hair:rgba(237,230,216,.16); --gutter:56px;
    --serif:'Cormorant',Georgia,serif; --sans:'Golos Text',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{overflow-x:clip;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{display:block}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .meta-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:28px var(--gutter) 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .head{padding:72px var(--gutter) 48px;max-width:900px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,4.6vw,68px);line-height:1.05;text-wrap:balance}

  .stage{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:56px;
    padding:24px var(--gutter) 120px;align-items:stretch}

  /* persistent index */
  .index{display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid var(--hair)}
  .idx-list{display:flex;flex-direction:column}
  .idx{display:flex;align-items:baseline;gap:20px;text-align:left;padding:26px 0;border-bottom:1px solid var(--hair);
    opacity:.35;transition:opacity .35s ease}
  .idx.active{opacity:1}
  .idx .n{font-size:11px;letter-spacing:.16em;color:var(--muted)}
  .idx .w{font-family:var(--serif);font-style:italic;font-weight:400;font-size:52px;line-height:1}
  .fact{min-height:72px;padding-top:28px}
  .fact .in{display:block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    animation:factIn .45s cubic-bezier(.2,.7,.2,1) both}
  html.static .fact .in{animation:none}
  @keyframes factIn{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}

  /* the pair */
  .pair{display:grid;grid-template-columns:1fr .82fr;gap:20px;min-height:0}
  .panel{position:relative;overflow:clip;background:var(--bg-2)}
  .panel .slide{position:absolute;inset:0;transform:translateY(102%);will-change:transform}
  .panel .slide.cur{transform:none}
  .panel .slide img{width:100%;height:100%;object-fit:cover}
  .sphere{aspect-ratio:1/1;align-self:center}
  .detail-slot{position:relative;aspect-ratio:4/5;align-self:center}
  .detail{position:absolute;inset:0;overflow:clip;background:var(--bg-2)}
  .detail.expanded{position:fixed;z-index:40}
  .h-cap{position:absolute;left:16px;bottom:14px;z-index:5;font:500 11px/1 var(--sans);
    letter-spacing:.14em;text-transform:uppercase;color:rgba(237,230,216,.82);
    text-shadow:0 1px 8px rgba(10,8,6,.65);pointer-events:none}

  .expander{position:absolute;top:14px;right:14px;z-index:6;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(237,230,216,.5);display:grid;place-items:center;background:rgba(26,23,19,.35)}
  .expander svg{display:block}
  .detail.expanded .expander .plus{display:none}
  .detail .expander .cross{display:none}
  .detail.expanded .expander .cross{display:block}

  .scrim{position:fixed;inset:0;z-index:30;background:rgba(12,10,8,.72);opacity:0;
    pointer-events:none;transition:opacity .45s ease}
  .scrim.on{opacity:1;pointer-events:auto}

  /* static fallback: три пари списком */
  html.static .stage{grid-template-columns:1fr}
  html.static .pair,html.static .index{display:none}
  .static-list{display:none}
  html.static .static-list{display:grid;gap:64px}
  .static-item{display:grid;grid-template-columns:minmax(280px,380px) 1fr .8fr;gap:24px;align-items:center}
  .static-item .cap{font-family:var(--serif);font-style:italic;font-size:40px;line-height:1.1;margin-bottom:14px}
  .static-item .f{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .static-item figure{position:relative;overflow:clip}
  .static-item img{width:100%;height:auto}

  @media (max-width:820px){
    :root{--gutter:20px}
    .head{padding-top:48px}
    .static-item{grid-template-columns:1fr;gap:14px}
  }
</style>
</head>
<body>
<section data-screen-label="t-2 material in hand">
  <div class="meta-row"><span data-slot="project"></span><span>Клас A · t-2</span></div>
  <header class="head">
    <p class="eyebrow" data-slot="eyebrow"></p>
    <h1 data-slot="title"></h1>
  </header>

  <div class="stage">
    <div class="index">
      <div class="idx-list" id="idxList"></div>
      <div class="fact"><span class="in" id="fact"></span></div>
    </div>
    <div class="pair">
      <div class="panel sphere" id="spherePanel"></div>
      <div class="detail-slot">
        <div class="detail" id="detail" role="button" tabindex="0" aria-label="Розгорнути деталь">
          <button class="expander" aria-hidden="true" tabindex="-1">
            <svg class="plus" width="14" height="14" viewBox="0 0 14 14"><path d="M7 0v14M0 7h14" stroke="#EDE6D8" stroke-width="1.2"/></svg>
            <svg class="cross" width="14" height="14" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="#EDE6D8" stroke-width="1.2"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="static-list" id="staticList"></div>
  </div>
</section>
<div class="scrim" id="scrim"></div>

<script>
/* ═ TEMPLATE CONTRACT ═
   ОБОВʼЯЗКОВІ поля для нового проєкту:
   project.name · section.{eyebrow,title} · materials[2..4]:
   { word (слово індексу), caption «Матеріал · де застосований» (CAPS факт-рядок),
     sphere (квадратний рендер-куля), detail (портретний кадр застосування 4:5),
     honesty (підпис медіа; для чистого рендера одне слово «Візуалізація») }
   ОПЦІЙНІ: немає. alt збирається: sphere -> «{honesty}: {word} зблизька»,
   detail -> «{honesty}: {caption}». */
const DATA = {
  project: { name: 'ЖК Агрономічне' },
  section: { eyebrow: 'Матеріали', title: 'Три матеріали будинку зблизька' },
  materials: [
    { word: 'Цегла',      caption: 'Цегла · несучі стіни будинку',
      sphere: 'assets/macro-smarts/sphere-brick.webp',   detail: 'assets/macro-smarts/detail-brick.webp',
      honesty: 'Візуалізація' },
    { word: 'Фальц',      caption: 'Фальцева покрівля · дах будинку',
      sphere: 'assets/macro-smarts/sphere-falz.webp',    detail: 'assets/macro-smarts/detail-roof.webp',
      honesty: 'Візуалізація' },
    { word: 'Штукатурка', caption: 'Штукатурка · фінішний шар фасаду',
      sphere: 'assets/macro-smarts/sphere-plaster.webp', detail: 'assets/macro-smarts/detail-window.webp',
      honesty: 'Візуалізація' }
  ]
};

const $ = s => document.querySelector(s);
const put = (slot, v) => { const el = document.querySelector(`[data-slot="${slot}"]`); if (el) el.textContent = v; };
put('project', DATA.project.name);
put('eyebrow', DATA.section.eyebrow);
put('title', DATA.section.title);
document.title = 't-2 · ' + DATA.section.title;

const idxList = $('#idxList'), factEl = $('#fact');
const spherePanel = $('#spherePanel'), detail = $('#detail');
const EASE = 'cubic-bezier(.6,0,.2,1)', DUR = 620, LAG = 100;
let active = 0, busy = false;

/* index buttons */
DATA.materials.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'idx' + (i === 0 ? ' active' : '');
  b.setAttribute('aria-pressed', i === 0);
  const n = document.createElement('span'); n.className = 'n'; n.textContent = '0' + (i + 1);
  const w = document.createElement('span'); w.className = 'w'; w.textContent = m.word;
  b.appendChild(n); b.appendChild(w);
  b.addEventListener('click', () => go(i));
  idxList.appendChild(b);
});

const mkSlide = (src, alt, honesty) => {
  const s = document.createElement('div'); s.className = 'slide';
  const img = new Image(); img.src = src; img.alt = alt; img.loading = 'eager';
  const c = document.createElement('span'); c.className = 'h-cap'; c.textContent = honesty;
  s.appendChild(img); s.appendChild(c); return s;
};
const sphereSlide = i => mkSlide(DATA.materials[i].sphere,
  DATA.materials[i].honesty + ': ' + DATA.materials[i].word.toLowerCase() + ' зблизька', DATA.materials[i].honesty);
const detailSlide = i => mkSlide(DATA.materials[i].detail,
  DATA.materials[i].honesty + ': ' + DATA.materials[i].caption.toLowerCase(), DATA.materials[i].honesty);

function setFact(i){
  factEl.classList.remove('in'); void factEl.offsetWidth;
  factEl.textContent = DATA.materials[i].caption; factEl.classList.add('in');
}

/* rigid push-swap of one panel (no clip, no fade) */
function push(panel, slide, dir, delay){
  const old = panel.querySelector('.slide.cur');
  slide.style.transition = 'none';
  slide.style.transform = `translateY(${dir * 102}%)`;
  panel.appendChild(slide);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    slide.style.transition = `transform ${DUR}ms ${EASE} ${delay}ms`;
    old.style.transition = `transform ${DUR}ms ${EASE} ${delay}ms`;
    slide.style.transform = 'translateY(0)';
    old.style.transform = `translateY(${dir * -102}%)`;
    slide.classList.add('cur'); old.classList.remove('cur');
    setTimeout(() => old.remove(), DUR + delay + 60);
  }));
}

function go(i){
  if (busy || i === active) return;
  busy = true;
  const dir = i > active ? 1 : -1;
  push(spherePanel, sphereSlide(i), dir, 0);
  push(detail, detailSlide(i), dir, LAG);         /* друга панель з лагом */
  [...idxList.children].forEach((b, k) => {
    b.classList.toggle('active', k === i); b.setAttribute('aria-pressed', k === i);
  });
  setFact(i);
  active = i;
  setTimeout(() => { busy = false; }, DUR + LAG + 80);
}

/* ── FLIP expand of the SAME node ── */
const scrim = $('#scrim');
const slot = document.querySelector('.detail-slot');
let expanded = false, flipBusy = false;

function flip(open){
  if (flipBusy) return; flipBusy = true;
  const first = detail.getBoundingClientRect();
  const ratio = first.width / first.height;
  if (open) {
    const h = Math.min(innerHeight * .84, 900), w = h * ratio;
    const left = (innerWidth - w) / 2, top = (innerHeight - h) / 2;
    detail.classList.add('expanded');
    Object.assign(detail.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
    const s = first.width / w;
    detail.style.transformOrigin = '0 0';
    detail.style.transition = 'none';
    detail.style.transform = `translate(${first.left - left}px, ${first.top - top}px) scale(${s})`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      detail.style.transition = `transform ${DUR}ms ${EASE}`;
      detail.style.transform = 'none';
    }));
    scrim.classList.add('on');
  } else {
    const target = slot.getBoundingClientRect();
    const cur = detail.getBoundingClientRect();
    const s = target.width / cur.width;
    detail.style.transition = `transform ${DUR}ms ${EASE}`;
    detail.style.transform = `translate(${target.left - cur.left}px, ${target.top - cur.top}px) scale(${s})`;
    scrim.classList.remove('on');
    setTimeout(() => {
      detail.classList.remove('expanded');
      detail.style.cssText = '';
    }, DUR + 30);
  }
  expanded = open;
  setTimeout(() => { flipBusy = false; }, DUR + 60);
}
detail.addEventListener('click', () => flip(!expanded));
detail.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(!expanded); } });
scrim.addEventListener('click', () => expanded && flip(false));
addEventListener('keydown', e => { if (e.key === 'Escape' && expanded) flip(false); });

/* ── static fallback (reduced motion / narrow): всі три пари списком ── */
function buildStatic(){
  const list = $('#staticList');
  list.innerHTML = '';
  DATA.materials.forEach(m => {
    const it = document.createElement('div'); it.className = 'static-item';
    const t = document.createElement('div');
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = m.word;
    const f = document.createElement('div'); f.className = 'f'; f.textContent = m.caption;
    t.appendChild(cap); t.appendChild(f);
    const f1 = document.createElement('figure');
    const i1 = new Image(); i1.src = m.sphere; i1.alt = m.honesty + ': ' + m.word.toLowerCase() + ' зблизька';
    const c1 = document.createElement('span'); c1.className = 'h-cap'; c1.textContent = m.honesty;
    f1.appendChild(i1); f1.appendChild(c1);
    const f2 = document.createElement('figure');
    const i2 = new Image(); i2.src = m.detail; i2.alt = m.honesty + ': ' + m.caption.toLowerCase();
    const c2 = document.createElement('span'); c2.className = 'h-cap'; c2.textContent = m.honesty;
    f2.appendChild(i2); f2.appendChild(c2);
    it.appendChild(t); it.appendChild(f1); it.appendChild(f2);
    list.appendChild(it);
  });
}

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const narrow = matchMedia('(max-width: 820px)');

const decoded = img => Promise.race([
  img.decode().catch(() => {}),
  new Promise(r => { if (img.complete) r(); else img.addEventListener('load', r, { once: true }); }),
  new Promise(r => setTimeout(r, 800))
]);
async function init(){
  if (reduced.matches || narrow.matches) {
    document.documentElement.classList.add('static');
    buildStatic();
    return;
  }
  document.documentElement.classList.remove('static');
  /* DECODE-GUARD: усі сфери й деталі декодуються ДО вмикання перемикача */
  const all = [];
  DATA.materials.forEach(m => { [m.sphere, m.detail].forEach(src => { const i = new Image(); i.src = src; all.push(i); }); });
  await Promise.all(all.map(decoded));
  if (!spherePanel.querySelector('.slide')) {
    const s0 = sphereSlide(0); s0.classList.add('cur'); s0.style.transform = 'none'; spherePanel.appendChild(s0);
    const d0 = detailSlide(0); d0.classList.add('cur'); d0.style.transform = 'none';
    detail.insertBefore(d0, detail.querySelector('.expander'));
    setFact(0);
  }
}
init();
narrow.addEventListener('change', () => init());
reduced.addEventListener('change', () => init());
</script>
</body>
</html>
