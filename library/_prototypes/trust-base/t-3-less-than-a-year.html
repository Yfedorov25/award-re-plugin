<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
PASSPORT · t-3-less-than-a-year «Менше року: одометр» · клас A
Граматика: Springs P15 pinned-stat. Число = герой, стадії тихо проходять ЗА цифрою.
SIGNATURE MORPH (F-45): одометр-рол. Гігантська цифра місяців = digit strip
(0..9, translateY -m*1em), квантована, з write-on-change guard. Стадії позаду
міняються ВУЗЬКИМИ кросфейдами (легально тут: герой = число, не шов).

STAGE MAP (p = прогрес піна, чиста функція скролу):
  p 0.00-0.25  dwell      stage-0 «ділянка», рил 0-2
  p 0.25-0.35  XFADE-1    stage-1 проявляється (вікно 10% p)
  p 0.35-0.58  dwell      stage-1 «каркас», рил крутиться
  p 0.58-0.68  XFADE-2    stage-2 проявляється (вікно 10% p)
  p 0.85       BEAT       рил лягає на «9» + підпис «2 квартал 2027 · ключі»
  p 0.85-1.00  dwell      фінальний кадр тримається

Анімовані властивості: transform (рил), opacity (кросфейди, підписи). Нуль інших.
stage-0 = база opacity:1 назавжди (ZERO-BLANK).
Reduced-motion / <=820px: render(1) статично: готовий будинок, «9 місяців», фінальний підпис.
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t-3 · Менше року</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1713; --ink:#EDE6D8; --muted:#A2988A; --accent:#AC7E65;
    --hair:rgba(237,230,216,.16); --gutter:56px;
    --serif:'Cormorant',Georgia,serif; --sans:'Golos Text',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{overflow-x:clip;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{display:block}

  .meta-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:28px var(--gutter) 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .head{padding:72px var(--gutter) 48px;max-width:980px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,4.6vw,68px);line-height:1.05;text-wrap:balance}

  .pin{height:460vh;position:relative}
  html.static .pin{height:auto}
  .stick{position:sticky;top:0;height:100vh;overflow:clip;background:var(--bg)}
  html.static .stick{position:relative;height:100vh}
  .stages{position:absolute;inset:0}
  .stages img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%}
  .stages img.s1,.stages img.s2{opacity:0}
  .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,13,10,.72),rgba(16,13,10,.18) 45%,rgba(16,13,10,.28));pointer-events:none}
  .h-cap{position:absolute;left:16px;bottom:14px;z-index:5;font:500 11px/1 var(--sans);
    letter-spacing:.14em;text-transform:uppercase;color:rgba(237,230,216,.82);
    text-shadow:0 1px 8px rgba(10,8,6,.65)}

  .stat{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .stat-inner{display:flex;align-items:baseline;gap:3vw}
  .reel{height:1em;overflow:clip;font-family:var(--serif);font-weight:300;font-size:min(36vh,30vw);line-height:1;color:var(--ink)}
  .reel .strip{transition:transform .55s cubic-bezier(.3,0,.2,1);will-change:transform}
  html.static .reel .strip{transition:none}
  .reel .strip span{display:block;height:1em}
  .unit{text-align:left}
  .unit .u{font-family:var(--serif);font-weight:300;font-size:min(9vh,7vw);line-height:1}
  .unit .s{margin-top:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,230,216,.75)}

  .capline{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center}
  .capline .in{display:inline-block;font-family:var(--serif);font-size:30px;font-weight:400;
    animation:capIn .45s cubic-bezier(.2,.7,.2,1) both}
  html.static .capline .in{animation:none}
  @keyframes capIn{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

  @media (max-width:820px){
    :root{--gutter:20px}
    .capline .in{font-size:22px}
  }
</style>
</head>
<body>
<section data-screen-label="t-3 less than a year">
  <div class="meta-row"><span data-slot="project"></span><span>Клас A · t-3</span></div>
  <header class="head">
    <p class="eyebrow" data-slot="eyebrow"></p>
    <h1 data-slot="title"></h1>
  </header>

  <div class="pin" id="pin">
    <div class="stick">
      <div class="stages" id="stages"></div>
      <div class="veil"></div>
      <div class="stat">
        <div class="stat-inner">
          <div class="reel"><div class="strip" id="strip"></div></div>
          <div class="unit">
            <div class="u" id="unitWord"></div>
            <div class="s" data-slot="sub"></div>
          </div>
        </div>
      </div>
      <div class="capline"><span class="in" id="capline"></span></div>
      <span class="h-cap" id="hcap"></span>
    </div>
  </div>
</section>

<script>
/* ═ TEMPLATE CONTRACT ═
   ОБОВʼЯЗКОВІ поля для нового проєкту:
   project.name · section.{eyebrow,title} · stages[3] (frame-matched кадри однієї
   камери: src, caption «дата · стан», honesty «Візуалізація · стан, дата») ·
   finale.caption · odometer.{finalValue, unitForms[3], sub}
   ОПЦІЙНІ: немає. Одна величина на рилі: тільки місяці (закон одометра). */
const DATA = {
  project: { name: 'ЖК Агрономічне' },
  section: { eyebrow: 'Будівництво', title: 'Менше року від старту до ключів' },
  stages: [
    { src: 'assets/build-smarts/build-stage-0.webp', caption: 'Червень 2026 · ділянка',
      honesty: 'Візуалізація · ділянка, червень 2026' },
    { src: 'assets/build-smarts/build-stage-1.webp', caption: 'Осінь 2026 · каркас',
      honesty: 'Візуалізація · каркас, осінь 2026' },
    { src: 'assets/build-smarts/build-stage-2.webp', caption: 'Кінець 2026 · фасади',
      honesty: 'Візуалізація · фасади, кінець 2026' }
  ],
  finale: { caption: '2 квартал 2027 · ключі' },
  odometer: { finalValue: 9, unitForms: ['місяць','місяці','місяців'], sub: 'від старту до ключів' }
};

const $ = s => document.querySelector(s);
const put = (slot, v) => { const el = document.querySelector(`[data-slot="${slot}"]`); if (el) el.textContent = v; };
put('project', DATA.project.name);
put('eyebrow', DATA.section.eyebrow);
put('title', DATA.section.title);
put('sub', DATA.odometer.sub);

const stagesEl = $('#stages');
const stageEls = DATA.stages.map((st, i) => {
  const img = new Image();
  img.src = st.src; img.alt = st.honesty.replace(' · ', ': ');
  img.className = 's' + i; img.loading = 'eager';
  stagesEl.appendChild(img); return img;
});

const strip = $('#strip');
for (let d = 0; d <= 9; d++) { const s = document.createElement('span'); s.textContent = d; strip.appendChild(s); }
const plural = n => DATA.odometer.unitForms[n === 1 ? 0 : (n >= 2 && n <= 4 ? 1 : 2)];

/* ── pure render(p) ── */
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const X1 = [0.25, 0.35], X2 = [0.58, 0.68], BEAT = 0.85;
let lastM = -1, lastCap = -1, lastH = -1;
const capline = $('#capline'), hcap = $('#hcap'), unitWord = $('#unitWord');
const captions = [DATA.stages[0].caption, DATA.stages[1].caption, DATA.stages[2].caption, DATA.finale.caption];

function render(p){
  stageEls[1].style.opacity = seg(p, X1[0], X1[1]);
  stageEls[2].style.opacity = seg(p, X2[0], X2[1]);

  const lp = Math.min(1, p / BEAT);
  const F = DATA.odometer.finalValue;
  const mQ = lp >= 1 ? F : Math.floor(lp * F);   /* квантовано, одна величина на рил */
  if (mQ !== lastM) {
    strip.style.transform = `translateY(${-mQ}em)`;
    unitWord.textContent = plural(mQ);
    lastM = mQ;
  }
  const cap = p >= BEAT ? 3 : p >= X2[1] ? 2 : p >= X1[1] ? 1 : 0;
  if (cap !== lastCap) {
    capline.classList.remove('in'); void capline.offsetWidth;
    capline.textContent = captions[cap]; capline.classList.add('in');
    lastCap = cap;
  }
  const h = p >= X2[0] ? 2 : p >= X1[0] ? 1 : 0;
  if (h !== lastH) { hcap.textContent = DATA.stages[h].honesty; lastH = h; }
}

window.__zeroBlankProbe = function(){
  for (let p = 0; p <= 1.001; p += 0.02) {
    render(p);
    if (getComputedStyle(stageEls[0]).opacity !== '1') return { ok: false, p };
  }
  return { ok: true };
};

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const narrow = matchMedia('(max-width: 820px)');

const decoded = img => Promise.race([
  img.decode().catch(() => {}),
  new Promise(r => { if (img.complete) r(); else img.addEventListener('load', r, { once: true }); }),
  new Promise(r => setTimeout(r, 800))
]);
async function init(){
  /* DECODE-GUARD: стадії декодуються ДО створення тригера */
  await Promise.all(stageEls.map(decoded));

  if (reduced.matches || narrow.matches) {
    document.documentElement.classList.add('static');
    requestAnimationFrame(() => requestAnimationFrame(() => render(1)));
    return;
  }
  document.documentElement.classList.remove('static');

  const pin = $('#pin');
  let start = 0, len = 1;
  const measure = () => { const r = pin.getBoundingClientRect(); start = r.top + scrollY; len = pin.offsetHeight - innerHeight; };
  /* PIN-MEASURE: подвійний rAF після декодування */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    measure(); render(0);
    let raf = null;
    const loop = () => { raf = null; render(Math.min(1, Math.max(0, (scrollY - start) / len))); };
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(loop); }, { passive: true });
    addEventListener('resize', () => { measure(); loop(); });
    loop();
  }));
}
init();
narrow.addEventListener('change', () => init());
reduced.addEventListener('change', () => init());
</script>
</body>
</html>
