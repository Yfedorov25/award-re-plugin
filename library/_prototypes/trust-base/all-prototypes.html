<!DOCTYPE html>
<!-- all-prototypes.html - TRUST base gallery: dark rail + iframe stage. Zero em/en-dash. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRUST - база секції: 6 темплейтів</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#15181C;--ink:#EAE4D8;--sub:#828B93;--gold:#C8A06A}
  html,body{height:100%}
  body{font-family:"Jost",sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:minmax(300px,380px) 1fr;-webkit-font-smoothing:antialiased}
  .rail{border-right:1px solid rgba(234,228,216,.14);display:flex;flex-direction:column;overflow-y:auto}
  .railhead{padding:30px 26px 22px;border-bottom:1px solid rgba(234,228,216,.14)}
  .railhead .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  .railhead h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:26px;margin-top:10px;letter-spacing:-.01em}
  .railhead p{font-size:12px;color:var(--sub);margin-top:8px;font-weight:300;line-height:1.6}
  .grouphead{padding:16px 26px 8px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .item{display:flex;align-items:baseline;gap:14px;padding:17px 26px;border-bottom:1px solid rgba(234,228,216,.08);cursor:pointer;background:none;border-left:2px solid transparent;text-align:left;color:var(--ink);width:100%;border-top:0;border-right:0;font-family:"Jost",sans-serif;transition:background .3s,border-color .3s}
  .item:hover{background:rgba(234,228,216,.05)}
  .item.on{background:rgba(234,228,216,.07);border-left-color:var(--gold)}
  .item .no{font-family:"Cormorant Garamond",serif;font-size:21px;color:var(--gold);min-width:40px;font-variant-numeric:tabular-nums}
  .item .tt{font-size:14px;letter-spacing:.02em}
  .item .arch{display:block;font-size:11px;color:var(--sub);margin-top:4px;font-weight:300}
  .stage{position:relative}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#1A1713}
  .openlink{position:absolute;right:18px;top:14px;z-index:5;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:rgba(21,24,28,.75);border:1px solid rgba(234,228,216,.25);border-radius:30px;padding:9px 15px;text-decoration:none}
  .openlink:hover{background:rgba(21,24,28,.95)}
</style>
</head>
<body>
<aside class="rail">
  <div class="railhead">
    <div class="k">Trust · База секції</div>
    <h1>6 темплейтів доказу</h1>
    <p>Config-driven: дані = приклад, re-skin = заміна DATA. Клас A: повний фактаж. Клас B: чесність без дат.</p>
  </div>
  <nav id="list"></nav>
</aside>
<main class="stage">
  <a class="openlink" id="openlink" href="t-1-keys-road.html" target="_blank" rel="noopener">Відкрити окремо</a>
  <iframe id="frame" src="t-1-keys-road.html" title="Прототип"></iframe>
</main>
<script>
(function(){
  var P = [
    { group: 'Клас A · повний фактаж (демо: ЖК Агрономічне)' },
    { f: 't-1-keys-road.html', t: 'Шлях до ключів', a: 'пін · clip-wipe стадій · одометр місяців · віхи', no: 't-1' },
    { f: 't-2-material-in-hand.html', t: 'Матеріал у руці', a: 'індекс · push-swap пар · FLIP деталі', no: 't-2' },
    { f: 't-3-less-than-a-year.html', t: 'Менше року', a: 'число-герой · стадії за цифрою', no: 't-3' },
    { f: 't-4-technical-sheet.html', t: 'Технічний аркуш', a: 'palette-invert · self-draw сітки', no: 't-4' },
    { group: 'Клас B · обмежений фактаж (демо: вул. Замкова)' },
    { f: 't-5-honest-inventory.html', t: 'Чесна інвентаризація', a: 'факт-CAPS · hairline self-draw', no: 't-5' },
    { f: 't-6-six-of-six.html', t: 'Шість із шести', a: 'антискарсіті · status-write тапи', no: 't-6' }
  ];
  var list = document.getElementById('list');
  var frame = document.getElementById('frame');
  var open = document.getElementById('openlink');
  var first = true;
  P.forEach(function(p){
    if (p.group){
      var g = document.createElement('div');
      g.className = 'grouphead';
      g.textContent = p.group;
      list.appendChild(g);
      return;
    }
    var b = document.createElement('button');
    b.className = 'item' + (first ? ' on' : '');
    first = false;
    b.type = 'button';
    b.innerHTML = '<span class="no">' + p.no + '</span><span><span class="tt">' + p.t + '</span><span class="arch">' + p.a + '</span></span>';
    b.addEventListener('click', function(){
      [].slice.call(list.querySelectorAll('.item')).forEach(function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      frame.src = p.f;
      open.href = p.f;
    });
    list.appendChild(b);
  });
})();
</script>
</body>
</html>
