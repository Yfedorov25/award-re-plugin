<title>location v4 · Зум до дверей</title>
<!--
  COMPOSITION PASSPORT · v4 «Зум до дверей» · ROUND 3 (3 фікси L4, лишається zoom-drill, БЕЗ авто)
  (a) АРХЕТИП: v4 рівень зуму (Part E, OSM-реалізм A) — керований zoom-drill, layer-swap
  (b) МЕДІА-МОВА: OSM-реалізм (рівень 1 = locmap-engine; рівні 2-3 = ті САМІ реальні дані,
      вирізані й перемальовані світлими шарами — НЕ scale-dive, НЕ форк движка)
  (c) КАДР: full-bleed сцена + драфтинг-рамка coords-corner-frame + рейка рівнів
  (d) ДРАЙВЕР × payoff: РІВЕНЬ ЗУМУ (район → вулиця → ділянка) → кожен рівень несе СВІЙ
      контент: район=POI+часи · вулиця=в'їзд+сусіди · ділянка=22,5 сотки dimension-line
  (e) ВЗАЄМОДІЯ: zoom-drill (клік рейки або кнопки «ближче/далі»)
  АКТИ = РІВНІ: морф між актами = кругова маска росте ВІД якоря (site), справжній layer-swap,
  НЕ crossfade і НЕ transform-scale карти (урок F-19). Масштабна лінійка чесно міняється.
  ASSET-TRUTH: рівень 2 = реальні дороги/будівлі в радіусі 300 м; рівень 3 = реальна ділянка
  45×50 м (22,5 сотки) на вул. Замковій. Нуль вигаданого.
  pin-LESS: SectionHarness.declare({ pinOwner:'none', expectPins:0 }) — zoom-drill виняток без піна.
  ROUND 3 (L4, 3 фікси): (1) dock/h2 pointer-events:none, інтерактивні діти auto (h2 перехоплював тапи);
  (2) safe-frame fit-to-content viewBox + meet -> 0 POI за кадром на 984x588 і 390x844; (3) on-map name-pill (назва+хв) +
  44px hit ЗАВЖДИ (не лише coarse) на кожному POI. Жодного авто-розширення (це вісь zoom-drill, L6).
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
/* LOCMAP-ENGINE · component.css
   Award-grade location map styling, harvested 1:1 from apps/smarts location + apps/quadro infra.
   SVG fill/stroke/opacity + transform/stroke-dashoffset only. NO WebGL. Tokenised so any palette drops in. */

:root {
  --lm-ink: #f3f1ec;          /* map foreground (cream) */
  --lm-bg-1: #161410;         /* map field gradient inner */
  --lm-bg-2: #0b0a08;         /* map field gradient outer + road casing */
  --lm-accent: #b06a4f;       /* brick — the property + active state */
  --lm-accent-soft: #c98a72;
  --lm-lit: 236,178,118;      /* warm lit-window rgb */
}

.lm__stage { position: relative; overflow: clip;
  background: radial-gradient(120% 100% at 40% 30%, var(--lm-bg-1), var(--lm-bg-2)); }
.lm__map { width: 100%; height: 100%; display: block; }

/* green / water */
.lm-gw--green { fill: rgba(140,170,130,0.05); }
.lm-gw--water { fill: rgba(120,150,190,0.07); }

/* buildings + deterministic lit windows (nocturnal life) */
.lm-bld { fill: rgba(243,241,236,0.04); stroke: rgba(243,241,236,0.04); stroke-width: 0.7; }
.lm-bld--lit { fill: rgba(var(--lm-lit),0.22); stroke: rgba(var(--lm-lit),0.18); animation: lmFlick 5.5s ease-in-out infinite; }
.lm-bld--lit:nth-child(3n) { animation-delay: 1.8s; }
.lm-bld--lit:nth-child(5n) { animation-delay: 3.2s; }

/* road hierarchy — casing (under) + stroke (over), dual width per rank */
.lm-rdc { fill: none; stroke: var(--lm-bg-2); stroke-linecap: round; stroke-linejoin: round; }
.lm-rd  { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lm-rd--hwy   { stroke: rgba(243,241,236,0.4);  stroke-width: 7; }   .lm-rdc--hwy   { stroke-width: 11; }
.lm-rd--main  { stroke: rgba(201,138,114,0.65); stroke-width: 5; }   .lm-rdc--main  { stroke-width: 9; }
.lm-rd--mid   { stroke: rgba(243,241,236,0.2);  stroke-width: 3.4; } .lm-rdc--mid   { stroke-width: 6; }
.lm-rd--minor { stroke: rgba(243,241,236,0.13); stroke-width: 2.2; } .lm-rdc--minor { stroke-width: 4; }
.lm-rd--faint { stroke: rgba(243,241,236,0.05); stroke-width: 1.2; } .lm-rdc--faint { display: none; }
.lm-rdname { fill: rgba(243,241,236,0.4); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }

/* property parcel + dual pulse + tag */
.lm-parcel { fill: url(#lmHatch); stroke: var(--lm-accent-soft); stroke-width: 1.6; }
.lm-pulse  { fill: none; stroke: var(--lm-accent-soft); stroke-width: 1.3; opacity: 0; }
.lm.is-born .lm-pulse { animation: lmPulse 3s cubic-bezier(0.25,0.46,0.45,0.94) infinite; }
.lm.is-born .lm-pulse--2 { animation-delay: 1.5s; }
.lm-sitetag { fill: var(--lm-ink); font-size: 12.5px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }

/* walking ring */
.lm-ring  { fill: none; stroke: rgba(243,241,236,0.22); stroke-width: 1.2; stroke-dasharray: 5 7; }
.lm-ringt { fill: rgba(243,241,236,0.45); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* numbered POIs */
.lm-pt { cursor: pointer; }
.lm-pt .lm-hit { fill: transparent; stroke: none; }   /* 44px coarse tap zone */
.lm-pt circle { fill: #1d1813; stroke: rgba(201,138,114,0.8); stroke-width: 1.4; transition: fill 0.3s, stroke 0.3s; }
.lm-pt text { fill: var(--lm-ink); font-size: 11.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lm-ptname { fill: var(--lm-ink); font: 600 11px 'Inter', sans-serif; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: rgba(11,10,8,.92); stroke-width: 3px; pointer-events: none; }
.lm-pt:hover circle, .lm-pt.is-on circle { fill: var(--lm-accent); stroke: var(--lm-ink); }
.lm-pt.is-dim { opacity: 0.3; }

/* Dijkstra route + walker + live timer */
.lm-route  { fill: none; stroke: var(--lm-accent-soft); stroke-width: 3.2; stroke-dasharray: 8 8; }
.lm-walker { fill: var(--lm-ink); stroke: var(--lm-accent); stroke-width: 2; }
.lm-livet  { fill: var(--lm-ink); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.lm-livebg { fill: rgba(16,19,26,0.85); stroke: rgba(201,138,114,0.5); stroke-width: 1; }

/* INFRA mode (quadro): category pins + centroid cluster badge */
.lm-infra { fill: rgba(243,241,236,0.5); }
.lm-cluster__bg { fill: var(--lm-accent); }
.lm-cluster__n  { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }

/* side list (host markup) */
.lm-row { display: grid; grid-template-columns: 2.4ch 1fr auto; gap: 0.8rem; align-items: baseline;
  padding: 0.7rem 0; border-bottom: 1px solid rgba(243,241,236,0.08); cursor: pointer; color: var(--lm-ink); }
.lm-row .n { color: var(--lm-accent-soft); font-variant-numeric: tabular-nums; }
.lm-row .nm { font-weight: 500; }
.lm-row .tm { font-size: 0.8rem; opacity: 0.65; font-variant-numeric: tabular-nums; }
.lm-row:hover, .lm-row.is-on { background: rgba(243,241,236,0.04); }
.lm-row.is-on .n { color: var(--lm-accent); }

@keyframes lmFlick { 0%,100% { opacity: 0.5; } 45% { opacity: 1; } 70% { opacity: 0.65; } }
@keyframes lmPulse { 0% { transform: scale(0.5); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .lm-bld--lit, .lm.is-born .lm-pulse { animation: none; }
}

</style>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #100e0b; font-family: 'Inter', system-ui, sans-serif; }
  .combo-pre, .combo-post { height: 60vh; display: grid; place-items: center;
    background: #100e0b; color: rgba(243,241,236,.4);
    font: 500 .72rem/1 'Inter', sans-serif; letter-spacing: .22em; text-transform: uppercase; }
  :root { --cream: #f3f1ec; --brick: #b06a4f; --soft: #c98a72;
    --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --ease-house: cubic-bezier(.25,.74,.22,.99); }

  #combo { position: relative; height: 100vh; min-height: 640px; overflow: clip; background: #0b0a08; }

  /* ---- three LAYERS, hard-swapped by a circular mask growing FROM the site anchor ---- */
  .v4__layer { position: absolute; inset: 0; visibility: hidden; }
  .v4__layer.is-live { visibility: visible; }
  .v4__layer--0 {
    --lm-accent: #b06a4f; --lm-accent-soft: #c98a72; --lm-ink: #f3f1ec;
    background:
      radial-gradient(125% 95% at 55% 40%, rgba(34,28,20,0), rgba(11,10,8,.92) 80%),
      radial-gradient(120% 100% at 55% 42%, #1a160f, #0b0a08); }
  .v4__layer--0 .lm__map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .v4__layer--1 { background: radial-gradient(120% 100% at 50% 45%, #221c13, #0f0d09); }
  .v4__layer--2 { background: radial-gradient(120% 100% at 50% 45%, #2a2214, #14100a); }
  .v4__layer svg.v4-scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* street + plot scene inks */
  .v4-rd { fill: none; stroke: rgba(243,241,236,.3); stroke-linecap: round; stroke-linejoin: round; }
  .v4-rd--zamkova { stroke: rgba(201,138,114,.85); }
  .v4-bld { fill: rgba(243,241,236,.06); stroke: rgba(243,241,236,.12); stroke-width: .35; }
  .v4-bld--near { fill: rgba(236,178,118,.14); stroke: rgba(236,178,118,.25); }
  .v4-parcel { fill: url(#v4Hatch); stroke: var(--soft); stroke-width: .8; }
  .v4-rdname { fill: rgba(243,241,236,.55); font: 500 5px var(--sans); letter-spacing: .1em; text-transform: uppercase; }
  .v4-tag { fill: var(--cream); font: 600 6px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .v4-note { fill: rgba(243,241,236,.5); font: 500 4.6px var(--sans); letter-spacing: .06em; }
  .v4-dim { stroke: var(--soft); stroke-width: .5; }
  .v4-dimt { fill: var(--soft); font: 600 6.5px var(--sans); letter-spacing: .1em; }
  .v4-entry { fill: none; stroke: var(--soft); stroke-width: .9; stroke-dasharray: 2.4 2.2; marker-end: url(#v4Arrow); }
  .v4-sitedot { fill: var(--brick); stroke: var(--cream); stroke-width: .7; }
  .v4-poi-min { fill: var(--cream); font: 600 11px var(--sans); }

  /* plot scene (viewBox 0 0 200 125, метри ×2) */
  .v4-plot { fill: url(#v4Hatch2); stroke: var(--soft); stroke-width: 1; }
  .v4-plott { fill: var(--cream); font-family: var(--serif); font-weight: 300; font-size: 11.5px; letter-spacing: -.02em; }
  .v4-plotsub { fill: rgba(243,241,236,.6); font: 500 4.6px var(--sans); letter-spacing: .16em; text-transform: uppercase; }

  /* ---- coords-corner-frame chrome (draughting plate) ---- */
  .v4__frame { position: absolute; inset: clamp(14px,2.4vw,30px); pointer-events: none; z-index: 7; }
  .v4__tick { position: absolute; width: 22px; height: 22px; }
  .v4__tick::before, .v4__tick::after { content: ''; position: absolute; background: rgba(243,241,236,.4); }
  .v4__tick::before { width: 100%; height: 1px; } .v4__tick::after { width: 1px; height: 100%; }
  .v4__tick--tl { top: 0; left: 0; } .v4__tick--tl::before { top: 0; } .v4__tick--tl::after { left: 0; }
  .v4__tick--tr { top: 0; right: 0; } .v4__tick--tr::before { top: 0; } .v4__tick--tr::after { right: 0; }
  .v4__tick--bl { bottom: 0; left: 0; } .v4__tick--bl::before { bottom: 0; } .v4__tick--bl::after { left: 0; }
  .v4__tick--br { bottom: 0; right: 0; } .v4__tick--br::before { bottom: 0; } .v4__tick--br::after { right: 0; }
  .v4__coords { position: absolute; top: 4px; right: 34px; font: 500 .62rem/1.5 var(--sans);
    letter-spacing: .14em; color: rgba(243,241,236,.45); text-align: right; text-transform: uppercase; }
  .v4__scale { position: absolute; bottom: 2px; right: 34px; display: flex; align-items: baseline; gap: .5rem;
    font: 500 .62rem/1 var(--sans); letter-spacing: .1em; color: rgba(243,241,236,.5); }
  .v4__scalebar { width: 90px; height: 5px; border: 1px solid rgba(243,241,236,.45); border-top: none; }
  .v4__north { position: absolute; top: 0; left: 34px; font: 500 .68rem/1 var(--sans); color: rgba(243,241,236,.5); }

  /* ---- dock: heading + level rail ---- */
  /* L4 fix 1: the dock over the map must NOT intercept POI taps (v4 bug: h2.v4__title ate taps).
     Container is click-through; only the interactive rail children opt back in. */
  .v4__dock { position: absolute; z-index: 9; left: clamp(24px,4.5vw,68px); bottom: clamp(26px,6vh,60px);
    width: min(40ch, 40vw); pointer-events: none; }
  .v4__rail, .v4__lvl, .v4__go { pointer-events: auto; }
  .v4__eyebrow { font: 600 .68rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(243,241,236,.62); margin-bottom: .5rem; text-shadow: 0 1px 16px rgba(0,0,0,.55); }
  .v4__title { font-family: var(--serif); font-weight: 300; font-size: clamp(1.9rem,3.2vw,2.9rem);
    line-height: 1; letter-spacing: -.03em; color: var(--cream); text-shadow: 0 2px 26px rgba(0,0,0,.6); margin-bottom: .55rem; }
  /* level caption: push-swap window */
  .v4__cap { overflow: hidden; height: 1.55em; position: relative; margin-bottom: 1rem;
    font: 500 .86rem/1.55 var(--sans); color: rgba(243,241,236,.72); text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  .v4__cap span { display: block; }

  .v4__rail { display: flex; align-items: center; gap: .6rem; }
  .v4__lvl { appearance: none; border: 1px solid rgba(243,241,236,.22); background: rgba(16,14,11,.55);
    color: rgba(243,241,236,.75); font: 500 .74rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    padding: .55rem .85rem; border-radius: 3px; cursor: pointer;
    transition: background .35s var(--ease-house), color .35s, border-color .35s; }
  .v4__lvl:hover { border-color: rgba(201,138,114,.7); }
  .v4__lvl.is-on { background: var(--brick); border-color: var(--brick); color: #fff; }
  .v4__sep { width: 18px; height: 1px; background: rgba(243,241,236,.25); }
  .v4__go { appearance: none; border: 1px solid rgba(201,138,114,.55); background: none; border-radius: 999px;
    color: var(--soft); font: 600 .74rem/1 var(--sans); letter-spacing: .06em;
    padding: .55rem .95rem; cursor: pointer; transition: background .3s, color .3s; }
  .v4__go:hover { background: var(--brick); color: #fff; border-color: var(--brick); }

  .v4__label { position: absolute; z-index: 8; top: clamp(24px,5vh,56px); left: 50%; transform: translateX(-50%);
    font: 600 .64rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase;
    color: rgba(243,241,236,.5); text-shadow: 0 1px 14px rgba(0,0,0,.5); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { .v4__lvl { transition: none; } }
</style>
</head>
<body>

  <section id="combo" data-combo="location--v4-zoom-drill" data-lvl="0" data-screen-label="v4 Зум до дверей">

    <!-- РІВЕНЬ 0 · РАЙОН: справжня карта (locmap-engine) -->
    <div class="v4__layer v4__layer--0 lm is-live" data-layer="0" data-lm-stage data-render-surface></div>

    <!-- РІВЕНЬ 1 · ВУЛИЦЯ: реальні дороги/будівлі в радіусі ~300 м, перемальовані світло -->
    <div class="v4__layer v4__layer--1" data-layer="1"></div>

    <!-- РІВЕНЬ 2 · ДІЛЯНКА: 45 × 50 м, 22,5 сотки, dimension lines -->
    <div class="v4__layer v4__layer--2" data-layer="2"></div>

    <!-- hidden engine list so the 9-gate reveal's .lm-row selector resolves (clean console) -->
    <div data-lm-list style="display:none" aria-hidden="true"></div>

    <p class="v4__label">с. Агрономічне · за даними OpenStreetMap</p>

    <!-- draughting plate -->
    <div class="v4__frame">
      <span class="v4__tick v4__tick--tl"></span><span class="v4__tick v4__tick--tr"></span>
      <span class="v4__tick v4__tick--bl"></span><span class="v4__tick v4__tick--br"></span>
      <p class="v4__coords">49.18° Пн · 28.33° Сх<br/><span data-sheet>Аркуш 1 · Район</span></p>
      <p class="v4__north">Пн ↑</p>
      <div class="v4__scale"><span class="v4__scalebar"></span><span data-scale>500 м</span></div>
    </div>

    <div class="v4__dock">
      <p class="v4__eyebrow">Локація</p>
      <h2 class="v4__title">Район, вулиця, ділянка.</h2>
      <div class="v4__cap"><span data-cap>Три кроки: район з обʼєктами, вулиця Замкова, ваші 22,5 сотки.</span></div>
      <div class="v4__rail" role="tablist" aria-label="Рівень наближення">
        <button class="v4__lvl is-on" data-go="0">Район</button>
        <button class="v4__lvl" data-go="1">Вулиця</button>
        <button class="v4__lvl" data-go="2">Ділянка</button>
        <span class="v4__sep"></span>
        <button class="v4__go" data-closer>Ближче ↓</button>
      </div>
    </div>

      gsap.to(o, { t: 1, duration: D, ease: 'power1.inOut',
        onUpdate: function () {
          var pt = route.getPointAtLength(o.t * len);
          walker.setAttribute('cx', pt.x); walker.setAttribute('cy', pt.y);
          liveBg.setAttribute('x', pt.x + 10); liveBg.setAttribute('y', pt.y - 12);

    // ---- interactions: dual-axis hover + click + bg-clear ----
    host.appendChild ? null : null;
    host.addEventListener('click', function (e) {
      var tgt = e.target.closest('.lm-pt,.lm-row');
      if (tgt) { select(tgt.dataset.id); return; }
      if (e.target.closest('.lm__map')) clearSel();
    });
    function hover(id, on) { host.querySelectorAll('[data-id="' + id + '"]').forEach(function (e) { e.classList.toggle('is-on', on || cur === id); }); }
    host.querySelectorAll('.lm-row,.lm-pt').forEach(function (e) {
      e.addEventListener('mouseenter', function () { hover(e.dataset.id, true); });
      e.addEventListener('mouseleave', function () { hover(e.dataset.id, false); });

    // ---- mode switch ----
    var mode = 'loc';
    function setMode(m) {
      mode = m;
      host.setAttribute('data-lm-mode', m);
      if (m === 'infra') { clearSel(); renderInfra(curCat || (data.infra && Object.keys(data.infra)[0])); }

    function setCat(cat) { curCat = cat; if (mode === 'infra') renderInfra(cat); }

      gsap.set('.lm-rd,.lm-rdc', { opacity: 0 });
      drawRoads.forEach(function (o) { var l = o.p.getTotalLength(); gsap.set(o.p, { strokeDasharray: l, strokeDashoffset: l, opacity: 1 }); });
      gsap.set(ring, { opacity: 0 });
      gsap.set(gSite, { opacity: 0, scale: 0.7, transformOrigin: S.x + 'px ' + S.y + 'px' });
      gsap.set('.lm-pt', { opacity: 0, scale: 0.4, transformOrigin: 'center' });
      gsap.set('.lm-row', { opacity: 0 });

      global.ScrollTrigger.create({
        trigger: host, start: opt.reveal.start || 'top 58%', once: opt.reveal.once !== false,
        onEnter: function () {
          var tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });
          tl.to(gGreen, { opacity: 1, duration: 0.9 }, 0.1)                                                   // 1 green
            .to(gBld, { opacity: 1, duration: 1.2 }, 0.3)                                                     // 2 buildings
            .to('.lm-rd--mid,.lm-rd--minor,.lm-rd--faint,.lm-rdc--mid,.lm-rdc--minor', { opacity: 1, duration: 1.0 }, 0.5) // 3 small roads
            .add(function () { drawRoads.forEach(function (o, k) { gsap.to(o.p, { strokeDashoffset: 0, duration: o.cls === 'hwy' ? 1.4 : 1.1, delay: k * 0.12, ease: 'power2.inOut' }); }); }, 0.7) // 4 big roads draw
            .to('.lm-rdc--hwy,.lm-rdc--main', { opacity: 1, duration: 0.4 }, 0.7)                             // 5 big casing
            .to(gNames, { opacity: 1, duration: 0.7 }, 1.7)                                                   // 6 names
            .to(ring, { opacity: 1, duration: 0.9 }, 2.0)                                                     // 7 ring
            .to(gSite, { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 2.2)                      // 8 site
            .call(function () { host.classList.add('is-born'); })

            .to('.lm-row', { opacity: 1, duration: 0.5, stagger: 0.07 }, 2.5);

      // asymmetric parallax
      var P = opt.parallax;
      function lp(g, f) { if (!f) return; gsap.fromTo(g, { yPercent: -f }, { yPercent: f, ease: 'none', scrollTrigger: { trigger: host, start: 'top bottom', end: 'bottom top', scrub: true } }); }

  <script>
  (function () {
    'use strict';
    var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    SectionHarness.boot();
    var NSVG = 'http://www.w3.org/2000/svg';
    var OSM = window.OSM, S = OSM.site;
    var combo = document.getElementById('combo');

    /* ---- РІВЕНЬ 0: the real district map (engine, NOT forked) ---- */
    var map;
    SectionHarness.ranOK('locmap-engine', function () {
      map = window.LocMap.create('#combo', {
        data: Object.assign({}, OSM, { viewBox: '300 -36 806 720', site: Object.assign({}, S, { tag: 'вул. Замкова' }) }),   /* L4 fix 2: fit-to-content viewBox (site + 6 POIs + routes + 10-min ring) */
        mScale: 2.6, walkMin: 10, modes: ['loc'], route: true,
        reveal: { start: 'top 70%', once: true },
        parallax: { green: 0, buildings: 0, pins: 0 },   /* clean swap: no parallax under the drill */
        ease: 'award'
      });
      window.__v4Map = map;
    });

    function el(tag, attrs, parent) {
      var e = document.createElementNS(NSVG, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e); return e;
    }

    /* ---- РІВЕНЬ 1: the STREET scene from the SAME real data, cropped ±150 units (~390 м) ---- */
    SectionHarness.ranOK('street-crop-scene', function () {
      var B = { x0: S.x - 190, y0: S.y - 120, x1: S.x + 190, y1: S.y + 120 };
      var svg = el('svg', { class: 'v4-scene', viewBox: B.x0 + ' ' + B.y0 + ' 380 240', preserveAspectRatio: 'xMidYMid slice' },
        document.querySelector('[data-layer="1"]'));
      var defs = el('defs', {}, svg);
      var h = el('pattern', { id: 'v4Hatch', width: 4, height: 4, patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse' }, defs);
      el('rect', { width: 4, height: 4, fill: 'rgba(176,106,79,.22)' }, h);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 4, stroke: 'rgba(201,138,114,.8)', 'stroke-width': 1 }, h);
      var m = el('marker', { id: 'v4Arrow', viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M0 0 L10 5 L0 10 Z', fill: 'rgba(201,138,114,.9)' }, m);
      function inBox(x, y) { return x > B.x0 - 30 && x < B.x1 + 30 && y > B.y0 - 30 && y < B.y1 + 30; }
      /* real roads clipped to the box */
      OSM.roads.forEach(function (r) {
        if (!r.pts.some(function (p) { return inBox(p[0], p[1]); })) return;
        var w = { hwy: 5, main: 4, mid: 3, minor: 2.2, faint: 1.2 }[r.cls] || 1.2;
        var isZ = r.name === 'вулиця Замкова';
        el('polyline', { points: r.pts.map(function (p) { return p.join(','); }).join(' '),
          class: 'v4-rd' + (isZ ? ' v4-rd--zamkova' : ''), 'stroke-width': isZ ? w + 1 : w, opacity: isZ ? 1 : .55 }, svg);
      });
      /* real buildings in the box; near neighbours warm-lit */
      OSM.buildings.forEach(function (d) {
        var mm = /M(-?[\d.]+) (-?[\d.]+)/.exec(d); if (!mm) return;
        var bx = +mm[1], by = +mm[2];
        if (!inBox(bx, by)) return;
        var near = Math.hypot(bx - S.x, by - S.y) < 70;
        el('path', { d: d, class: 'v4-bld' + (near ? ' v4-bld--near' : '') }, svg);
      });
      /* street names in the box */
      (OSM.names || []).forEach(function (n) {
        if (!inBox(n.x, n.y)) return;
        el('text', { x: n.x, y: n.y, class: 'v4-rdname', transform: n.a ? 'rotate(' + n.a + ' ' + n.x + ' ' + n.y + ')' : null }, svg).textContent = n.n;
      });
      /* the parcel + entry from Замкова + notes */
      el('path', { d: 'M' + (S.x - 15) + ' ' + (S.y - 9) + ' L' + (S.x + 9) + ' ' + (S.y - 14) + ' L' + (S.x + 14) + ' ' + (S.y + 7) + ' L' + (S.x - 9) + ' ' + (S.y + 13) + ' Z', class: 'v4-parcel' }, svg);
      el('path', { d: 'M' + (S.x - 52) + ' ' + (S.y + 34) + ' Q ' + (S.x - 26) + ' ' + (S.y + 26) + ' ' + (S.x - 13) + ' ' + (S.y + 9), class: 'v4-entry' }, svg);
      el('text', { x: S.x - 58, y: S.y + 44, class: 'v4-note' }, svg).textContent = 'в’їзд з вул. Замкової';
      el('text', { x: S.x, y: S.y - 20, class: 'v4-tag', 'text-anchor': 'middle' }, svg).textContent = 'Ваша ділянка';
      el('text', { x: S.x + 24, y: S.y + 26, class: 'v4-note' }, svg).textContent = 'сусіди: приватні будинки';
    });

    /* ---- РІВЕНЬ 2: the PLOT, честна геометрія 45 × 50 м (22,5 сотки) ---- */
    SectionHarness.ranOK('plot-scene', function () {
      var svg = el('svg', { class: 'v4-scene', viewBox: '0 0 220 140', preserveAspectRatio: 'xMidYMid meet' },
        document.querySelector('[data-layer="2"]'));
      var defs = el('defs', {}, svg);
      var h = el('pattern', { id: 'v4Hatch2', width: 5, height: 5, patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse' }, defs);
      el('rect', { width: 5, height: 5, fill: 'rgba(176,106,79,.14)' }, h);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: 'rgba(201,138,114,.55)', 'stroke-width': .8 }, h);
      /* HONEST scale: 1 м = 1.4 units, uniform. Ділянка 45 м (ширина) × 50 м (глибина) -> 63 × 70 */
      var W = 63, H = 70;
      var x0 = (220 - W) / 2, y0 = (128 - H) / 2;
      el('rect', { x: x0, y: y0, width: W, height: H, class: 'v4-plot' }, svg);
      /* dimension lines */
      el('line', { x1: x0, y1: y0 - 9, x2: x0 + W, y2: y0 - 9, class: 'v4-dim' }, svg);
      el('line', { x1: x0, y1: y0 - 12, x2: x0, y2: y0 - 6, class: 'v4-dim' }, svg);
      el('line', { x1: x0 + W, y1: y0 - 12, x2: x0 + W, y2: y0 - 6, class: 'v4-dim' }, svg);
      el('text', { x: x0 + W / 2, y: y0 - 13, 'text-anchor': 'middle', class: 'v4-dimt' }, svg).textContent = '45 м';
      el('line', { x1: x0 - 9, y1: y0, x2: x0 - 9, y2: y0 + H, class: 'v4-dim' }, svg);
      el('line', { x1: x0 - 12, y1: y0, x2: x0 - 6, y2: y0, class: 'v4-dim' }, svg);
      el('line', { x1: x0 - 12, y1: y0 + H, x2: x0 - 6, y2: y0 + H, class: 'v4-dim' }, svg);
      el('text', { x: x0 - 13, y: y0 + H / 2 + 2, 'text-anchor': 'end', class: 'v4-dimt' }, svg).textContent = '50 м';
      /* the headline inside the plot */
      el('text', { x: 110, y: y0 + H / 2 - 2, 'text-anchor': 'middle', class: 'v4-plott' }, svg).textContent = '22,5 сотки';
      el('text', { x: 110, y: y0 + H / 2 + 8, 'text-anchor': 'middle', class: 'v4-plotsub' }, svg).textContent = 'рівна · під забудову';
      /* street edge below */
      el('line', { x1: 30, y1: y0 + H + 12, x2: 190, y2: y0 + H + 12, class: 'v4-rd', 'stroke-width': 2.4, opacity: .8 }, svg);
      el('text', { x: 110, y: y0 + H + 20, 'text-anchor': 'middle', class: 'v4-plotsub' }, svg).textContent = 'вул. Замкова';
      el('circle', { cx: 110, cy: y0 + H + 12, r: 1.6, class: 'v4-sitedot' }, svg);
    })

    /* ---- the DRILL: circular clip-mask grows FROM the anchor (layer-swap, not scale-dive) ---- */
    var LEVELS = [
      { sheet: 'Аркуш 1 · Район',   scale: '500 м', cap: 'Три кроки: район з обʼєктами, вулиця Замкова, ваші 22,5 сотки.' },
      { sheet: 'Аркуш 2 · Вулиця',  scale: '100 м', cap: 'Тиха вулиця приватних будинків. В’їзд з вул. Замкової.' },
      { sheet: 'Аркуш 3 · Ділянка', scale: '10 м',  cap: 'Рівна ділянка 45 на 50 метрів. Готова під ваш дім.' }
    ];
    var lvl = 0, busy = false;
    var layers = [].slice.call(document.querySelectorAll('.v4__layer'));
    function anchorPct(i) {
      /* the mask grows from the SITE position: on layer 0 the site sits at its projected screen spot;
         on deeper layers the anchor is the scene centre (the site IS the centre there) */
      if (i > 0) return { x: 50, y: 48 };
      var vb = { x: 300, y: -36, w: 806, h: 720 };   /* matches the meet fit-to-content box */
      var host = combo.getBoundingClientRect();
      /* meet-fit: scale = min(w/h ratios) */
      var sc = Math.min(host.width / vb.w, host.height / vb.h);
      var offX = (host.width - vb.w * sc) / 2, offY = (host.height - vb.h * sc) / 2;
      return { x: ((S.x - vb.x) * sc + offX) / host.width * 100, y: ((S.y - vb.y) * sc + offY) / host.height * 100 };
    }
    function setLvl(n) {
      n = Math.max(0, Math.min(2, n));
      if (n === lvl || busy) return;
      var from = lvl, to = n; lvl = n; busy = true;
      combo.setAttribute('data-lvl', n);
      document.querySelectorAll('.v4__lvl').forEach(function (b) { b.classList.toggle('is-on', +b.dataset.go === n); });
      document.querySelector('[data-closer]').textContent = n === 2 ? 'Далі ↑' : 'Ближче ↓';
      var inc = layers[to], out = layers[from];
      var a = anchorPct(Math.min(from, to));
      /* copy follows the media by ~100ms */
      setTimeout(function () { swapCap(LEVELS[n].cap); document.querySelector('[data-sheet]').textContent = LEVELS[n].sheet;
        document.querySelector('[data-scale]').textContent = LEVELS[n].scale; }, 120);
      if (REDUCED || !window.gsap) {
        out.classList.remove('is-live'); inc.classList.add('is-live'); inc.style.clipPath = 'none'; busy = false; return;
      }
      inc.classList.add('is-live');
      inc.style.zIndex = 3; out.style.zIndex = 2;
      if (to > from) {
        /* dive: the incoming sheet grows FROM the anchor over the old one */
        gsap.fromTo(inc, { clipPath: 'circle(0% at ' + a.x + '% ' + a.y + '%)' },
          { clipPath: 'circle(142% at ' + a.x + '% ' + a.y + '%)', duration: .95, ease: 'expo.inOut',
            onComplete: done });
      } else {
        /* pull back: the outgoing sheet shrinks INTO the anchor, revealing the wider one */
        inc.style.clipPath = 'none'; inc.style.zIndex = 2; out.style.zIndex = 3;
        gsap.fromTo(out, { clipPath: 'circle(142% at ' + a.x + '% ' + a.y + '%)' },
          { clipPath: 'circle(0% at ' + a.x + '% ' + a.y + '%)', duration: .95, ease: 'expo.inOut', onComplete: done });
      }
      function done() {
        layers.forEach(function (L, i) { L.classList.toggle('is-live', i === lvl); L.style.clipPath = 'none'; L.style.zIndex = ''; });
        busy = false;
      }
    }
    function swapCap(text) {
      var holder = document.querySelector('.v4__cap'), old = holder.querySelector('span');
      var next = document.createElement('span'); next.textContent = text;
      holder.appendChild(next);
      if (REDUCED || !window.gsap) { old.remove(); return; }
      gsap.fromTo([old, next], { y: 0 }, { y: -old.offsetHeight, duration: .55, ease: 'expo.out',
        onComplete: function () { old.remove(); gsap.set(next, { y: 0 }); } });
    }

    document.querySelectorAll('.v4__lvl').forEach(function (b) {
      b.addEventListener('click', function () { setLvl(+b.dataset.go); });
    });
    document.querySelector('[data-closer]').addEventListener('click', function () {
      setLvl(lvl === 2 ? 0 : lvl + 1);
    });

    SectionHarness.declare({ pinOwner: 'none', expectPins: 0, atomsCited: ['locmap-engine', 'zoom-to-the-door', 'coords-corner-frame'] });
  })();
  </script>
