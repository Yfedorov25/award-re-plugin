<!DOCTYPE html>
<!--
  PASSPORT · A2 «Чому він такий»  (ROUND 2 - СУПЕРКОМПОЗИЦІЯ)
  Питання: ЧОМУ ДІМ ВИГЛЯДАЄ САМЕ ТАК?  (дім 2, QUADRO-модерн)
  Граматика збірки = spec-builds (bundle-6): media-step + типо-реліз + драфтинг-мета.
  atoms_used (>=3, код перенесено ДОСЛІВНО, конфігуровано через опції):
    1. media-step-switch  - ЯДРО степера. MediaStepSwitch.init('#pin',{steps}) будує pinned
       full-bleed стейджер: OUTGOING знизу непрозорий + INCOMING зверху крос-фейд; текст
       СЕТЛИТЬСЯ перш ніж медіа міняється (matched hold -> media crossfade). 5 біт.
    2. blur-reveal-stagger-title - типо-реліз кожної констатації: per-word blur(18->0)+opacity,
       staggered. BlurRevealStaggerTitle.create(h2).play() синхронно з активацією біта степера.
    3. corner-frame-meta  - драфтинг-мета кадру: CornerFrameMeta.create(pin) з [data-corner]
       лейблами (tl/bl), reveal() staggered.
  Типо: Fraunces + Inter (з media-step-switch css). Ease: house air (CustomEase 0.25,0.74,0.22,0.99).
  Закони: копі дослівно; нуль em/en-dash; текст веде медіа; rest повний; тільки видиме;
  NO WebGL/mix-blend/backdrop над скрабом; один дім (QUADRO); renders/ відносні.
-->
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чому він такий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- atom stylesheets (verbatim) -->
<link rel="stylesheet" href="technique-code/_tokens.css">
<link rel="stylesheet" href="technique-code/media-step-switch/component.css">
<link rel="stylesheet" href="technique-code/corner-frame-meta/component.css">
<style>
  /* supplementary layout ONLY (atom CSS untouched): sub line under a statement,
     the closer moment, and z/colour for the corner meta over the media. */
  .m-statement .msw-sub{font-family:var(--sans);font-weight:400;font-size:clamp(1rem,1.35vw,1.28rem);
    line-height:1.5;color:rgba(244,237,225,.9);max-width:30ch;margin-top:1.0em;
    text-shadow:0 2px 18px rgba(0,0,0,.55)}
  .m-quote.m-closer blockquote{font-style:normal;font-weight:300;max-width:20ch}
  .a2-corner{z-index:8;color:rgba(244,237,225,.82);font-family:var(--sans);font-weight:500}
  .a2-corner b{color:#fbf6ec;font-weight:600}
</style>
</head>
<body>
  <div class="pin" id="pin"></div>

<!-- deps + atoms (verbatim) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="technique-code/media-step-switch/component.js"></script>
<script src="technique-code/blur-reveal-stagger-title/component.js"></script>
<script src="technique-code/corner-frame-meta/component.js"></script>
<script>
(function(){
  // ---- A2 steps (approved copy, verbatim). Custom el ids -> we own the moment markup. ----
  var STEPS = [
    { media:'renders/day-34.webp',      el:'a2Intro',   type:'BIG STATEMENT', enter:{x:-44,y:0}, objPos:'50% 46%',
      layout:'statement', eyebrow:'Дім 2 · QUADRO модерн', title:'Кожне рішення має причину.', sub:'' },
    { media:'renders/macro-roof.webp',  el:'a2Roof',    type:'STATEMENT', enter:{x:-40,y:0}, objPos:'50% 50%',
      layout:'statement', eyebrow:'Причина 01', title:'Дах - тераса.',
      sub:'Ще одна кімната просто неба: настил, лаунж, вид на сад.' },
    { media:'renders/macro-pergola.webp', el:'a2Pergola', type:'STATEMENT', enter:{x:0,y:30}, objPos:'50% 42%',
      layout:'statement', eyebrow:'Причина 02', title:'Пергола над терасою.',
      sub:'Тінь удень, відкрите небо ввечері.' },
    { media:'renders/terrace-02.webp',  el:'a2Glass',   type:'STATEMENT', enter:{x:-40,y:0}, objPos:'50% 50%',
      layout:'statement', eyebrow:'Причина 03', title:'Скління на всю стіну.',
      sub:'Сад видно з кожної кімнати.' },
    { media:'renders/day-front.webp',   el:'a2Final',   type:'CLOSER', enter:{x:0,y:26}, objPos:'50% 46%',
      layout:'closer', eyebrow:'', title:'Так виглядає дім, у якому все продумано.', sub:'' }
  ];

  // === ATOM 1: media-step-switch — builds the pinned stepper into #pin ===
  var msw = window.MediaStepSwitch.init('#pin', { steps: STEPS, pinFactor: 1.7, dwell: 0.9 });

  // static fallback branch (reduced-motion / <=820px): the atom built .static; still fill copy.
  var isStatic = !!(msw && msw.static);

  function moment(i){ return document.getElementById(STEPS[i].el); }

  // rebuild each moment's markup with OUR copy in the atom's native type styles.
  function paint(el, s){
    if (!el) return;
    if (s.layout === 'closer'){
      el.className = 'moment m-quote m-closer';
      el.innerHTML = '<div class="rule"></div>'
        + '<blockquote data-a2title>'+s.title+'</blockquote>'
        + '<div class="rule"></div>';
    } else {
      el.className = 'moment m-statement';
      el.innerHTML = (s.eyebrow ? '<span class="eyebrow">'+s.eyebrow+'</span>' : '')
        + '<h2 data-a2title>'+s.title+'</h2>'
        + (s.sub ? '<p class="msw-sub">'+s.sub+'</p>' : '');
    }
  }

  if (!isStatic){
    // paint moments, then wire the typo-release + draughting meta
    STEPS.forEach(function(s,i){ paint(moment(i), s); });
    // the atom seeded each moment as its generic .m-quote (centred: translate(-50%,-50%)),
    // which GSAP baked into the inline transform. Statement moments are lower-left, NOT
    // centred, so clear the percent-translate; the closer keeps .m-quote centring.
    STEPS.forEach(function(s,i){
      if (s.layout==='statement' && window.gsap) window.gsap.set(moment(i), { xPercent:0, yPercent:0 });
    });

    // === ATOM 2: blur-reveal-stagger-title on every statement heading ===
    var titles = STEPS.map(function(s,i){
      var h = moment(i) && moment(i).querySelector('[data-a2title]');
      return h ? window.BlurRevealStaggerTitle.create(h, { blur:18, stagger:0.09, duration:0.62, ease:'power2.out' }) : null;
    });
    var played = STEPS.map(function(){ return false; });
    // first heading reads SHARP at rest, independent of the scrub ticker (rest-state law)
    if (window.gsap) window.gsap.set(moment(0), { opacity:1, x:0, y:0 });
    if (titles[0]){ titles[0].set(1); played[0]=true; }

    // drive each title's staggered focus-pull from its moment's LIVE opacity (set by the stepper)
    (function loop(){
      for (var i=0;i<titles.length;i++){
        if (!titles[i]) continue;
        var op = parseFloat(getComputedStyle(moment(i)).opacity) || 0;
        if (op>0.55 && !played[i]){ played[i]=true; titles[i].play(); }
        else if (op<0.10 && played[i]){ played[i]=false; titles[i].reset(); }
      }
      requestAnimationFrame(loop);
    })();

    // === ATOM 3: corner-frame-meta — draughting meta over the full-bleed frame ===
    var pin = document.getElementById('pin');
    var tl = document.createElement('span'); tl.className='a2-corner'; tl.setAttribute('data-corner','tl');
    tl.innerHTML = '<b>QUADRO</b>';
    var bl = document.createElement('span'); bl.className='a2-corner'; bl.setAttribute('data-corner','bl');
    bl.textContent = 'Архітектура · чому він такий';
    pin.appendChild(tl); pin.appendChild(bl);
    window.CornerFrameMeta.create(pin, { sel:'.a2-corner', stagger:0.12, dur:0.6 }).reveal();
  } else {
    // static deck: paint the static captions with our copy (atom built .static__cap blocks)
    var caps = document.querySelectorAll('.static__cap');
    STEPS.forEach(function(s,i){
      var cap = caps[i]; if(!cap) return;
      cap.querySelector('.static__title').textContent = s.title;
      var sub = cap.querySelector('.static__sub'); if (sub) sub.textContent = s.sub || '';
      var k = cap.querySelector('.static__kicker'); if (k) k.textContent = '0'+(i+1)+' / 0'+STEPS.length+' · '+s.eyebrow;
    });
  }
})();
</script>
</body>
</html>
