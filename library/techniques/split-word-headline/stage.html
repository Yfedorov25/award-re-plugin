<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>split-word-headline · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{ --green:#16322a; --green-deep:#0e241d; --cream:var(--spr-cream); --slate:#9fb0a6;
    --serif:var(--spr-serif); --body:var(--spr-sans); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%}
  .before{ height:70vh; }  /* desktop: headline enters from below on scroll (collapsed on mobile) */
  .wrap{ min-height:60vh; display:flex; flex-direction:column; justify-content:center; padding:clamp(24px,6vw,90px); }
  .eyebrow{ font-size:.7rem; letter-spacing:.32em; text-transform:uppercase; color:var(--slate); margin-bottom:clamp(20px,4vh,40px); }
  h1[data-swh]{ font-family:var(--serif); font-weight:400; font-size:clamp(2.4rem,8vw,6.5rem);
    line-height:1.02; letter-spacing:-.015em; color:var(--cream); max-width:100%; overflow-wrap:break-word; }
  .after{ height:110vh; }  /* desktop scroll runway; collapsed on mobile */
  .badge{ position:fixed; top:10px; left:10px; z-index:9; font-family:ui-monospace,Menlo,monospace;
    font-size:.62rem; letter-spacing:.06em; color:#7fd8b0; background:rgba(8,22,17,.72);
    border:1px solid #26463c; border-radius:999px; padding:4px 10px; pointer-events:none; }
</style>
</head>
<body>
  <div class="badge" id="badge">…</div>
  <div class="before" id="before"></div>
  <section class="wrap" id="stage">
    <div class="eyebrow">QUADRO · приватний квартал</div>
    <h1 data-swh>Дім,
що дихає
спокоєм</h1>
  </section>
  <div class="after" id="after"></div>

<script src="engine.js"></script>
<script src="component.js"></script>
<script>
  var r = SplitWordHeadlineDual.init('#stage h1', { platform: 'auto', stagger: 0.09, playMs: 1500 });
  var badge = document.getElementById('badge');
  badge.textContent = r.platform === 'desktop' ? 'desktop · scroll-reveal' : 'mobile · reveal-on-view';
  if (r.platform === 'mobile') { document.getElementById('after').style.height = '0'; document.getElementById('before').style.height = '0'; }
  if (r.platform === 'desktop' && window.Lenis) {
    var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
    requestAnimationFrame(function raf(t){ lenis.raf(t); requestAnimationFrame(raf); });
  }
</script>
</body>
</html>
