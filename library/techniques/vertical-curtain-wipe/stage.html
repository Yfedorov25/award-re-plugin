<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vertical-curtain-wipe · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{--green:#16322a;--green-deep:#0e241d;--cream:var(--spr-cream);--slate:#9fb0a6;--serif:var(--spr-serif);--body:var(--spr-sans);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%;}
  /* BOTH platforms pin; mobile keeps full-bleed single-column layout but still sticks (S19g) */
  .vcw-stage{position:sticky;top:0;height:100vh !important;}
  /* the entering panel = a green column with the heading */
  .vcw-panel{background:var(--green);display:flex;flex-direction:column;justify-content:flex-end;
    padding:clamp(24px,5vw,70px);}
  .vcw-eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--slate);
    margin-bottom:clamp(12px,2.4vh,22px);max-width:min(24ch,100%);}
  .vcw-head{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,7.4vw,4.4rem);line-height:1.03;
    color:var(--cream);max-width:100%;overflow-wrap:break-word;}
  .badge{position:fixed;top:10px;left:10px;z-index:9;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:#7fd8b0;background:rgba(8,22,17,.72);border:1px solid #26463c;border-radius:999px;padding:4px 10px;pointer-events:none;}
</style></head><body>
  <div class="badge" id="badge">…</div>
  <div class="pin-wrap" id="pinwrap"><section class="vcw-stage" id="stage">
    <div class="vcw-out"><img src="img/out.webp" alt=""></div>
    <div class="vcw-panel">
      <div class="vcw-eyebrow">SPRINGS · дизайн</div>
      <h2 class="vcw-head">Форма<br>тримає світло</h2>
    </div>
  </section></div>
<script src="engine.js"></script><script src="component.js"></script>
<script>
  // mobile parks the vertical panel taller (58% up the screen) so the photo stays visible on top
  var isMobile = !(window.matchMedia && window.matchMedia('(min-width:1024px)').matches);
  var r = VerticalCurtainWipeDual.init('#stage', { platform:'auto', park: isMobile?58:50, zoom:0.12 });
  document.getElementById('badge').textContent = r.platform==='desktop'?'desktop · wipe →':'mobile · wipe ↑ (vertical)';
  { document.getElementById('pinwrap').style.height='200vh';
    if(window.Lenis){var l=new Lenis({lerp:0.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});} }
</script></body></html>
