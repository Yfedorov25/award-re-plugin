<script>
(function(){
  window.__KINETIC = { composed:false, p:function(){ return 1; }, treatment:null };
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var SVGNS='http://www.w3.org/2000/svg';
  var D=Math.PI/180;

  // arc configs. B/C = verbatim DC renderVals (alt treatments). A = tuned toward live B0:
  //   live top-right arc is contained in upper-right + a softer left arc through the letters.
  //   DC A had r1:320 (swept too wide/low) → r0 76→92, r1 320→268 (higher, narrower band);
  //   left arc r1 210→186 (less mass). Verified vs _live-b0.jpg ink scan.
  var CFG = {
    A:[{cx:388,cy:14,r0:96,r1:250,a0:98,a1:172},{cx:-8,cy:330,r0:48,r1:178,a0:-40,a1:42}],
    B:[{cx:-48,cy:250,r0:118,r1:474,a0:-27,a1:52},{cx:420,cy:70,r0:40,r1:175,a0:122,a1:205}],
    C:[{cx:360,cy:-10,r0:90,r1:355,a0:100,a1:182},{cx:0,cy:620,r0:60,r1:300,a0:-80,a1:-6}]
  };
  var ACONTRAST={A:0.42,B:0.5,C:0.5};                   // A softer (live arcs are delicate)
  var density=0.5;                                      // DC default
  var count=Math.max(14, Math.round(24+density*34));    // =41

  function makeFan(cfg,contrast){
    var cx=cfg.cx,cy=cfg.cy,r0=cfg.r0,r1=cfg.r1,a0=cfg.a0,a1=cfg.a1,gapRatio=0.30;
    var span=a1-a0, step=span/count, half=(step*(1-gapRatio))/2;
    function P(rad,ang){ return [cx+Math.cos(ang*D)*rad, cy+Math.sin(ang*D)*rad]; }
    var blades=[], creases=[];
    for(var i=0;i<count;i++){
      var c=a0+step*(i+0.5), t=count>1?i/(count-1):0.5, bell=Math.sin(Math.PI*t);
      var p1=P(r0,c-half),p2=P(r0,c+half),p3=P(r1,c+half),p4=P(r1,c-half);
      var points=[p1,p2,p3,p4].map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
      var L=100-(2.0+7*contrast*(0.55*bell+0.45*t));
      blades.push({points:points, fill:'hsl(220 8% '+L.toFixed(1)+'%)'});
      var g=a0+step*(i+1), aa=P(r0+2,g), bb=P(r1-4,g);
      var op=(0.09+0.34*contrast)*(0.32+0.68*bell);
      creases.push({x1:aa[0].toFixed(1),y1:aa[1].toFixed(1),x2:bb[0].toFixed(1),y2:bb[1].toFixed(1),op:op.toFixed(3)});
    }
    var N=22, sh=[];
    for(var i2=0;i2<=N;i2++){var p=P(r1,a0+span*i2/N); sh.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
    for(var i3=N;i3>=0;i3--){var p2=P(r0,a0+span*i3/N); sh.push(p2[0].toFixed(1)+','+p2[1].toFixed(1));}
    return {blades:blades, creases:creases, shadow:{points:sh.join(' ')}};
  }
  function buildSet(cfgs,contrast){
    var blades=[],creases=[],shadows=[];
    cfgs.forEach(function(c){ var f=makeFan(c,contrast); blades.push.apply(blades,f.blades); creases.push.apply(creases,f.creases); shadows.push(f.shadow); });
    return {blades:blades,creases:creases,shadows:shadows};
  }
  function poly(points,fill){ var el=document.createElementNS(SVGNS,'polygon'); el.setAttribute('points',points); el.setAttribute('fill',fill); return el; }
  function ln(c){ var el=document.createElementNS(SVGNS,'line'); el.setAttribute('x1',c.x1); el.setAttribute('y1',c.y1); el.setAttribute('x2',c.x2); el.setAttribute('y2',c.y2); el.setAttribute('stroke','#99a0aa'); el.setAttribute('opacity',c.op); el.setAttribute('style','stroke-width:0.9px;'); return el; }

  // render arcs into every [data-arcs]
  [].slice.call(document.querySelectorAll('[data-arcs]')).forEach(function(holder){
    var setKey=holder.getAttribute('data-arcset');
    var set=buildSet(CFG[setKey], (ACONTRAST[setKey]!=null?ACONTRAST[setKey]:0.5));
    var gS=holder.querySelector('[data-arc-shadows]'), gB=holder.querySelector('[data-arc-blades]'), gC=holder.querySelector('[data-arc-creases]');
    set.shadows.forEach(function(s){ gS.appendChild(poly(s.points,'#b6bbc4')); });
    set.blades.forEach(function(b){ gB.appendChild(poly(b.points,b.fill)); });
    set.creases.forEach(function(c){ gC.appendChild(ln(c)); });
  });

  // entrance (verbatim таймінги з DC runEntrance)
  var EASE='cubic-bezier(.22,.61,.36,1)';
  var STG = 150;   // letterStagger default 150
  function runEntrance(animate){
    [].slice.call(document.querySelectorAll('[data-screen]')).forEach(function(sc){
      function q(s){ return sc.querySelector(s); }
      function qa(s){ return [].slice.call(sc.querySelectorAll(s)); }
      function run(el,kf,dur,delay){ if(!el)return;
        if(animate && !rm){ if(el.getAnimations) el.getAnimations().forEach(function(a){a.cancel();}); el.animate(kf,{duration:dur,delay:delay,easing:EASE,fill:'both'}); }
        else { Object.assign(el.style, kf[kf.length-1]); } }
      run(q('[data-arcs]'), [{opacity:0,transform:'scale(0.965)'},{opacity:1,transform:'scale(1)'}], 1200, 80);
      run(q('[data-kicker]'), [{opacity:0,transform:'translateY(10px)',filter:'blur(6px)'},{opacity:1,transform:'translateY(0px)',filter:'blur(0px)'}], 780, 150);
      var letters=qa('[data-letter]');
      letters.forEach(function(el,i){ run(el,[{opacity:0,transform:'translateY(12px)',filter:'blur(16px)'},{opacity:1,transform:'translateY(0px)',filter:'blur(0px)'}],900,240+i*STG); });
      var capDelay=240+letters.length*STG+220;
      run(q('[data-caption]'),[{opacity:0,transform:'translateY(10px)',filter:'blur(6px)'},{opacity:1,transform:'translateY(0px)',filter:'blur(0px)'}],780,capDelay);
      run(q('[data-arrow]'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0px)'}],620,capDelay+160);
    });
  }
  requestAnimationFrame(function(){ runEntrance(true); });

  // replay-on-tap (для дебагу/борду)
  document.addEventListener('click',function(e){ if(e.target.closest('[data-screen]')) runEntrance(true); });

  var firstScreen=document.querySelector('[data-screen]');
  window.__KINETIC.composed=true;
  window.__KINETIC.treatment = firstScreen ? firstScreen.getAttribute('data-treatment') : null;
  window.__KINETIC.replay = function(){ runEntrance(true); };
})();
</script>
