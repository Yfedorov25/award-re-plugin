<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>amenities-ivy · cream-textblock-photocard</title>
<link rel="stylesheet" href="../variants/_springs-tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:auto;}
  body{ font-family:var(--spr-sans,"TT Commons Pro",sans-serif); background:#f5e8d1; }

  /* scroll driver: tall page, ivy pinned as sticky stage */
  .wrap{ height:240vh; position:relative; }
  .stage{
    position:sticky; top:0;
    height:100dvh; width:100%;
    overflow:hidden;
    background:var(--spr-cream-lite,#f5e8d1);   /* CREAM-панель (live rgb244,227,202) */
  }

  /* хедер ІНВЕРТОВАНИЙ: темний на cream */
  .hdr{
    position:absolute; left:0; top:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; z-index:4;
    color:var(--spr-ink,#162d24);
  }
  .hdr .logo{ font-family:var(--spr-serif,"Victor Serif",serif); font-size:22px; letter-spacing:.5px; }
  .hdr .nav{ display:flex; gap:16px; align-items:center; opacity:.92; }
  .hdr .burger{ width:22px; height:12px; display:flex; flex-direction:column; justify-content:space-between; }
  .hdr .burger i{ display:block; height:1.4px; background:currentColor; }
  .hdr .heart{ width:20px; height:20px; }

  /* центрований заголовок зверху (Victor Serif, темно-зелений) */
  .title{
    position:absolute; left:20px; right:20px; top:20.5%;
    z-index:2; text-align:center;
    font-family:var(--spr-serif,"Victor Serif",serif);
    font-weight:400;
    /* 🔴 КЕГЛЬ З ВИМІРУ (урок borges): live заголовок висота 5.8% екрана (brightness). 20px давав 4.6%
       (замало), 33px давав 12.6% (завелико). 22px → ~5.5%; топ 20.5% під live топ22%. */
    font-size:22px;
    line-height:1.24;
    letter-spacing:-.1px;
    color:var(--spr-ink,#162d24);
  }

  /* фото-картка pod: В cream-полі (НЕ full-bleed — live має cream-рамку зліва/справа/зверху);
     reveal знизу wipe-up потім hold. Картка займає ~низ екрана з бічними полями. */
  .photocard{
    position:absolute; left:16px; right:16px; bottom:0; height:50%;
    overflow:hidden;
    will-change:transform;
  }
  .photo{
    position:absolute; inset:0;
    background:url(../variants/assets/ivy-pod.webp) center 45% / cover no-repeat;
  }
  .cap{
    position:absolute; left:16px; bottom:16px; z-index:2;
    font-size:11px; font-weight:500; letter-spacing:.14em; line-height:1.5;
    text-transform:uppercase;
    color:var(--spr-cream-lite,#f5e8d1);
    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }

  @media (prefers-reduced-motion:reduce){
    .photocard{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <header class="hdr">
        <span class="logo">Springs</span>
        <span class="nav">
          <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7-4.6-9.3-9C1 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.5 0 5 3.5 3.3 6.5C19 16.4 12 21 12 21z"/></svg>
          <span class="burger"><i></i><i></i></span>
        </span>
      </header>

      <h2 class="title" id="title">Sit down to read<br>under ivy-covered awning</h2>

      <div class="photocard" id="photocard">
        <div class="photo"></div>
        <span class="cap">Permanent Outdoor Recreation<br>Spaces</span>
      </div>
    </div>
  </div>

<script>
(function(){
  var wrap=document.querySelector('.wrap');
  var photocard=document.getElementById('photocard');
  var title=document.getElementById('title');

  function clamp(v){ return v<0?0:v>1?1:v; }

  function render(p){                       // p = scroll progress 0..1
    // фото-картка: reveal знизу wipe-up (translateY 100%→0 на p0..0.55), тоді hold
    var rev = p < 0.55 ? (1 - p/0.55) : 0;
    photocard.style.transform = 'translateY(' + (rev*100) + '%)';
    // заголовок: тримається, легкий lift по скролу
    title.style.transform = 'translateY(' + (-p*14) + 'px)';
    window.__IVY_P__ = p;
  }

  function onScroll(){
    var rect=wrap.getBoundingClientRect();
    var total=wrap.offsetHeight - window.innerHeight;
    var p=clamp((-rect.top)/total);
    render(p);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);

  window.render = render;
  window.__IVY_API__ = { get:function(){return window.__IVY_P__||0;} };
  render(0);
})();
</script>
</body>
</html>
