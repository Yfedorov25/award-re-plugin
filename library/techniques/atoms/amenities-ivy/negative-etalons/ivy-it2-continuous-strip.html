<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>amenities-ivy · cream-textblock-strip</title>
<link rel="stylesheet" href="../variants/_springs-tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:auto;}
  body{ font-family:var(--spr-sans,"TT Commons Pro",sans-serif); background:#f5e8d1; }

  /* scroll driver: tall page, ivy pinned as sticky stage; strip travels within */
  .wrap{ height:360vh; position:relative; }   /* 3 блоки → довший скрол */
  .stage{
    position:sticky; top:0;
    height:100dvh; width:100%;
    overflow:hidden;
    background:var(--spr-cream-lite,#f5e8d1);   /* CREAM (live rgb244,227,202) */
  }

  /* СТРІЧКА з 3 блоків — їде вгору цілком (текст+фото кожного блоку РАЗОМ) */
  .strip{
    position:absolute; left:0; top:0; width:100%;
    will-change:transform;
  }
  .block{
    position:relative; width:100%; height:100dvh;
    overflow:hidden;
  }
  /* центрований заголовок зверху (Victor Serif темно-зелений); кегль З ВИМІРУ (live висота ~6% екрана) */
  .btitle{
    position:absolute; left:20px; right:20px; top:20.5%;
    text-align:center;
    font-family:var(--spr-serif,"Victor Serif",serif);
    font-weight:400; font-size:22px; line-height:1.24; letter-spacing:-.1px;
    color:var(--spr-ink,#162d24);
  }
  /* фото-картка (з cream-полями, НЕ full-bleed), reveal знизу */
  .bphoto{
    position:absolute; left:16px; right:16px; bottom:6vh; height:48%;
    overflow:hidden;
    background-size:cover; background-position:center 45%; background-repeat:no-repeat;
  }
  .b1 .bphoto{ background-image:url(../variants/assets/ivy-pod.webp); }
  .b2 .bphoto{ background-image:url(../variants/assets/ivy-playground.webp); }
  .b3 .bphoto{ background-image:url(../variants/assets/ivy-yoga.webp); }
  .bcap{
    position:absolute; left:16px; bottom:16px; z-index:2;
    font-size:11px; font-weight:500; letter-spacing:.14em; line-height:1.5;
    text-transform:uppercase;
    color:var(--spr-cream-lite,#f5e8d1);
    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }

  /* хедер ІНВЕРТОВАНИЙ (темний на cream), СТАТИЧНИЙ поверх стрічки */
  .hdr{
    position:absolute; left:0; top:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; z-index:4;
    color:var(--spr-ink,#162d24);
    background:linear-gradient(180deg,var(--spr-cream-lite,#f5e8d1) 55%,rgba(245,232,209,0));
  }
  .hdr .logo{ font-family:var(--spr-serif,"Victor Serif",serif); font-size:22px; letter-spacing:.5px; }
  .hdr .nav{ display:flex; gap:16px; align-items:center; opacity:.92; }
  .hdr .burger{ width:22px; height:12px; display:flex; flex-direction:column; justify-content:space-between; }
  .hdr .burger i{ display:block; height:1.4px; background:currentColor; }
  .hdr .heart{ width:20px; height:20px; }

  @media (prefers-reduced-motion:reduce){ .strip{ transition:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <div class="strip" id="strip">
        <section class="block b1">
          <h2 class="btitle">Sit down to read<br>under ivy-covered awning</h2>
          <div class="bphoto"><span class="bcap">Permanent Outdoor Recreation<br>Spaces</span></div>
        </section>
        <section class="block b2">
          <h2 class="btitle">Bring the little ones<br>to a landscaped playground</h2>
          <div class="bphoto"><span class="bcap">Video-Monitored<br>Playgrounds</span></div>
        </section>
        <section class="block b3">
          <h2 class="btitle">Meditate on our<br>softest lawns</h2>
          <div class="bphoto"><span class="bcap">Portable<br>Outdoor Furniture</span></div>
        </section>
      </div>

      <header class="hdr">
        <span class="logo">Springs</span>
        <span class="nav">
          <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7-4.6-9.3-9C1 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.5 0 5 3.5 3.3 6.5C19 16.4 12 21 12 21z"/></svg>
          <span class="burger"><i></i><i></i></span>
        </span>
      </header>
    </div>
  </div>

<script>
(function(){
  var wrap=document.querySelector('.wrap');
  var strip=document.getElementById('strip');
  var N=3;                                  // блоків

  function clamp(v){ return v<0?0:v>1?1:v; }

  function render(p){                       // p = scroll progress 0..1
    // СТРІЧКА їде вгору: 3 блоки → рух 0..(N-1) екранів. Текст+фото кожного блоку РАЗОМ.
    var vh = window.innerHeight;
    strip.style.transform = 'translateY(' + (-p * (N-1) * vh) + 'px)';
    window.__IVY_P__ = p;
  }

  function onScroll(){
    var rect=wrap.getBoundingClientRect();
    var total=wrap.offsetHeight - window.innerHeight;
    var p=clamp((-rect.top)/total);
    render(p);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);

  window.render = render;
  window.__IVY_API__ = { get:function(){return window.__IVY_P__||0;} };
  render(0);
})();
</script>
</body>
</html>
