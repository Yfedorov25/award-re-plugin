<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"autoAdvance":{"editor":"boolean","default":false,"tsType":"boolean","section":"Carousel"},"intervalMs":{"editor":"int","default":5000,"min":2000,"max":9000,"step":500,"unit":"ms","tsType":"number","section":"Carousel"}}'>
class Component extends DCLogic {
  state = { active: 0, vis: 1 };

  DATA = [
    { t:"Flats",       s:"Designer finishings", b:"Search flats",   s1n:"138", s1l:"panoramic view flats", s2p:"up to", s2v:"3.1 m", s2l:"Ceiling height" },
    { t:"Townhouses",  s:"Private patios",      b:"Available soon", s1n:"5",   s1l:"townhouses",           s2p:"up to", s2v:"4.1 m", s2l:"Ceiling height" },
    { t:"Penthouses",  s:"Green terraces",      b:"Available soon", s1n:"7",   s1l:"Penthouses",           s2p:"up to", s2v:"4.1 m", s2l:"Ceiling height" }
  ];

  setTab(i){
    if(i === this.state.active) return;
    this.setState({ active:i, vis:0 });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ vis:1 }), 40);
    this.arm();
  }

  arm(){
    clearInterval(this._iv);
    if(this.props.autoAdvance){
      var ms = this.props.intervalMs || 5000;
      this._iv = setInterval(() => this.setTab((this.state.active + 1) % 3), ms);
    }
  }

  componentDidMount(){ this.arm(); }
  componentDidUpdate(prev){
    if(prev.autoAdvance !== this.props.autoAdvance || prev.intervalMs !== this.props.intervalMs) this.arm();
  }
  componentWillUnmount(){ clearInterval(this._iv); clearTimeout(this._t); }

  renderVals(){
    var active = this.state.active, vis = this.state.vis;
    var on = i => active === i;
    var d = this.DATA[active];
    return {
      t0:()=>this.setTab(0), t1:()=>this.setTab(1), t2:()=>this.setTab(2),
      op0:on(0)?1:0, op1:on(1)?1:0, op2:on(2)?1:0,
      z0:on(0)?3:1, z1:on(1)?3:1, z2:on(2)?3:1,
      pe0:on(0)?"auto":"none", pe1:on(1)?"auto":"none", pe2:on(2)?"auto":"none",

    };
  }
}
