<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>design-hero · A — springs Design (self-contained atom)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<script>window.__ATOM_OK__=false;window.render=function(){};</script>
<style>
  @font-face{font-display:swap;font-family:"Victor Serif";font-weight:400;src:url(../_fonts/VictorSerif-40Regular.woff2) format("woff2");}
  @font-face{font-display:swap;font-family:"TT Commons Pro";font-weight:400;src:url(../_fonts/TT_Commons_Pro_Regular.woff2) format("woff2");}
  @font-face{font-display:swap;font-family:"TT Commons Pro";font-weight:500;src:url(../_fonts/TTCommonsPro-Md.woff2) format("woff2");}
  :root{
    --spr-serif:"Victor Serif",Georgia,serif;
    --spr-sans:"TT Commons Pro",Helvetica,Arial,sans-serif;
    --cream:#e0d1b6; --cream-lite:#f5e8d1; --cream-hi:#efe3c8;
    --green-deep:#0e241d; --green:#16322a;
    --ease:cubic-bezier(.25,.74,.22,.99);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--green-deep);-webkit-font-smoothing:antialiased;}
  body{max-width:390px;margin:0 auto;font-family:var(--spr-sans);color:var(--cream);overflow-x:hidden;}

  /* header */
  .hdr{position:fixed;top:0;left:0;right:0;max-width:390px;margin:0 auto;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 15px) 20px 13px;
    background:linear-gradient(180deg,rgba(14,36,29,.4),rgba(14,36,29,0));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);pointer-events:none;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand .wm{font-family:var(--spr-serif);font-size:24px;color:var(--cream-lite);line-height:1;}
  .brand svg{display:block;transform:translateY(-3px);}
  .tools{display:flex;align-items:center;gap:17px;}
  .tools .caps{font-family:var(--spr-sans);font-weight:500;font-size:13px;letter-spacing:.11em;color:var(--cream);}
  .burger{display:flex;flex-direction:column;gap:5px;width:22px;}
  .burger i{height:1.5px;background:var(--cream);border-radius:2px;display:block;}

  /* scroll track: page taller than viewport so the hero image parallaxes */
  .track{position:relative;height:150vh;}
  .hero{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--green-deep);}

  .photo{position:absolute;inset:-8% 0 -8% 0;z-index:1;will-change:transform;
    background:#2a2419 url(../_img/tower-hero.jpg) center/cover no-repeat;}
  .tint{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(10,20,14,.28) 0%,rgba(10,20,14,0) 22%,rgba(10,20,14,0) 52%,rgba(10,20,14,.55) 82%,rgba(10,20,14,.82) 100%);}

  .title{position:absolute;right:20px;top:36%;z-index:3;text-align:right;will-change:transform,opacity;}
  .title h1{font-family:var(--spr-serif);font-weight:400;font-size:74px;line-height:.9;letter-spacing:-1px;
    color:rgba(245,232,209,.9);text-shadow:0 2px 30px rgba(8,16,10,.4);}
  .title .caps{margin-top:8px;font-family:var(--spr-sans);font-weight:500;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(224,209,182,.72);}

  .lede{position:absolute;left:22px;right:22px;bottom:44px;z-index:3;will-change:transform,opacity;
    font-family:var(--spr-sans);font-weight:400;font-size:15px;line-height:1.5;letter-spacing:.1px;
    color:rgba(240,236,225,.92);text-shadow:0 1px 16px rgba(5,14,9,.7);max-width:340px;}
</style>
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <span class="wm">Springs</span>
      <svg width="21" height="21" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14.5" stroke="#e0d1b6" stroke-width="1.1" opacity=".85"/><path d="M11 20c0-4 3-5 5-5s5-1 5-5" stroke="#e0d1b6" stroke-width="1.2" stroke-linecap="round"/><path d="M21 12c0 4-3 5-5 5s-5 1-5 5" stroke="#e0d1b6" stroke-width="1.2" stroke-linecap="round"/></svg>
    </div>
    <div class="tools">
      <span class="caps">RESIDENCES</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0d1b6" stroke-width="1.4"><path d="M12 20s-7-4.6-7-9.3A3.7 3.7 0 0 1 12 8a3.7 3.7 0 0 1 7 2.7C19 15.4 12 20 12 20Z"/></svg>
      <span class="burger"><i></i><i></i></span>
    </div>
  </header>

  <div class="track">
    <section class="hero">
      <div class="photo" id="photo"></div>
      <div class="tint"></div>
      <div class="title" id="title">
        <h1>Design</h1>
        <div class="caps">Inspired Architecture</div>
      </div>
      <p class="lede" id="lede">A standalone crystal building soaring above the treetops. A secluded tower resembling a glassy waterfall with flowing cascades of greenery-framed loggia.</p>
    </section>
  </div>

<script>
(function(){
  if(!window.gsap){return;}
  gsap.registerPlugin(ScrollTrigger, CustomEase);
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
  var lerp=function(a,b,t){return a+(b-a)*t;};
  var eOut=gsap.parseEase('power2.out');

  var photo=document.getElementById('photo'), title=document.getElementById('title'), lede=document.getElementById('lede');
  var track=document.querySelector('.track');

  // initial intro states (GSAP owns animated transforms)
  gsap.set(photo,{scale:1.08, transformOrigin:'50% 40%'});
  gsap.set(title,{autoAlpha:0, y:26});
  gsap.set(lede,{autoAlpha:0, y:20});

  function render(p){
    p=clamp((typeof p==='number'&&isFinite(p))?p:0,0,1);
    // INTRO (first 40%): photo settles 1.08→1.0, title + lede fade up (staggered)
    var intro=clamp(p/0.40,0,1);
    gsap.set(photo,{scale:lerp(1.08,1.0,eOut(intro))});
    var tI=clamp((p-0.06)/0.30,0,1); gsap.set(title,{autoAlpha:eOut(tI), y:(1-eOut(tI))*26});
    var lI=clamp((p-0.16)/0.30,0,1); gsap.set(lede,{autoAlpha:eOut(lI), y:(1-eOut(lI))*20});
    // SCROLL (40→100%): parallax the photo up, hero content drifts up + fades toward the seam
    var scr=clamp((p-0.40)/0.60,0,1);
    gsap.set(photo,{y:-scr*90});
    gsap.set(title,{y:(1-eOut(tI))*26 - scr*40});
    gsap.set(lede,{y:(1-eOut(lI))*20 - scr*30, autoAlpha:eOut(lI)*(1-scr*0.7)});
  }
  window.render=render;

  var lenis=new Lenis({lerp:0.11});
  lenis.on('scroll',ScrollTrigger.update);
  gsap.ticker.add(function(t){ lenis.raf(t*1000); });
  gsap.ticker.lagSmoothing(0);

  ScrollTrigger.create({trigger:'.track',start:'top top',end:'bottom bottom',scrub:0.5,
    onUpdate:function(s){ render(s.progress); }});

  render(0);
  // play intro on load (before user scrolls)
  gsap.to({v:0},{v:1,duration:1.7,ease:'power2.out',onUpdate:function(){ if(window.scrollY<4) render(this.targets()[0].v*0.40); }});
  window.__ATOM_OK__=true;
})();
</script>
</body>
</html>
