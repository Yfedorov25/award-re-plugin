<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile-hero — A / B / C review board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#07120d;color:#ece7d9}
  body{font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(120% 80% at 50% -10%,#10241a,#07120d 70%)}
  .head{padding:34px 40px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .head h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;letter-spacing:.4px}
  .head p{font-size:12.5px;font-weight:300;color:#9fb6a8;max-width:560px;line-height:1.5}
  .board{display:flex;gap:34px;padding:22px 40px 56px;overflow-x:auto;align-items:flex-start}
  .frame{flex:0 0 auto;width:390px;display:flex;flex-direction:column;gap:14px}
  .cap{display:flex;align-items:center;gap:10px}
  .letter{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1;width:34px}
  .cap .meta{display:flex;flex-direction:column;gap:1px}
  .cap .kind{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:#cdddc9}
  .cap .desc{font-size:11.5px;font-weight:300;color:#8ba593}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a5346;margin-left:auto;transition:background .3s,box-shadow .3s}
  .dot.ok{background:#7fd39b;box-shadow:0 0 0 3px rgba(127,211,155,.16)}
  .phone{width:390px;height:844px;border-radius:26px;overflow:hidden;position:relative;
    border:1px solid rgba(159,182,168,.22);background:#0a1913;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 6px rgba(255,255,255,.015)}
  iframe{width:390px;height:844px;border:0;display:block}
  .ctrl{display:flex;align-items:center;gap:12px}
  .btn{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
    color:#cdddc9;background:transparent;border:1px solid rgba(159,182,168,.3);border-radius:40px;
    padding:8px 15px;cursor:pointer;transition:.2s;white-space:nowrap}
  .btn:hover{border-color:rgba(159,182,168,.7);color:#fff}
  .scrub{flex:1;-webkit-appearance:none;appearance:none;height:2px;border-radius:2px;
    background:rgba(159,182,168,.28);outline:none;cursor:pointer}
  .scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#ece7d9;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.5)}
  .scrub::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#ece7d9;cursor:pointer}
  .val{font-size:11px;font-variant-numeric:tabular-nums;color:#9fb6a8;width:34px;text-align:right}
  .hint{font-size:11px;font-weight:300;color:#6f8a79;padding-left:4px}
</style>
</head>
<body>
  <div class="head">
    <h1>mobile-hero — three takes</h1>
    <p>Same law, three entry + drift characters at a 390×844 portrait viewport. Drag a slider to scrub each atom's <code>render(0→1)</code> — intro settle into scroll parallax. Scroll inside any phone for live Lenis parallax; Replay re-runs the intro.</p>
  </div>

  <div class="board" id="board">
    <div class="frame" data-src="mobile-hero-a.html" data-letter="A" data-kind="reveal-as-one" data-desc="fades in as one composition · quiet, editorial"></div>
    <div class="frame" data-src="mobile-hero-b.html" data-letter="B" data-kind="tile-cascade" data-desc="mosaic assembles, tiles pop in · column-split parallax"></div>
    <div class="frame" data-src="mobile-hero-c.html" data-letter="C" data-kind="designer's cut" data-desc="ken-burns entry, light-shift, line-masked title"></div>
  </div>

<script>
  document.querySelectorAll('.frame').forEach(function(f){
    var src=f.dataset.src;
    f.innerHTML =
      '<div class="cap">'+
        '<span class="letter">'+f.dataset.letter+'</span>'+
        '<span class="meta"><span class="kind">'+f.dataset.kind+'</span>'+
        '<span class="desc">'+f.dataset.desc+'</span></span>'+
        '<span class="dot"></span>'+
      '</div>'+
      '<div class="phone"><iframe src="'+src+'" title="Variant '+f.dataset.letter+'" loading="eager"></iframe></div>'+
      '<div class="ctrl">'+
        '<button class="btn replay">Replay</button>'+
        '<input class="scrub" type="range" min="0" max="1" step="0.002" value="0">'+
        '<span class="val">0.00</span>'+
      '</div>';

    var iframe=f.querySelector('iframe');
    var scrub=f.querySelector('.scrub');
    var val=f.querySelector('.val');
    var dot=f.querySelector('.dot');
    var cw=function(){ try{return iframe.contentWindow;}catch(e){return null;} };

    scrub.addEventListener('input',function(){
      var v=parseFloat(scrub.value); val.textContent=v.toFixed(2);
      var w=cw(); if(w && typeof w.render==='function') w.render(v);
    });
    f.querySelector('.replay').addEventListener('click',function(){
      scrub.value=0; val.textContent='0.00';
      try{ iframe.contentWindow.location.reload(); }catch(e){ iframe.src=iframe.src; }
    });
    // ready indicator
    var poll=setInterval(function(){
      var w=cw();
      if(w && w.__ATOM_OK__){ dot.classList.add('ok'); clearInterval(poll); }
    },250);
    iframe.addEventListener('load',function(){ dot.classList.remove('ok'); });
  });
</script>
</body>
</html>
