<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>amenities-hero · parallax-hero-fade</title>
<link rel="stylesheet" href="_springs-tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:auto;}
  body{
    font-family:var(--spr-sans,"TT Commons Pro",sans-serif);
    background:#f3e5cb;
  }

  /* scroll driver: tall page, hero pinned as sticky stage */
  .hero-wrap{ height:200vh; position:relative; }
  .stage{
    position:sticky; top:0;
    height:100dvh; width:100%;
    overflow:hidden;
    background:#0e241d;
  }

  /* full-bleed facade render, scrolls up (parallax: moves slightly slower than scroll → drifts up) */
  .facade{
    position:absolute; left:0; top:0;
    width:100%; height:118%;           /* extra height for parallax drift room */
    background:url(assets/hero.webp) center 18% / cover no-repeat;
    will-change:transform;
  }
  /* top scrim so white header + Springs logo stay legible over render */
  .scrim{
    position:absolute; left:0; top:0; width:100%; height:120px;
    background:linear-gradient(180deg,rgba(14,36,29,.55),rgba(14,36,29,0));
    z-index:3; pointer-events:none;
  }

  /* fake header (Springs + burger) over scrim */
  .hdr{
    position:absolute; left:0; top:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; z-index:4;
    color:var(--spr-cream-lite,#f5e8d1);
  }
  .hdr .logo{ font-family:var(--spr-serif,"Victor Serif",serif); font-size:22px; letter-spacing:.5px; }
  .hdr .nav{ display:flex; gap:16px; align-items:center; opacity:.92; }
  .hdr .burger{ width:22px; height:12px; display:flex; flex-direction:column; justify-content:space-between; }
  .hdr .burger i{ display:block; height:1.4px; background:currentColor; }
  .hdr .heart{ width:20px; height:20px; }

  /* title cluster lower-left: fades out on scroll (fade-coupling) */
  .titleblock{
    position:absolute; left:20px; bottom:118px;
    z-index:2; color:var(--spr-cream-lite,#f5e8d1);
    will-change:opacity,transform;
  }
  .title{
    font-family:var(--spr-serif,"Victor Serif",serif);
    font-weight:400;
    font-size:74px;
    line-height:.98;
    letter-spacing:-1.5px;
  }
  .kicker{
    margin-top:14px;
    font-family:var(--spr-sans,"TT Commons Pro",sans-serif);
    font-weight:500; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; opacity:.92;
  }
  /* scroll hint circle bottom-right, fades with title */
  .hint{
    position:absolute; right:20px; bottom:120px; z-index:2;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(245,232,209,.6);
    display:flex; align-items:center; justify-content:center;
    color:var(--spr-cream-lite,#f5e8d1);
    will-change:opacity;
  }
  .hint svg{ width:18px; height:18px; }

  /* cream panel rising from bottom (wipe-up seam S01) */
  .cream{
    position:absolute; left:0; bottom:0; width:100%;
    height:100%;
    background:#f3e5cb;
    transform:translateY(100%);        /* starts fully below */
    will-change:transform;
    z-index:1;
    padding:0 20px;
    display:flex; align-items:flex-start;
  }
  .cream .copy{
    margin-top:70px;
    font-family:var(--spr-serif,"Victor Serif",serif);
    font-weight:400; font-size:32px; line-height:1.16; letter-spacing:-.3px;
    color:var(--spr-ink,#162d24);
    max-width:640px;
  }

  @media (prefers-reduced-motion:reduce){
    .facade,.titleblock,.hint,.cream{ transition:none; }
  }
</style>
</head>
<body>
  <div class="hero-wrap">
    <div class="stage" id="stage">
      <div class="facade" id="facade"></div>
      <div class="scrim"></div>
      <header class="hdr">
        <span class="logo">Springs</span>
        <span class="nav">
          <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7-4.6-9.3-9C1 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.5 0 5 3.5 3.3 6.5C19 16.4 12 21 12 21z"/></svg>
          <span class="burger"><i></i><i></i></span>
        </span>
      </header>

      <div class="titleblock" id="titleblock">
        <div class="title">Amenities</div>
        <div class="kicker">Beauty at Your Fingertips</div>
      </div>
      <div class="hint" id="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg>
      </div>

      <div class="cream" id="cream">
        <p class="copy">Springs is a rational choice that you make with your heart. Listen: City's pulse steadies and synchronizes with the rhythm of your life.</p>
      </div>
    </div>
  </div>

<script>
(function(){
  var wrap=document.querySelector('.hero-wrap');
  var facade=document.getElementById('facade');
  var titleblock=document.getElementById('titleblock');
  var hint=document.getElementById('hint');
  var cream=document.getElementById('cream');

  function clamp(v){ return v<0?0:v>1?1:v; }

  function render(p){                       // p = scroll progress 0..1 across hero-wrap
    // facade parallax: drifts up slower than scroll (1.0x page → ~0.72x image = classic drift)
    facade.style.transform = 'translateY(' + (-p*14) + '%)';
    // title + hint fade out (holds longer, gone by p~0.62 like live)
    var fade = clamp(1 - p/0.62);
    titleblock.style.opacity = fade;
    titleblock.style.transform = 'translateY(' + (-p*40) + 'px)';
    hint.style.opacity = fade;
    // cream wipe-up: rises from bottom later + slower (matches live pacing)
    var rise = clamp((p-0.32)/0.66);        // starts at p .32, done by .98
    cream.style.transform = 'translateY(' + (100 - rise*100) + '%)';
    window.__HERO_P__ = p;
  }

  function onScroll(){
    var rect=wrap.getBoundingClientRect();
    var total=wrap.offsetHeight - window.innerHeight;
    var p=clamp((-rect.top)/total);
    render(p);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);

  // parity/gate hook
  window.render = render;
  window.__HERO_API__ = { get:function(){return window.__HERO_P__||0;} };
  render(0);
})();
</script>
</body>
</html>
