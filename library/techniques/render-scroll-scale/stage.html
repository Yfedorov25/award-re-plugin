<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>render-scroll-scale · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{--green:#16322a;--green-deep:#0e241d;--cream:var(--spr-cream);--slate:#9fb0a6;--serif:var(--spr-serif);--body:var(--spr-sans);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%}
  /* BOTH platforms pin (springs scale-creep is scroll-tied on mobile too) */
  .pin-wrap{position:relative;} .rss-frame{position:sticky;top:0;height:100vh!important;}
  .cap{position:absolute;left:0;bottom:0;z-index:3;padding:clamp(24px,6vw,80px);pointer-events:none;}
  .cap .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--cream);opacity:.85;}
  .cap .title{margin-top:.3em;font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,7vw,5rem);line-height:1.02;max-width:100%;overflow-wrap:break-word;}
  .badge{position:fixed;top:10px;left:10px;z-index:9;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:#7fd8b0;background:rgba(8,22,17,.72);border:1px solid #26463c;border-radius:999px;padding:4px 10px;pointer-events:none;}
</style></head><body>
  <div class="badge" id="badge">…</div>
  <div class="pin-wrap" id="pinwrap">
    <div class="rss-frame" id="frame">
      <img class="rss-render" src="img/a.webp" alt="">
      <div class="cap"><div class="eyebrow">SPRINGS · головний кадр</div><div class="title">Дім, що дихає</div></div>
    </div>
  </div>
<script src="engine.js"></script><script src="component.js"></script>
<script>
  var r = RenderScrollScaleDual.init('#frame', { platform:'auto', scaleFrom:1.0, scaleTo:1.35, cycleMs:2600 });
  document.getElementById('badge').textContent = r.platform==='desktop'?'desktop · scroll-scale':'mobile · scroll-scale';
  { document.getElementById('pinwrap').style.height='200vh';
    if(window.Lenis){var l=new Lenis({lerp:0.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});} }
</script></body></html>
