<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>portrait-carousel · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<style>
  :root{ --green:#16322a; --green-deep:#0e241d; --cream:var(--spr-cream); --slate:#9fb0a6;
    --serif:var(--spr-serif); --body:var(--spr-sans); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%}
  .pc-stage{ grid-template-columns:1fr auto; align-items:center; gap:clamp(20px,4vw,60px);
    padding:clamp(24px,6vw,90px); color:var(--cream); }
  @media (max-width:820px){ .pc-stage{ padding:clamp(20px,6vw,40px); } }
  .pc-left{ max-width:40ch; }
  .pc-eyebrow{ font-size:.7rem; letter-spacing:.32em; text-transform:uppercase; color:var(--slate); margin-bottom:clamp(14px,3vh,26px); }
  .pc-title{ font-family:var(--serif); font-weight:400; font-size:clamp(1.9rem,6vw,3.6rem); line-height:1.05;
    letter-spacing:-.01em; max-width:100%; overflow-wrap:break-word; }
  .pc-copy{ margin-top:clamp(14px,3vh,28px); font-size:clamp(.95rem,1.5vw,1.1rem); line-height:1.5; color:#c7d3cb; min-height:3em; }
  .pc-nav{ display:flex; gap:12px; margin-top:clamp(18px,3vh,30px); }
  .pc-btn{ color:var(--cream); background:none; cursor:pointer; display:grid; place-items:center; }
  .pc-frame{ border-radius:3px; }
  .badge{ position:fixed; top:10px; left:10px; z-index:9; font-family:ui-monospace,Menlo,monospace;
    font-size:.62rem; letter-spacing:.06em; color:#7fd8b0; background:rgba(8,22,17,.72);
    border:1px solid #26463c; border-radius:999px; padding:4px 10px; pointer-events:none; }
</style>
</head>
<body>
  <div class="badge" id="badge">…</div>
  <section class="pc-stage" id="stage">
    <div class="pc-left">
      <div class="pc-eyebrow">QUADRO · будинки кварталу</div>
      <div class="pc-title">Кожен дім<br>має характер</div>
      <div class="pc-copy"></div>
      <div class="pc-nav">
        <button class="pc-btn pc-prev" aria-label="назад"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="pc-btn pc-next" aria-label="далі"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="pc-frame"></div>
    <div class="pc-slide" data-image="img/p1.webp" data-copy="Денне світло заливає вітальню крізь панорамне скління — головний будинок кварталу." hidden></div>
    <div class="pc-slide" data-image="img/p2.webp" data-copy="Тераса виходить у приватний сад — межа між домом і зеленню розчиняється." hidden></div>
    <div class="pc-slide" data-image="img/p3.webp" data-copy="Вечірній фасад — тепле світло крізь ритм вертикальних ламелей." hidden></div>
    <div class="pc-slide" data-image="img/p4.webp" data-copy="Деталь інтер'єру: натуральні матеріали, спокійна палітра, тактильність." hidden></div>
  </section>

<script src="engine.js"></script>
<script src="component.js"></script>
<script>
  // slower push + more copy-lag = springs-like smooth image/text transition (not a hard cut);
  // longer autoMs so each slide reads before the next.
  var r = PortraitCarouselDual.init('#stage', { platform: 'auto', loop: true, autoMs: 0, pushMs: 1100, copyLagMs: 260 });
  document.getElementById('badge').textContent = r.platform === 'desktop' ? 'desktop · arrows' : 'mobile · swipe';
</script>
</body>
</html>
