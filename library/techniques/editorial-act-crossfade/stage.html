<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>editorial-act-crossfade · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{--green:#16322a;--green-deep:#0e241d;--cream:var(--spr-cream);--slate:#9fb0a6;--serif:var(--spr-serif);--body:var(--spr-sans);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%}
  /* BOTH platforms pin now (springs mobile = pinned-scroll dovodchik, T-PIN-RUNSCENE) */
  .pin-wrap{position:relative;} .eac-stage{position:sticky;top:0;height:100vh;}
  .eac-img::after{background:linear-gradient(180deg,rgba(14,36,29,.15),rgba(14,36,29,.55));}
  .eac-centre{--eac-centremin:60vw;}
  .eac-word{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,9vw,6rem);letter-spacing:var(--spr-hero-ls);line-height:1;color:var(--cream);text-align:center;}
  .eac-topline,.eac-fixed--l,.eac-fixed--r{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);opacity:.85;}
  .eac-toplines{position:absolute;top:clamp(24px,6vh,60px);left:0;right:0;text-align:center;z-index:4;}
  .eac-bodies{position:absolute;bottom:clamp(24px,7vh,70px);left:0;right:0;text-align:center;z-index:4;padding:0 8vw;}
  .eac-body{font-size:clamp(.9rem,1.5vw,1.05rem);line-height:1.5;color:#d7ddd6;max-width:44ch;margin:0 auto;}
  .eac-topline,.eac-body,.eac-word{opacity:0;}
  .badge{position:fixed;top:10px;left:10px;z-index:9;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:#7fd8b0;background:rgba(8,22,17,.72);border:1px solid #26463c;border-radius:999px;padding:4px 10px;pointer-events:none;}
</style></head><body>
  <div class="badge" id="badge">…</div>
  <div class="pin-wrap" id="pinwrap"><section class="eac-stage" id="stage">
    <div class="eac-images">
      <div class="eac-img" data-act="0"><img src="img/a.webp" alt=""></div>
      <div class="eac-img" data-act="1"><img src="img/b.webp" alt=""></div>
      <div class="eac-img" data-act="2"><img src="img/c.webp" alt=""></div>
    </div>
    <div class="eac-toplines">
      <span class="eac-topline" data-act="0">Розділ 01 · Ранок</span>
      <span class="eac-topline" data-act="1">Розділ 02 · День</span>
      <span class="eac-topline" data-act="2">Розділ 03 · Вечір</span>
    </div>
    <div class="eac-headline"><div class="eac-centre">
      <span class="eac-word" data-act="0">Світло</span>
      <span class="eac-word" data-act="1">Простір</span>
      <span class="eac-word" data-act="2">Спокій</span>
    </div></div>
    <div class="eac-bodies">
      <p class="eac-body" data-act="0">Ранок відкриває дім м'яким світлом крізь панорамне скління.</p>
      <p class="eac-body" data-act="1">Удень простір тече від вітальні до тераси й саду.</p>
      <p class="eac-body" data-act="2">Увечері тепле світло замикає день у тиші кварталу.</p>
    </div>
  </section></div>
<script src="engine.js"></script><script src="component.js"></script>
<script>
  var r = EditorialActCrossfadeDual.init('#stage', { platform:'auto' });
  document.getElementById('badge').textContent = r.platform==='desktop'?'desktop · scroll-pin':'mobile · scroll-pin';
  // BOTH platforms pin: tall wrap gives the scroll length; acts crossfade by scroll-progress
  document.getElementById('pinwrap').style.height=((r.acts||3)*100+100)+'vh';
  if(window.Lenis){var l=new Lenis({lerp:0.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});}
</script></body></html>
