<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>numeral-frame-expand-hero · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{--green:#16322a;--green-deep:#0e241d;--cream:var(--spr-cream);--slate:#9fb0a6;--serif:var(--spr-serif);--body:var(--spr-sans);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body);min-height:100%}
  .pin-wrap{position:relative;} .nfe-hero{position:sticky;top:0;--nfe-bg:var(--green-deep);--nfe-ink:var(--cream);}
  @media(max-width:1023px){.pin-wrap{height:auto!important;}.nfe-hero{position:relative;}}
  .nfe-numerals{font-family:var(--serif);font-weight:400;font-size:clamp(7rem,34vw,24rem);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(236,228,211,.6);}
  .nfe-title{position:absolute;left:0;right:0;bottom:clamp(60px,16vh,150px);text-align:center;z-index:4;font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,7vw,4.6rem);color:var(--cream);}
  .nfe-sub{position:absolute;left:0;right:0;bottom:clamp(36px,10vh,90px);text-align:center;z-index:4;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--slate);}
  .badge{position:fixed;top:10px;left:10px;z-index:9;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:#7fd8b0;background:rgba(8,22,17,.72);border:1px solid #26463c;border-radius:999px;padding:4px 10px;pointer-events:none;}
</style></head><body>
  <div class="badge" id="badge">…</div>
  <div class="pin-wrap" id="pinwrap"><section class="nfe-hero" id="hero">
    <div class="nfe-bg"><div class="nfe-frame"><img src="img/a.webp" alt=""></div></div>
    <div class="nfe-numerals">01</div>
    <div class="nfe-title">Дім, що дихає</div>
    <div class="nfe-sub">QUADRO · приватний квартал</div>
  </section></div>
<script src="engine.js"></script><script src="component.js"></script>
<script>
  var r = NumeralFrameExpandHeroDual.init('#hero', { platform:'auto', playMs:2200, restAt:0.8 });
  document.getElementById('badge').textContent = r.platform==='desktop'?'desktop · scroll-hero':'mobile · auto-hero';
  if(r.platform==='desktop'){ document.getElementById('pinwrap').style.height='300vh';
    if(window.Lenis){var l=new Lenis({lerp:0.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});} }
</script></body></html>
