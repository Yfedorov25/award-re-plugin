<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>map-dim-carousel · stage</title>
<link rel="stylesheet" href="../_springs-tokens.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{--mdc-ground:#2c2724;--mdc-cream:#e7e2d6;--mdc-cream-dim:#c9c4b6;--mdc-serif:var(--spr-serif);--mdc-sans:var(--spr-sans);--mdc-headline:3.1vw;--mdc-card-w:30vw;--green-deep:#0e241d;}
  *{margin:0;padding:0;box-sizing:border-box} html,body{background:var(--mdc-ground);color:var(--mdc-cream);font-family:var(--mdc-sans);min-height:100%;}
  .badge{position:fixed;top:10px;left:10px;z-index:9;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:#7fd8b0;background:rgba(8,22,17,.72);border:1px solid #26463c;border-radius:999px;padding:4px 10px;pointer-events:none;}
  /* light inline-SVG map styling */
  .map-svg{background:#3a332e;}
  .map-svg .water{fill:#2b3b3a;} .map-svg .park{fill:#33402f;} .map-svg .road{stroke:#5a5148;stroke-width:2;fill:none;}
  .map-svg .road-lg{stroke:#6a6055;stroke-width:4;fill:none;} .map-svg .poi{fill:#c9a24a;} .map-svg .block{fill:#453d36;}
  @media(max-width:820px){ :root{--mdc-headline:8vw;} }
</style></head><body>
  <div class="badge" id="badge">…</div>
  <div class="pin-wrap" id="pinwrap">
    <section class="mdc-stage" id="stage">
      <div class="mdc-map">
        <svg class="map-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect class="water" x="0" y="360" width="800" height="240"/>
          <path class="water" d="M0 360 Q200 330 400 360 T800 350 V420 H0 Z"/>
          <rect class="park" x="80" y="70" width="180" height="140" rx="6"/>
          <rect class="park" x="540" y="120" width="150" height="110" rx="6"/>
          <rect class="block" x="300" y="90" width="70" height="60"/>
          <rect class="block" x="390" y="90" width="90" height="60"/>
          <rect class="block" x="300" y="170" width="70" height="70"/>
          <rect class="block" x="390" y="170" width="90" height="70"/>
          <rect class="block" x="120" y="260" width="80" height="70"/>
          <rect class="block" x="560" y="270" width="90" height="60"/>
          <path class="road-lg" d="M0 250 H800"/>
          <path class="road-lg" d="M280 0 V360"/>
          <path class="road" d="M0 130 H280"/>
          <path class="road" d="M500 0 V250"/>
          <path class="road" d="M480 250 L640 360"/>
          <path class="road" d="M120 250 L60 360"/>
          <circle class="poi" cx="170" cy="140" r="6"/>
          <circle class="poi" cx="615" cy="175" r="6"/>
          <circle class="poi" cx="400" cy="200" r="6"/>
          <circle class="poi" cx="430" cy="330" r="6"/>
        </svg>
      </div>
      <div class="mdc-overlay">
        <h2 class="mdc-headline">The Center of Your Life</h2>
        <p class="mdc-sub">Один з найпривілейованіших районів — усе поруч, за кілька хвилин пішки.</p>
        <div class="mdc-rail-wrap">
          <div class="mdc-rail">
            <div class="mdc-card"><div class="mdc-card-img"><svg viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%"><rect width="200" height="160" fill="#3d4a3a"/><rect x="0" y="110" width="200" height="50" fill="#2b3b3a"/><circle cx="150" cy="40" r="22" fill="#c9a24a"/></svg></div><div class="mdc-card-cap">Набережна<br>5 хв пішки</div></div>
            <div class="mdc-card"><div class="mdc-card-img"><svg viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%"><rect width="200" height="160" fill="#33402f"/><path d="M40 160 L70 60 L100 160 Z" fill="#26301f"/><path d="M110 160 L140 80 L170 160 Z" fill="#2c3a26"/></svg></div><div class="mdc-card-cap">Парк поруч<br>3 хв пішки</div></div>
            <div class="mdc-card"><div class="mdc-card-img"><svg viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%"><rect width="200" height="160" fill="#453d36"/><rect x="30" y="40" width="40" height="120" fill="#5a5148"/><rect x="90" y="30" width="40" height="130" fill="#6a6055"/><rect x="150" y="55" width="35" height="105" fill="#5a5148"/></svg></div><div class="mdc-card-cap">Галерея<br>7 хв пішки</div></div>
          </div>
        </div>
        <div class="mdc-nav"><button class="mdc-prev" aria-label="prev">&#8592;</button><button class="mdc-arrow" aria-label="next">&#8594;</button></div>
      </div>
    </section>
  </div>
<script src="engine.js"></script><script src="component.js"></script>
<script>
  var r = MapDimCarouselDual.init('#stage', { platform:'auto', dimTo:0.3, cardStagger:0.5, step:1, railSteps:2, railStart:0.6 });
  document.getElementById('badge').textContent = r.platform==='desktop'?'desktop · scroll-map':'mobile · scroll-map';
  { document.getElementById('pinwrap').style.height='250vh';
    if(window.Lenis){var l=new Lenis({lerp:0.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});} }
</script></body></html>
