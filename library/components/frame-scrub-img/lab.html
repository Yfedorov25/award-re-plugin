<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>frame-scrub-img, scroll-scrubbed image sequence lab</title>

<!--
  LAB: frame-scrub-img (scroll-scrubbed IMAGE SEQUENCE, no canvas, no WebGL)
  ==================================================================
  120 sequential WebP frames (renders/arrival-frames/f_001..f_120) = one continuous
  fly-around of the building. A single <img>.src swaps to the frame nearest scroll
  progress on a pinned scrub; every frame is decode()'d off-DOM up front so the swap
  is jank-free. ERA (149-frame) / Ever (~1333-frame) data-sequence grammar.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="component.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#07090d;color:#eef1f6;font-family:"Inter",system-ui,sans-serif}
  .pre,.post{height:60vh;display:grid;place-items:center;color:rgba(238,241,246,.4);
    font:600 .7rem/1 "Inter";letter-spacing:.24em;text-transform:uppercase}
  .cap{position:absolute;z-index:6;left:clamp(20px,5vw,80px);bottom:clamp(28px,8vh,80px);
    max-width:24ch;pointer-events:none}
  .cap .e{font:500 .72rem/1 "Inter";letter-spacing:.4em;text-transform:uppercase;
    color:#dcb27e;display:block;margin-bottom:.9rem}
  .cap .t{font-family:"Fraunces",Georgia,serif;font-weight:300;
    font-size:clamp(2.2rem,5vw,4.4rem);line-height:.96;letter-spacing:-.03em;color:#f4efe6;
    text-shadow:0 2px 40px rgba(0,0,0,.5)}
  .cap .t em{font-style:italic;color:#dcb27e;font-weight:400}
</style>
</head>
<body>
  <div class="pre">scroll ↓</div>

  <section class="fsi-stage" id="stage" aria-label="Обліт будинку, послідовність кадрів">
    <img class="fsi-frame" alt="Обліт будинку, кадр послідовності">
    <figure class="cap">
      <figcaption class="e">Обліт · 120 кадрів</figcaption>
      <div class="t">Одне коло <em>навколо дому</em></div>
    </figure>
  </section>

  <div class="post">далі</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="component.js"></script>
<script>
  var fsi = FrameScrubImg.create('#stage', {
    framePath: 'renders/arrival-frames/',
    pattern: 'f_###.webp',
    count: 120, from: 1, pad: 3,
    pinFactor: 2.4,
    hold: 0.06
  });
  window.addEventListener('resize', function(){ if (window.ScrollTrigger) ScrollTrigger.refresh(); });
</script>

<!-- ── __LAB_OK__ acceptance probe (library convention) ──
     asserts: gsap + ScrollTrigger + FrameScrubImg present, a PINNED ScrollTrigger
     exists (or static path), the .fsi-frame painted a decoded image, 0 real errors.
     component.js sets __LAB_OK__ on ready; this re-confirms + adds the error gate. -->
<script>(function(){
  var errs=0; var _e=console.error; console.error=function(){
    var s=Array.prototype.join.call(arguments," ");
    if(!/Failed to load resource|ERR_FILE_NOT_FOUND|net::ERR|favicon/.test(s)) errs++;
    return _e.apply(console,arguments);
  };
  var tries=0;
  function painted(im){ return im && (im.complete ? im.naturalWidth>0 : false); }
  function ready(){
    try{
      var reduce = matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
      var narrow = matchMedia && matchMedia('(max-width:820px)').matches;
      var stPinned = (window.ScrollTrigger && ScrollTrigger.getAll)
        ? ScrollTrigger.getAll().some(function(st){ return st.pin; }) : false;
      var frame = document.querySelector('.fsi-frame');
      var engineOK = !!(window.gsap && window.ScrollTrigger && window.FrameScrubImg);
      var motionOK = (reduce || narrow) ? painted(frame) : (stPinned && painted(frame));
      var ok = errs===0 && engineOK && motionOK;
      window.__LAB_OK__ = !!ok;
      if(!ok && tries<40){ tries++; return setTimeout(ready,150); }
    }catch(e){ window.__LAB_OK__=false; }
  }
  window.addEventListener('load',function(){ setTimeout(ready,400); });
})();</script>
</body>
</html>
