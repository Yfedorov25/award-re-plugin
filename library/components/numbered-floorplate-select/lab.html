<!--
================================================================================
  TECHNIQUE LAB · numbered-floorplate-select  (EVER visual-search Level 2)
================================================================================
  Pick a UNIT on a CLEAN REDRAWN vector floor plan where the NUMBER IS the UI (NOT the developer
  raw plan image + a text wall = the smarts mistake). Inline SVG line-art substrate; per-unit
  footprint <path data-nr> in the SAME viewBox; each unit gets a NUMBER PILL at its COMPUTED
  CENTROID (engine, never hand-placed). Hover -> footprint wash + pill scale + top info card; dead
  units 'not on sale', live units reveal '+'. Harvested from D_ever_visualsearch_video.md (§3). NO WebGL.
================================================================================
-->
