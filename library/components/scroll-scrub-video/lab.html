<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · scroll-scrub-video · architect camera move, scrubbed frame-by-frame (no decoder jank)</title>

<!--
================================================================================
  TECHNIQUE LAB · scroll-scrub-video
================================================================================
  Scroll-scrubs an architect's camera move (a 3D fly-around / descent) frame by frame
  as you scroll — the Apple/AirPods technique: a PRE-EXTRACTED image sequence painted
  to a <canvas>, NOT video.currentTime (which stutters because the clip is 1 keyframe
  per ~192 frames, so every seek decodes the whole GOP). Zero decoder lag, 60fps.

  THE MOVE: the section PINS full-screen; scroll progress 0..1 maps to frame 0..N-1
  (a lerped, eased index so it glides); the canvas paints that frame. A preload gate
  holds (showing 0..100) until enough frames are decoded.

  ASSET-SUBSTITUTION GATE: OUR nahirna arrival/descent fly-in (120 frames, 1280x720)
  + UA copy. NO WebGL (2d canvas). window.__LAB_OK__ once preloaded.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{
    --ssv-bg:#0e1512; --ssv-ink:#e9e2d2;
    --ssv-serif:'Fraunces',Georgia,serif; --ssv-sans:'Inter',system-ui,sans-serif;
    --green:#0e1512; --cream:#e9e2d2;
  }
  *{margin:0;box-sizing:border-box}
  html,body{background:var(--green);color:var(--cream);font-family:'Inter',system-ui,sans-serif}
  .spacer{height:100vh;display:grid;place-items:center;color:var(--cream);opacity:.5;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  .ssv-content{display:flex;align-items:flex-end;padding:0 clamp(28px,5vw,80px) clamp(40px,8vh,80px)}
  .ssv-content .cap{max-width:30ch}
  .ssv-content .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cream);opacity:.7;margin-bottom:.5rem}
  .ssv-content h2{font-family:var(--ssv-serif);font-weight:300;font-size:clamp(1.6rem,3.2vw,2.8rem);line-height:1.1;letter-spacing:-.01em}
  /* subtle bottom scrim so copy reads over any frame (scrim is static, not over the scrubbed paint as a filter) */
  .ssv-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to top, rgba(8,12,10,.6) 0%, rgba(8,12,10,0) 38%)}
</style>
</head>
<body>

  <div class="spacer">скрол — камера обльоту рухається кадр за кадром ↓</div>

  <section class="ssv-stage" id="scrub">
    <canvas class="ssv-canvas"></canvas>
    <div class="ssv-scrim"></div>
    <div class="ssv-content">
      <div class="cap">
        <div class="eyebrow">Власний берег · обліт</div>
        <h2>Камера спускається до води — у вашому темпі.</h2>
      </div>
    </div>
    <div class="ssv-preload">0%</div>
  </section>

  <div class="spacer">кінець</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      lenis.on('scroll', function(){ if (window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    ScrollScrubVideo.init('#scrub', {
      frames: 'renders/arrival-frames/f_', count: 120, pad: 3, ext: '.webp', start: 1,
      pinFactor: 2.0, lerp: 0.16, preloadMin: 0.5, manageLenis: false
    });
  })();
</script>
</body>
</html>
