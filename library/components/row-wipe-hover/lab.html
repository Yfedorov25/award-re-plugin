<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · row-wipe-hover · Saisei nav-row hover (tan wipe + underline + kanji flip)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<style>
  :root{--cream:#f1ebd6;--ink:#1a1813;--rwh-band:#d8cdb0;--rwh-serif:'Fraunces',serif}
  *{margin:0;box-sizing:border-box}html,body{height:100%}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',system-ui;display:grid;place-items:center}
  .nav{width:min(560px,80vw)}
  .rwh-row{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.4}
  .rwh-ordinal{font-size:1rem}
  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font:600 .7rem/1 'Inter';letter-spacing:.16em;text-transform:uppercase;opacity:.5}
</style></head><body>
  <div class="nav" id="nav">
    <div class="rwh-row"><span class="rwh-ordinal" data-kanji="家">01</span>&nbsp;Головна</div>
    <div class="rwh-row"><span class="rwh-ordinal" data-kanji="革新">02</span>&nbsp;Проєкт</div>
    <div class="rwh-row"><span class="rwh-ordinal" data-kanji="地">03</span>&nbsp;Локація</div>
    <div class="rwh-row"><span class="rwh-ordinal" data-kanji="話">04</span>&nbsp;Контакти</div>
  </div>
  <div class="hint">наведи на рядок — tan-wipe + лінія + кандзі-фліп</div>
<script src="component.js"></script>
<script>(function(){ RowWipeHover.create('#nav'); try{window.__LAB_OK__=true}catch(e){} })();</script>
</body></html>
