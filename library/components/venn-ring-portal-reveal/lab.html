<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · venn-ring-portal-reveal · 11tanjung (3 rings → centre clip-mask portal opens the render)</title>

<!--
================================================================================
  TECHNIQUE LAB · venn-ring-portal-reveal
================================================================================
  11tanjung's signature portal — 3 outline circles (overlapping = venn). On scroll the
  SIDE circles fill -> hollow -> shrink to dots; the CENTRE circle is a clip-path:circle
  portal that opens onto a full-bleed render (+counter-scale 1.15->1). Harvested from
  D_11tanjung (C1; b024 thin rings -> b033 portal opening -> b048 full). OUR QUADRO
  render. NO WebGL. window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --brown:#6b5e4f; --cream:#e6e0d4; --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{height:100%}
  body{background:var(--brown);color:var(--cream);font-family:var(--sans)}
  .spacer{height:140vh;display:grid;place-items:center;background:var(--brown);color:var(--cream);opacity:.5;
    font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  .vrp-stage{ --vrp-bg:#6b5e4f; --vrp-stroke:#e6e0d4; --vrp-d:24vw; --vrp-gap:-3%; }
  /* per-ring label inside it (/01 LIVE WITH STANDARD etc.) */
  .vrp-ring .lbl{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    text-align:center;line-height:1.5;color:var(--cream);opacity:.9}
  .vrp-ring .lbl b{display:block;font-family:var(--serif);font-style:italic;font-size:1.4rem;letter-spacing:0;text-transform:none;margin-bottom:.3rem}
  .pill{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(30,26,23,.42);backdrop-filter:blur(12px);border:1px solid rgba(244,241,234,.14);
    border-radius:14px 14px 22px 22px;padding:.5rem 1.4rem;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--cream)}
</style>
</head>
<body>

  <section class="vrp-stage" id="venn">
    <div class="vrp-render"><img src="renders/terrace.webp" alt="QUADRO"></div>
    <div class="vrp-rings">
      <div class="vrp-ring"><span class="lbl"><b>01</b>життя зі<br>стандартом</span></div>
      <div class="vrp-ring vrp-ring--portal"></div>
      <div class="vrp-ring"><span class="lbl"><b>03</b>життя без<br>компромісів</span></div>
    </div>
    <div class="pill">11 tanjung</div>
  </section>

  <div class="spacer">скрол ↓ — кільця стискаються, центральний портал відкриває рендер</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp:0.1, smoothWheel:true });
      lenis.on('scroll', function(){ if(window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    VennRingPortalReveal.create('#venn', { fillEnd:0.4, pinFactor:1.4, ease:'power2.out', manageLenis:false });
  })();
</script>
</body>
</html>
