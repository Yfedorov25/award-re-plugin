<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · brand-overlay-crossfade · VIDEO under the wash (autoplay loop, tint → 0)</title>

<!--
================================================================================
  TECHNIQUE LAB (variant) · brand-overlay-crossfade WITH A VIDEO
================================================================================
  Same engine as lab.html, but the media under the brand wash is a <video autoplay
  muted loop> instead of an <img>. With fadeImage:false the engine NEVER touches the
  media — it only tints the wash 1 → 0 — so a live video plays the whole time while
  the brand tint drains off the pinned full-bleed frame. (Scenario A: video plays
  itself, scroll clears the tint. NOT scroll-scrubbed currentTime.)

  Media: OUR nahirna render (water, golden hour) playing under a green brand wash.
  NO WebGL. window.__LAB_OK__ on init.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --green:#16302a; --cream:#e9e2d2; --serif:'Fraunces',Georgia,serif; }
  *{margin:0;box-sizing:border-box}
  html,body{background:var(--green);color:var(--cream);font-family:'Inter',system-ui,sans-serif}
  .spacer{height:100vh;display:grid;place-items:center;color:var(--cream);opacity:.5;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  /* the media layer holds a <video> here instead of an <img> */
  .boc-img video{width:100%;height:100%;object-fit:cover;display:block}

  .boc-stage{ --boc-wash:#16302a; }
  .boc-content{display:flex;align-items:flex-end;padding:0 clamp(28px,5vw,80px) clamp(40px,8vh,80px)}
  .boc-content p{max-width:34ch;font-size:clamp(.95rem,1.2vw,1.1rem);line-height:1.6;color:var(--cream)}
</style>
</head>
<body>

  <div class="spacer">скрол — відео грає, а зелений wash стікає з нього ↓</div>

  <section class="boc-stage" id="reveal">
    <div class="boc-img">
      <video src="renders/nahirna-water.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>
    <div class="boc-wash"></div>
    <div class="boc-content"><p>Власний берег. Вода, що дихає поряд щодня.</p></div>
  </section>

  <div class="spacer">кінець</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      lenis.on('scroll', function(){ if (window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    // fadeImage:false => the engine only tints the wash; the <video> is never touched and keeps playing.
    BrandOverlayCrossfade.init('#reveal', { wash: 1.0, fadeImage: false, manageLenis: false });
  })();
</script>
</body>
</html>
