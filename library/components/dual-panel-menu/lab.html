<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · dual-panel-menu · Saisei split menu (cream nav left / dark identity right)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{ --cream:#f1ebd6; --ink:#1a1813; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{height:100%}
  body{background:#0c0c0a;color:var(--cream);font-family:var(--sans);overflow:hidden}
  .pagebg{position:fixed;inset:0;z-index:0}
  .pagebg img{width:100%;height:100%;object-fit:cover;opacity:.5}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:9995;display:flex;justify-content:space-between;padding:22px clamp(28px,5vw,64px)}
  .topbar .brand{font-family:var(--serif);letter-spacing:.18em}
  .topbar button{background:none;border:0;color:var(--cream);font:600 .72rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}

  /* the cream nav panel (left) */
  .dpm-left{background:var(--cream);color:var(--ink);padding:14vh clamp(28px,4vw,64px)}
  .dpm-left .num{font-family:var(--serif);opacity:.4;margin-right:.8em;font-size:1rem}
  .dpm-item.nav{display:flex;align-items:baseline;font-family:var(--serif);font-weight:300;
    font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.5;letter-spacing:-.01em}

  /* the dark identity panel (right) */
  .dpm-right{background:var(--ink);color:var(--cream);padding:14vh clamp(28px,4vw,64px);display:flex;flex-direction:column;justify-content:space-between}
  .dpm-right .mono{font-family:var(--serif);font-size:clamp(3rem,6vw,5rem);opacity:.9}
  .dpm-right .contact .lbl{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:.3rem}
  .dpm-right .contact .val{font-family:var(--serif);font-size:1.1rem;margin-bottom:1.2rem}
</style>
</head>
<body>
  <div class="pagebg"><img src="renders/terrace.webp" alt=""></div>
  <div class="topbar"><div class="brand">QUADRO</div><button id="toggle">меню</button></div>

  <div class="dpm-scrim"></div>
  <div class="dpm-root" id="menu">
    <div class="dpm-left">
      <div class="dpm-item nav"><span class="num">01</span>Головна</div>
      <div class="dpm-item nav"><span class="num">02</span>Проєкт</div>
      <div class="dpm-item nav"><span class="num">03</span>Планування</div>
      <div class="dpm-item nav"><span class="num">04</span>Локація</div>
      <div class="dpm-item nav"><span class="num">05</span>Контакти</div>
    </div>
    <div class="dpm-right">
      <div class="dpm-item mono">再生</div>
      <div class="contact">
        <div class="dpm-item"><div class="lbl">Email</div><div class="val">hello@quadro.house</div></div>
        <div class="dpm-item"><div class="lbl">Телефон</div><div class="val">+380 67 989 12 51</div></div>
        <div class="dpm-item"><div class="lbl">Адреса</div><div class="val">Власний берег, 2025</div></div>
      </div>
    </div>
  </div>

<script src="component.js"></script>
<script>
  (function(){
    var menu = DualPanelMenu.create('#menu', { duration:0.7, ease:'power3.inOut', split:0.5, contentDelay:0.25, contentStagger:0.07 });
    document.getElementById('toggle').addEventListener('click', function(){ menu.toggle(); });
    setTimeout(function(){ menu.open(); }, 600);   // autoplay open
    try{ window.__LAB_OK__ = true; }catch(e){}
  })();
</script>
</body>
</html>
