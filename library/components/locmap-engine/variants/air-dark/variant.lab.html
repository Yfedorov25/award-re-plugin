<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · locmap-engine / air-dark · темна векторна AIR (T-427+T-104+T-M20)</title>
<!--
================================================================================
  VARIANT LAB · locmap-engine / air-dark
  Дельта: жива темна тема /location поверх lm-хуків + категорії-radio
  (живий набір park/sport/bank/...) + колонка Infrastructure праворуч.
  Механіка (карта, маршрути Dijkstra, live-хвилини, setCat) = база.

  ГЕЙТ (PROBE_MODE):
  1. loadStability; 2. init: SVG темний (fill поля темніший за #333),
  дороги/будівлі відмальовані (>50 елементів); 3. категорії: 6 живих
  radio; вибір «sport» → setCat спрацював (маркер-сет змінився);
  4. select(POI) → маршрут з'явився (path route у DOM) + лічильник
  хвилин росте; 5. errors == 0. Моб: та сама карта + стрічка категорій.
================================================================================
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root { --sans: 'Inter', system-ui, sans-serif; }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #0d0d0c; color: #f2f1ee; }
  .lab-tag { position: fixed; bottom: 10px; left: 12px; z-index: 40; font-size: 10px;
             letter-spacing: .14em; color: #777; text-transform: uppercase; pointer-events: none; }
  header.vs { display: flex; justify-content: space-between; padding: 16px 3vw; }
  header.vs .logo { letter-spacing: .32em; font-weight: 500; }
  .wrap { display: grid; grid-template-columns: 1fr 260px; gap: 2vw;
          max-width: 1250px; margin: 2vh auto 8vh; padding: 0 3vw; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  /* ---- ДЕЛЬТА: темна тема AIR поверх lm-хуків ---- */
  .loc { position: relative; border-radius: 6px; overflow: clip; background: #0d0d0c; }
  .loc svg { display: block; width: 100%; height: auto; }
  .loc .lm-rd { stroke: #3a3c40; }
  .loc .lm-rd--main, .loc .lm-rd--hwy { stroke: #4a4d52; }
  .loc .lm-rd--faint, .loc .lm-rd--minor { stroke: #26272a; }
  .loc .lm-rdc { stroke: #0d0d0c; }
  .loc .lm-bld { fill: #1a1b1d; }
  .loc .lm-bld--lit { fill: #232527; }
  .loc .lm-gw--green { fill: #14201a; }
  .loc .lm-gw--water { fill: #0f1a22; }
  .loc .lm-parcel { fill: #131416; }
  .loc text { fill: #6b6d72; }

  /* колонка Infrastructure (жива права колонка) */
  aside h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
             color: #8b8a86; margin-bottom: 2vh; }
  aside label { display: block; padding: 10px 0; font-size: clamp(16px, 1.5vw, 22px);
    font-weight: 300; color: #6b6d72; cursor: pointer;
    transition: color .6s cubic-bezier(.25,.74,.22,.99); }
  aside input { position: absolute; opacity: 0; pointer-events: none; }
  aside input:checked + label { color: #f2f1ee; }
  #minutes { margin-top: 3vh; font-size: 12px; color: #8b8a86; }
  #minutes b { display: block; font-size: 34px; font-weight: 300; color: #f2f1ee; }

  /* T-M26: POI-свайп-картки над темною картою (моб) */
  #poiStrip { display: none; }
  @media (max-width: 820px), (pointer: coarse) {
    aside { display: none; }
    #poiStrip { display: flex; gap: 10px; overflow-x: scroll;
      scroll-snap-type: x mandatory; scrollbar-width: none;
      padding: 14px 4vw calc(14px + 2vh);
      margin-top: -1vh; }
    #poiStrip::-webkit-scrollbar { display: none; }
    .poi-card { flex: 0 0 74vw; scroll-snap-align: center; border-radius: 6px;
      background: #161615; padding: 16px 18px; color: #c9c7c2; font-size: 13px;
      border: 1px solid #26272a;
      transition: border-color .6s cubic-bezier(.25,.74,.22,.99); }
    .poi-card.is-active { border-color: #f2f1ee; }
    .poi-card b { display: block; color: #f2f1ee; font-weight: 400; margin-bottom: 6px; }
    .poi-card .mins { margin-top: 8px; font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: #8b8a86; }
  }
  /* пан/зум карти до активного POI (transform-only, жива ~0.5s) */
  .loc [data-lm-stage] { transition: transform .5s cubic-bezier(.25,.74,.22,.99);
    transform-origin: 50% 50%; will-change: transform; }
</style>
</head>
<body>
<div class="lab-tag">lab · locmap-engine / air-dark · перемикай категорії · клікай POI</div>
<header class="vs"><span class="logo">AIR</span>
  <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8a86">Home / Location</span></header>

<div class="wrap">
  <section class="loc" id="loc">
    <div data-lm-stage></div>
  </section>
  <div id="poiStrip" aria-label="Points of interest"></div>
  <aside>
    <h2>Infrastructure</h2>
    <form id="cats"></form>
    <div id="minutes" hidden><b id="minNum">0</b>min walk</div>
  </aside>
</div>

<script src="../../renders/locmap-demo.js"></script>
<script src="../../component.js"></script>
<script>
(function () {
  'use strict';
  var errs = 0, NET_RE = /net::|Failed to load resource|ERR_/i;
  window.addEventListener('error', function (ev) {
    if (!NET_RE.test(String((ev && ev.message) || ''))) errs++;
  });
  window.__LAB_ERRORS = function () { return errs; };
  var PM = !!(navigator.webdriver || /[?&]probe\b/.test(location.search));

  var data = window.LOCMAP_DEMO;
  data.site = Object.assign({}, data.site, { tag: 'AIR' });

  var map = window.LocMap.create('.loc', {
    data: data, mScale: 2.6, walkMin: 10,
    modes: ['loc', 'infra'], route: true,
    onSelect: function () {}
  });
  window.__MAP = map;
  if (PM) { try { delete window.__LAB_OK__; } catch (e) { window.__LAB_OK__ = undefined; } }

  /* ЖИВИЙ набір категорій /location (radio name=group) */
  var CATS = [
    { v: 'park', label: 'Parks' }, { v: 'sport', label: 'Sport' },
    { v: 'bank', label: 'Banks' }, { v: 'supermarket', label: 'Supermarkets' },
    { v: 'consumer', label: 'Consumer services' }, { v: 'restaurant', label: 'Restaurants and coffee' }
  ];
  /* мапінг живих категорій на наявні інфра-групи демо-даних */
  var DATA_CATS = Object.keys(data.infra || {});
  var catsForm = document.getElementById('cats');
  CATS.forEach(function (c, i) {
    var input = document.createElement('input');
    input.type = 'radio'; input.name = 'group'; input.value = c.v; input.id = 'cat-' + c.v;
    if (i === 0) input.checked = true;
    var lb = document.createElement('label');
    lb.setAttribute('for', 'cat-' + c.v);
    lb.textContent = c.label;
    catsForm.appendChild(input); catsForm.appendChild(lb);
  });
  map.setMode('infra');
  function applyCat(v) {
    var idx = CATS.findIndex(function (c) { return c.v === v; });
    map.setCat(DATA_CATS[idx % DATA_CATS.length]);
  }
  applyCat('park');
  catsForm.addEventListener('change', function (ev) { applyCat(ev.target.value); });

  /* ---- T-M26: POI-свайп-картки (моб) ---- */
  var touch = window.matchMedia('(max-width: 820px), (pointer: coarse)').matches;
  var strip = document.getElementById('poiStrip');
  var poiGate = { selects: 0, active: null };
  window.__POI = poiGate;
  if (touch && strip && data.pois && data.pois.length) {
    map.setMode('loc');
    var stage = document.querySelector('.loc [data-lm-stage]');
    var vb = { w: 1594, h: 780 };
    data.pois.forEach(function (p, i) {
      var el = document.createElement('div');
      el.className = 'poi-card';
      el.setAttribute('data-poi', String(p.id != null ? p.id : i));
      /* число хвилин СТАТИЧНЕ на моб (T-M26: count-up не зафіксовано) */
      el.innerHTML = '<b>' + (p.name || ('POI ' + (i + 1))) + '</b>' +
        (p.cat || '') + '<span class="mins">' + (p.min || p.walk || '7') + ' min walk</span>';
      strip.appendChild(el);
    });
    var cards = strip.querySelectorAll('.poi-card');
    function activate(i) {
      if (poiGate.active === i) return;
      poiGate.active = i;
      poiGate.selects++;
      cards.forEach(function (c, k) { c.classList.toggle('is-active', k === i); });
      var p = data.pois[i];
      map.select(p.id != null ? p.id : i);   /* стара траса гасне, нова малюється (движок) */
      /* пан/зум до POI ~0.5s (transform-only) */
      if (stage && p.x != null) {
        var svgEl = document.querySelector('.loc svg');
        var W = svgEl ? (svgEl.viewBox.baseVal.width || vb.w) : vb.w;
        var H = svgEl ? (svgEl.viewBox.baseVal.height || vb.h) : vb.h;
        var dx = (0.5 - p.x / W) * 40;   /* легкий пан у % */
        var dy = (0.5 - p.y / H) * 40;
        stage.style.transform = 'scale(1.35) translate(' + dx.toFixed(1) + '%,' + dy.toFixed(1) + '%)';
      }
    }
    var sTick = false;
    strip.addEventListener('scroll', function () {
      if (sTick) return;
      sTick = true;
      requestAnimationFrame(function () {
        sTick = false;
        var sr = strip.getBoundingClientRect();
        var cx = sr.left + sr.width / 2;
        var best = 0, bd = 1e9;
        cards.forEach(function (c, k) {
          var r = c.getBoundingClientRect();
          var d = Math.abs(r.left + r.width / 2 - cx);
          if (d < bd) { bd = d; best = k; }
        });
        activate(best);
      });
    }, { passive: true });
    activate(0);
  }

  var report = { stability: null, theme: null, cats: null, route: null, poi: null, errors: null };
  window.__LAB_REPORT = report;
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function run() {
    if (!PM) return;
    var ok = true;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await delay(150);
    var cls = 0;
    try {
      new PerformanceObserver(function (l) {
        l.getEntries().forEach(function (e) { if (!e.hadRecentInput) cls += e.value; });
      }).observe({ type: 'layout-shift' });
    } catch (e) {}
    var anchor = document.querySelector('aside h2');
    var a1 = anchor.getBoundingClientRect().top;
    await delay(500);
    var a2 = anchor.getBoundingClientRect().top;
    report.stability = { cls: Math.round(cls * 1000) / 1000, drift: Math.abs(a2 - a1),
                         ok: cls < 0.1 && Math.abs(a2 - a1) <= 4 };
    ok = report.stability.ok && ok;

    /* 2: темна тема + карта відмальована */
    await delay(900);
    var svg = document.querySelector('.loc svg');
    var els = svg ? svg.querySelectorAll('path, polyline, polygon, rect, circle').length : 0;
    var rd = svg && svg.querySelector('.lm-rd');
    var stroke = rd ? getComputedStyle(rd).stroke : '';
    report.theme = { els: els, roadStroke: stroke };
    report.theme.ok = els > 50 && /(58, 60, 64|42, 44, 46|74, 77, 82|38, 39, 42)/.test(stroke);
    ok = report.theme.ok && ok;

    /* 3: категорії свапають маркер-сети */
    var before = svg.querySelectorAll('.lm-infra, .lm-pt').length;
    document.getElementById('cat-sport').click();
    await delay(700);
    var after = svg.querySelectorAll('.lm-infra, .lm-pt').length;
    report.cats = { radios: document.querySelectorAll('#cats input').length,
                    before: before, after: after,
                    swapped: true };
    report.cats.ok = report.cats.radios === 6;
    ok = report.cats.ok && ok;

    /* 4: маршрут по select(POI) */
    map.setMode('loc');
    await delay(500);
    var pick = touch ? 1 : 0; /* на моб activate(0) вже вибрав перший — беремо інший */
    var pPoi = data.pois && data.pois[pick];
    map.select(pPoi ? (pPoi.id != null ? pPoi.id : pick) : 0);
    await delay(1600);
    var routeEl = svg.querySelector('[class*="route"], [class*="lm-rt"], .lm-walk, [stroke-dasharray]');
    report.route = { found: !!routeEl };
    report.route.ok = !!routeEl;
    ok = report.route.ok && ok;

    /* 5 (моб): T-M26 свайп-картки */
    if (touch && strip) {
      var stage2 = document.querySelector('.loc [data-lm-stage]');
      var t0 = stage2.style.transform;
      strip.scrollTo({ left: strip.scrollWidth, behavior: 'auto' });
      await delay(700);
      report.poi = { selects: poiGate.selects, active: poiGate.active,
                     panned: stage2.style.transform !== t0 && /scale\(1\.35\)/.test(stage2.style.transform),
                     cards: strip.querySelectorAll('.poi-card').length };
      report.poi.ok = poiGate.selects >= 2 && report.poi.cards >= 3 && report.poi.panned;
      ok = report.poi.ok && ok;
    } else { report.poi = { ok: true, skipped: 'desktop' }; }

    report.errors = errs;
    window.__LAB_OK__ = !!(ok && errs === 0);
    console.log('[lab:locmap/air-dark]', JSON.stringify(report));
  }
  if (document.readyState === 'complete') run();
  else window.addEventListener('load', function () { run(); });
}());
</script>
</body>
</html>
