<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · floating-product-orbit · gapsy (object floats on a red pedestal, idle + pointer-tilt parallax, NO WebGL)</title>

<!--
================================================================================
  TECHNIQUE LAB · floating-product-orbit
================================================================================
  gapsystudio's services "product on a pedestal" — a staged object floating above a red
  plinth: idle float + pointer-tilt parallax in a CSS perspective scene. HONEST NO-WebGL
  translation of gapsy's live-3D product (approximation, not a real 3D mesh). Harvested
  from D_gapsy (D /services). OUR QUADRO macro render as the object. NO WebGL. window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">

<style>
  :root{ --studio:#f2f2f0; --ink:#16150f; --red:#f0473e; --display:'Anton',sans-serif; --script:'Caveat',cursive; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{min-height:100%}
  body{background:var(--studio);color:var(--ink);font-family:var(--sans);
    display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4vw;min-height:100vh;padding:8vh 7vw}
  .copy{max-width:38ch}
  .copy .script{font-family:var(--script);font-size:1.6rem;color:var(--ink);margin-bottom:.5rem}
  .copy .script .q{color:var(--red)}
  .copy h2{font-family:var(--display);font-size:5.4vw;line-height:.98;margin-bottom:1.4rem}
  .copy p{font-size:1rem;line-height:1.65;margin-bottom:1.6rem;opacity:.85;max-width:34ch}
  .copy .cta{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;border:1px solid var(--ink);border-radius:8px;text-decoration:none;color:var(--ink)}

  .fpo-stage{ --fpo-bg:#e9e9e6; --fpo-h:66vh; --fpo-radius:16px; --fpo-persp:1100px; }
</style>
</head>
<body>

  <div class="copy">
    <div class="script"><span class="q">“</span>Обертай об'єкт — він живе на сцені<span class="q">”</span></div>
    <h2>UX-аудит</h2>
    <p>Веди курсором по сцені — об'єкт нахиляється до тебе, п'єдестал і кільце реагують глибше (parallax). Без WebGL.</p>
    <a class="cta" href="#">Дивитись більше ›</a>
  </div>

  <div class="fpo-stage" id="orbit">
    <div class="fpo-scene">
      <div class="fpo-pedestal"></div>
      <div class="fpo-ring"></div>
      <div class="fpo-object"><img src="renders/macro-table.webp" alt="QUADRO об'єкт"></div>
    </div>
  </div>

<script src="component.js"></script>
<script>
  window.__fpo = FloatingProductOrbit.create('#orbit', { maxTilt:16, depth:0.42, float:10, lerp:0.08, idle:true });
</script>
</body>
</html>
