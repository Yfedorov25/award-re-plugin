<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · grid-skeleton-draw · Saisei grid skeleton (column rules stroke in)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{--cream:#f1ebd6;--ink:#2a2418}*{margin:0;box-sizing:border-box}html,body{height:100%}
  body{background:var(--cream);overflow:hidden}
  .field{position:fixed;inset:0}
  .mono{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Fraunces',serif;font-size:2.4rem;color:var(--ink)}
  .replay{position:fixed;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);color:var(--cream);background:var(--ink);border:0;padding:.55rem 1rem;font:600 .68rem/1 system-ui;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
</style></head><body>
  <div class="field" id="field"></div>
  <div class="mono">木</div>
  <button class="replay" id="replay">▶ накреслити сітку</button>
<script src="component.js"></script>
<script>(function(){
  var g=GridSkeletonDraw.create('#field',{cols:[7,33,50,67,93],colour:'#2a2418',opacity:.2,dur:0.6,stagger:0.08,origin:'center'});
  function play(){ g.set(0); requestAnimationFrame(function(){ g.draw(); }); }
  document.getElementById('replay').addEventListener('click',play); setTimeout(play,500);
  try{window.__LAB_OK__=true}catch(e){}
})();</script>
</body></html>
