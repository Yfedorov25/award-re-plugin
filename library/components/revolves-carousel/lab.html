<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · revolves-carousel · T-119-переклад (clip+scale+blur замість шейдера)</title>
<!--
================================================================================
  LAB: revolves-carousel — T-119-переклад на ЖИВИХ фото /about
  (image-1/2/3 revolves, 1176×672 hotlink). Свап = clip L→R за напрямом
  + scale 1.06→1 + blur 8→0 (вх.) / scale→0.97 + fade (вих.), 1s
  ease-out; лічильник на старті; thumbnails активний стан.

  ГЕЙТ (PROBE_MODE):
  1. loadStability; 2. next(): лічильник «2» ОДРАЗУ, вхідний слайд
  у польоті (clip-path інтерпольований, є анімації), thumb-2 active;
  через 1.2s старий схований; 3. prev(): клип з протилежного краю
  (inset left>0 на старті); 4. thumbnail-клік → go(2); 5. errors 0.
  mobile: rvc-strip (snap-стрічка, thumbnails/стрілки сховані).
================================================================================
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<style>
  :root { --sans: 'Inter', system-ui, sans-serif; }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: #f4f2ee; color: #111110; }
  .lab-tag { position: fixed; bottom: 10px; left: 12px; z-index: 20; font-size: 10px;
             letter-spacing: .14em; color: #999; text-transform: uppercase; pointer-events: none; }
  .wrap { max-width: 1100px; margin: 6vh auto 10vh; padding: 0 3vw; }
  h1 { font-size: clamp(26px, 3.4vw, 44px); font-weight: 300; margin-bottom: 3vh; }
  [data-rvc-stage] { aspect-ratio: 1176 / 672; }
  .bar { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .bar button.nav { width: 48px; height: 48px; border-radius: 4px; font-size: 18px;
    border: 1px solid rgba(17,17,16,.3); background: none; cursor: pointer; }
  .cnt { font-size: 13px; color: #6b6b68; min-width: 4em; }
  .cnt b { font-weight: 300; font-size: 26px; color: #111110; }
</style>
</head>
<body>
<div class="lab-tag">lab · revolves-carousel · t-119-переклад · тисни ‹ › або thumbnail</div>

<div class="wrap">
  <h1>Architecture that revolves</h1>
  <div data-rvc id="rvc">
    <div data-rvc-stage>
      <figure data-rvc-slide><img src="https://aircenter.space/media/cache/about_resolves_carousel_img_xxl/assets/images/media/about/5.revolves/image-1%40xxxl.webp" alt=""></figure>
      <figure data-rvc-slide><img src="https://aircenter.space/media/cache/about_resolves_carousel_img_xxl/assets/images/media/about/5.revolves/image-2%40xxxl.webp" alt=""></figure>
      <figure data-rvc-slide><img src="https://aircenter.space/media/cache/about_resolves_carousel_img_xxl/assets/images/media/about/5.revolves/image-3%40xxxl.webp" alt=""></figure>
    </div>
    <div class="bar">
      <button class="nav" data-rvc-prev aria-label="previous">‹</button>
      <span class="cnt"><b data-rvc-count>1</b> <span data-rvc-total>/ 3</span></span>
      <button class="nav" data-rvc-next aria-label="next">›</button>
      <div data-rvc-thumbs></div>
    </div>
  </div>
</div>

<script src="component.js"></script>
<script>
(function () {
  'use strict';
  var errs = 0, NET_RE = /net::|Failed to load resource|ERR_/i;
  window.addEventListener('error', function (ev) {
    if (!NET_RE.test(String((ev && ev.message) || ''))) errs++;
  });
  window.__LAB_ERRORS = function () { return errs; };
  var PM = !!(navigator.webdriver || /[?&]probe\b/.test(location.search));
  var touch = window.matchMedia('(pointer: coarse), (max-width: 768px)').matches;

  var rvc = window.RevolvesCarousel.create('#rvc', {});
  window.__RVC = rvc;

  var slides = document.querySelectorAll('[data-rvc-slide]');
  var count = document.querySelector('[data-rvc-count]');
  var report = { stability: null, fwd: null, back: null, thumb: null, mob: null, errors: null };
  window.__LAB_REPORT = report;
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clipLeft(el) {
    var c = getComputedStyle(el).clipPath || '';
    var m = /inset\(\s*[\d.]+(?:px|%)?\s+[\d.]+(?:px|%)?\s+[\d.]+(?:px|%)?\s+([\d.]+)(px|%)/.exec(c);
    return m ? parseFloat(m[1]) : -1;
  }

  async function run() {
    if (!PM) { window.__LAB_OK__ = 'live-mode'; return; }
    var ok = true;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await delay(120);
    var cls = 0;
    try {
      new PerformanceObserver(function (l) {
        l.getEntries().forEach(function (e) { if (!e.hadRecentInput) cls += e.value; });
      }).observe({ type: 'layout-shift' });
    } catch (e) {}
    var anchor = document.querySelector('h1');
    var a1 = anchor.getBoundingClientRect().top;
    await delay(500);
    var a2 = anchor.getBoundingClientRect().top;
    report.stability = { cls: Math.round(cls * 1000) / 1000, drift: Math.abs(a2 - a1),
                         ok: cls < 0.1 && Math.abs(a2 - a1) <= 4 };
    ok = report.stability.ok && ok;

    if (touch) {
      var strip = document.getElementById('rvc').classList.contains('rvc-strip');
      var snap = (getComputedStyle(document.querySelector('[data-rvc-stage]')).scrollSnapType || '').indexOf('x') >= 0;
      report.mob = { strip: strip, snap: snap, ok: strip && snap };
      report.errors = errs;
      window.__LAB_OK__ = !!(ok && report.mob.ok && errs === 0);
      console.log('[lab:revolves-carousel:mob]', JSON.stringify(report));
      return;
    }

    /* 2: next — лічильник на старті + в польоті */
    document.querySelector('[data-rvc-next]').click();
    await delay(120);
    var early = { count: count.textContent,
                  animating: slides[1].getAnimations && slides[1].getAnimations().length > 0,
                  thumb2: document.querySelectorAll('.rvc-thumb')[1].classList.contains('is-active') };
    await delay(1300);
    report.fwd = { early: early, s1off: slides[0].classList.contains('is-off'),
                   s2on: !slides[1].classList.contains('is-off') };
    report.fwd.ok = early.count === '2' && early.animating && early.thumb2 &&
                    report.fwd.s1off && report.fwd.s2on;
    ok = report.fwd.ok && ok;

    /* 3: prev — клип з протилежного краю */
    document.querySelector('[data-rvc-prev]').click();
    await delay(100);
    var cl = clipLeft(slides[0]);
    await delay(1300);
    report.back = { clipLeftEarly: cl, count: count.textContent };
    report.back.ok = cl > 20 && count.textContent === '1';
    ok = report.back.ok && ok;

    /* 4: thumbnail → go(2) */
    document.querySelectorAll('.rvc-thumb')[2].click();
    await delay(1300);
    report.thumb = { idx: rvc.index(), count: count.textContent,
                     ok: rvc.index() === 2 && count.textContent === '3' };
    ok = report.thumb.ok && ok;

    report.errors = errs;
    window.__LAB_OK__ = !!(ok && errs === 0);
    console.log('[lab:revolves-carousel]', JSON.stringify(report));
  }
  if (document.readyState === 'complete') run();
  else window.addEventListener('load', function () { run(); });
}());
</script>
</body>
</html>
