<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · stacked-pairs · frs11 · text-left / render-right per section (BASE, 1:1)</title>

<!--
================================================================================
  TECHNIQUE LAB · stacked-pairs   ·   BASE = frs11-stacked-pairs (owner-approved)
================================================================================
  SOURCE: apps/quadro/public/slide-lab/frs11-stacked-pairs.html  ("це залишаємо")

  NOT a pinned stepper. A VERTICAL RHYTHM of distinct full-screen sections; each
  section = TEXT on the LEFT (~38%) + a BIG contained RENDER on the RIGHT (~62%,
  fixed 84vh, clean rounded-left frame, ~2cm gap, a thin bronze rule on the far-
  left edge of the text column, an index eyebrow + Fraunces serif heading with an
  italic-bronze keyword + sub, a small tag bottom-right of the render). The render
  is ALWAYS on the right. You scroll from one PAIR to the NEXT.

  THE MOVE: each section's render + text REVEAL as the section enters the
  viewport (scrub-driven, reverse-safe), with a SLOW continuous monotonic
  ken-burns on the render while it is on screen. NO pin, NO swap, NO clip.

  WHY PURE render(progress), NOT toggleActions: the first frs11 used a
  toggleActions tween and it FAILED to fire on load (sections already in view
  never got their enter callback). The FIX is a PURE function of each section's
  own viewport progress driven from a scrubbed ScrollTrigger onUpdate + painted
  once at init. Do NOT reintroduce toggleActions.

  ENGINE LAWS (verbatim from frs11): ONE smoother — Lenis 1.1.13 lerp 0.1
  smoothWheel -> gsap.ticker -> ScrollTrigger.update; lagSmoothing(0). GSAP
  3.12.5 + ScrollTrigger + CustomEase ("air" 0.25,0.74,0.22,0.99). Fraunces +
  Inter; bronze #c08a4e; transform / opacity ONLY; NO WebGL; NO mask-composite;
  NO mix-blend / backdrop over the scrubbed surface; NO video.currentTime;
  reduced-motion / <=820px -> static legible stack; zero em-dashes.

  RENDERS: renders/*.webp resolve via the renders symlink -> apps/quadro/public/proto.

  STACK: vanilla + GSAP 3.12.5 + ScrollTrigger + CustomEase + Lenis 1.1.13
  (cdnjs / jsdelivr). No build. Canonical drop-in:
  award-re-plugin/library/components/stacked-pairs/
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- eager-preload the first paired render (resolves via renders -> quadro/public/proto) -->
<link rel="preload" as="image" href="renders/day-34-portrait.webp">

<!-- the canonical component skin -->
<link rel="stylesheet" href="component.css">

<!-- GSAP + Lenis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>

  <section class="intro gate">
    <span class="intro__kicker">QUADRO HOUSE</span>
    <h1 class="intro__title">Шість поглядів на <em>один дім</em>.</h1>
    <span class="scrollcue">Гортайте</span>
  </section>

  <!-- empty container: the component builds the .pair sections from its slides -->
  <div class="pairs" id="pairs"></div>

  <section class="outro gate">
    <h2 class="outro__title">Один дім, у якому <em>хочеться лишитися</em>.</h2>
  </section>

<!-- the canonical component engine -->
<script src="component.js"></script>

<script>
  /* the frs11 stacked-pairs scene — a vertical rhythm of text-left / render-right
     sections, each revealing on scroll, ken-burns while on screen. NO pin.
     Builds into the #pairs container from the faithful frs11 slides; renders
     resolve via the renders symlink. */
  window.__SP = StackedPairs.init('#pairs');
</script>

<!-- ── __LAB_OK__ acceptance probe ──
     asserts: gsap + ScrollTrigger + Lenis present; the stacked deck built
     (>=2 .pair sections, OR the reduced-motion / narrow static branch); the
     reveal is wired (per-section ScrollTriggers live) and this technique does
     NOT pin (no pinned ScrollTrigger); no em-dash in visible copy; zero real
     console.error. -->
<script>(function(){
  var errs=0; var _e=console.error;
  console.error=function(){var s=Array.prototype.join.call(arguments," ");
    if(!/Failed to load resource|ERR_FILE_NOT_FOUND|net::ERR|decode/i.test(s)) errs++;
    return _e.apply(console,arguments);};
  window.__LAB_ERRORS=function(){return errs;};

  function gather(){
    var reduce = matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
    var narrow = matchMedia && matchMedia('(max-width:820px)').matches;
    var hasGsap = !!window.gsap;
    var hasST   = !!window.ScrollTrigger;
    var hasLenis= !!window.Lenis;

    var isStatic = !!(window.__SP && window.__SP.static);
    var pairs = document.querySelectorAll('#pairs .pair').length;

    var stCount = (window.ScrollTrigger && ScrollTrigger.getAll)?ScrollTrigger.getAll().length:0;
    var pinned  = (window.ScrollTrigger && ScrollTrigger.getAll)?ScrollTrigger.getAll().some(function(s){return s.pin;}):false;

    // this technique is pin-LESS: reveal is wired via per-section scrubbed
    // triggers (stCount>0) and NO trigger should pin.
    var revealWired = isStatic ? (pairs>=2) : (stCount>0 && !pinned);
    var deckBuilt = pairs>=2;
    var noEmDash = document.body.innerText.indexOf('—') === -1;

    return {
      ok: errs===0 && hasGsap && hasST && hasLenis && deckBuilt && revealWired && noEmDash,
      pairs:pairs, stCount:stCount, pinned:pinned,
      isStatic:isStatic, reduced:!!(reduce||narrow), errs:errs
    };
  }

  var tries=0;
  function ready(){
    var p = gather();
    window.__SP_PROBE__ = p;
    window.__LAB_OK__ = !!p.ok;
    try{ console.log('__LAB_OK__', p); }catch(e){}
    if(!p.ok && tries<40){ tries++; return setTimeout(ready,150); }
  }
  window.addEventListener('load', function(){ setTimeout(ready,500); });
})();</script>

</body>
</html>
