<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · stacked-pairs / slice-lr — frs12 (pinned SAISEI slice, L to R)</title>

<!--
================================================================================
VARIANT: stacked-pairs / slice-lr   ·   frs12 stacked pairs + SAISEI slice (L->R)
================================================================================
SOURCE: apps/quadro/public/slide-lab/frs12-stacked-slice-lr.html  (owner-approved)

SAME composition as the stacked-pairs BASE (TEXT on the LEFT ~38% + a BIG
contained fixed-size RENDER on the RIGHT ~62%, 84vh, rounded-left frame, ~2cm
gap, far-left bronze rule, index eyebrow + Fraunces serif heading with an
italic-bronze keyword + sub, tag bottom-right) and the SAME ONE-Lenis engine.
The DELTA vs the base: the render does NOT just rise+fade in-view — each .pair
section is PINNED and its reveal is SCRUBBED over a long pinned scroll, so the
timing is CONTROLLED (independent of flick speed): you arrive -> the section
holds -> TEXT appears -> a clear PAUSE (text alone, render hidden) -> THEN the
render CLIP-WIPES open slowly LEFT->RIGHT -> it holds settled -> the pin
releases to the next section. Calm, graceful, deliberate.

The ONLY axis difference from the slice-td sibling: the render clip-path in the
reveal phase uses inset(0 R% 0 0) with R 100->0, so the visible region starts at
the LEFT edge and grows RIGHTWARD (a left->right wipe).

Pinned engine (verified working, 0 errors): per .pair
  ScrollTrigger.create({ trigger:sec, start:"top top",
    end:"+="+Math.round(innerHeight*1.35), pin:true, pinSpacing:true,
    scrub:1, onUpdate:self=>render(self.progress) })  +  render(0) at init.
render(p) phase map:
  0.00 -> 0.20  TEXT reveals (bar + idx + title + sub, gentle air stagger)
  ~0.26 -> 0.46 PAUSE — text sits alone, render fully hidden
  0.46 -> 0.96  RENDER clip-wipes open LEFT->RIGHT, slow + air-eased
  0.96 -> 1.00  settled hold before the pin releases
plus a slow MONOTONIC ken-burns on the img scale 1.05 -> 1.12 across the whole p.

LAWS: GSAP 3.12.5 + ScrollTrigger + CustomEase + Lenis 1.1.13 (CDN);
  transform / opacity / clip-path ONLY; NO mask-composite; Fraunces + Inter;
  bronze #c08a4e; NO WebGL; NO mix-blend / backdrop over the scrubbed surface;
  reduced-motion + <=820px -> static legible stack; zero em-dashes.
  Renders resolve via the `renders` symlink -> quadro/public/proto.

__LAB_OK__ probe asserts: gsap + ScrollTrigger + Lenis present, the N pair
sections built, each pair pinned with a scrubbed reveal (or the reduced-motion /
narrow static branch), the render clip axis is L->R (inset(0 R% 0 0)), no
em-dash in visible copy, zero real console.error.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1a1410; --paper:#f4ede1; --cream:#efe7d9; --mid:#b4a892;
    --line:rgba(26,20,16,.12); --bronze:#c08a4e; --bronze-soft:#cf9d63;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
    --mx:clamp(20px,4.4vw,72px); --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream)}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{display:block}
  .gate{opacity:0;transition:opacity .5s ease}
  .ready .gate{opacity:1}

  /* ---------------- intro ---------------- */
  .intro{position:relative;min-height:84vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,10vh,120px) var(--mx)}
  .intro__kicker{font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--bronze);display:flex;align-items:center;gap:.8rem}
  .intro__kicker::before{content:"";width:30px;height:1px;background:var(--bronze)}
  .intro__title{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:1.0;letter-spacing:-.02em;margin-top:.4em;max-width:16ch}
  .intro__title em{font-style:italic;color:var(--bronze);font-weight:400}
  .scrollcue{margin-top:2.4em;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--bronze-soft);display:flex;align-items:center;gap:.7rem;opacity:.85}
  .scrollcue::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,var(--bronze),transparent)}

  /* ---------------- one PAIR section: text LEFT, render RIGHT ---------------- */
  .pair{position:relative;min-height:100vh;display:grid;grid-template-columns:38% 62%;align-items:center}
  /* a thin bronze rule on the far-left edge of the text column (like the screenshot) */
  .pair__bar{position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,transparent,var(--bronze-soft) 30%,var(--bronze) 50%,var(--bronze-soft) 70%,transparent);opacity:.0;will-change:opacity}

  .pair__text{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(18px,2.2vw,38px) 0 var(--mx)}
  .pair__idx{font-size:.7rem;letter-spacing:.36em;text-transform:uppercase;color:var(--bronze-soft);
    display:inline-flex;align-items:center;gap:.7rem;will-change:transform,opacity}
  .pair__idx::before{content:"";width:22px;height:1px;background:var(--bronze);opacity:.7}
  .pair__title{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,3.4vw,3.1rem);
    line-height:1.04;letter-spacing:-.015em;margin-top:.34em;color:var(--ink);will-change:transform,opacity}
  .pair__title em{font-style:italic;color:var(--bronze);font-weight:400}
  .pair__sub{margin-top:.8em;font-size:clamp(.94rem,1.08vw,1.06rem);line-height:1.55;color:#6f6453;max-width:34ch;will-change:transform,opacity}

  /* render RIGHT — big, contained, fixed size, clean rounded-left frame */
  .pair__media{position:relative;justify-self:end;width:100%;height:84vh;
    border-radius:var(--radius) 0 0 var(--radius);overflow:hidden;background:var(--cream);will-change:transform,opacity}
  .pair__media img{width:100%;height:100%;object-fit:cover;object-position:50% 48%;will-change:transform}
  .pair__media .grade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(18,12,7,.10) 0%,rgba(18,12,7,0) 26%,rgba(18,12,7,0) 64%,rgba(18,12,7,.30) 100%)}
  .pair__tag{position:absolute;right:16px;bottom:16px;z-index:3;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--paper);padding:.42em .72em;background:rgba(26,20,16,.40)}

  /* ---------------- outro ---------------- */
  .outro{position:relative;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(40px,9vh,110px) var(--mx)}
  .outro__title{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,5.2vw,4.2rem);line-height:1.04;max-width:18ch}
  .outro__title em{font-style:italic;color:var(--bronze);font-weight:400}

  /* ---------------- static fallback ---------------- */
  .static{display:none}
  body.is-static .pairs .pair{min-height:auto;margin-bottom:clamp(20px,6vh,64px)}
  body.is-static .pair__media{height:auto;aspect-ratio:3/2}
  body.is-static .pair__bar{opacity:1}

  @media (max-width:820px){
    .pair{grid-template-columns:1fr;min-height:auto;gap:18px;padding-top:clamp(28px,8vh,64px)}
    .pair__media{height:auto;aspect-ratio:3/2;border-radius:var(--radius);order:-1}
    .pair__text{padding:0 var(--mx)}
  }
</style>
</head>
<body>

  <section class="intro gate">
    <span class="intro__kicker">QUADRO HOUSE</span>
    <h1 class="intro__title">Шість поглядів на <em>один дім</em>.</h1>
    <span class="scrollcue">Гортайте</span>
  </section>

  <div class="pairs" id="pairs"><!-- pair sections injected by JS --></div>

  <section class="outro gate">
    <h2 class="outro__title">Один дім, у якому <em>хочеться лишитися</em>.</h2>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script>
  (function(){
    "use strict";
    var SLIDES = [
      { src:"renders/day-34-portrait.webp", tag:"Ранок", idx:"01",
        title:"Ранок <em>приходить</em> першим", sub:"Світло лягає на фасад раніше, ніж прокидається вулиця." },
      { src:"renders/night-front.webp", tag:"Вечір", idx:"02", objPos:"50% 42%",
        title:"Вечір <em>теплішає</em>", sub:"Світло вмикається зсередини, і дім видно здалеку." },
      { src:"renders/terrace-04.webp", tag:"Тераса", idx:"03",
        title:"Кава над <em>водою</em>", sub:"Тераса, тиша і власний берег на відстані кроку." },
      { src:"renders/macro-roof.webp", tag:"Матеріал", idx:"04",
        title:"Клінкер <em>зблизька</em>", sub:"Тепла цегла, обпалена вручну. Фактура, яку хочеться торкнути." },
      { src:"renders/aerial.webp", tag:"Згори", idx:"05",
        title:"Увесь дім <em>з висоти</em>", sub:"Крок назад, і ділянка читається цілою картиною." },
      { src:"renders/day-08.webp", tag:"Всередині", idx:"06",
        title:"І життя <em>всередині</em>", sub:"За фасадом простір, у якому хочеться лишитися." }
    ];
    var N = SLIDES.length;

    function pairHTML(s){
      return '<section class="pair">'
           +   '<div class="pair__bar"></div>'
           +   '<div class="pair__text">'
           +     '<span class="pair__idx">'+s.idx+' / 0'+N+'</span>'
           +     '<h2 class="pair__title">'+s.title+'</h2>'
           +     '<p class="pair__sub">'+s.sub+'</p>'
           +   '</div>'
           +   '<div class="pair__media">'
           +     '<img src="'+s.src+'" alt="QUADRO" loading="lazy" decoding="async" style="object-position:'+(s.objPos||"50% 48%")+'">'
           +     '<div class="grade"></div><span class="pair__tag">'+s.tag+'</span>'
           +   '</div>'
           + '</section>';
    }

    function build(){
      try{
        gsap.registerPlugin(ScrollTrigger, CustomEase);
        CustomEase.create("air","0.25,0.74,0.22,0.99");

        var pairs=document.getElementById("pairs");
        pairs.innerHTML = SLIDES.map(pairHTML).join("");

        var reduce = matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
        var narrow = matchMedia && matchMedia("(max-width:820px)").matches;
        if (reduce || narrow){
          document.body.classList.add("is-static","ready");
          window.__LAB_OK__ = !!(document.querySelectorAll(".pair").length>=N);
          return;
        }

        // ---- ONE smoother: Lenis lerp 0.1 -> gsap.ticker -> ScrollTrigger.update ----
        gsap.ticker.lagSmoothing(0);
        var lenis = new Lenis({ lerp:0.1, smoothWheel:true, wheelMultiplier:1 });
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add(function(t){ lenis.raf(t*1000); });
        window.__lenis = lenis;

        document.body.classList.add("ready");

        var sections = Array.prototype.slice.call(document.querySelectorAll(".pair"));
        var airEase = gsap.parseEase("air");
        function clamp01(v){ return v<0?0:(v>1?1:v); }

        // SAISEI 1:1 — each section is PINNED and its reveal is scrubbed over a
        // LONG pinned scroll, so the timing is CONTROLLED (independent of how fast
        // the user flicks). You arrive -> the section holds -> TEXT appears ->
        // a clear PAUSE -> THEN the render slices open slowly LEFT->RIGHT -> it
        // holds settled -> the pin releases to the next section. Calm, graceful.
        sections.forEach(function(sec){
          var bar = sec.querySelector(".pair__bar");
          var media = sec.querySelector(".pair__media");
          var img = sec.querySelector(".pair__media img");
          var bits = [ sec.querySelector(".pair__idx"), sec.querySelector(".pair__title"), sec.querySelector(".pair__sub") ];

          // PURE function of the pinned-scrub progress p (0..1). Phase map:
          //   0.00 -> 0.26  TEXT reveals (bar + idx + title + sub, gentle stagger)
          //   0.26 -> 0.46  PAUSE — text sits alone, render still fully hidden
          //   0.46 -> 0.96  RENDER slices open LEFT->RIGHT, slow + air-eased
          //   0.96 -> 1.00  settled hold before the pin releases
          function render(p){
            // TEXT
            var bar_r = airEase(clamp01(p / 0.20));
            gsap.set(bar, { opacity:bar_r, scaleY:0.6 + 0.4*bar_r, transformOrigin:"50% 50%" });
            for (var k=0;k<bits.length;k++){
              var br = airEase(clamp01((p - 0.02 - k*0.05) / 0.22));
              gsap.set(bits[k], { y:(1-br)*26, opacity:br });
            }
            // RENDER — clip wipe LEFT->RIGHT (clip the RIGHT: inset right R%,
            // 100->0, so the visible region starts at the left and grows RIGHT).
            // Starts only at 0.46 (clear pause after the text) and is slow.
            var rev = airEase(clamp01((p - 0.46) / 0.50));
            var rightInset = (1-rev)*100;
            gsap.set(media, { opacity:1, clipPath:"inset(0 "+rightInset.toFixed(2)+"% 0 0)" });
            // slow monotonic ken-burns across the whole pinned reveal (no reset)
            gsap.set(img, { scale:1.05 + 0.07*p });
          }

          // pinned, scrubbed timeline: pin length ~1.35 viewport-heights => the
          // reveal takes a long, controlled scroll regardless of flick speed.
          ScrollTrigger.create({
            trigger:sec, start:"top top", end:"+="+Math.round(innerHeight*1.35),
            pin:true, pinSpacing:true, scrub:1, anticipatePin:0,
            onUpdate:function(self){ render(self.progress); }
          });
          render(0);   // correct first frame (section starts un-revealed)
        });

        window.__LAB_OK__ = !!(window.gsap && window.ScrollTrigger && window.Lenis && sections.length>=N);
        requestAnimationFrame(function(){ ScrollTrigger.refresh(); });
      }catch(e){
        window.__LAB_OK__ = false;
        try{ document.body.classList.add("is-static","ready"); }catch(_){}
        if (window.console) console.error("[slice-lr] build failed:", e);
      }
    }
    if (document.readyState!=="loading") build();
    else document.addEventListener("DOMContentLoaded", build);
  })();
  </script>
</body>
</html>
