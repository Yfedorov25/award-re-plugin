<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · portrait-vertical-hero · composed 9:16 hero plate (settle + type stagger)</title>

<!--
================================================================================
  TECHNIQUE LAB · portrait-vertical-hero
================================================================================
  A composed PORTRAIT 9:16 hero PLATE — the editorial vertical hero for mobile-first /
  portrait-render sites. ONE create() call builds, from data, a centred portrait plate: a 9:16
  framed render (object-fit cover) inside a thin coords/meta frame, an eyebrow, a serif title, and
  a small bottom meta row. On enter the plate SETTLES (scale 1.04 -> 1 + opacity) and the type
  STAGGERS in (eyebrow -> title -> meta). DECODE-GUARD: the render is decoded before the plate is
  revealed (no black flicker). OUR QUADRO render. NO WebGL. window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --bg:#0e0d0a; --ink:#f3efe6; --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .pvh-stage{
    --pvh-bg:#0e0d0a; --pvh-ink:#f3efe6;
    --pvh-serif:'Playfair Display',Georgia,serif; --pvh-sans:'Inter',system-ui,sans-serif;
    --pvh-line:rgba(243,239,230,0.5);
    --pvh-plate-w:46vh;
    --pvh-frame-bg:#1a1813;
  }
  .pvh-title{font-style:normal}
</style>
</head>
<body>

  <section id="hero" class="pvh-host"></section>

<script src="component.js"></script>
<script>
  (function () {
    // shared Lenis (lab drives it; atom uses manageLenis:false)
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp:0.1, smoothWheel:true });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    window.__pvh = PortraitVerticalHero.create('#hero', {
      media: 'renders/day-34-portrait.webp',
      eyebrow: 'QUADRO',
      title: 'Дім над водою',
      meta: ['Над річкою', '9:16'],
      ratio: '9/16',
      revealStagger: 0.1,
      enterScale: 1.04,
      autoplay: true,
      manageLenis: false
    });
  })();
</script>
</body>
</html>
