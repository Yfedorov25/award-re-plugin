<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · corner-frame-meta · Saisei corner meta (4 corners fade in)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{--cream:#f1ebd6}*{margin:0;box-sizing:border-box}html,body{height:100%}
  body{background:#0c0c0a;color:var(--cream);font-family:'Inter',system-ui;overflow:hidden}
  .frame{position:fixed;inset:0}
  .frame img{width:100%;height:100%;object-fit:cover;opacity:.55}
  [data-corner]{color:var(--cream)}
  [data-corner].eyebrow{font-family:'Fraunces',serif;font-size:1.2rem;letter-spacing:0;text-transform:none}
  .replay{position:fixed;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);color:#2a2418;background:var(--cream);border:0;padding:.55rem 1rem;font:600 .68rem/1 'Inter';letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
</style></head><body>
  <div class="frame" id="frame">
    <img src="renders/terrace.webp" alt="">
    <div data-corner="tl" class="eyebrow">再生</div>
    <div data-corner="bl">Власний берег, Україна</div>
    <div data-corner="br">Резиденція — 2025</div>
    <div data-corner="rc">(1)</div>
  </div>
  <button class="replay" id="replay">▶ показати meta</button>
<script src="component.js"></script>
<script>(function(){
  var m=CornerFrameMeta.create('#frame',{stagger:0.1});
  function play(){ m.hide(); requestAnimationFrame(function(){ m.reveal(); }); }
  document.getElementById('replay').addEventListener('click',play); setTimeout(play,500);
  try{window.__LAB_OK__=true}catch(e){}
})();</script>
</body></html>
