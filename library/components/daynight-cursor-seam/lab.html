<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · daynight-cursor-seam · cursor wipes the evening in (Smarts dialect)</title>

<!--
================================================================================
  TECHNIQUE LAB · daynight-cursor-seam   (V3 — the SMARTS dialect)
================================================================================
  A VARIATION of the day↔night canon (window.DayNight). Move the mouse across the
  interior and a vertical splitline wipes the evening in from the right; a round ⇆ grip
  rides the seam. On touch, drag the handle. Cursor at the left = day; at the right = evening.

  Harvested 1:1 from apps/smarts/src/js/sections/interiors.js (the «ШТОРА день↔вечір»):
  clip-path inset following the cursor via gsap.quickTo (0.5s power3.out), clamp 6..94%,
  reset to a ~55% resting split on mouseleave, plus a hint that fades after the first move.

  V3 just drives the CANON and adds the Smarts chrome. The canon paints the seam line + ⇆
  grip + День/Вечір tags; this brick adds the fading curtain hint.

  Loads, IN ORDER: canon css → variation css → GSAP → CANON js → variation js.
  NO WebGL (opacity + clip-path + gradient only). window.__LAB_OK__ on init.
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- 1) the CANON stage / seam / tag styles  2) this variation's chrome -->
<link rel="stylesheet" href="../daynight-engine/component.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root{ --cream:#f1ebd6; --ink:#20272c; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0c0c0a;color:var(--cream);font-family:var(--sans);overflow:hidden;display:grid;place-items:center}

  /* the seed is an interior — frame is the render's 4:3 proportion (G7: r
     aspect-ratio = frame proportion, zero crop) */
  .frame{position:relative;width:min(92vw,980px);aspect-ratio:4/3;border-radius:6px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.5);cursor:ew-resize}
  @media (max-height:760px){ .frame{ width:min(76vh,980px); } }

  /* caption over the scene */
  .cap{position:absolute;z-index:6;left:clamp(20px,4vw,48px);top:clamp(18px,4vh,40px);max-width:18ch;pointer-events:none}
  .cap h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.7rem,4vw,3.1rem);line-height:.98;letter-spacing:-.01em;
    text-shadow:0 2px 22px rgba(0,0,0,.5)}
  .cap p{margin-top:.5rem;font-size:clamp(.74rem,1.1vw,.9rem);opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.6)}

  .replay{position:fixed;z-index:10000;left:50%;bottom:18px;transform:translateX(-50%);
    font:500 .66rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--cream);
    background:rgba(12,12,11,.6);border:1px solid rgba(241,235,214,.32);border-radius:6px;padding:.6rem .9rem;cursor:pointer}
  .replay:hover{background:#e8c9a0;color:#20272c;border-color:#e8c9a0}
</style>
</head>
<body>

  <div class="frame" id="frame">
    <!-- two frame-matched interior stills of the SAME room (real Higgsfield day/evening pair) -->
    <div class="cap"><h1>Та сама кухня.<br>Тепер вечір.</h1><p>Ведіть курсор. Світло змінюється під рукою.</p></div>
  </div>

  <button class="replay" id="replay">Показати ще раз</button>

<!-- 3) the CANON engine MUST load before this brick -->
<script src="../daynight-engine/component.js"></script>
<!-- 4) this variation -->
<script src="component.js"></script>
<script>
  (function () {
    var frame = document.getElementById('frame');
    var replay = document.getElementById('replay');

    // the smarts seed is an INTERIOR -> use the interior 4:3 pair
    var DAY = 'renders/dn-int-day.webp';
    var NIGHT = 'renders/dn-int-night.webp';

    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    var cs = window.DayNightCursorSeam.create(frame, {
      dayMedia: DAY,
      nightMedia: NIGHT,
      hint: 'Проведіть, щоб настав вечір'
    });

    // gentle autoplay demo so a screen-record shows the move; the seam sweeps right then
    // settles at the ~55% resting split (rest 0.45). Fully interactive after.
    var autoTween = null;
    function killAuto() { if (autoTween) { autoTween.kill(); autoTween = null; } }
    function demo() {
      killAuto();
      if (reduced || !window.gsap) { cs.set(0.45); return; }
      cs.resetHint();
      var o = { v: cs.get() };
      autoTween = gsap.timeline({ onComplete: function () { autoTween = null; } })
        .fromTo(o, { v: 0 }, { v: 0.92, duration: 2.6, delay: 0.8, ease: 'sine.inOut',
          onUpdate: function () { cs.set(o.v); } })
        .to(o, { v: 0.45, duration: 1.1, ease: 'power3.out',
          onUpdate: function () { cs.set(o.v); }, onStart: function () { cs.hideHint(); } });
    }
    demo();

    // any real interaction cancels the canned demo so manual control is exact
    frame.addEventListener('pointerdown', killAuto);
    frame.addEventListener('mousemove', killAuto, { once: true });
    frame.addEventListener('touchstart', killAuto, { passive: true });

    replay.addEventListener('click', demo);

    try { window.__LAB_OK__ = true; } catch (e) {}
  })();
</script>
</body>
</html>
