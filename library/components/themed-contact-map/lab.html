================================================================================
  TECHNIQUE LAB · themed-contact-map
================================================================================
  r1864's /contacts map — the river-tinted-poi-map DIALECT stripped to a SINGLE destination: the
  warm-taupe drawn district map carries ONE pin (ОФИС ПРОДАЖ) that DROPS + PULSES on enter, the
  1864 disc marks the residence, beside a CONTACT PANEL (address / phone / hours / CTA). Distinct
  from river-tinted-poi-map (the FULL atlas) + map-dim-carousel-announce (map dimmed as backdrop).

================================================================================
-->
