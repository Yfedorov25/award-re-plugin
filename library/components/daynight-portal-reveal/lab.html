<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · daynight-portal-reveal · the evening blooms from where you touch</title>

<!--
================================================================================
  TECHNIQUE LAB · daynight-portal-reveal   (V9 — portal bloom from a click)
================================================================================
  A VARIATION of the day<->night canon (window.DayNight). Touch the lit window and the
  evening blooms outward in a growing circle from exactly that point; tap elsewhere and
  it blooms from there instead; tap again to bring the day back. A soft pulsing dot over
  the window invites the first touch and fades once you make it.

  Built on the canon's reveal:"portal" (night clip-path = circle(t*145% at portalOrigin)).
  This brick drives it manual + re-centres the portal at each tap (cheap destroy+create),
  blooming t from 0->1 (or back) via gsap.

  Loads, IN ORDER: canon css -> variation css -> GSAP -> CANON js -> variation js.
  NO WebGL (clip-path + transform + gradient only). window.__LAB_OK__ on init.
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- 1) the CANON stage / layer / tag styles  2) this variation's chrome -->
<link rel="stylesheet" href="../daynight-engine/component.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root{ --cream:#f1ebd6; --ink:#20272c; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0c0c0a;color:var(--cream);font-family:var(--sans);overflow:hidden;display:grid;place-items:center}

  /* exterior pair — frame is the render's 16:9 proportion (G7: aspect-ratio = frame proportion, zero crop) */
  .frame{position:relative;width:min(94vw,1180px);aspect-ratio:16/9;border-radius:6px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.5)}
  @media (max-height:720px){ .frame{ width:min(120vh,1180px); } }

  /* caption over the scene */
  .cap{position:absolute;z-index:7;left:clamp(20px,4vw,52px);top:clamp(18px,4vh,42px);max-width:20ch;pointer-events:none}
  .cap h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,4.4vw,3.4rem);line-height:.98;letter-spacing:-.01em;
    text-shadow:0 2px 22px rgba(0,0,0,.5)}
  .cap p{margin-top:.55rem;font-size:clamp(.76rem,1.1vw,.92rem);opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.6)}

  .replay{position:fixed;z-index:10000;left:50%;bottom:18px;transform:translateX(-50%);
    font:500 .66rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--cream);
    background:rgba(12,12,11,.6);border:1px solid rgba(241,235,214,.32);border-radius:6px;padding:.6rem .9rem;cursor:pointer}
  .replay:hover{background:#e8c9a0;color:#20272c;border-color:#e8c9a0}
</style>
</head>
<body>

  <div class="frame" id="frame">
    <!-- two frame-matched exterior stills of the SAME house (real Higgsfield day/night pair) -->
    <div class="cap"><h1>Торкніться вікна.</h1><p>Вечір розходиться звідти, де ви торкнулись.</p></div>
  </div>

  <button class="replay" id="replay">Показати ще раз</button>

<!-- 3) the CANON engine MUST load before this brick -->
<script src="../daynight-engine/component.js"></script>
<!-- 4) this variation -->
<script src="component.js"></script>
<script>
  (function () {
    var frame = document.getElementById('frame');
    var replay = document.getElementById('replay');

    // the exterior pair — a lit window reads best as the bloom origin
    var DAY = 'renders/dn-ext-day.webp';
    var NIGHT = 'renders/dn-ext-night.webp';

    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    var pr = window.DayNightPortalReveal.create(frame, {
      dayMedia: DAY,
      nightMedia: NIGHT,
      origin: '60% 62%',          // over a lit window
      duration: 1.6,
      labels: ['День', 'Вечір']
    });

    // gentle autoplay demo so a screen-record shows the move: after a beat, the evening
    // blooms from the hotspot window. Fully interactive after (tap anywhere to re-bloom).
    var demoTimer = null;
    function killDemo() { if (demoTimer) { clearTimeout(demoTimer); demoTimer = null; } }
    function demo() {
      killDemo();
      if (reduced) return;                 // canon already statics to night; no bloom
      pr.reset();                          // day at the default origin
      demoTimer = setTimeout(function () {
        pr.bloomAt(60, 62);                // evening blooms from the lit window
        demoTimer = null;
      }, 1100);
    }
    demo();

    // any real tap cancels the canned demo so manual control is exact
    frame.addEventListener('pointerdown', killDemo);

    replay.addEventListener('click', demo);

    try { window.__LAB_OK__ = true; } catch (e) {}
  })();
</script>
</body>
</html>
