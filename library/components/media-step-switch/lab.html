<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · media-step-switch · msw4a · full-bleed media+text stepper (film/quote) (BASE, 1:1)</title>

<!--
================================================================================
  TECHNIQUE LAB · media-step-switch   ·   BASE = msw4a-film-quote (owner-approved)
================================================================================
  SOURCE: apps/quadro/public/slide-lab/msw4a-film-quote.html  (gate-passing)

  A PINNED full-bleed MEDIA STEPPER. The full-bleed render/video is the WHOLE
  background; typographic text steps float OVER it. Each step is a DIFFERENT text
  TYPE — (1) BIG STATEMENT (photo day-front), (2) VIDEO BEAT (the lite river clip,
  the emotional centre), (3) QUOTE (photo terrace), (4) NUMBER/FACT (photo aerial)
  — woven with a looping VIDEO beat. Clean sequence per beat: the TEXT settles
  FIRST -> a clear PAUSE -> THEN the media crossfades.

  SWAP: an OPACITY crossfade of TWO stacked full-bleed GPU layers (A=even, B=odd).
  Outgoing sits underneath, FULLY OPAQUE the whole beat; incoming sits on top and
  fades 0 -> 1. Same rect => a crossfade, never a seam/diptych, never a blank. The
  lite video lives in layer B; we toggle the poster <img> vs the <video> and NEVER
  scrub video.currentTime (muted-autoplay-loop while on stage, PAUSE off-stage).

  SMOOTHNESS (verbatim from msw4a): every .layer is its OWN GPU compositor layer
  (will-change:transform; transform:translateZ(0); backface-visibility:hidden); we
  animate ONLY opacity (swap) + transform (a tiny monotonic ken-burns); NO
  backdrop-filter over the moving media; NO clip-path on the full-screen surface.
  ONE smoother: Lenis 1.1.13 lerp 0.09 -> gsap.ticker -> ScrollTrigger.update;
  lagSmoothing(0). PINNED stage, scrub:1, GENEROUS pin length. render(prog) is a
  PURE fn of progress (onUpdate + render(0) at init; reverse-safe). QUANTIZED DOM
  writes with skip-unchanged caches. GSAP 3.12.5 + CustomEase ("air"/"glide").

  Fraunces + Inter; bronze #c08a4e; cream; Ukrainian copy; ZERO em-dashes. NO
  WebGL. reduced-motion / <=820px -> static legible stack.

  RENDERS: renders/*.webp + renders/clip-river-lite.mp4 + renders/clip-river-poster.webp
  resolve via the renders symlink -> apps/quadro/public/proto.

  STACK: vanilla + GSAP 3.12.5 + ScrollTrigger + CustomEase + Lenis 1.1.13
  (cdnjs / jsdelivr). No build. Canonical drop-in:
  award-re-plugin/library/components/media-step-switch/
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- eager-preload the first full-bleed render (resolves via renders -> quadro/public/proto) -->
<link rel="preload" as="image" href="renders/day-front.webp">

<!-- the canonical component skin -->
<link rel="stylesheet" href="component.css">

<!-- GSAP + Lenis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>

  <section class="intro gate">
    <span class="intro__kicker">QUADRO HOUSE</span>
    <h1 class="intro__title">Кіно про <em>один берег</em>.</h1>
    <span class="scrollcue">Гортайте</span>
  </section>

  <!-- empty pin host: the component builds the full-bleed layers + the four text
       moments (photo / VIDEO / quote / number) + chrome into it -->
  <div class="pin gate" id="pin"></div>

  <section class="outro gate">
    <h2 class="outro__title">Один дім, у якому <em>хочеться лишитися</em>.</h2>
  </section>

  <!-- the static fallback host (reduced-motion / <=820px). Filled by the engine. -->
  <div class="static" id="static"></div>

<!-- the canonical component engine -->
<script src="component.js"></script>

<script>
  /* the msw4a film/quote scene — a pinned full-bleed media stepper whose text
     steps are four DIFFERENT types woven with a looping video beat. Builds into
     the #pin host from the faithful msw4a steps; renders resolve via the renders
     symlink. */
  window.__MSW = MediaStepSwitch.init('#pin');
</script>

<!-- ── __LAB_OK__ acceptance probe ──
     asserts: gsap + ScrollTrigger + CustomEase + Lenis present; the stage built
     (the 4 .moment text blocks + 2 full-bleed .layer media surfaces, OR the
     reduced-motion / narrow static branch with >=4 .static__shot); this technique
     OWNS A PIN (exactly one pinned ScrollTrigger); the lite video is present and
     never currentTime-scrubbed; no em-dash in visible copy; zero real
     console.error. -->
<script>(function(){
  var errs=0; var _e=console.error;
  console.error=function(){var s=Array.prototype.join.call(arguments," ");
    if(!/Failed to load resource|ERR_FILE_NOT_FOUND|net::ERR|decode|play\(\) request/i.test(s)) errs++;
    return _e.apply(console,arguments);};
  window.__LAB_ERRORS=function(){return errs;};

  function gather(){
    var reduce = matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
    var narrow = matchMedia && matchMedia('(max-width:820px)').matches;
    var hasGsap = !!window.gsap;
    var hasST   = !!window.ScrollTrigger;
    var hasCE   = !!window.CustomEase;
    var hasLenis= !!window.Lenis;

    var isStatic = !!(window.__MSW && window.__MSW.static);
    var moments = document.querySelectorAll('#pin .moment').length;
    var layers  = document.querySelectorAll('#pin .layer').length;
    var shots   = document.querySelectorAll('#static .static__shot').length;
    var video   = document.querySelector('#pin video') || document.querySelector('#static video');

    var stCount = (window.ScrollTrigger && ScrollTrigger.getAll)?ScrollTrigger.getAll().length:0;
    var pinned  = (window.ScrollTrigger && ScrollTrigger.getAll)?ScrollTrigger.getAll().some(function(s){return s.pin;}):false;

    // this technique OWNS its pin: in the live branch exactly one trigger pins +
    // 4 moments + 2 layers are built; in the static branch the deck is the shots.
    var stageBuilt = isStatic ? (shots>=4) : (moments>=4 && layers>=2);
    var pinWired   = isStatic ? true : (stCount>0 && pinned);
    var hasVideo   = !!video;
    var noEmDash   = document.body.innerText.indexOf('—') === -1;

    return {
      ok: errs===0 && hasGsap && hasST && hasCE && hasLenis && stageBuilt && pinWired && hasVideo && noEmDash,
      moments:moments, layers:layers, shots:shots, hasVideo:hasVideo,
      stCount:stCount, pinned:pinned, isStatic:isStatic, reduced:!!(reduce||narrow), errs:errs
    };
  }

  var tries=0;
  function ready(){
    var p = gather();
    window.__MSW_PROBE__ = p;
    window.__LAB_OK__ = !!p.ok;
    try{ console.log('__LAB_OK__', p); }catch(e){}
    if(!p.ok && tries<40){ tries++; return setTimeout(ready,150); }
  }
  window.addEventListener('load', function(){ setTimeout(ready,500); });
})();</script>

</body>
</html>
