<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · dual-slicer · Springs coupled-split (render-strip + per-line + inset) on OUR renders</title>

<!--
================================================================================
  TECHNIQUE LAB · dual-slicer
================================================================================
  Springs' signature "Open the doors" COUPLED-SPLIT, harvested from the frame-by-
  frame teardown (D_springs_dual_render_slicer_clip).

  ONE pinned scroll drives TWO independent systems in one column-pair:
    RIGHT = a vertical CLIP-PATH render strip — each incoming (lower) render is
      revealed UPWARD by shrinking its top inset (inset(100% 0 0 0) -> inset(0)),
      scroll-scrubbed 1:1, reversible, crisp full-width seam (lower covers upper).
    LEFT  = SIMULTANEOUSLY the heading reveals per-line (each line rises from under
      a clip) AND a small inset photo rises from below — coupled to the SAME scroll.
  Multiple things move in one scroll beat off one scroll position = the "parallel".

  ASSET-SUBSTITUTION GATE (council): rebuilt on OUR content — QUADRO renders in the
  3-render right strip, Ukrainian heading/body, an inset render — proving the engine
  re-fires on our assets, not a trace of Springs' photos. Scroll to drive it.

  ENGINE LAWS (verbatim from slice-clip): Lenis 1.1.13 lerp 0.1 -> gsap.ticker ->
  ScrollTrigger.update; lagSmoothing(0); render(prog) pure; pin/scrub; clip-path +
  transform + opacity only; NO mix-blend/backdrop over the scrubbed surface; NO
  WebGL; reduced-motion / <=820px -> static stack. window.__LAB_OK__ set on init.
  Renders via renders -> apps/quadro/public/proto.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="renders/night-front.webp">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --green:#1f3a32; --green-2:#16302a; --cream:#e9e2d2; --slate:#9fb0a6; --accent:#c9b79a;
    --serif:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--green-2);color:var(--cream);font-family:var(--body)}
  .spacer{height:60vh;display:grid;place-items:center;color:var(--slate);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  .ds-stage{background:linear-gradient(100deg,var(--green) 0%,var(--green-2) 60%)}
  .ds-left{color:var(--cream)}
  .ds-eyebrow{color:var(--accent)}
  .ds-head{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4vw,3.4rem);line-height:1.08;letter-spacing:-.01em}
  .ds-body{color:var(--slate);font-size:clamp(.9rem,1.1vw,1.05rem);line-height:1.6;margin-top:.4em}
  .ds-inset{border-radius:2px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6)}
</style>
</head>
<body>

  <div class="spacer">скрол вниз ↓</div>

  <section class="ds-stage" id="slicer">
    <!-- LEFT: per-line heading + body + rising inset -->
    <div class="ds-left">
      <div class="ds-eyebrow">QUADRO · відчинити двері</div>
      <div class="ds-head">
        <span class="ds-line"><span class="ds-line__i">Відчини двері</span></span>
        <span class="ds-line"><span class="ds-line__i">QUADRO і ступи</span></span>
        <span class="ds-line"><span class="ds-line__i">у власний спокій</span></span>
      </div>
      <p class="ds-body">Тихий двір, власний берег простору і фасад, що не кричить. Місце, де ранок починається з кави, а не з чужих стін за вікном.</p>
      <div class="ds-inset"><img src="renders/terrace-03.webp" alt="QUADRO деталь"></div>
    </div>

    <!-- RIGHT: the vertical clip-path render strip (>=2 renders, our QUADRO views) -->
    <div class="ds-right">
      <div class="ds-render"><img src="renders/night-front.webp" alt="QUADRO ніч"></div>
      <div class="ds-render"><img src="renders/day.webp" alt="QUADRO день"></div>
      <div class="ds-render"><img src="renders/aerial.webp" alt="QUADRO з висоти"></div>
    </div>
  </section>

  <div class="spacer">кінець секції</div>

<script src="component.js"></script>
<script>
  DualSlicer.init('#slicer', { lerp: 0.1, pinFactor: 1.5 });
</script>
</body>
</html>
