<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · rotated-mosaic-hero · Springs tilted photo-tile plane + wash + parallax</title>

<!--
================================================================================
  TECHNIQUE LAB · rotated-mosaic-hero
================================================================================
  Springs' signature HERO — a grid of photo tiles rotated as ONE rigid plane (~-9deg),
  bound by a colour multiply WASH that unifies the disparate photos, drifting as one
  plane on scroll. Depth comes from the rotation (top vs bottom tiles travel
  different screen-Y), no per-tile speed. Harvested from D_springs_walkthrough S1.

  ASSET-SUBSTITUTION GATE: OUR renders (12 QUADRO tiles) + a green wash + a giant
  serif title "Власний спокій" bottom-right + eyebrow. Scroll: the whole plane
  drifts up keeping its tilt. NO WebGL.
  window.__LAB_OK__ on init.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --green:#16322a; --green-deep:#0e241d; --cream:#ece4d3; --slate:#9fb0a6;
    --serif:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--green-deep);color:var(--cream);font-family:var(--body)}
  .spacer{height:120vh;display:grid;place-items:center;color:var(--slate);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  .rmh-bg{ background: radial-gradient(120% 100% at 50% 30%, var(--green) 0%, var(--green-deep) 100%); }
  .rmh-wash{ background: var(--green); }   /* multiply wash unifies the tiles */
  .rmh-content{ padding: 0 clamp(24px,5vw,90px) clamp(40px,8vh,90px); }
  .rmh-eyebrow{ font-family:var(--body); font-size:.74rem; letter-spacing:.34em; text-transform:uppercase; color:var(--slate); align-self:flex-start; margin-top:clamp(80px,16vh,150px); }
  .rmh-title{ margin-top:auto; align-self:flex-end; text-align:right; font-family:var(--serif); font-weight:300;
    font-size:clamp(2.6rem,7vw,6rem); line-height:1.0; letter-spacing:-.01em; color:var(--cream); }
</style>
</head>
<body>

  <section class="rmh-stage" id="hero">
    <div class="rmh-bg"></div>
    <div class="rmh-plane">
      <div class="rmh-grid"></div>   <!-- engine fills tiles -->
      <div class="rmh-wash"></div>
    </div>
    <div class="rmh-content">
      <div class="rmh-eyebrow">QUADRO · приватний квартал</div>
      <div class="rmh-title">Власний<br>спокій</div>
    </div>
  </section>

  <div class="spacer">скрол — площина дрейфує ↓</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      lenis.on('scroll', function(){ if (window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
    }
    RotatedMosaicHero.init('#hero', {
      tiles: ['renders/day.webp','renders/day-02.webp','renders/macro-roof.webp','renders/terrace.webp',
              'renders/aerial.webp','renders/macro-pergola.webp','renders/day-08.webp','renders/scene18.webp',
              'renders/night.webp','renders/terrace-03.webp','renders/macro-table.webp','renders/day-06.webp'],
      cols: 4, rows: 3, angle: -9, scale: 1.4, wash: 0.55, parallax: 16, gutter: 8
    });
  })();
</script>
</body>
</html>
