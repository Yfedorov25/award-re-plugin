<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · river-tinted-poi-map · r1864 (drawn district map: river band + park blobs + landmark glyphs + terracotta pins + project disc)</title>

<!--
================================================================================
  TECHNIQUE LAB · river-tinted-poi-map  (the 3rd map dialect)
================================================================================
  r1864's drawn location map — hand-styled vector district map: warm-taupe/near-black field, a
  slate-blue river band, green park blobs, thin roads, white landmark glyphs, terracotta POI
  pins with icons, a copper project disc. NOT Mapbox — inline SVG + DOM. River draws, glyphs
  fade-rise, pins ladder, disc scales in on scroll-into-view. Harvested from D_r1864. NO WebGL.
  window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{height:100%}
  body{background:#2b2622;color:#e9e3db;font-family:var(--sans)}
  .spacer{height:90vh;display:grid;place-items:center;background:#2b2622;opacity:.4;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
  .rtm-stage{ --rtm-bg:#2b2622; --rtm-ink:#e9e3db; --rtm-river:#48535f; --rtm-river-w:26;
    --rtm-park:rgba(96,112,82,.5); --rtm-road:rgba(233,227,219,.14); --rtm-pin:#b07a52; --rtm-pin-hot:#c98a5e;
    --rtm-disc:#b06a3e; --rtm-serif:'Playfair Display',serif; --rtm-sans:'Inter',sans-serif; }
</style>
</head>
<body>

  <div class="spacer">скрол ↓ — ріка малюється, гліфи й пінси проявляються, диск проєкту зʼявляється</div>

  <section class="rtm-stage" id="map">
    <svg class="rtm-map" viewBox="0 0 1440 900" preserveAspectRatio="none">
      <!-- park blobs -->
      <path class="rtm-park" d="M 470 180 C 560 150 660 200 640 290 C 520 320 430 270 470 180 Z"/>
      <path class="rtm-park" d="M 1080 240 C 1160 220 1230 270 1200 340 C 1110 360 1040 310 1080 240 Z"/>
      <path class="rtm-park" d="M 360 640 C 440 620 500 670 470 740 C 390 760 320 710 360 640 Z"/>
      <path class="rtm-park" d="M 980 700 C 1060 680 1120 730 1090 800 C 1010 820 940 770 980 700 Z"/>
      <!-- roads -->
      <path class="rtm-road" d="M -20 220 C 300 240 600 180 900 240 C 1140 288 1300 240 1480 270"/>
      <path class="rtm-road" d="M 200 -20 C 260 240 360 460 320 760 C 300 880 360 960 340 1000"/>
      <path class="rtm-road" d="M 1100 -20 C 1080 240 1160 460 1100 720 C 1060 860 1120 960 1100 1000"/>
      <!-- the river band (draws in) -->
      <path data-river d="M -40 470 C 260 430 440 520 620 470 C 760 432 760 320 900 330 C 1080 342 1180 470 1140 600 C 1100 740 940 720 820 700 C 660 676 540 760 360 800 C 180 836 40 800 -40 820"/>

      <!-- landmark glyphs -->
      <g data-glyph transform="translate(560 240)">
        <polygon points="0,-26 8,-12 5,-12 5,14 -5,14 -5,-12 -8,-12"/>
        <rect x="-14" y="14" width="28" height="20"/>
        <text x="0" y="50" text-anchor="middle">Кремль</text>
      </g>
      <g data-glyph transform="translate(330 360)">
        <rect x="-22" y="-8" width="44" height="34" rx="2"/>
        <polygon points="0,-26 14,-8 -14,-8"/>
        <text x="0" y="46" text-anchor="middle">Храм Христа Спасителя</text>
      </g>
      <g data-glyph transform="translate(660 540)">
        <rect x="-30" y="-6" width="60" height="32" rx="2"/>
        <polygon points="-30,-6 0,-26 30,-6"/>
        <text x="0" y="46" text-anchor="middle">Третьяковская галерея</text>
      </g>
    </svg>

    <!-- terracotta POI pins -->
    <div class="rtm-pin" data-poi style="left:46%;top:31%"><div class="dot">◆</div><div class="lbl">ГУМ</div></div>
    <div class="rtm-pin" data-poi style="left:53%;top:30%"><div class="dot">❀</div><div class="lbl">Парк Зарядье</div></div>
    <div class="rtm-pin" data-poi style="left:61%;top:34%"><div class="dot">♪</div><div class="lbl">Филармония</div></div>
    <div class="rtm-pin" data-poi style="left:55%;top:14%"><div class="dot">✦</div><div class="lbl"></div></div>
    <div class="rtm-pin" data-poi style="left:34%;top:73%"><div class="dot">❀</div><div class="lbl">Музеон</div></div>
    <div class="rtm-pin" data-poi style="left:27%;top:90%"><div class="dot">❀</div><div class="lbl">Парк Горького</div></div>
    <div class="rtm-pin" data-poi style="left:67%;top:73%"><div class="dot">♫</div><div class="lbl">Дом музыки</div></div>
    <div class="rtm-pin" data-poi style="left:56%;top:73%"><div class="dot">✦</div><div class="lbl"></div></div>

    <!-- copper project disc -->
    <div class="rtm-disc" data-disc style="left:50%;top:42%">
      <div class="n">1864</div>
      <div class="rtm-disc-cap">Софийская наб., 36</div>
    </div>
  </section>

  <div class="spacer">мапа розкрита</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp:0.1, smoothWheel:true });
      lenis.on('scroll', function(){ if(window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    window.__rtm = RiverTintedPoiMap.create('#map', { draw:true, stagger:0.06, duration:1.0, ease:'power2.out', start:'top 78%', once:true, manageLenis:false });
  })();
</script>
</body>
</html>
