================================================================================
  TECHNIQUE LAB · clean-floor-hover-select  (EVER visual-search Level 1)
================================================================================

  the render with viewBox LOCKED to the render's intrinsic px; each floor is a hand-traced
  PERSPECTIVE polygon (corner-wrapping chevron of two quads) so the highlight RIDES the building.
  Hover -> terracotta fill + dark top-edge stroke; ONE tooltip card whose y TWEENS to the floor.
  Here the "render" is a synthetic inline-SVG tower built from the SAME geometry as the bands, so

================================================================================
-->
