<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LAB · slide-out-img-text (deck-fan reveal)</title>

<!-- GSAP + ScrollTrigger + CustomEase via cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

<style>
/* ============================================================
   LAB SHELL — minimal page that hosts the component twice:
   1) a tall intro so you scroll INTO the pinned section
   2) the technique itself
   3) a tail so you scroll OUT
   The component's own styles live in component.css; this <style>
   only sets the shell + display font so the lab runs standalone.
   ============================================================ */
@font-face{
  font-family:"Display Serif";
  src:local("Nyght Serif"), local("PP Editorial New"), local("Times New Roman");
  font-weight:300 500; font-display:swap;
}
:root{ --ink:#0B0B0C; --paper:#EDE7DD; --bronze:#B8946A; }
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{ background:var(--ink); color:var(--paper);
  font-family:"Helvetica Neue","Inter Tight",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
img{display:block}

/* intro / outro spacers so the pin has somewhere to grab */
.shell-band{ min-height:100vh; display:grid; place-items:center; text-align:center; }
.shell-band h2{ font-family:"Display Serif",serif; font-weight:400;
  font-size:clamp(2rem,6vw,5rem); letter-spacing:-.01em; opacity:.9 }
.shell-band p{ margin-top:1rem; opacity:.5; letter-spacing:.06em; font-size:.85rem }

/* ---- preloader (Saisei-style ritual, no-WebGL) ---- */
#pre{ position:fixed; inset:0; z-index:1000; background:var(--ink);
  display:flex; align-items:center; justify-content:center; }
#pre svg{ width:min(28vw,150px); overflow:visible }
#pre path{ stroke:var(--paper); stroke-width:1.3; fill:none; vector-effect:non-scaling-stroke }
.curt{ position:fixed; top:0; bottom:0; width:50vw; background:var(--ink); z-index:999; transform:scaleX(0) }
.curt.l{ left:0; transform-origin:right center }
.curt.r{ right:0; transform-origin:left center }

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<!-- the component's own stylesheet -->
<link rel="stylesheet" href="component.css" />
</head>

<body>

<!-- ===================== PRELOADER ===================== -->
<div id="pre" aria-hidden="true">
  <svg viewBox="0 0 120 120">
    <path id="pMark" d="M30 90 L30 40 L60 22 L90 40 L90 90" />
    <path id="pBar"  d="M30 64 L90 64" />
  </svg>
</div>
<div class="curt l"></div>
<div class="curt r"></div>

<!-- intro spacer -->
<section class="shell-band">
  <div>
    <h2>scroll ↓</h2>
    <p>DECK-FAN REVEAL — slide-out-img-text</p>
  </div>
</section>

<!-- ===================== THE TECHNIQUE ===================== -->
<!-- NOTE: placeholder imagery uses picsum so the lab runs offline-ish.
     Swap the src for real renders; ratios match the card box. -->
<section class="sofi" id="deckFan" aria-label="Портфоліо">
  <div class="sofi__eyebrow">Zera Studio · Portfolio</div>

  <div class="sofi__stage">

    <!-- ghost depth layer -->
    <div class="sofi__ghost">
      <span class="sofi__ghost-letter">E</span>
      <span class="sofi__ghost-word">Craft
Systems</span>
    </div>

    <!-- the deck: 4 cards, dealt to 4 corners -->
    <div class="sofi__deck">
      <figure class="sofi__card">
        <img src="https://picsum.photos/id/1027/600/860" alt="Eterna" />
        <figcaption class="sofi__card-label">Eterna</figcaption>
      </figure>
      <figure class="sofi__card">
        <img src="https://picsum.photos/id/1062/600/860" alt="Orva" />
        <figcaption class="sofi__card-label">Orva</figcaption>
      </figure>
      <figure class="sofi__card">
        <img src="https://picsum.photos/id/1080/600/860" alt="Interior" />
        <figcaption class="sofi__card-label">Lumen</figcaption>
      </figure>
      <figure class="sofi__card">
        <img src="https://picsum.photos/id/180/600/860" alt="Portal" />
        <figcaption class="sofi__card-label">Portal</figcaption>
      </figure>
    </div>

    <!-- centre copy: two captions crossfade in place -->
    <div class="sofi__copy">
      <div class="sofi__cap sofi__cap-a">
        <div class="sofi__h">PORTFOLIO</div>
        <div class="sofi__sub">ETERNA</div>
      </div>
      <div class="sofi__cap sofi__cap-b">
        <div class="sofi__h">The proof is in the work.</div>
        <a class="sofi__cta" href="#">View work</a>
      </div>
    </div>

    <span class="sofi__dot" aria-hidden="true"></span>
  </div>
</section>

<!-- outro spacer -->
<section class="shell-band">
  <div>
    <h2>end of demo</h2>
    <p>scroll back up to replay the deal-out</p>
  </div>
</section>

<!-- component logic -->
<script src="component.js"></script>
<script>
/* ============================================================
   LAB BOOT — preloader ritual, then init the component.
   ============================================================ */
gsap.registerPlugin(ScrollTrigger);
const AIR = CustomEase.create("air","M0,0 C0.22,0.68 0.16,0.99 1,1");
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

function lenOf(el){ try{return el.getTotalLength();}catch(e){return 200;} }

function boot(){
  // init component first so its ScrollTrigger exists before refresh
  SlideOutImgText.init("#deckFan");

  const mark=document.getElementById("pMark");
  const bar=document.getElementById("pBar");
  const cl=document.querySelector(".curt.l");
  const cr=document.querySelector(".curt.r");
  const pre=document.getElementById("pre");

  if(reduce){
    pre.style.display="none";
    gsap.set([cl,cr],{scaleX:0});
    ScrollTrigger.refresh();
    return;
  }

  [mark,bar].forEach(p=>{ const L=lenOf(p);
    gsap.set(p,{strokeDasharray:L,strokeDashoffset:L}); });

  const tl=gsap.timeline({ onComplete(){ ScrollTrigger.refresh(); } });
  tl.to(mark,{strokeDashoffset:0,duration:.7,ease:AIR},.15)
    .to(bar ,{strokeDashoffset:0,duration:.5,ease:AIR},"-=0.3")
    .set([cl,cr],{scaleX:1})
    .to(pre,{opacity:0,duration:.3,ease:"none"},"+=0.1")
    .set(pre,{display:"none"})
    .to(cl,{scaleX:0,duration:.9,ease:AIR},"<")
    .to(cr,{scaleX:0,duration:.9,ease:AIR},"<");
}

window.addEventListener("load",boot);
</script>
</body>
</html>
