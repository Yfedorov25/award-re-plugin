<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · apartment-day-grid · уся квартира проживає день (Модель A: синхронно)</title>

<!--
================================================================================
  TECHNIQUE LAB · apartment-day-grid  (SECTION A1a / MODEL A)
================================================================================
  ALL rooms on screen at once, in a grid. Scroll 07:00 -> 23:00 and EVERY room changes its
  lighting TOGETHER, consistently: at 11:00 every room is 11:00, at 19:00 every room is 19:00.
  Time == lighting everywhere, simultaneously. The whole apartment lives one day.

  Thin orchestrator over daynight-engine (one instance per cell, all driven by one t).
  NO WebGL. The page is tall so the pinned day has room to play. window.__LAB_OK__ on init.
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../daynight-engine/component.css">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
  :root{ --adg-sans:'Inter',system-ui,sans-serif; --adg-serif:'Fraunces',Georgia,serif; }
  *{margin:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{background:#16121a;color:#f3f1ec;font-family:var(--adg-sans)}
  .pre{height:42vh;display:grid;place-items:center;color:rgba(243,241,236,.4);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}

  .adg{position:relative}
  .adg__stage{height:100vh;position:relative}
  .adg__grid{--adg-cols:2}  /* 4 rooms = a calm 2x2 */

  /* the day-clock chrome floats top-center over the grid */
  .clock{position:absolute;z-index:8;top:clamp(16px,3vh,28px);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;background:rgba(12,10,14,.5);border:1px solid rgba(243,241,236,.18);
    border-radius:999px;padding:.5rem 1.1rem;backdrop-filter:none}
  .clock__t{font-variant-numeric:tabular-nums;font-size:.92rem;letter-spacing:.06em}
  .clock__ph{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
  .clock__bar{position:relative;width:min(34vw,260px);height:3px;border-radius:2px;background:rgba(243,241,236,.16);overflow:hidden}
  .clock__fill{position:absolute;inset:0 auto 0 0;width:calc(var(--adg-t,0)*100%);background:linear-gradient(90deg,#9cc,#e8c9a0,#caa);border-radius:2px}

  .head{position:absolute;z-index:8;left:50%;bottom:clamp(18px,4vh,40px);transform:translateX(-50%);text-align:center;pointer-events:none;width:max-content;max-width:90vw}
  .head .h{font-family:var(--adg-serif);font-weight:300;font-size:clamp(1.4rem,2.4vw,2.2rem);line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .head .s{font-size:.86rem;opacity:.78;margin-top:.5rem;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  .hint{position:absolute;z-index:8;left:50%;bottom:6px;transform:translateX(-50%);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;opacity:.45}

  .after{height:16vh;display:grid;place-items:center;color:rgba(243,241,236,.35);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="pre">↓ гортайте: вся квартира проживає день, від ранку до ночі</div>

  <section class="adg" data-phase="day" aria-label="Уся квартира протягом дня">
    <div class="adg__stage">
      <div class="adg__grid" data-grid></div>
      <div class="clock" aria-live="polite">
        <span class="clock__t" data-clock>07:00</span>
        <span class="clock__bar"><span class="clock__fill"></span></span>
        <span class="clock__ph" data-phase-label>ранок</span>
      </div>
      <div class="head" data-head>
        <div class="h">Уся квартира. Один день.</div>
        <div class="s" data-sub>Світло змінюється всюди одночасно, поки ви гортаєте.</div>
      </div>
    </div>
  </section>

  <div class="after">галерея триватиме нижче</div>

<script src="../daynight-engine/component.js"></script>
<script src="component.js"></script>
<script>
  (function () {
    var R = 'renders/';
    // 4 DISTINCT rooms (no duplicates — the dn-int* pairs are byte-identical to a1-r3/r1)
    var ROOMS = [
      { day: R+'a1-r1-day.webp', night: R+'a1-r1-night.webp', name: 'Вітальня' },
      { day: R+'a1-r2-day.webp', night: R+'a1-r2-night.webp', name: 'Кухня' },
      { day: R+'a1-r3-day.webp', night: R+'a1-r3-night.webp', name: 'Простір' },
      { day: R+'a1-r4-day.webp', night: R+'a1-r4-night.webp', name: 'Їдальня' }
    ];

    var clock = document.querySelector('[data-clock]');
    var phLabel = document.querySelector('[data-phase-label]');
    var sub = document.querySelector('[data-sub]');
    var SUB = { ранок: 'Світло змінюється всюди одночасно, поки ви гортаєте.', день: 'Полудень. Уся квартира у рівному денному світлі.', вечір: 'Золота година. Та сама квартира, тепліше світло.', ніч: 'Вечір. Усі кімнати засвічують лампи разом.' };
    var lastPh = '';

    var grid = window.ApartmentDayGrid.create('.adg', {
      rooms: ROOMS,
      hours: [7, 23],
      stagger: 0,      // PERFECTLY synchronized: every room at the SAME time-of-day (the whole point)
      scrub: { trigger: '.adg', start: 'top top', end: '+=200%', pin: true },
      onProgress: function (t, hour) {
        var hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
        if (mm === 60) { mm = 0; hh += 1; }
        clock.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
        var ph = hh < 12 ? 'ранок' : hh < 17 ? 'день' : hh < 21 ? 'вечір' : 'ніч';
        phLabel.textContent = ph;
        if (ph !== lastPh) { lastPh = ph; sub.textContent = SUB[ph]; }   // sub + pill from the SAME hour
      }
    });

    try { window.__LAB_OK__ = true; } catch (e) {}
  })();
</script>
</body>
</html>
