<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB · de-bleed · EVER full-bleed → contained card (wordmark behind)</title>

<!--
================================================================================
  TECHNIQUE LAB · de-bleed
================================================================================
  EVER's de-bleed: a full-bleed photo INSETS into a contained editorial card on
  scroll (a giant wordmark sitting BEHIND it, revealed in the new gutters), the
  editorial copy rising in around it. Reverse re-bleeds it back (gallery-open).
  Harvested from D_ever_walkthrough (SEAM B/D, reverse f_043).

  ASSET-SUBSTITUTION GATE: OUR render full-bleed -> a centred card, the word
  "АРХІТЕКТУРА" behind showing in the gutters, Ukrainian copy rising in. Scroll into
  the pinned section. NO WebGL. window.__LAB_OK__ on init.
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --slate:#313E48; --cream:#DCC5B7; --accent:#AC7E65; --wm:'Jost',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box}
  html,body{background:var(--slate);color:var(--cream);font-family:'Inter',system-ui,sans-serif}
  .spacer{height:80vh;display:grid;place-items:center;color:var(--cream);opacity:.5;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  .db-word{font-family:var(--wm);font-weight:400;font-size:clamp(3rem,13vw,12rem);letter-spacing:-.02em;
    text-transform:uppercase;color:var(--cream);opacity:.9;white-space:nowrap}
  .db-around--eye{top:8%;left:6%;font-family:var(--wm);font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent)}
  .db-around--copy{bottom:10%;right:6%;max-width:30ch;text-align:right;font-size:clamp(.9rem,1.1vw,1.05rem);line-height:1.6;color:var(--cream)}
</style>
</head>
<body>

  <div class="spacer">скрол — фото стискається в картку ↓</div>

  <section class="db-stage" id="debleed">
    <!-- z1: wordmark behind -->
    <div class="db-word">АРХІТЕКТУРА</div>
    <!-- z2: media (full-bleed -> contained card) -->
    <div class="db-media"><img src="renders/day.webp" alt="QUADRO фасад"></div>
    <!-- z3: editorial that rises in around the card -->
    <div class="db-around db-around--eye">QUADRO · форма і матеріал</div>
    <p class="db-around db-around--copy">Камінь, скло і світло замість зайвого декору. Дім, що читається спокійно з будь-якої точки.</p>
  </section>

  <div class="spacer">кінець</div>

<script src="component.js"></script>
<script>
  DeBleed.init('#debleed', { insetX: 22, insetY: 12, lerp: 0.1, pinFactor: 1.1 });
</script>
</body>
</html>
