<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · video-card-reveal · to-place (pinned, wheel-stepped full-bleed video panels wiping vertically; per-card playback gating; play-pause + waveform chrome — for Higgsfield reels)</title>

<!--
================================================================================
  TECHNIQUE LAB · video-card-reveal
================================================================================
  to-place.co.jp's full-bleed video handoff — a PINNED, wheel/touch-STEPPED, input-LOCKED stack
  of full-viewport <video> panels; each step WIPES the next video VERTICALLY over the last (new
  panel from the bottom, one horizontal seam up) + a scale settle; ONLY the active video decodes;
  fixed play-pause + audio-waveform chrome above. poster = the still -> reveal reads STILL->MOTION
  (built for Higgsfield image->video reels). Harvested from D_toplace_video.md (§3). NO WebGL.
  window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --charcoal:#1c1b19; --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{min-height:100%}
  body{ background:var(--charcoal); color:#fff; font-family:var(--sans); }
  .spacer{ height:100vh; display:grid; place-items:center; background:var(--charcoal);
    opacity:.5; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; text-align:center; padding:0 8vw; }
  .vcr-stage{ --vcr-ground:#1c1b19; --vcr-serif:var(--serif); --vcr-sans:var(--sans); }
</style>
</head>
<body>

  <div class="spacer">скрол вниз — секція запіниться; КОЖЕН крок колеса = наступне відео вʼїжджає знизу вертикальним wipe (один шов угору); грає лише активне; play-pause + waveform зверху</div>

  <section class="vcr-stage" id="reel">
    <div class="vcr-viewport">
      <div class="vcr-card">
        <video muted loop playsinline preload="metadata" poster="renders/clip-river-poster.webp">
          <source src="renders/clip-river-lite.mp4" type="video/mp4">
        </video>
      </div>
      <div class="vcr-card">
        <video muted loop playsinline preload="none" poster="renders/day-front.webp" data-src="renders/nahirna-water.mp4"></video>
      </div>
      <div class="vcr-card">
        <video muted loop playsinline preload="none" poster="renders/night-front.webp" data-src="renders/clip-river-lite.mp4"></video>
      </div>
    </div>

    <div class="vcr-chrome">
      <div class="vcr-wordmark"><span class="vcr-dia"></span>TO PLACE</div>
      <button class="vcr-toggle" aria-label="play / pause">
        <span class="vcr-wave"><span class="vcr-bar"></span><span class="vcr-bar"></span><span class="vcr-bar"></span><span class="vcr-bar"></span><span class="vcr-bar"></span></span>
      </button>
      <div class="vcr-index">01 / 03</div>
    </div>
  </section>

  <div class="spacer">ріл завершено — пін відпускає, сторінка скролиться далі</div>

<script src="component.js"></script>
<script>
  (function () {
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp:0.1, smoothWheel:true });
      lenis.on('scroll', function(){ if(window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }
    window.__vcr = VideoCardReveal.create('#reel', { stepDur:0.8, ease:'expo.out', overshoot:0.94, lazy:true, loop:false, autoplayActive:true, manageLenis:false });
  })();
</script>
</body>
</html>
