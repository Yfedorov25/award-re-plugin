<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB · split-word-headline · a headline that arrives word by word from under per-word clips</title>

<!--
================================================================================
  TECHNIQUE LAB · split-word-headline
================================================================================
  A PER-WORD split headline reveal. The atom splits a headline into per-word clip rows
  (each WORD in its own overflow:hidden box) and reveals the words in a wave: each rises
  from under its own clip (translateY 120% -> 0%) + fades. Plays once on enter, or scrubs
  via set(p). Distinct from mask-up-title (line mask), blur-reveal-stagger-title (per-char)
  and stroke-draw-title (SVG). Demonstrated over OUR QUADRO render renders/day-34.webp.
  NO WebGL. DECODE-GUARD before paint. window.__LAB_OK__.
================================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="component.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<style>
  :root{ --paper:#0e0d0a; --ink:#f3efe6; --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;box-sizing:border-box} html,body{min-height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans)}

  .spacer{height:90vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);opacity:.4;
    font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}

  /* the hero: a full-bleed QUADRO render with the split headline over it */
  .hero{ position:relative; min-height:100vh; display:grid; place-items:center; overflow:hidden; }
  .hero__bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    /* a calm scrim so the serif reads: plain gradient, NO mix-blend / NO backdrop-filter */
    filter:none; }
  .hero__scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,9,7,.20), rgba(10,9,7,.62)); }
  .hero__inner{ position:relative; text-align:center; padding:0 6vw; }

  .hero-overline{ font-family:var(--sans); font-size:.78rem; letter-spacing:.34em; text-transform:uppercase;
    opacity:.72; margin-bottom:1.6rem; }
  .hero-title{ font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem, 9vw, 7.4rem); line-height:1.02;
    letter-spacing:-.01em; }

  /* a second, multi-line headline lower down to prove per-line clipping + scrub mode */
  .opener{ min-height:100vh; display:grid; place-items:center; background:#15130d; padding:0 6vw; }
  .opener-title{ font-family:var(--serif); font-weight:400; font-size:clamp(2rem, 7vw, 5.6rem); line-height:1.06;
    text-align:center; }
</style>
</head>
<body>

  <section class="hero" id="hero">
    <img class="hero__bg" id="heroImg" alt="QUADRO" />
    <div class="hero__scrim"></div>
    <div class="hero__inner">
      <div class="hero-overline">Quadro House</div>
      <h1 class="hero-title" data-swh id="heroTitle">Дім дихає</h1>
    </div>
  </section>

  <div class="spacer">скрол вниз: наступний заголовок проявляється пословно по скролу</div>

  <section class="opener">
    <h2 class="opener-title" data-swh id="openerTitle">Тиша<br>має адресу</h2>
  </section>

  <div class="spacer">кінець</div>

<script src="component.js"></script>
<script>
  (function () {
    // page-owned Lenis (the hero usually drives a shared smooth scroll)
    if (window.Lenis && window.gsap) {
      var lenis = new Lenis({ lerp:0.1, smoothWheel:true });
      lenis.on('scroll', function(){ if(window.ScrollTrigger) ScrollTrigger.update(); });
      gsap.ticker.add(function(t){ lenis.raf(t*1000); }); gsap.ticker.lagSmoothing(0);
      window.__lenis = lenis;
    }

    var img = document.getElementById('heroImg');

    // DECODE-GUARD: never show an undecoded <img> (= black flicker). Force-decode the
    // render BEFORE wiring the reveal + only then mark the lab ready.
    function wire() {
      // hero headline: one-shot wave on enter
      window.__swh = SplitWordHeadline.create('#heroTitle', {
        stagger: 0.09, from:{ yPercent:120, opacity:0 }, ease:'air', trigger:'enter', manageLenis:false
      });
      // multi-line headline: scrubbed cascade driven by scroll (proves set(p) + per-line clip)
      window.__swh2 = SplitWordHeadline.create('#openerTitle', {
        from:{ yPercent:120, opacity:0 }, trigger:'progress', manageLenis:false
      });
      // the hero title is in view at load -> play it now so the lab shows the move immediately
      if (window.__swh && window.__swh.play) window.__swh.play();

      // ready only once the render is actually painted (decoded) + the atom is wired
      try { window.__LAB_OK__ = true; } catch (e) {}
    }

    img.src = 'renders/day-34.webp';
    if (img.decode) {
      img.decode().then(wire).catch(wire); // catch -> still wire (atom must not depend on the image)
    } else {
      img.complete ? wire() : img.addEventListener('load', wire, { once:true });
      img.addEventListener('error', wire, { once:true });
    }
  })();
</script>
</body>
</html>
