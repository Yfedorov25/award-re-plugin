# bans.yaml — розширюваний бан-лист видимого копі (закони E1-E8).
# Перевірка: grep кожного перед здачею копі. Юзер може дописувати свої.
hard_phrases:            # точні фрази/патерни — нуль входжень
  - "Невелика, але власна"
  - "чесно відповімо навіть на незручні запитання"
  - "без жодних прикрас"
  - "Без прикрас"
  - "розумієш: це твоє"
  - "розумієш: твоє"
patterns:                # класи формулювань
  - "em-dash «—» у будь-якому видимому тексті, включно з og/twitter/page-тайтлами (→ « · »)"
  - "протиставлення чужа/своя, оренда-проти-власності в лоб"
  - "команди глядачу: Дивись / Бачиш / Придивись / Подивись-но"
  - "парцеляція-драма (рублені. короткі. речення. для пафосу.)"
  - "питання до читача в секційному копі (VI-регістр = декларації)"
  - "слово «буква» (тільки «літера»)"
ai_slop:                 # кліше-маркери (повний список: _ANTISLOP_ukrainian_hard)
  - "зануртеся" 
  - "не просто X, а Y"
  - "вражає"
  - "широкий спектр"
  - "індивідуальний підхід"
  - "втілення мрії"
  - "ідеальне поєднання"
  - "у серці міста"
facts:                   # факт-бани (E5-E7)
  - "цитати від названих людей/компаній без даних клієнта"
  - "вік/біографія/статус читача"
  - "минулий/теперішній час для недобудованого"
  - "операційні обіцянки (передзвонимо сьогодні) без підтвердження власника"
meta_tests:
  - "чи сказав би це живий продавець уголос сусідові?"
  - "чи можна поставити цю фразу на БУДЬ-ЯКИЙ ЖК? якщо так — викинути"
voice:
  - "один голос на сайт: ти АБО ви (виняток /privacy)"
  - "hero ≤6 слів · H1 3-6 слів · body-речення ≤12 слів"
  - "~70% хедлайнів прості/описові; гра слів ≤1 і лише в hero"
